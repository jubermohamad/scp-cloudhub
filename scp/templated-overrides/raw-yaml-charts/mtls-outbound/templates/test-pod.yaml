apiVersion: v1
kind: Pod
metadata:
  name: curl-test
  namespace: {{ $.Release.Namespace }}
  labels:
    app: curl-test
    purpose: mTLS-testing

spec:
  containers:
  - name: curl
    image: curlimages/curl
    command: ["sleep", "3600"]

# -------------------------------------------------------
# Usage: HAProxy is a reverse proxy, NOT a forward proxy.
# Do NOT use HTTP_PROXY / HTTPS_PROXY env vars — clients
# using HTTPS_PROXY will send HTTP CONNECT which is unsupported.
#
# Correct way to call through the proxy from inside this pod:
#
#   curl -v \
#     'http://haproxy-egress:{{ $.Values.service.port }}/<path>' \
#     -H 'Host: <target-hostname>' \
#     -H 'Content-Type: application/json' \
#     --data-binary @payload.json
#
# Example for VISA:
#   curl -v \
#     'http://haproxy-egress:{{ $.Values.service.port }}/rsrv_vicscaas-qa/caas/v3/callback' \
#     -H 'Host: maiclqaservices.visa.com' \
#     -H 'business-unit: VBC' \
#     -H 'Content-Type: application/json' \
#     --data-binary @payload.json
# -------------------------------------------------------
