# username is retrieved from the environment with the format SYMPHONYFS_USERNAME
# password is retrieved from the environment with the format SYMPHONYFS_PASSWORD
repositories:
  - name: symphonyfs
    url: https://helm.symphonyfs.net
  - name: k8s-as-helm
    url: https://ameijer.github.io/k8s-as-helm/
  - name: csi-driver-nfs
    url: https://raw.githubusercontent.com/kubernetes-csi/csi-driver-nfs/master/charts
  - name: netapp-trident
    url: https://netapp.github.io/trident-helm-chart

helmDefaults:
  timeout: 1500
  wait: false  # 'true' will cause deadlock for NR with helm waiting for override-volume-claim indefinitely
               # more: https://netreveal.atlassian.net/browse/FCENGX-3005
  kubeContext: aks-UPDATE_ME_NC_SUFFIX

---

# The environments section to define the reusable variables
environments:
  default:
    values:
      - anf:
          enabled: true  # set to true to enable Azure NetApp Files (ANF) backend which is typically required for 'production' clusters.
          azure_serviceLevel: 'ultra'  # 'premium' or 'standard' are also valid options, but 'ultra' is recommended for 'production' clusters.
          azure_location: 'UPDATE_ME_AZ_REGION'  # Azure region for the ANF backend; this should match the region of the AKS cluster.
          vnet_name: 'vnet-UPDATE_ME_NC_SUFFIX'
          subnet_name: 'snet-na-UPDATE_ME_NC_SUFFIX'
          pool_name: 'napool-UPDATE_ME_NC_SUFFIX'
          replication:
            enabled: false  # This is disabled ("false") by default for most clusters. Set to "true" only for production-grade, active-active/active-passive setups to enable cross-region replication for ANF volumes. Note: Enabling replication incurs additional cost - enable only if specifically included & budgeted. Note: Value must be lowercase (true/false), without quotes.
      - internal_NLB_flag: "false"  # set to "true" for VPN clusters
      - internal_NLB_subnet: 'snet-ilb-UPDATE_ME_NC_SUFFIX'  # This is the subnet NAME for the internal network for the NLB; note if the internal_NLB_flag is set to "false" then this value is ignored and so will not cause any issue for non-VPN setups.
      - appName: '{{ requiredEnv "APP_NAME" }}'
      - helm_chart_version: '{{ env "CLOUDHUB_HELM_CHART_VERSION" }}'
      - helm_chart_values_file_ref: '{{ env "CLOUDHUB_HELM_CHART_VALUES_FILE_REF" }}'

---

releases:

  - name: csi-driver-nfs
    namespace: common-res
    chart: csi-driver-nfs/csi-driver-nfs
    version: 4.11.0
    condition: anf.replication.enabled

  - name: "trident-secret-regcred"
    namespace: trident
    chart: k8s-as-helm/secret
    version: 1.0.4
    values:
      - nameOverride: "regcred"
      - type: "kubernetes.io/dockerconfigjson"
      - secretData:
          '.dockerconfigjson': '{{ env "CLOUDHUB_DOCKERHUB_AND_ACR__DOCKERCONFIGJSON" }}'

  - name: trident-operator
    namespace: trident
    chart: netapp-trident/trident-operator
    version: 23.04.0
    condition: anf.enabled
    values:
      - imagePullSecrets: ["regcred"]
    needs:
      - "trident-secret-regcred"

  - name: trident-secret-backend-tbc-anf-secret
    namespace: trident
    chart: k8s-as-helm/secret
    version: 1.0.4
    condition: anf.enabled
    values:
      - nameOverride: "backend-tbc-anf-secret"
      - type: "Opaque"
      - secretData:
          'clientID': '{{ env "CLOUDHUB_PRINCIPAL_ID" }}'
          'clientSecret': '{{ env "CLOUDHUB_PRINCIPAL_SECRET" }}'

  - name: trident-backend
    namespace: trident
    chart: ../../templated-overrides/raw-yaml-charts/trident-backend
    condition: anf.enabled
    values:
      - azure:
          subscriptionID: '{{ env "CLOUDHUB_SUBSCRIPTION_ID" }}'
          tenantID: '{{ env "CLOUDHUB_TENANT_ID" }}'
          location: '{{ .Values.anf.azure_location }}'
          serviceLevel: '{{ .Values.anf.azure_serviceLevel }}'
          vnet: '{{ .Values.anf.vnet_name }}'
          subnet: '{{ .Values.anf.subnet_name }}'
          capacityPool: '{{ .Values.anf.pool_name }}'
    needs:
      - trident-secret-regcred
      - trident/trident-operator
      - trident/trident-secret-backend-tbc-anf-secret

  - name: common-res
    namespace: common-res
    chart: symphonyfs/common-res
    version: "{{ .Values.helm_chart_version }}"
    values:
      - values/params-common-res.yaml
      - ../../templated-overrides/{{ .Values.appName }}/ingress-nginx-disabled.gotmpl
      - overrides.gotmpl
    # The below set command overrides the property global.nrSubChartSwitches.enableER to enable argo workflows as a temporary workaround to get ER on NR 9.5+ running.
    set:
      - name: global.nrSubChartSwitches.enableER
        value: false

  - name: ingress-nginx
    namespace: ingress-nginx
    chart: symphonyfs/common-res
    version: "{{ .Values.helm_chart_version }}"
    values:
      - values/params-common-res.yaml
      - ../../templated-overrides/{{ .Values.appName }}/ingress-nginx-enabled.gotmpl
      - overrides.gotmpl
    needs:
      - common-res/common-res
