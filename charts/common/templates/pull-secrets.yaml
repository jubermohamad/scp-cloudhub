{{- /*
Registry pull secrets, rendered from global.pullSecrets so `helm install
--create-namespace` yields a fully bootstrapped namespace with no kubectl
pre-seeding. One dockerconfigjson published under every name the product
charts reference. Plain manifests on purpose — no named helpers (template
names are global per release and have bitten this repo before).

In the UMBRELLA all four domain charts are in ONE release, so all four would
render the same three Secrets — helm applies each of them repeatedly and the
last write wins, silently. `pullSecrets.render: false` lets the umbrella elect
a single renderer (the common domain); each chart still renders them when it
is a release of its own, which is the multi-namespace layout and the org's
standalone installs.
*/ -}}
{{- $ps := (.Values.global).pullSecrets | default dict }}
{{- $render := true }}
{{- if hasKey ((.Values.pullSecrets) | default dict) "render" }}
{{- $render = .Values.pullSecrets.render }}
{{- end }}
{{- if and $ps.enabled $render }}
{{- range ($ps.names | default (list "regcred-acr" "regcred" "symphonyfs-acr-secret")) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ . }}
  namespace: {{ $.Release.Namespace }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ required "global.pullSecrets.dockerconfigjson is required when pullSecrets.enabled" $ps.dockerconfigjson }}
{{- end }}
{{- end }}
