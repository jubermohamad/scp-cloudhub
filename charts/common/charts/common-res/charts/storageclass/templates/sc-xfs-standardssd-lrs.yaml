{{- if and (eq .Values.global.clusterType "aks") .Values.storageClass.enable.scXfsStandardssdLrs }}
{{- $storageClass := .Values.storageClass | default dict -}}
{{- $config := $storageClass.config | default dict -}}
{{- $cfg := index $config "scXfsStandardssdLrs" | default dict -}}
{{- $reclaimPolicy := $cfg.reclaimPolicy | default "Retain" -}}
{{- $volumeBindingMode := $cfg.volumeBindingMode | default "WaitForFirstConsumer" -}}
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: managed-csi-xfs-standardssd-lrs
parameters:
  skuname: StandardSSD_LRS
  fsType: xfs
provisioner: disk.csi.azure.com
reclaimPolicy: {{ $reclaimPolicy }}
volumeBindingMode: {{ $volumeBindingMode }}
allowVolumeExpansion: true
{{- end }}
