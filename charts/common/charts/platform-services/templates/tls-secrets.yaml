{{- /*
BRING-YOUR-OWN TLS (P13) — kubernetes.io/tls Secrets supplied by the installation.

The platform's default path is cert-manager + Let's Encrypt with DNS-01 against
Azure DNS, which is fine for an environment whose zone lives in Azure and useless
for one that does not. This is the other path: the installation hands over a
certificate and the chart turns it into the Secret an Ingress references. No ACME
account, no DNS-01 credential, no rate limit, and cert-manager need not be
installed at all.

Deliberately NOT doing two things:

  * NOT touching the ingress annotations. An Ingress that still carries
    `cert-manager.io/cluster-issuer` will have its TLS secret MANAGED by
    cert-manager, which would fight this Secret — cert-manager would overwrite it
    on renewal, or fail and leave the served certificate stale. Choosing this path
    means removing that annotation in the same values file. Said plainly in
    values.yaml because a half-applied choice here fails at certificate time, not
    at install time.

  * NOT defaulting or generating anything. A self-signed fallback would let an
    install "succeed" while serving a certificate no browser accepts, which is the
    failure mode this platform has been bitten by repeatedly: valid render,
    runtime-only breakage. Absent input is an error.
*/}}
{{- range $name, $spec := .Values.tlsSecrets }}
{{- $crt := $spec.crt | default "" }}
{{- $key := $spec.key | default "" }}
{{- if not $crt }}
{{- fail (printf "tlsSecrets.%s: 'crt' is empty — supply the certificate (leaf first, then intermediates) from the deploy secrets layer or a provisioner material. An Ingress referencing this Secret would otherwise serve nothing." $name) }}
{{- end }}
{{- if not $key }}
{{- fail (printf "tlsSecrets.%s: 'key' is empty — supply the private key. A Secret with a certificate and no key mounts successfully and then fails every TLS handshake." $name) }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "platform-services.labels" $ | nindent 4 }}
    sri.symphony.ai/tls-source: supplied
  annotations:
    # Kept across an uninstall on purpose: a supplied certificate is not this
    # release's to destroy, and re-creating it needs the operator to fetch the PEM
    # again. Same reasoning as the cert-manager-issued secrets the runbook's
    # reinstall procedure preserves to avoid re-issuing (and burning ACME quota).
    helm.sh/resource-policy: keep
type: kubernetes.io/tls
data:
  tls.crt: {{ $crt | b64enc | quote }}
  tls.key: {{ $key | b64enc | quote }}
{{- end }}
