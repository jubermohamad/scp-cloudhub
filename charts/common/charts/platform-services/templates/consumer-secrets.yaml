{{- /*
Credential Secrets named exactly what consumers already reference.
host defaults to the namespace-qualified -rw service; each entry may
override with host:/port:.
*/}}
{{- if .Values.postgres.enabled }}
{{- $root := . }}
{{- $defaultHost := include "platform-services.postgresHost" . }}
{{- range .Values.appSecrets }}
{{- $creds := include "platform-services.dbCreds" (dict "root" $root "db" .database) | fromYaml }}
{{- $host := .host | default $defaultHost }}
{{- $port := .port | default 5432 }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .name }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "platform-services.labels" $root | nindent 4 }}
    app.kubernetes.io/component: consumer-credentials
    cnpg.io/reload: "true"
type: kubernetes.io/basic-auth
stringData:
  host: {{ $host | quote }}
  port: {{ $port | quote }}
  dbname: {{ .database | quote }}
  user: {{ $creds.owner | quote }}
  username: {{ $creds.owner | quote }}
  password: {{ $creds.password | quote }}
  uri: {{ printf "postgresql://%s:%s@%s:%v/%s" $creds.owner $creds.password $host $port .database | quote }}
  fqdn-uri: {{ printf "postgresql://%s:%s@%s:%v/%s" $creds.owner $creds.password $host $port .database | quote }}
  jdbc-uri: {{ printf "jdbc:postgresql://%s:%v/%s?password=%s&user=%s" $host $port .database $creds.password $creds.owner | quote }}
  fqdn-jdbc-uri: {{ printf "jdbc:postgresql://%s:%v/%s?password=%s&user=%s" $host $port .database $creds.password $creds.owner | quote }}
  pgpass: {{ printf "%s:%v:%s:%s:%s\n" $host $port .database $creds.owner $creds.password | quote }}
{{- end }}
{{- range .Values.basicAuthSecrets }}
{{- $creds := include "platform-services.dbCreds" (dict "root" $root "db" .database) | fromYaml }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .name }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "platform-services.labels" $root | nindent 4 }}
    app.kubernetes.io/component: consumer-credentials
type: kubernetes.io/basic-auth
stringData:
  username: {{ $creds.owner | quote }}
  password: {{ $creds.password | quote }}
{{- end }}
{{- range .Values.envSecrets }}
{{- $creds := include "platform-services.dbCreds" (dict "root" $root "db" .database) | fromYaml }}
{{- $host := .host | default $defaultHost }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .name }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "platform-services.labels" $root | nindent 4 }}
    app.kubernetes.io/component: consumer-credentials
type: Opaque
stringData:
  POSTGRES_HOST: {{ $host | quote }}
  POSTGRES_PORT: {{ .port | default 5432 | quote }}
  POSTGRES_DB: {{ .database | quote }}
  POSTGRES_USER: {{ $creds.owner | quote }}
  POSTGRES_PASSWORD: {{ $creds.password | quote }}
{{- end }}
{{- end }}
