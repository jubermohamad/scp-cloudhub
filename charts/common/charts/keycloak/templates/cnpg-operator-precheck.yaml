{{- /*
Precheck: the CloudNativePG (PostgreSQL) operator must be installed before this
chart can create the Keycloak database, which is a postgresql.cnpg.io/v1 Cluster
resource reconciled by that operator.

The check only runs when Helm has cluster access (install/upgrade): `lookup`
returns nothing during offline rendering (helm template / helm lint / helm
package), so listing all CRDs is used as a connectivity probe first.
*/}}
{{- if (index .Values "cn-postgres-keycloak").enabled }}
{{- if not (.Capabilities.APIVersions.Has "postgresql.cnpg.io/v1") }}
{{- $allCRDs := lookup "apiextensions.k8s.io/v1" "CustomResourceDefinition" "" "" }}
{{- if $allCRDs.items }}
{{- if not (lookup "apiextensions.k8s.io/v1" "CustomResourceDefinition" "" "clusters.postgresql.cnpg.io") }}
{{- fail (printf `

PRECHECK FAILED: the PostgreSQL operator does not exist in this cluster.

This chart creates the Keycloak database as a CloudNativePG Cluster resource
(clusters.postgresql.cnpg.io), but the CloudNativePG operator CRDs were not found.

Install the operator first, e.g. via the common-res chart (cloudnative-pg.enabled=true) or:

  helm repo add cnpg https://cloudnative-pg.github.io/charts
  helm install cnpg cnpg/cloudnative-pg --namespace cnpg-system --create-namespace

then retry. Alternatively set cn-postgres-keycloak.enabled=false and configure
externalDatabase.* to point at an existing PostgreSQL server.
`) }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
