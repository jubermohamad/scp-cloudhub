{{- /*
Credentials for the Keycloak database owner in the CloudNativePG cluster.
CNPG's bootstrap.initdb consumes it (kubernetes.io/basic-auth) to create the
role, and Keycloak reads the same secret through externalDatabase.existingSecret.
An existing password is always reused so it stays stable across upgrades;
set externalDatabase.password to pin an explicit value on first install.
*/}}
{{- $cnpg := index .Values "cn-postgres-keycloak" }}
{{- if $cnpg.enabled }}
{{- $secretName := dig "bootstrap" "config" "bootstrap" "initdb" "secret" "name" "postgres-credential-keycloak-cn" $cnpg }}
{{- $owner := dig "bootstrap" "config" "bootstrap" "initdb" "owner" "bn_keycloak" $cnpg }}
{{- $existingSecret := (lookup "v1" "Secret" (include "common.names.namespace" .) $secretName) | default dict }}
{{- $existingData := (get $existingSecret "data") | default dict }}
{{- $password := .Values.externalDatabase.password }}
{{- if hasKey $existingData "password" }}
{{- $password = index $existingData "password" | b64dec }}
{{- else if not $password }}
{{- $password = randAlphaNum 24 }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName | quote }}
  namespace: {{ include "common.names.namespace" . | quote }}
  labels: {{- include "common.labels.standard" (dict "customLabels" .Values.commonLabels "context" .) | nindent 4 }}
    app.kubernetes.io/part-of: keycloak
  {{- if .Values.commonAnnotations }}
  annotations: {{- include "common.tplvalues.render" (dict "value" .Values.commonAnnotations "context" .) | nindent 4 }}
  {{- end }}
type: kubernetes.io/basic-auth
data:
  username: {{ $owner | b64enc | quote }}
  password: {{ $password | b64enc | quote }}
{{- end }}
