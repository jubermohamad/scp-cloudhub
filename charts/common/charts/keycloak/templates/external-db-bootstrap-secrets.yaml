{{- /*
Dedicated, brand-new Secrets for external-db-bootstrap-job.yaml's own
consumption — never a plain env value, to avoid leaking credentials in
cleartext anywhere the Job spec is displayed (kubectl get -o yaml, helm diff,
CI logs/artifacts).

These are deliberately NOT the same resource as secret-external-db.yaml (the
"real" secret Keycloak itself connects with): that file is a normal,
non-hook resource created after this chart's own pre-install/pre-upgrade
hooks run, so the bootstrap Job (a pre-install/pre-upgrade hook) can't
depend on it existing yet. Promoting secret-external-db.yaml itself to a
hook was tried and reverted — for an existing release upgrading from a
chart version where it was a normal resource, Helm's upgrade prune step
(removing anything in the old release manifest but absent from the new one)
would delete it right after hooks run, while the StatefulSet still needs it.
These secrets carry no such history: they're new resources with nothing to
prune.

When externalDatabase.password is explicitly set (required whenever
bootstrap.enabled, see the fail() below), common.secrets.passwords.manage's
providedValues makes this secret's password identical to whatever
secret-external-db.yaml derives it to later in the same release, so both
consumers agree on the same value.
*/}}
{{- if eq (include "keycloak.externalDatabase.bootstrapEnabled" .) "true" }}
{{- $fullname := include "common.names.fullname" . }}
{{- if and (not .Values.externalDatabase.bootstrap.adminExistingSecret) (not .Values.externalDatabase.bootstrap.adminPassword) }}
{{- fail "externalDatabase.bootstrap.enabled requires externalDatabase.bootstrap.adminExistingSecret or externalDatabase.bootstrap.adminPassword to be set" }}
{{- end }}
{{- if and (not .Values.externalDatabase.existingSecret) (not .Values.externalDatabase.password) }}
{{- fail "externalDatabase.bootstrap.enabled requires externalDatabase.existingSecret or externalDatabase.password to be set" }}
{{- end }}
{{- if not .Values.externalDatabase.bootstrap.adminExistingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-db-bootstrap-admin" $fullname | trunc 63 | trimSuffix "-" }}
  namespace: {{ include "common.names.namespace" . | quote }}
  labels: {{- include "common.labels.standard" (dict "customLabels" .Values.commonLabels "context" .) | nindent 4 }}
    app.kubernetes.io/component: external-db-bootstrap
    app.kubernetes.io/part-of: keycloak
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-20"
    "helm.sh/hook-delete-policy": before-hook-creation
type: Opaque
data:
  password: {{ include "common.secrets.passwords.manage" (dict "secret" (printf "%s-db-bootstrap-admin" $fullname) "key" "password" "length" 10 "providedValues" (list "externalDatabase.bootstrap.adminPassword") "context" .) }}
{{- end }}
{{- if not .Values.externalDatabase.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-db-bootstrap-db" $fullname | trunc 63 | trimSuffix "-" }}
  namespace: {{ include "common.names.namespace" . | quote }}
  labels: {{- include "common.labels.standard" (dict "customLabels" .Values.commonLabels "context" .) | nindent 4 }}
    app.kubernetes.io/component: external-db-bootstrap
    app.kubernetes.io/part-of: keycloak
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-20"
    "helm.sh/hook-delete-policy": before-hook-creation
type: Opaque
data:
  password: {{ include "common.secrets.passwords.manage" (dict "secret" (printf "%s-externaldb" $fullname) "key" "db-password" "length" 10 "providedValues" (list "externalDatabase.password") "context" .) }}
{{- end }}
{{- end }}
