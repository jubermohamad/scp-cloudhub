{{- /*
Random passwords for the additional default admin users created by
keycloak-config-cli (see keycloakConfigCli.configuration). The bootstrap admin
(auth.adminUser) uses the chart's admin password; the two extra users get the
passwords from adminUsers.* values, or random ones generated here and kept
stable across upgrades via lookup.
*/}}
{{- if .Values.keycloakConfigCli.enabled }}
{{- $secretName := printf "%s-admin-users" (include "common.names.fullname" .) }}
{{- $existingSecret := (lookup "v1" "Secret" (include "common.names.namespace" .) $secretName) | default dict }}
{{- $existingData := (get $existingSecret "data") | default dict }}
{{- $sriPassword := ((.Values.adminUsers).sriPassword) | default "" }}
{{- if not $sriPassword }}
{{- if hasKey $existingData "sri-password" }}
{{- $sriPassword = index $existingData "sri-password" | b64dec }}
{{- else }}
{{- $sriPassword = randAlphaNum 20 }}
{{- end }}
{{- end }}
{{- $nsPassword := ((.Values.adminUsers).namespacePassword) | default "" }}
{{- if not $nsPassword }}
{{- if hasKey $existingData "namespace-admin-password" }}
{{- $nsPassword = index $existingData "namespace-admin-password" | b64dec }}
{{- else }}
{{- $nsPassword = randAlphaNum 20 }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName | quote }}
  namespace: {{ include "common.names.namespace" . | quote }}
  labels: {{- include "common.labels.standard" (dict "customLabels" .Values.commonLabels "context" .) | nindent 4 }}
    app.kubernetes.io/part-of: keycloak
  {{- if .Values.commonAnnotations }}
  annotations: {{- include "common.tplvalues.render" (dict "value" .Values.commonAnnotations "context" .) | nindent 4 }}
  {{- end }}
type: Opaque
data:
  sri-password: {{ $sriPassword | b64enc | quote }}
  namespace-admin-password: {{ $nsPassword | b64enc | quote }}
{{- end }}
