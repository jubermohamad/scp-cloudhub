{{- /*
Container registry pull secret, created by the chart when
imageCredentials.create=true. The secret name must match the name referenced
in global.imagePullSecrets (default "regcred").
*/}}
{{- if .Values.imageCredentials.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.imageCredentials.secretName | quote }}
  namespace: {{ include "common.names.namespace" . | quote }}
  labels: {{- include "common.labels.standard" (dict "customLabels" .Values.commonLabels "context" .) | nindent 4 }}
    app.kubernetes.io/part-of: keycloak
  {{- if .Values.commonAnnotations }}
  annotations: {{- include "common.tplvalues.render" (dict "value" .Values.commonAnnotations "context" .) | nindent 4 }}
  {{- end }}
type: kubernetes.io/dockerconfigjson
data:
  {{- if .Values.imageCredentials.dockerConfigJson }}
  .dockerconfigjson: {{ .Values.imageCredentials.dockerConfigJson | b64enc }}
  {{- else }}
  .dockerconfigjson: {{ printf "{\"auths\":{\"%s\":{\"username\":\"%s\",\"password\":\"%s\",\"auth\":\"%s\"}}}"
    .Values.imageCredentials.registry
    .Values.imageCredentials.username
    .Values.imageCredentials.password
    (printf "%s:%s" .Values.imageCredentials.username .Values.imageCredentials.password | b64enc)
    | b64enc }}
  {{- end }}
{{- end }}
