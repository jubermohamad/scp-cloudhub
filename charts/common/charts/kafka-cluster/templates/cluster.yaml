apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaNodePool
metadata:
  name: dual-role
  labels:
    {{- $name := .Values.global.kafkaClusterName | default .Values.name }}
    strimzi.io/cluster: {{ required "Cluster name should be provided with .Values.name" $name }}
    {{- include "platform.solutionsLabel" . | nindent 4 }}
spec:
  {{- /* SINGLE `template:` key. This file used to carry TWO — an upstream chart
       bug: one for imagePullSecrets and a second, conditional one for the
       solutions label. YAML duplicate keys do not merge, so whichever came last
       silently erased the other. It only ever looked harmless because the two
       never mattered at the same time: `common` normally leaves
       global.SRIsolutions unset, so the second block did not render and
       imagePullSecrets survived by luck. Adding a third thing to this pod
       template is what made the bug real, hence the merge.

       The `if` around metadata is still required: an empty `labels:` serialises
       as null and the CRD rejects it with
         spec.template.pod.metadata.labels in body must be of type object: "null"
    */}}
  {{- $solutionsLabel := include "platform.solutionsLabel" . | trim }}
  template:
    pod:
      {{- include "platform.imagePullSecrets" . | indent 6 }}
      {{- if $solutionsLabel }}
      metadata:
        labels:
          {{- $solutionsLabel | nindent 10 }}
      {{- end }}
      {{- /* Scheduling knobs, both raw passthrough and both empty by default:
           the chart must stay installable on a single-node cluster, where any
           spread rule that is `required`/DoNotSchedule would strand every broker
           after the first in Pending. Environments that HAVE several nodes set
           these in their own values — see common.kafka-cluster in
           deploy/sri-dev-centraindia/values.yaml. */}}
      {{- with .Values.pod.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.pod.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  replicas: {{ .Values.replicas }}
  roles:
    - controller
    - broker
  storage:
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        size: {{ .Values.kafka.storage.size }}
        deleteClaim: {{ .Values.kafka.storage.deleteClaim | default false}}
---
apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  {{- $name := .Values.global.kafkaClusterName | default .Values.name }}
  name: {{ required "Cluster name should be provided with .Values.name" $name }}
  labels:
  {{- include "platform.solutionsLabel" . | nindent 4 }}
  annotations:
    strimzi.io/node-pools: enabled
    strimzi.io/kraft: enabled
spec:
  kafka:
    version: {{ .Values.kafka.version }}
    listeners:
      {{- range .Values.kafka.listeners }}
      - name: {{ .name }}
        port: {{ .port }}
        type: {{ .type }}
        tls: {{ .tls }}
        {{- if .networkPolicyPeers }}
        networkPolicyPeers:
          {{ .networkPolicyPeers | toYaml | nindent 10 }}
        {{- end }}
      {{- end }}
    config:
      {{- toYaml .Values.kafka.config | nindent 6 }}