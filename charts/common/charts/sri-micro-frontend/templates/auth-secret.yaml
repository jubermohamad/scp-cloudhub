{{/*
Created only when the chart itself is asked to carry the session secret
(auth.sessionSecret set at install time). Prefer auth.existingSecret for
anything long-lived — then this template renders nothing.
*/}}
{{- if and .Values.auth.enabled .Values.auth.sessionSecret (not .Values.auth.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sri-micro-frontend.fullname" . }}-auth
  labels:
    {{- include "sri-micro-frontend.labels" . | nindent 4 }}
type: Opaque
data:
  session-secret: {{ .Values.auth.sessionSecret | b64enc }}
{{- end }}
