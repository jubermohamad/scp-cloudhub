{{- if .Values.imageCredentials.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.imageCredentials.secretName }}
  labels:
    {{- include "sri-micro-frontend.labels" . | nindent 4 }}
type: kubernetes.io/dockerconfigjson
data:
  {{- if .Values.imageCredentials.dockerConfigJson }}
  .dockerconfigjson: {{ .Values.imageCredentials.dockerConfigJson | b64enc }}
  {{- else }}
  .dockerconfigjson: {{ printf "{\"auths\":{\"%s\":{\"username\":\"%s\",\"password\":\"%s\",\"auth\":\"%s\"}}}"
    .Values.imageCredentials.registry
    .Values.imageCredentials.username
    .Values.imageCredentials.password
    (printf "%s:%s" .Values.imageCredentials.username .Values.imageCredentials.password | b64enc)
    | b64enc }}
  {{- end }}
{{- end }}
