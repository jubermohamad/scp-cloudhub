{{/*
Created only when the chart itself is asked to carry the Keycloak admin
credentials (auth.setup.adminUser/adminPassword set via an encrypted
values.secrets.yaml). Prefer auth.setup.adminSecret for a secret managed
outside the release — then this template renders nothing.
*/}}
{{- if and .Values.auth.enabled .Values.auth.setup.enabled .Values.auth.setup.adminUser .Values.auth.setup.adminPassword (not .Values.auth.setup.adminSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sri-micro-frontend.fullname" . }}-keycloak-admin
  labels:
    {{- include "sri-micro-frontend.labels" . | nindent 4 }}
  annotations:
    # Hook so it exists before the keycloak-setup hook Job (weight 0) runs
    # on first install; hooks aren't part of the release render otherwise.
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
type: Opaque
data:
  keycloak-admin-user: {{ .Values.auth.setup.adminUser | b64enc }}
  keycloak-admin-password: {{ .Values.auth.setup.adminPassword | b64enc }}
{{- end }}
