{{- if and .Values.ingressTlsSecret.create .Values.ingressTlsSecret.cert .Values.ingressTlsSecret.key }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.ingressTlsSecret.secretName }}
  labels:
    {{- include "sri-micro-frontend.labels" . | nindent 4 }}
type: kubernetes.io/tls
data:
  tls.crt: {{ .Values.ingressTlsSecret.cert | b64enc }}
  tls.key: {{ .Values.ingressTlsSecret.key | b64enc }}
{{- end }}
