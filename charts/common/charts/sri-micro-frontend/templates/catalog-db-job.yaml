{{- if .Values.catalog.database.enabled }}
{{- $db := .Values.catalog.database }}
# Pre-install/upgrade: ensure the portal DATABASE + role exist on an
# EXISTING Postgres instance (never the instance itself) and — when
# applySchema — load the catalog schema/seed. Idempotent: creates only
# what's missing, upserts seed rows. Admin creds come from an in-namespace
# secret; the app role/password/database are PARSED from the same
# PORTAL_DATABASE_URL the app runs with (appExistingSecret), so there is one
# source of truth for the connection.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "sri-micro-frontend.fullname" . }}-catalog-db
  labels:
    {{- include "sri-micro-frontend.labels" . | nindent 4 }}
    app.kubernetes.io/component: catalog-db
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: catalog-db
    spec:
      restartPolicy: Never
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: schema
          configMap:
            name: {{ include "sri-micro-frontend.fullname" . }}-catalog-schema
      containers:
        - name: catalog-db
          image: {{ $db.image | quote }}
          imagePullPolicy: {{ $.Values.global.imagePullPolicy | default "Always" }}
          volumeMounts:
            - name: schema
              mountPath: /schema
              readOnly: true
          env:
            - name: PGHOST
              value: {{ $db.host | quote }}
            - name: PGPORT
              value: {{ $db.port | quote }}
            # Admin (superuser) — only used to CREATE ROLE / CREATE DATABASE.
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: {{ $db.adminExistingSecret }}
                  key: {{ $db.adminUserKey }}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $db.adminExistingSecret }}
                  key: {{ $db.adminPasswordKey }}
            # The app's own runtime connection string — the target db/role/
            # password are parsed from it so they can never drift from what
            # the portal actually connects with.
            - name: PORTAL_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ $db.appExistingSecret }}
                  key: {{ $db.appUrlKey }}
            - name: APPLY_SCHEMA
              value: {{ $db.applySchema | quote }}
          command: ["/bin/sh", "-ec"]
          args:
            - |
              # postgresql://USER:PASS@HOST:PORT/DB[?params] — parse without
              # extra tooling (hex secrets, so no special-char ambiguity).
              creds="${PORTAL_DATABASE_URL#*://}"
              userpass="${creds%%@*}"
              APP_USER="${userpass%%:*}"
              APP_PASS="${userpass#*:}"
              rest="${creds#*@}"
              APP_DB="${rest##*/}"; APP_DB="${APP_DB%%\?*}"
              echo "ensuring role '$APP_USER' and database '$APP_DB' on $PGHOST:$PGPORT"

              # Role (create if missing, and keep its password in sync with
              # the secret so a rotated secret still authenticates).
              psql -d postgres -v ON_ERROR_STOP=1 \
                -v app_user="$APP_USER" -v app_password="$APP_PASS" <<'SQL'
              SELECT format('CREATE ROLE %I LOGIN PASSWORD %L', :'app_user', :'app_password')
              WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = :'app_user')
              \gexec
              SELECT format('ALTER ROLE %I LOGIN PASSWORD %L', :'app_user', :'app_password')
              \gexec
              SQL

              # Database (CREATE DATABASE can't run inside a transaction/DO).
              psql -d postgres -v ON_ERROR_STOP=1 \
                -v app_user="$APP_USER" -v app_db="$APP_DB" <<'SQL'
              SELECT format('CREATE DATABASE %I OWNER %I', :'app_db', :'app_user')
              WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = :'app_db')
              \gexec
              SQL

              if [ "$APPLY_SCHEMA" = "true" ]; then
                echo "applying catalog schema/seed as $APP_USER"
                PGPASSWORD="$APP_PASS" psql -U "$APP_USER" -d "$APP_DB" \
                  -v ON_ERROR_STOP=1 -f /schema/portal-catalog.sql
              fi
              echo "done"
{{- end }}
