---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .Values.clusterName }}-ca
spec:
  isCA: true
  secretName: {{ .Values.clusterName }}-ca-certs
  privateKey:
    rotationPolicy: Always
  issuerRef:
    name: selfsigned-issuer
  commonName: OpenSearch CA
  duration: {{ .Values.certificates.ca.duration }}
  renewBefore: {{ .Values.certificates.ca.renewBefore }}
---
# Once the CA certificate is created and stored in the secret ca-certs, the os-ca-issuer can be used to issue certificates that are signed by this CA, establishing a chain of trust.
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ .Values.clusterName }}-ca-issuer
spec:
  ca:
    secretName: {{ .Values.clusterName }}-ca-certs
