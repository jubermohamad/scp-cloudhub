apiVersion: v1
kind: Secret
metadata:
  name: {{ include "flows.fullname" . }}
  labels:
    {{- include "flows.labels" . | nindent 4 }}
  annotations:
    checksum/config: {{ toYaml .Values.secrets | sha256sum }}
type: Opaque
data:
  EUREKA_FLOWS_AUTH_USERNAME: {{ .Values.secrets.username | default "default-username" | b64enc | quote }}
  EUREKA_FLOWS_AUTH_PASSWORD: {{ .Values.secrets.password | default "default-password" | b64enc | quote }}
