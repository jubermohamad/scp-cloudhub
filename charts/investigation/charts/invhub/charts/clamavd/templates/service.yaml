apiVersion: v1
kind: Service
metadata:
  name: {{ include "clamavd.fullname" . }}
  labels:
    {{- include "clamavd.labels" . | nindent 4 }}
  namespace: {{ .Release.Namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - nodePort: {{ .Values.service.nodePort }}
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
      protocol: TCP
      name: clamavd
  selector:
    {{- include "clamavd.selectorLabels" . | nindent 4 }}