replicas: 3
storageSize: "100Gi"

metrics:
  enabled: false

name: invhub

kafka:
  version: "3.9.0"
  listeners:
    - name: plain
      port: 9092
      type: internal
      tls: false
      networkPolicyPeers:
        []
        # - podSelector:
        #     matchLabels:
        #       app.kubernetes.io/instance: datadog-agent
        #   namespaceSelector:
        #     matchLabels:
        #       kubernetes.io/metadata.name: default
    - name: tls
      port: 9093
      type: internal
      tls: true
      networkPolicyPeers:
        []
        # - podSelector:
        #     matchLabels:
        #       app.kubernetes.io/instance: datadog-agent
        #   namespaceSelector:
        #     matchLabels:
        #       kubernetes.io/metadata.name: default
  config:
    offsets.topic.replication.factor: 3
    transaction.state.log.replication.factor: 3
    transaction.state.log.min.isr: 2
    default.replication.factor: 3
    min.insync.replicas: 2
    max.incremental.fetch.session.cache.slots: 10000
    inter.broker.protocol.version: "3.9"
    max.message.bytes: 10485880
    message.max.bytes: 10485880
    replica.fetch.max.bytes: 10485880
    producer.compression.type: producer
  storage:
    size: "100Gi"
  template:
    pod:
      metadata:
        annotations:
          ad.datadoghq.com/kafka.checks: |
            {
              "kafka": {
                "init_config": {
                  "is_jmx": true,
                  "collect_default_metrics": true,
                  "new_gc_metrics": true
                },
                "instances":[
                  {
                    "host": "%%host%%",
                    "port": "9999"
                  }
                ]
              },
              "kafka_consumer": {
                "init_config": {},
                "instances": [
                  {
                    "kafka_connect_str": "%%host%%:9092",
                    "monitor_unlisted_consumer_groups": "true"
                  }
                ]
              }
            }

kafkaExporter:
  groupRegex: .*
  logging: warn
  template:
    pod:
      metadata:
        annotations:
          prometheus.io/port: "9404"
          prometheus.io/scrape: "true"

zookeeper:
  replicas: 3
  storage:
    size: "100Gi"
  jvmOptions:
    javaSystemProperties:
      - name: zookeeper.ssl.hostnameVerification
        value: "false"
      - name: zookeeper.ssl.quorum.hostnameVerification
        value: "false"
  template:
    pod:
      metadata:
        annotations:
          ad.datadoghq.com/zookeeper.checks: |
            {
              "zk": {
                "instances":[
                  {
                    "host":"%%host%%","port":"2181"
                  }
                ]
              }
            }

entityOperator:
  topicOperator: {}
  userOperator: {}
  template:
    pod:
      metadata:
        annotations:
          ad.datadoghq.com/topic-operator.checks: |
            {
              "strimzi": {
                "instances":[
                  {
                    "topic_operator_endpoint": "http://%%host%%:8080/metrics"
                  }
                ]
              }
            }
          ad.datadoghq.com/user-operator.checks: |
            {
              "strimzi": {
                "instances":[
                  {
                    "user_operator_endpoint": "http://%%host%%:8081/metrics"
                  }
                ]
              }
            }
