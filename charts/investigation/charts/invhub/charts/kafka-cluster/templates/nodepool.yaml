apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaNodePool
metadata:
  # unique per namespace — detectionhub's kafka-cluster also renders a
  # nodepool named dual-role
  name: {{ .Values.name }}-dual-role
  labels:
    strimzi.io/cluster: {{ required "Cluster name should be provided with .Values.name" .Values.name }}
spec:
  replicas: {{ .Values.replicas }}
  roles:
    - controller
    - broker
  storage:
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        deleteClaim: {{ .Values.kafka.storage.deleteClaim | default false }}
        size: {{ .Values.kafka.storage.size }}
        class: {{ .Values.kafka.storage.class | default "default" }}
        kraftMetadata: shared
