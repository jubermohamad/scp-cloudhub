{{- if include "api.waitPermissionsNeeded" . | trim }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "api.fullname" . }}-wait-tls-secrets
  namespace: {{ .Release.Namespace }}
  annotations:
    meta.helm.sh/release-name: {{ .Release.Name }}
    meta.helm.sh/release-namespace: {{ .Release.Namespace }}
  labels:
    {{- include "api.labels" . | nindent 4 }}
rules:
  {{- if include "api.waitTlsSecretsNeeded" . | trim }}
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
    resourceNames:
      {{- if ne .Values.dbRootCert.secretName "" }}
      - {{ .Values.dbRootCert.secretName | quote }}
      {{- end }}
      {{- if ne .Values.kafkaRootCert.secretName "" }}
      - {{ .Values.kafkaRootCert.secretName | quote }}
      {{- end }}
      {{- if and .Values.global.INVESTIGATION_HUB_OPEN_SEARCH_BASIC_AUTH (ne .Values.osRootCert.secretName "") }}
      - {{ .Values.osRootCert.secretName | quote }}
      {{- end }}
  {{- end }}
  {{- if include "api.waitMigrationsNeeded" . | trim }}
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get"]
    resourceNames:
      - {{ include "api.migrationJobName" . | quote }}
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["list"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "patch"]
    resourceNames:
      - {{ include "api.migrationStateConfigMapName" . | quote }}
  {{- end }}
  {{- if include "api.waitDependenciesNeeded" . | trim }}
  - apiGroups: [""]
    resources: ["services", "endpoints"]
    verbs: ["get", "list"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["list"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "api.fullname" . }}-wait-tls-secrets
  namespace: {{ .Release.Namespace }}
  annotations:
    meta.helm.sh/release-name: {{ .Release.Name }}
    meta.helm.sh/release-namespace: {{ .Release.Namespace }}
  labels:
    {{- include "api.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "api.fullname" . }}-wait-tls-secrets
subjects:
  - kind: ServiceAccount
    name: {{ include "api.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
