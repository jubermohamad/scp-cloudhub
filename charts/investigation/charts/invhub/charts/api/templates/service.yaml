apiVersion: v1
kind: Service
metadata:
  name: {{ include "api.fullname" . }}
  labels:
    {{- include "api.labels" . | nindent 4 }}
  namespace: {{ .Release.Namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    {{- range .Values.service.ports }}
    {{- if eq .name "api" }}
    - port: {{ .port }}
      targetPort: {{ .port }}
      protocol: {{ .protocol }}
      name: {{ .name }}
    {{- end }}
    {{- end }}
  sessionAffinity: ClientIP
  selector:
    {{- include "api.selectorLabels" . | nindent 4 }}


---
# This is separated websocket service for notification which is linked with the ingerss.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "api.fullname" . }}-ws
  labels:
    {{- include "api.labels" . | nindent 4 }}
  namespace: {{ .Release.Namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    {{- range .Values.service.ports }}
    {{- if eq .name "notific-ws" }}
    - port: {{ .port }}
      targetPort: {{ .port }}
      protocol: {{ .protocol }}
      name: {{ .name }}
    {{- end }}
    {{- end }}
  sessionAffinity: ClientIP
  selector:
    {{- include "api.selectorLabels" . | nindent 4 }}
