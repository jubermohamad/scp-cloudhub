# Default values for ares.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 2

image:
  repository: symphonyfs.azurecr.io/symphonysensa/invhub-web
  # When empty, omit imagePullPolicy and use the Kubernetes default.
  pullPolicy: ""
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets:
  - name: "regcred"

nameOverride: ""
fullnameOverride: "web"

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations:
  configmap.reloader.stakater.com/reload: "flows"

flowsConfigMapName: "flows"
flowsSecretName: "flows"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 8080

tls:
  enabled: true

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 50m
    memory: 128Mi

podDisruptionBudget:
  enabled: false
  maxUnavailable: 1

topologySpreadConstraints:
  enabled: false
  maxSkew: 1
  topologyKey: kubernetes.io/hostname
  whenUnsatisfiable: ScheduleAnyway

livenessProbe:
  initialDelaySeconds: 15
  periodSeconds: 10
  timeoutSeconds: 10
  successThreshold: 1
  httpGet:
    path: /
    port: http

readinessProbe:
  initialDelaySeconds: 20
  periodSeconds: 10
  timeoutSeconds: 10
  successThreshold: 1
  httpGet:
    path: /
    port: http

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - web
          topologyKey: "topology.kubernetes.io/zone"

calicoNetworkPolicy:
  enabled: false
  ingress:
    - action: Allow
      protocol: TCP
      source: {}
      destination:
        ports:
          - 80
  egress:
    - action: Allow

global:
  imagePullPolicy: Always   # platform default; the umbrella global overrides it
  SENSA_KAFKA_BOOTSTRAP: "invhub-kafka-bootstrap:9093"
  SENSA_PROMETHEUS_URL: "http://prometheus:9090"
  SENSA_REDIS_URL: "redis://redis-master:6379"
  NODE_ENV: "production"
