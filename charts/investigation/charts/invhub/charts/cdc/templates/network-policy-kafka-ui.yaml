apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kafka-ui-to-kafka-connect
spec:
  podSelector:
    matchLabels:
      strimzi.io/cluster: cdc
      strimzi.io/kind: KafkaConnect
      strimzi.io/name: cdc-connect
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: 8083
      from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: kafka-ui
