apiVersion: v1
kind: Service
metadata:
  name: {{ include "disc-web.fullname" . }}
  labels:
    {{- include "disc-web.labels" . | nindent 4 }}
  namespace: {{ .Release.Namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - nodePort: {{ .Values.service.nodePort }}
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
      protocol: TCP
      name: http
  selector:
    {{- include "disc-web.selectorLabels" . | nindent 4 }}
