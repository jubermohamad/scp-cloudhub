{{- if include "disc-api.waitPermissionsNeeded" . | trim }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "disc-api.fullname" . }}-wait-tls-secrets
  namespace: {{ .Release.Namespace }}
  annotations:
    meta.helm.sh/release-name: {{ .Release.Name }}
    meta.helm.sh/release-namespace: {{ .Release.Namespace }}
  labels:
    {{- include "disc-api.labels" . | nindent 4 }}
rules:
  {{- if include "disc-api.waitTlsSecretsNeeded" . | trim }}
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
    resourceNames:
      {{- if ne .Values.dbRootCert.secretName "" }}
      - {{ .Values.dbRootCert.secretName | quote }}
      {{- end }}
      {{- if ne .Values.kafkaRootCert.secretName "" }}
      - {{ .Values.kafkaRootCert.secretName | quote }}
      {{- end }}
  {{- end }}
  {{- if or (include "disc-api.waitTlsSecretsNeeded" . | trim) (include "disc-api.waitDependenciesNeeded" . | trim) }}
  - apiGroups: [""]
    resources: ["services", "endpoints"]
    verbs: ["get", "list"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["list"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "disc-api.fullname" . }}-wait-tls-secrets
  namespace: {{ .Release.Namespace }}
  annotations:
    meta.helm.sh/release-name: {{ .Release.Name }}
    meta.helm.sh/release-namespace: {{ .Release.Namespace }}
  labels:
    {{- include "disc-api.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "disc-api.fullname" . }}-wait-tls-secrets
subjects:
  - kind: ServiceAccount
    name: {{ include "disc-api.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
