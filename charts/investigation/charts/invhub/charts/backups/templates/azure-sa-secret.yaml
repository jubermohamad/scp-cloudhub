{{- if .Values.azureStorageAccountSecret.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.azureStorageAccountSecret.secretName }}
  annotations:
    checksum/config: {{ toYaml .Values.azureStorageAccountSecret | sha256sum }}
type: Opaque
data:
  storageAccountName: {{ .Values.azureStorageAccountSecret.storageAccountName | b64enc | quote }}
  storageAccountKey: {{ .Values.azureStorageAccountSecret.storageAccountKey | b64enc | quote }}
{{- end }}
