{{- $secretName := "minio-creds" -}}
{{- $existingSecret := (lookup "v1" "Secret" .Release.Namespace $secretName) | default dict -}}
{{- $existingData := get $existingSecret "data" | default dict -}}
{{- $password := include "invhub-secrets.getOrGenerateSecretValue" (dict "value" .Values.global.PASSWORD "existingData" $existingData "secretName" $secretName "secretKey" "root-password") -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName | quote }}
type: Opaque
stringData:
  config.yaml: |
  root-user: {{ .Values.global.MINIO_USER | quote }}
  root-password: {{ $password | quote }}