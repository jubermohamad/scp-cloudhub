{{- $secretName := "postgres-credential-invhub-cn" -}}
{{- $existingSecret := (lookup "v1" "Secret" .Release.Namespace $secretName) | default dict -}}
{{- $existingData := get $existingSecret "data" | default dict -}}
{{- $password := include "invhub-secrets.getOrGenerateSecretValue" (dict "value" .Values.global.PASSWORD "existingData" $existingData "secretName" $secretName "secretKey" "password") -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName | quote }}
type: kubernetes.io/basic-auth
stringData:
  password: {{ $password | quote }}
  pgpass: {{ $password | quote }}
  username: {{ .Values.global.DB_USER | quote }}
