{{- $secretName := "kafka-ui-creds" -}}
{{- $existingSecret := (lookup "v1" "Secret" .Release.Namespace $secretName) | default dict -}}
{{- $existingData := get $existingSecret "data" | default dict -}}
{{- $password := include "invhub-secrets.getOrGenerateSecretValue" (dict "value" .Values.global.PASSWORD "existingData" $existingData "secretName" $secretName "secretKey" "SPRING_SECURITY_USER_PASSWORD") -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName | quote }}
type: Opaque
stringData:
  config.yaml: |
  SPRING_SECURITY_USER_NAME: admin
  SPRING_SECURITY_USER_PASSWORD: {{ $password | quote }}
