{{- $secretName := "tempo-minio-creds" -}}
{{- $existingSecret := (lookup "v1" "Secret" .Release.Namespace $secretName) | default dict -}}
{{- $existingData := get $existingSecret "data" | default dict -}}
{{- $user := .Values.global.TEMPO_MINIO_USER | default .Values.global.MINIO_USER -}}
{{- $passwordValue := .Values.global.TEMPO_MINIO_PASSWORD | default .Values.global.PASSWORD -}}
{{- $password := include "invhub-secrets.getOrGenerateSecretValue" (dict "value" $passwordValue "existingData" $existingData "secretName" $secretName "secretKey" "root-password") -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName | quote }}
type: Opaque
stringData:
  config.yaml: |
  root-user: {{ $user | quote }}
  root-password: {{ $password | quote }}
