{{- $secretName := "invhub-master-password" -}}
{{- $existingSecret := (lookup "v1" "Secret" .Release.Namespace $secretName) -}}
{{- $existingData := get (default dict $existingSecret) "data" | default dict -}}
{{- $rotationId := dig "secrets" "rotationId" "" .Values.global -}}
{{- $existingRotationId := dig "metadata" "annotations" "invhub.ai/rotation-id" "" (default dict $existingSecret) -}}
{{- $shouldRotate := and (ne $rotationId "") (ne $rotationId $existingRotationId) -}}
{{- $adoptExisting := dig "secrets" "adoptExisting" false .Values.global -}}
{{- $ownedByRelease := and $existingSecret (eq (dig "metadata" "annotations" "meta.helm.sh/release-name" "" $existingSecret) .Release.Name) (eq (dig "metadata" "annotations" "meta.helm.sh/release-namespace" "" $existingSecret) .Release.Namespace) -}}
{{- if or (not $existingSecret) $ownedByRelease $adoptExisting }}
{{- $password := include "invhub-secrets.getOrRotateRandomSecretValue" (dict "value" .Values.global.PASSWORD "existingData" $existingData "secretKey" "master-password" "shouldRotate" $shouldRotate "length" 32) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  annotations:
    "helm.sh/resource-policy": keep
    {{- if ne $rotationId "" }}
    invhub.ai/rotation-id: {{ $rotationId | quote }}
    {{- end }}
type: Opaque
stringData:
  master-password: {{ $password | quote }}
{{- end }}
