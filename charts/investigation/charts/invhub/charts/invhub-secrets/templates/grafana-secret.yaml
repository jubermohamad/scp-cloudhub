{{- $secretName := "grafana-creds" -}}
{{- $existingSecret := (lookup "v1" "Secret" .Release.Namespace $secretName) | default dict -}}
{{- $existingData := get $existingSecret "data" | default dict -}}
{{- $passwordValue := .Values.global.GRAFANA_PASSWORD | default .Values.global.PASSWORD -}}
{{- $password := include "invhub-secrets.getOrGenerateSecretValue" (dict "value" $passwordValue "existingData" $existingData "secretName" $secretName "secretKey" "admin-password") -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName | quote }}
type: Opaque
stringData:
  config.yaml: |
  admin-user: {{ .Values.global.GRAFANA_USER | default "admin" | quote }}
  admin-password: {{ $password | quote }}
