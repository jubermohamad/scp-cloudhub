{{- $secretName := "sensa-global-secrets" -}}
{{- $existingSecret := (lookup "v1" "Secret" .Release.Namespace $secretName) | default dict -}}
{{- $existingData := get $existingSecret "data" | default dict -}}
{{- $password := include "invhub-secrets.getOrGenerateSecretValue" (dict "value" .Values.global.PASSWORD "existingData" $existingData "secretName" $secretName "secretKey" "SENSA_DB_PASSWORD") -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName | quote }}
type: Opaque
stringData:
  SENSA_API_KEY_SECRET: "{{ .Values.global.SENSA_API_KEY_SECRET }}"
  SENSA_DB_PASSWORD: {{ $password | quote }}
  SENSA_EMAIL_PASSWORD: "{{ include "global.emailPassword" . }}"
  SENSA_DB_URL: "{{ .Values.global.DB_TYPE }}://{{ .Values.global.DB_USER }}:{{ $password }}@{{ .Values.global.DB_HOST | default "postgres" }}:{{ .Values.global.DB_PORT }}/{{ .Values.global.DB_NAME }}?{{ .Values.global.DB_SSLMODE | default "sslmode=disable"  }}{{ .Values.global.DB_SSLROOTCERT | default "" }}&connection_limit={{ .Values.global.DB_CONNECTION_LIMIT }}&pool_timeout={{ .Values.global.dbPoolTimeout }}&connect_timeout={{ .Values.global.dbConnectTimeout }}{{ .Values.global.DB_KEEPALIVES | default "" }}"
  SENSA_DISC_DB_URL: "{{ .Values.global.DB_TYPE }}://{{ .Values.global.DB_USER }}:{{ $password }}@{{ .Values.global.DB_HOST | default "postgres" }}:{{ .Values.global.DB_PORT }}/disclosures?schema=public&{{ .Values.global.DB_SSLMODE | default "sslmode=disable"  }}{{ .Values.global.DB_SSLROOTCERT | default "" }}"
  TRANSACTIONS_API_DB_URL: "{{ .Values.global.TRANSACTIONS_API_DB_TYPE }}://{{ .Values.global.TRANSACTIONS_API_DB_USER }}:{{ $password }}@{{ .Values.global.TRANSACTIONS_API_DB_HOST | default "postgres" }}:{{ .Values.global.TRANSACTIONS_API_DB_PORT }}/{{ .Values.global.TRANSACTIONS_API_DB_NAME }}?{{ .Values.global.TRANSACTIONS_API_DB_SSLMODE | default "sslmode=disable"  }}{{ .Values.global.TRANSACTIONS_API_DB_SSLROOTCERT | default "" }}"
  SENSA_ENCRYPTION_SECRET: "{{ .Values.global.SENSA_ENCRYPTION_SECRET }}"
  {{- /* in-tree patch: these two were hardwired to $password — i.e. the JWT
       SIGNING KEY was the invhub Postgres role's password. Anyone who could
       read one credential could mint tokens, and rotating the database password
       silently invalidated every session. They are not database credentials and
       have no reason to be that value.

       Same shape as GRAFANA_PASSWORD / TEMPO_MINIO_PASSWORD elsewhere in this
       subchart: an explicit override that DEFAULTS to the old behaviour, so an
       installation that does not set them renders byte-for-byte what it did
       before and nothing needs migrating. Environments that care set
       global.SENSA_JWT_ACCESS_SECRET / global.SENSA_JWT_REFRESH_SECRET from
       their secrets layer. Access and refresh are separate keys on purpose:
       one value for both means a stolen refresh token verifies as an access
       token. */}}
  SENSA_JWT_ACCESS_SECRET: {{ .Values.global.SENSA_JWT_ACCESS_SECRET | default $password | quote }}
  SENSA_JWT_REFRESH_SECRET: {{ .Values.global.SENSA_JWT_REFRESH_SECRET | default $password | quote }}
  {{- /* in-tree patch: host was hardcoded to "redis-master" — the DEFAULT
       fullname of the bundled bitnami redis. Any fullnameOverride on that
       subchart (e.g. invhub-redis, to avoid cross-chart collisions) silently
       broke this URL; it kept "working" only while some OTHER chart exposed
       a service named redis-master. global.REDIS_HOST makes it explicit. */}}
  {{- /* in-tree patch (P7): full-URL override. The built-in form always injects
       ":<password>@" and pins port 6379, so it cannot address an AUTH-LESS Redis
       — and Redis 6+ rejects a client that sends AUTH when no password is set,
       so the shared sri-redis was unreachable by construction. */}}
  SENSA_REDIS_URL: {{ .Values.global.SENSA_REDIS_URL | default (printf "redis://:%s@%s:6379" $password (.Values.global.REDIS_HOST | default "redis-master")) | quote }}
  {{- /* in-tree patch (P7): full-URL override. Scheme, host AND port were all
       hardcoded to invhub's own minio-operator Tenant (https://minio:443), so no
       other object store could ever be addressed. */}}
  {{- /* The DEFAULT host was a bare `minio` literal, which only resolved because
       invhub used to render its own Tenant Service by that name. Nothing
       parameterised it, so an installation that did not set the full override
       got a URL pointing at a Service that no longer exists. Default the host
       and port from the platform anchor when one is supplied
       (global.S3_HOST/S3_PORT), keeping the old literal as the last fallback so
       a standalone org install is unchanged. */}}
  SENSA_S3_URL: {{ .Values.global.SENSA_S3_URL | default (printf "https://%s:%s@%s:%s" .Values.global.MINIO_USER $password (.Values.global.S3_HOST | default "minio") (.Values.global.S3_PORT | default "443" | toString)) | quote }}
  COPILOT_DB_URL: "{{ .Values.global.COPILOT_DB_TYPE }}://{{ .Values.global.COPILOT_DB_USER }}:{{ $password }}@{{ .Values.global.COPILOT_DB_HOST}}:5432/copilot?{{ .Values.global.COPILOT_DB_SSLMODE | default "sslmode=disable"  }}{{ .Values.global.COPILOT_DB_SSLROOTCERT | default "" }}"
  INVHUB_GOOGLE_MAPS_API_KEY: "{{ include "global.googleMapsApiKey" . }}"
  INVHUB_PENDO_API_KEY: "{{ include "global.pendoApiKey" . }}"
  INVESTIGATION_HUB_SERVICE_ACCOUNT_API_KEY: "{{ .Values.global.INVESTIGATION_HUB_SERVICE_ACCOUNT_API_KEY }}"
  INVESTIGATION_HUB_INSTALL_ADMIN_USER_API_KEY: "{{ .Values.global.INVESTIGATION_HUB_INSTALL_ADMIN_USER_API_KEY }}"
  {{- if eq (include "global.remoteDataDbType" .) "postgres" }}
  # No REMOTE_DATA_DB_URL for postgres — individual vars are used instead (see api deployment)
  {{- else }}
  REMOTE_DATA_DB_URL: "{{ include "global.remoteDataDbHost" . }}:{{ include "global.remoteDataDbPort" . }}/{{ include "global.remoteDataDbName" . }}"
  {{- end }}
  {{- if include "global.remoteDataDbUsername" . }}
  REMOTE_DATA_DB_USERNAME: "{{ include "global.remoteDataDbUsername" . }}"
  {{- end }}
  {{- if include "global.remoteDataDbPassword" . }}
  REMOTE_DATA_DB_PASSWORD: "{{ include "global.remoteDataDbPassword" . }}"
  {{- end }}
