{{- if .Values.envFromconfigMap }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "copilot.fullname" . }}-secret
  labels:
    {{- include "copilot.labels" . | nindent 4 }}
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  {{- $root := . -}}
  {{- range $key, $val := .Values.global.copilot }}
  {{- if eq (include "copilot.isSensitiveEnvKey" $key) "true" }}
  {{ $key }}: {{ if and (typeIs "string" $val) (contains "{{" $val) }}{{ tpl $val $root | quote }}{{ else }}{{ $val | quote }}{{ end }}
  {{- end }}
  {{- end }}
{{- end }}
