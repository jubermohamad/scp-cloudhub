# Default values for copilot.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.
engineName: "copilot"

replicaCount: 1

image:
  repository: nginx
  # When empty, omit imagePullPolicy and use the Kubernetes default.
  pullPolicy: ""
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets:
  - name: "regcred"

waitForDependencies:
  enabled: false
  image: docker.io/curlimages/curl:8.11.1
  imagePullPolicy: ""            # empty = inherit global.imagePullPolicy
  timeoutSeconds: 1200
  resources:
    limits:
      cpu: 100m
      memory: 64Mi
    requests:
      cpu: 10m
      memory: 16Mi
  # in-tree patch: leave `service` EMPTY so the template can fall back to
  # global.services.* (shared-service names differ per deployment — there is no
  # plain "redis-master" Service in the SRI release). Set it here only to pin a
  # service for this component specifically.
  postgres:
    enabled: false
    service: ""
    port: 5432
  redis:
    enabled: false
    service: ""
    port: 6379
  terrarium:
    enabled: false
    # EMPTY on purpose, like postgres/redis above: the copilot chart is aliased
    # four times, so a pinned literal here has to be corrected four times when
    # terrarium is renamed. Empty lets the template fall back to
    # global.services.terrarium — one key for all four (Risk #8).
    service: ""
    port: 8080

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  capabilities:
    drop:
      - ALL

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 50m
    memory: 128Mi

podDisruptionBudget:
  enabled: false
  maxUnavailable: 1

topologySpreadConstraints:
  enabled: false
  maxSkew: 1
  topologyKey: kubernetes.io/hostname
  whenUnsatisfiable: ScheduleAnyway

nodeSelector: {}

tolerations: []

affinity: {}

envFromconfigMap: false

# Per-engine extra config key-value pairs rendered into the engine's ConfigMap.
# Keys are used as-is for env var names. Non-empty, non-sensitive values only.
config: {}

calicoNetworkPolicy:
  enabled: false
  ingress:
    - action: Allow
      protocol: TCP
      source: {}
      destination:
        ports:
          - 8001
  egress:
    - action: Allow

service:
  type: ClusterIP
  port: 8001
  targetPort: 8001
  portName: engine-port

command:
  - sh
  - -c
  - uvicorn application:app --host 0.0.0.0 --port 8001

global:
  imagePullPolicy: Always   # platform default; the umbrella global overrides it
  copilot:
    AML_DETECTIONS_INITIALSUMMARY_FILTER_ROWS: "100"
