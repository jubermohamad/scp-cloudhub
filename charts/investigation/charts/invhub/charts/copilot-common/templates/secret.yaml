apiVersion: v1
kind: Secret
metadata:
  name: {{ include "copilot-common.fullname" . }}
  labels:
    {{- include "copilot-common.labels" . | nindent 4 }}
  annotations:
    checksum/config: {{ toYaml .Values.secrets | sha256sum }}
type: Opaque
data:
  AZURE_OPENAI_API_KEY: {{ .Values.secrets.azureOpenAIKey | b64enc | quote }}
  AZURE_EMBEDDINGS_API_KEY: {{ .Values.secrets.azureEmbeddingsKey | b64enc | quote }}
  TAVILY_API_KEY: {{ .Values.secrets.tavilyApiKey | b64enc | quote }}
  OPENAI_API_KEY_EMBEDDING: {{ .Values.secrets.azureEmbeddingsKey | b64enc | quote }}
  EMBED_API_KEY: {{ .Values.secrets.azureEmbeddingsKey | b64enc | quote }}
