apiVersion: v2
name: invhub
description: A Helm chart for installing Investigations Hub
type: application
version: 1.397.6
appVersion: "v2026.07.8"
dependencies:
  - name: opensearch
    version: 2.17.0
    repository: https://opensearch-project.github.io/helm-charts
    condition: infra.enabled
  - name: opensearch
    alias: observability-opensearch
    version: 2.17.0
    repository: https://opensearch-project.github.io/helm-charts
    tags:
      - logs
  - name: opensearch-dashboards
    version: 2.15.1
    repository: https://opensearch-project.github.io/helm-charts
    condition: opensearch-dashboards.enabled
  - name: opensearch-extensions
    version: ">=0.0.1"
    repository: file://./charts/opensearch-extensions
    condition: infra.enabled
  - name: fluentd
    version: 0.5.0
    repository: https://fluent.github.io/helm-charts
    condition: fluentd.enabled
  - name: kafka-cluster
    version: ">=0.0.1"
    repository: file://./charts/kafka-cluster
    # own condition (was infra.enabled, shared with every infra dep) so the
    # bundled Kafka can be disabled in favour of a shared platform cluster
    condition: kafka-cluster.enabled
  - name: kafka-ui
    version: 1.5.0
    repository: https://kafbat.github.io/helm-charts
    condition: infra.enabled
  - name: tenant
    alias: minioop
    version: 5.0.11
    repository: https://operator.min.io/
    # P7: own condition (was infra.enabled, shared with every infra dep) so
    # this bundled instance can be disabled in favour of the shared platform
    # one without losing the rest of invhub's infrastructure.
    condition: minioop.enabled
  - name: minioop-extensions
    version: ">=0.0.1"
    repository: file://./charts/minioop
    # P7: own condition (was infra.enabled, shared with every infra dep) so
    # this bundled instance can be disabled in favour of the shared platform
    # one without losing the rest of invhub's infrastructure.
    condition: minioop-extensions.enabled
  - name: common
    repository: https://charts.bitnami.com/bitnami
    tags:
      - bitnami-common
    version: 2.13.4
    condition: infra.enabled
  - name: redis
    version: 20.13.5
    repository: https://charts.bitnami.com/bitnami
    # P7: own condition (was infra.enabled, shared with every infra dep) so
    # this bundled instance can be disabled in favour of the shared platform
    # one without losing the rest of invhub's infrastructure.
    condition: redis.enabled
  - name: invhub-secrets
    version: ">=0.0.1"
    repository: file://./charts/invhub-secrets
    condition: infra.enabled
  - name: mockserver
    version: 0.27.1
    repository: file://./charts/mockserver
    condition: mockserver.enabled
  - name: reporting-dashboard
    version: 0.22.1
    repository: file://./charts/reporting-dashboard
    condition: reporting-dashboard.enabled
  - name: ingress
    version: ">=0.0.1"
    repository: file://./charts/ingress
    alias: reporting-dashboard-ingress
    condition: reporting-dashboard.enabled
  - name: ingress
    version: ">=0.0.1"
