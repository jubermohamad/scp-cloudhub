    evidenceBoardAgentDeploymentId: ""
    disclosureSubmissionAgentDeploymentId: ""
    ecddAgentDeploymentId: ""
    austracSmrSubmissionAgentDeploymentId: ""
    investigationNotesWebhookId: ""
    useInternalUrls: "true"
    internalDisclosuresHostUrl: "http://disc-api:3002"
    internalFlowsUrl: ""
    internalFlowsAuthUrl: ""
  secrets:
    username: ""
    password: ""
# ingress-tls is used for creating TLS certificates for ingress resources
# disabled by default
# requires cert-manager to be installed and cluster-issuer to be created
# in infra or common-res Helm charts
ingress-tls:
  enabled: false
  organization: SymphonyAI Financial Services
  host: example.com
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
# only creates a default secret with the destination for the backup
# it doesn not enable the backup functionality
# that is configured on cn-postgres* and minioop resources under 'backupConfig'
backups:
  azureStorageAccountSecret:
    enabled: false
    secretName: backup-creds
    storageAccountName: "storage-account-name"
    storageAccountKey: "storage-account-key"
kafka-cluster:
  # false = use a shared/external Strimzi cluster instead; then set `name`
  # to that cluster (migrations wait on the Kafka CR of this name) and
  # global.SENSA_KAFKA_BOOTSTRAP / api.kafkaRootCert accordingly.
  enabled: true
  name: invhub
  replicas: 3
  # SCP-3554 automatically pick image based on Strimzi version
  # image: quay.io/strimzi/kafka:0.45.1-kafka-3.9.0
  kafka:
    resources:
      requests:
        cpu: "100m"
        memory: "2Gi"
      limits:
        cpu: "500m"
        memory: "4Gi"
    storage:
      size: "200Gi"
  zookeeper:
    storage:
      size: "200Gi"
    resources:
      requests:
        cpu: "50m"
        memory: "768Mi"
      limits:
        cpu: "250m"
        memory: "1536Mi"
opensearch:
  imagePullSecrets:
    - name: regcred
  global:
    # Set if you want to change the default docker registry, e.g. a private one.
    dockerRegistry: ""
  image:
    repository: "opensearchproject/opensearch"
  sysctlInit:
    enabled: true
  opensearchJavaOpts: "-Xmx2g -Xms2g"
  initResources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "250m"
      memory: "128Mi"
  resources:
    requests:
      cpu: "250m"
      memory: "4Gi"
    limits:
      cpu: "1000m"
      memory: "6Gi"
  replicas: 3
  masterService: "opensearch-cluster-master"
  clusterName: "opensearch-cluster"
  nodeGroup: "master"
  openSearchAnnotations:
    secret.reloader.stakater.com/reload: "opensearch-cluster-certs"
  plugins:
    enabled: true
    installList:
      - "https://github.com/opensearch-project/opensearch-prometheus-exporter/releases/download/2.11.1.0/prometheus-exporter-2.11.1.0.zip"
  extraEnvs:
    - name: DISABLE_INSTALL_DEMO_CONFIG
      value: "true"
    # as from Opensearch 2.12 (we are at 2.11 atm) the OPENSEARCH_INITIAL_ADMIN_PASSWORD env variable is supported.
    # the currently configured default password will be updated as part of Opensearch upgrade
    - name: OPENSEARCH_INITIAL_ADMIN_PASSWORD
      valueFrom:
        secretKeyRef:
          name: opensearch-basic-auth
          key: INVESTIGATION_HUB_OPEN_SEARCH_PASSWORD
  secretMounts:
    - name: opensearch-cluster-certs
      secretName: opensearch-cluster-certs
      path: /usr/share/opensearch/config/certs
    - name: opensearch-cluster-admin-certs
      secretName: opensearch-cluster-admin-certs
      path: /usr/share/opensearch/config/admin-certs
  config:
    log4j2.properties: |
      appender.console.type = Console
      appender.console.name = console
      appender.console.layout.type = OpenSearchJsonLayout
      appender.console.layout.type_name = json_logger
      rootLogger.level = info
      rootLogger.appenderRef.console.ref = console
    opensearch.yml: |
      cluster.name: opensearch-cluster
      network.host: 0.0.0.0
      plugins:
        security:
          ssl:
            transport:
              pemcert_filepath: /usr/share/opensearch/config/certs/tls.crt
              pemkey_filepath:  /usr/share/opensearch/config/certs/tls.key
              pemtrustedcas_filepath: /usr/share/opensearch/config/certs/ca.crt
              enforce_hostname_verification: false
            http:
              enabled: true
              pemcert_filepath: /usr/share/opensearch/config/certs/tls.crt
              pemkey_filepath: /usr/share/opensearch/config/certs/tls.key
              pemtrustedcas_filepath: /usr/share/opensearch/config/certs/ca.crt
          allow_unsafe_democertificates: false
          allow_default_init_securityindex: true
          nodes_dn:
            - CN=opensearch-nodes,O=INVHUB
          audit.type: internal_opensearch
          enable_snapshot_restore_privilege: true
          check_snapshot_restore_write_privileges: true
          restapi:
            roles_enabled: ["all_access", "security_rest_api_access"]
          system_indices:
            enabled: true
            indices:
              [
                ".opendistro-alerting-config",
                ".opendistro-alerting-alert*",
                ".opendistro-anomaly-results*",
                ".opendistro-anomaly-detector*",
                ".opendistro-anomaly-checkpoints",
                ".opendistro-anomaly-detection-state",
                ".opendistro-reports-*",
                ".opendistro-notifications-*",
                ".opendistro-notebooks",
                ".opendistro-asynchronous-search-response*",
              ]
  calicoNetworkPolicy:
    enabled: false
opensearch-dashboards:
  # security config will be added as part of Opensearch upgrade in INVHUB-16030
  # as from Opensearch 2.12 the OPENSEARCH_INITIAL_ADMIN_PASSWORD env variable is supported
  # once added, set enabled to true
  enabled: false
  fullnameOverride: "opensearch-dashboards"
  opensearchHosts: "https://opensearch-cluster-master:9200"
  serverHost: "0.0.0.0"
  dashboardAnnotations:
    secret.reloader.stakater.com/reload: "opensearch-cluster-dashboards-certs"
  config:
    opensearch_dashboards.yml: |
      server.host: '0.0.0.0'
      server.ssl.enabled: true
      server.ssl.key: /usr/share/opensearch-dashboards/config/dashboards-certs/tls.key
      server.ssl.certificate: /usr/share/opensearch-dashboards/config/dashboards-certs/tls.crt
      server.ssl.certificateAuthorities: [ "/usr/share/opensearch-dashboards/config/dashboards-certs/ca.crt" ]
      opensearch.hosts: [https://opensearch-cluster-master:9200]
      opensearch.ssl.verificationMode: certificate
      opensearch.ssl.certificateAuthorities: [ "/usr/share/opensearch-dashboards/config/os-certs/ca.crt" ]
      opensearch.requestHeadersAllowlist: ["securitytenant","Authorization"]
      opensearch_security.multitenancy.enabled: false
      opensearch_security.readonly_mode.roles: [admin]
      opensearch_security.cookie.secure: true
      opensearch_security.auth.type: ["basicauth"]
    ssl:
      enabled: true
      key: /usr/share/opensearch-dashboards/config/dashboards-certs/tls.key
      certificate: /usr/share/opensearch-dashboards/config/dashboards-certs/tls.crt
  # security config will be added as part of Opensearch upgrade in INVHUB-16030
  # as from Opensearch 2.12 the OPENSEARCH_INITIAL_ADMIN_PASSWORD env variable is supported
  # opensearchAccount:
  #   secret: ""
  extraEnvs:
    - name: "SERVER_BASEPATH"
      value: "/opensearch-dashboards"
    - name: "SERVER_REWRITEBASEPATH"
      value: "true"
  secretMounts:
    - name: opensearch-cluster-dashboards-certs
      secretName: opensearch-cluster-dashboards-certs
      path: /usr/share/opensearch-dashboards/config/dashboards-certs
    - name: opensearch-cluster-certs
      secretName: opensearch-cluster-certs
      path: /usr/share/opensearch-dashboards/config/os-certs
fluentd:
  enabled: false
  kind: "DaemonSet"
  variant: opensearch
  env:
    - name: FLUENT_ELASTICSEARCH_HOST
      value: "observability-opensearch-cluster-master"
    - name: FLUENT_ELASTICSEARCH_PORT
      value: "9200"
    - name: K8S_NODE_NAME
      valueFrom:
        fieldRef:
          fieldPath: spec.nodeName
  metrics:
    serviceMonitor:
      enabled: true
  configMapConfigs:
    - fluentd-prometheus-conf # required for health check probes on k8s
  plugins:
    - fluent-plugin-opensearch
  fileConfigs:
    01_sources.conf: |-
      <source>
        @type tail
        @id in_tail_container_logs
        @label @KUBERNETES
        path /var/log/containers/*.log
        pos_file /var/log/fluentd-containers.log.pos
        tag kubernetes.*
        read_from_head true
        <parse>
          @type multi_format
          <pattern>
            format json
            time_key time
            time_type string
            time_format "%Y-%m-%dT%H:%M:%S.%NZ"
            keep_time_key true
          </pattern>
          <pattern>
            format regexp
            expression /^(?<time>.+) (?<stream>stdout|stderr)( (.))? (?<log>.*)$/
            time_format '%Y-%m-%dT%H:%M:%S.%NZ'
            keep_time_key true
          </pattern>
        </parse>
        emit_unmatched_lines true
      </source>
    02_filters.conf: |-
      <label @KUBERNETES>
        <match kubernetes.var.log.containers.fluentd**>
          @type relabel
          @label @FLUENT_LOG
        </match>
        <match kubernetes.var.log.containers.**_kube-system_**>
          @type null
          @id ignore_kube_system_logs
        </match>
        <filter kubernetes.**>
          @type kubernetes_metadata
          @id filter_kube_metadata
          skip_labels false
          skip_container_metadata false
          skip_namespace_metadata true
          skip_master_url true
        </filter>
        <match **_dev_**>
          @type relabel
          @label @DISPATCH
        </match>
      </label>
    03_dispatch.conf: |-
      <label @DISPATCH>
        <filter **>
          @type prometheus
          <metric>
            name fluentd_input_status_num_records_total
            type counter
            desc The total number of incoming records
            <labels>
              tag ${tag}
              hostname ${hostname}
            </labels>
          </metric>
        </filter>
        <match **>
          @type relabel
          @label @OUTPUT
        </match>
      </label>
    04_outputs.conf: |-
      <label @OUTPUT>
        <match **>
          @type opensearch
          host "observability-opensearch-cluster-master"
          port 9200
          index_name fluentd
        </match>
      </label>
grafana:
  global:
    imagePullSecrets:
      - name: regcred
  rbac:
    namespaced: true
  fullnameOverride: "grafana"
  testFramework:
    enabled: false
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: "default"
          orgId: 1
          folder: ""
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/default
  dashboardsConfigMaps:
    default: "grafana-dashboards"
  grafana.ini:
    server:
      root_url: http://localhost:3000/grafana
      serve_from_sub_path: true
  admin:
    existingSecret: "grafana-creds"
    userKey: admin-user
    passwordKey: admin-password
  resources:
    requests:
      cpu: "50m"
      memory: "256Mi"
    limits:
      cpu: "250m"
      memory: "512Mi"
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: Tempo
          type: tempo
          url: http://tempo-query-frontend:3100
          basicAuth: false
        - name: Prometheus
          type: prometheus
          url: http://infra-prometheus-prometheus.infra:9090
          access: proxy
# Under development - Optional PrometheusRule alerts (requires Prometheus Operator / kube-prometheus).
# These are additive and disabled by default.
observabilityAlerts:
  enabled: false
  # Optional labels/annotations to match your Prometheus ruleSelector setup.
  labels: {}
  annotations: {}
  postgresql:
    enabled: true
    # Alert when connections are above this percentage of max_connections.
    maxConnectionsUtilizationPercent: 80
    for: 10m
  kafka:
    enabled: true
    for: 10m
  opensearch:
    enabled: true
    for: 10m
  minioWebhooks:
    enabled: true
    for: 0m
kafka-ui:
  # &kafkaUiName anchor: see the &helpName comment (help: block, above) — same
  # zero-risk single-source-of-truth technique.
  fullnameOverride: &kafkaUiName "kafka-ui"
  image:
    registry: ghcr.io
    repository: kafbat/kafka-ui
  resources:
    requests:
      cpu: "50m"
      memory: "512Mi"
    limits:
      cpu: "250m"
      memory: "1Gi"
  envs:
    config:
      SERVER_SERVLET_CONTEXT_PATH: /kafka-ui
  existingSecret: "kafka-ui-creds"
  yamlApplicationConfig:
    kafka:
      clusters:
        - name: invhub
          bootstrapServers: invhub-kafka-bootstrap:9092
          kafkaconnect:
            - name: "cdc"
              address: "http://cdc-connect-api:8083"
    auth:
      type: LOGIN_FORM
    management:
      health:
        ldap:
          enabled: false
minioop:
  # P7: false = use the shared platform instance instead. Split out of
  # infra.enabled so it can be disabled on its own (see Chart.yaml).
  enabled: true
  tenant:
    image:
      repository: quay.io/minio/minio
    configuration:
      name: "minio-creds-operator"
    buckets:
      - name: os-snapshots
      - name: backups
    certificate:
      requestAutoCert: true
      certConfig:
        commonName: "minio"
        dnsNames:
          - "*.cluster.local"
          - "minio"
    name: minio
    pools:
      - servers: 4
        volumesPerServer: 2
        name: pool-main
        storageClassName: managed-csi-xfs-standardssd-lrs
        size: 200G
        resources:
          requests:
            cpu: "100m"
            memory: "1Gi"
          limits:
            cpu: "500m"
            memory: "2Gi"
            # example snippet on how to extend space in MinIO cluster.
            # MinIO doesn't allow extending existing nodepools, we need to add new one
            # and then MinIO will automatically rebalance data between the pools.
            # - servers: 4
            #   volumesPerServer: 2
            #   name: pool-main-1
            #   storageClassName: managed-csi-xfs-standardssd-lrs
            #   size: 200Gi
  calicoNetworkPolicy:
    enabled: false
  metrics:
    enabled: true
    protocol: https
  env:
    - name: MINIO_PROMETHEUS_AUTH_TYPE
      value: "public"
  mirror:
    image:
      repository: rclone/rclone
      tag: sha-f554fb1
  # Backup configuration needs to be enabled manually with appropriate destination.
  # Examples are given in charts/minioop/values.yaml
  backupConfig:
    enabled: false
