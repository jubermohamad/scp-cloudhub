    - name: NGINX_BASE_PATH_REWRITE
      value: "docs-graphql"
clamavd:
  image:
    repository: symphonyfs.azurecr.io/symphonysensa/invhub-clamav
    tag: clamav-v1.1.0
config:
  enabled: true
  # Naming-migration seam (docs/NAMING-MIGRATION.md Step 2): this Job's own
  # metadata.name had no override mechanism before now. Defaults to today's
  # bare name (render-neutral); the env-prefixed name
  # (sri-<env>-investigation-configurator) is a deploy-values override only —
  # see invhub.configuratorJobName in templates/_helpers.tpl.
  fullnameOverride: "configurator"
  image:
    repository: symphonyfs.azurecr.io/symphonysensa/invhub-config
    tag: "v2026.07.1"
  imagePullSecrets:
    - name: "regcred"
  resources:
    requests:
      cpu: "50m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"
minioWebhooks:
