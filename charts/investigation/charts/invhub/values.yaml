pgadmin4:
  imagePullSecrets:
    - name: regcred
  fullnameOverride: "pgadmin"
  serviceAccount:
    create: true
    name: pgadmin
    automountServiceAccountToken: false
  templatedPodAnnotations: |
    checksum/pgadmin-values: {{ toJson .Values | sha256sum }}
  VolumePermissions:
    enabled: true
  existingSecret: "postgres-creds"
  resources:
    requests:
      cpu: "50m"
      memory: "256Mi"
    limits:
      cpu: "250m"
      memory: "512Mi"
  startupProbe:
    failureThreshold: 60
    periodSeconds: 10
    timeoutSeconds: 5
  test:
    resources:
      requests:
        cpu: "25m"
        memory: "16Mi"
      limits:
        cpu: "50m"
        memory: "32Mi"
  strategy:
    type: Recreate
  env:
    email: pgadmin@fseng.net
    contextPath: /pgadmin
    variables:
      - name: PGADMIN_REPLACE_SERVERS_ON_STARTUP
        value: "True"
      - name: PGADMIN_CONFIG_PROXY_X_HOST_COUNT
        value: "0"
      - name: PGADMIN_CONFIG_PROXY_X_PORT_COUNT
        value: "0"
  featureToggles:
    copilot: true
    copilotv2: true
    ai-doc-centre: false
    invhub-db-migration: false
    transactions-api: false
    langfuse: false
    keycloak: false
  # in-tree patch (P7): every CA mount below fell back to the hardcoded
  # `cn-postgres-ca` when its featureToggle was off. That secret belongs to
  # invhub's own CNPG cluster, so once the databases move to a shared cluster the
  # fallback names a Secret that does not exist and pgadmin wedges in Init. One
  # knob now drives every fallback.
  caSecretDefault: cn-postgres-ca
  extraSecretMounts:
    - name: pgadmin-secret-config
      mountPath: "/var/lib/pgadmin/storage/pgadmin_fseng.net/pg-ca-cert"
      subPath: ""
      readOnly: true
      secret: '{{ .Values.caSecretDefault | default "cn-postgres-ca" }}' 
    - name: pgadmin-copilot-ca
      mountPath: "/var/lib/pgadmin/storage/pgadmin_fseng.net/pg-copilot-ca"
      subPath: ""
      readOnly: true
      secret: >-
        {{- if (default false (index .Values.featureToggles "copilot")) -}} cn-postgres-copilot-ca {{- else -}} {{ .Values.caSecretDefault | default "cn-postgres-ca" }} {{- end -}}
    - name: pgadmin-copilotv2-ca
      mountPath: "/var/lib/pgadmin/storage/pgadmin_fseng.net/pg-copilotv2-ca"
      subPath: ""
      readOnly: true
      secret: >-
        {{- if (default false (index .Values.featureToggles "copilotv2")) -}} cn-postgres-copilotv2-ca {{- else -}} {{ .Values.caSecretDefault | default "cn-postgres-ca" }} {{- end -}}
    - name: pgadmin-copilot-data-adapter-ca
      mountPath: "/var/lib/pgadmin/storage/pgadmin_fseng.net/pg-copilot-data-adapter-ca"
      subPath: ""
      readOnly: true
      secret: >-
        {{- if (default false (index .Values.featureToggles "copilotv2")) -}} cn-postgres-copilot-data-adapter-ca {{- else -}} {{ .Values.caSecretDefault | default "cn-postgres-ca" }} {{- end -}}
    - name: pgadmin-keycloak-ca
      mountPath: "/var/lib/pgadmin/storage/pgadmin_fseng.net/pg-keycloak-ca"
      subPath: ""
      readOnly: true
      secret: >-
        {{- if (default false (index .Values.featureToggles "keycloak")) -}} cn-postgres-keycloak-ca {{- else -}} {{ .Values.caSecretDefault | default "cn-postgres-ca" }} {{- end -}}
    - name: pgadmin-langfuse-ca
      mountPath: "/var/lib/pgadmin/storage/pgadmin_fseng.net/pg-langfuse-ca"
      subPath: ""
      readOnly: true
      secret: >-
        {{- if (default false (index .Values.featureToggles "langfuse")) -}} cn-postgres-langfuse-ca {{- else -}} {{ .Values.caSecretDefault | default "cn-postgres-ca" }} {{- end -}}
    - name: pgadmin-transactions-ca
      mountPath: "/var/lib/pgadmin/storage/pgadmin_fseng.net/pg-transactions-ca"
      subPath: ""
      readOnly: true
      secret: >-
        {{- if (default false (index .Values.featureToggles "transactions-api")) -}} cn-postgres-transactions-ca {{- else -}} {{ .Values.caSecretDefault | default "cn-postgres-ca" }} {{- end -}}
    - name: pgadmin-ai-doc-centre-ca
      mountPath: "/var/lib/pgadmin/storage/pgadmin_fseng.net/pg-ai-doc-centre-ca"
      subPath: ""
      readOnly: true
      secret: >-
        {{- if (default false (index .Values.featureToggles "ai-doc-centre")) -}} cn-postgres-ai-doc-centre-ca {{- else -}} {{ .Values.caSecretDefault | default "cn-postgres-ca" }} {{- end -}}
    - name: pgadmin-invhub-migration-ca
      mountPath: "/var/lib/pgadmin/storage/pgadmin_fseng.net/pg-invhub-migration-ca"
      subPath: ""
      readOnly: true
      secret: >-
        {{- if (default false (index .Values.featureToggles "invhub-db-migration")) -}} cn-postgres-invhub-ca {{- else -}} {{ .Values.caSecretDefault | default "cn-postgres-ca" }} {{- end -}}
  serverDefinitions:
    enabled: true
    resourceType: ConfigMap
    existingConfigmap: pgadmin-server-definitions
  extraInitContainers: |
    - name: create-storage-paths
      image: '{{ include "pgadmin.image" . }}'
      command:
        - /bin/sh
        - -c
        - >
          mkdir -p
          /var/lib/pgadmin/storage/pgadmin_fseng.net
          /var/lib/pgadmin/storage/pgadmin_fseng.net/pg-ca-cert
          /var/lib/pgadmin/storage/pgadmin_fseng.net/pg-copilot-ca
          /var/lib/pgadmin/storage/pgadmin_fseng.net/pg-copilotv2-ca
          /var/lib/pgadmin/storage/pgadmin_fseng.net/pg-copilot-data-adapter-ca
          /var/lib/pgadmin/storage/pgadmin_fseng.net/pg-keycloak-ca
          /var/lib/pgadmin/storage/pgadmin_fseng.net/pg-langfuse-ca
          /var/lib/pgadmin/storage/pgadmin_fseng.net/pg-transactions-ca
          /var/lib/pgadmin/storage/pgadmin_fseng.net/pg-ai-doc-centre-ca
          /var/lib/pgadmin/storage/pgadmin_fseng.net/pg-invhub-migration-ca
      volumeMounts:
        - name: pgadmin-data
          mountPath: /var/lib/pgadmin
      securityContext:
        runAsUser: 5050
