---
# toggles for optional components or features in active development
tags:
  # deploys Opensearch for storing logs produced by fluentd deamonset
  # and Opensearch dashboards for visualising the logs
  # for customer tenancy and self hosted Kubernetes clusters.
  logs: false
  # deploys Pod Monitors for metrics collection and Grafana for visualising
  # the metrics
  metrics: false
  # deploys experimental tracing resources,
  # OpenTelemetry collectors, Tempo for storage, Jaeger for visualization
  traces: false
  # deploys resources for experimental chatgpt integration with user guide docs
  ai-doc-centre: false
  # deploys a second PostgreSQL database for invhub application,
  # it will be used for migrating invhub database to remove ayasdi user
  # references
  # and set database collation and ctype settings that can only be done
  # on a new database to resolve sorting issues in invhub UI
  invhub-db-migration: false
  # deploys copilot v2 resources,
  # we are in the process of migrating various copilot functionalities
  # to copilot v2 and Flows
  copilotv2: true
  # deploys multiple api containers, each with a different responsibility,
  # according to
  # https://netreveal.atlassian.net/wiki/spaces/HARMONY/pages/124846650/
  # API+Container+Responsibilities
  # requires api.enabled to be set to false
  separate-api-responsibilities: false
  # deploys transactions REST api service,
  # including transactions PostgeSQL database
  transactions-api: false
  # deploys Langfuse resources, an OpenSource observability tool for LLMs
  # currently used for development and testing purposes
  langfuse: false
  # deploys Keycloak resources for authentication and authorization
  # including Keycloak PostgreSQL database
  # currently used for testing SSO authentication
  keycloak: false
  # deploys web application v2,
  # currently in development to replace the existing web application
  webv2: false
# infra.enabled condition deploys all dependencies for invhub application,
# like Postgre databases, MinIO, Kafka, Opensearch,
# Redis, Ingresses, ClamAv, common secrets and configmaps.
infra:
  enabled: true
# ─── Release-level migration job ─────────────────────────────────────────────
# Rendered once by the invhub parent chart. All api role deployments wait for
# this job before starting (wait-migrations init container).
migrations:
  # Image defaults to api.image — override only to pin migrations to a different tag.
  image:
    repository: ""
    tag: ""
    pullPolicy: ""
  # in-tree patch: raised from 3. On a FRESH install the platform's per-product
  # provisioning Jobs (ensure-db-<name>) can only run as post-install hooks — i.e.
  # AFTER this Job is applied — so the first attempts fail with 28P01 until the
  # role exists. Job backoff is exponential (10s, 20s, 40s, ...), so 8 gives ~10
  # minutes of self-healing instead of ~1.
  backoffLimit: 8
  timeout: 2400
  ttlSecondsAfterFinished: 86400
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi
  flowsConfigMapName: "flows"
  flowsSecretName: "flows"
  imagePullSecrets:
    - name: "regcred"
  podSecurityContext:
    fsGroup: 10001
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    capabilities:
      drop:
        - ALL
  nodeSelector: {}
  tolerations: []
  # TLS CA certificate secrets for the migration job.
  # Leave secretName as "" to auto-resolve from the active api alias:
  #   - tags.separate-api-responsibilities=true → api-for-ui.*.secretName
  #   - otherwise                               → api.*.secretName / mountPath
  # Set secretName/mountPath explicitly to override, or set secretName to "" only
  # here if you want to disable waiting for / mounting a specific cert in migrations only.
  dbRootCert:
    secretName: ""
    key: "ca.crt"
    mountPath: ""
  kafkaRootCert:
    secretName: ""
    key: "ca.crt"
    mountPath: ""
  osRootCert:
    secretName: ""
    key: "ca.crt"
    mountPath: ""
  # Wait for operator-managed TLS CA secrets before mounting them.
  waitForTlsSecrets:
    enabled: true
    image: docker.io/curlimages/curl:8.11.1
    imagePullPolicy: ""            # empty = inherit global.imagePullPolicy
    timeoutSeconds: 900
    resources:
      limits:
        cpu: 100m
        memory: 64Mi
      requests:
        cpu: 10m
        memory: 16Mi
  # Wait for infrastructure dependency endpoints before running migrations.
  waitForDependencies:
    enabled: true
    image: docker.io/curlimages/curl:8.11.1
    imagePullPolicy: ""            # empty = inherit global.imagePullPolicy
    timeoutSeconds: 1200
    resources:
      limits:
        cpu: 100m
        memory: 64Mi
      requests:
        cpu: 10m
        memory: 16Mi
    postgres:
      enabled: true
      service: "" # leave empty to auto-derive from cn-postgres.clusterName
      port: 5432
    kafka:
      enabled: true
      service: "" # leave empty to auto-derive from kafka-cluster.name
      port: 9093
    opensearch:
      enabled: true
      service: "" # leave empty to auto-derive from opensearch.masterService
      port: 9200
    minio:
      enabled: true
      service: "" # leave empty to auto-derive from minioop.tenant.name
      port: 9000
    redis:
      enabled: true
      service: "" # leave empty to auto-derive from redis.fullnameOverride
      port: 6379
api:
  enabled: true
  waitForMigrations:
    createStateConfigMap: false
  image:
    repository: symphonyfs.azurecr.io/symphonysensa/invhub-api
    tag: "v2026.07.7"
  resources:
    requests:
      cpu: "500m"
      memory: "512Mi"
    limits:
      cpu: "2000m"
      memory: "1Gi"
# Defaults for "separate-api-responsibilities" (disabled by default).
# These values apply when global.separateApiResponsibilities=true and the aliased api charts are enabled.
api-for-ui:
  # In separate-api-responsibilities mode, this is the UI-facing API service.
  fullnameOverride: "api-for-ui"
  waitForMigrations:
    createStateConfigMap: false
  resources:
    requests:
      cpu: "500m"
      memory: "512Mi"
    limits:
      cpu: "2000m"
      memory: "1Gi"
api-data-ingestion:
  fullnameOverride: "api-data-ingestion"
  waitForMigrations:
    createStateConfigMap: false
  resources:
    requests:
      cpu: "500m"
      memory: "512Mi"
    limits:
      cpu: "2000m"
      memory: "1Gi"
event-data-ingestion:
  fullnameOverride: "event-data-ingestion"
  waitForMigrations:
    createStateConfigMap: false
  resources:
    requests:
      cpu: "500m"
      memory: "512Mi"
    limits:
      cpu: "2000m"
      memory: "1Gi"
search-indexing:
  fullnameOverride: "search-indexing"
  waitForMigrations:
    createStateConfigMap: false
  resources:
    requests:
      cpu: "500m"
      memory: "512Mi"
    limits:
      cpu: "2000m"
      memory: "1Gi"
disc-api:
  enabled: true
  image:
    repository: symphonyfs.azurecr.io/symphonysensa/invhub-disc-api
    tag: "v2026.07.1"
transac-api:
  image:
    repository: symphonyfs.azurecr.io/symphonysensa/invhub-transactions-api
    tag: "v2025.09"
disc-web:
  enabled: true
  image:
    repository: symphonyfs.azurecr.io/symphonysensa/invhub-disc-web
    tag: "v2026.07.3"
mockserver:
  enabled: false
  image:
    repository: symphonyfs.azurecr.io/symphonysensa/invhub-mockserver
    tag: "v2026.07.1"
reporting-dashboard:
  enabled: true
  image:
    repository: symphonyfs.azurecr.io/symphonysensa/invhub-reporting-poc
    tag: "v1.10.8"
web:
  enabled: true
  image:
    repository: symphonyfs.azurecr.io/symphonysensa/invhub-web
    tag: "v2026.07.1"
help:
  enabled: true
  # &helpName anchor: single source of truth for this component's k8s name,
  # referenced by invhub-ingress' backend below (same file — YAML anchors
  # resolve at parse time to the identical scalar, so this is zero-risk:
  # no template/values-shape change, no effect on any checksum).
  fullnameOverride: &helpName "help"
  image:
    repository: symphonyfs.azurecr.io/symphonysensa/invhub-help-center
    tag: "v2026.07.1"
  readinessProbe:
    httpGet:
      path: /health
      port: http
  env:
    - name: NGINX_BASE_PATH_REWRITE
      value: "help"
graphql-api-docs:
  enabled: true
  # &graphqlApiDocsName anchor: see the &helpName comment above (help: block) —
  # same zero-risk single-source-of-truth technique.
  fullnameOverride: &graphqlApiDocsName "graphql-api-docs"
  image:
    repository: symphonyfs.azurecr.io/symphonysensa/invhub-graphql-api-docs
    tag: "v2026.07.1"
  readinessProbe:
    httpGet:
      path: /
      port: http
