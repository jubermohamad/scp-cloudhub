      secretName: ingress-tls
global:
  imagePullPolicy: Always   # platform default; the umbrella global overrides it
  # Set to true alongside api.enabled=false to deploy split-responsibility API pods.
  # Controls both which charts are deployed AND which API service URL all components use.
  # Replaces the former tags.separate-api-responsibilities mechanism.
  separateApiResponsibilities: false
  # Internal (cluster-local) base URL for the InvHub API, propagated automatically to all subcharts.
  # Leave empty for auto-detection: http://api:3001 (default) or http://api-for-ui:3001 when
  # separateApiResponsibilities=true. Set explicitly only to override the auto-detected URL.
  internalApiBaseUrl: ""
  # ingress tls secret name that will be applied to all Investigation Hub ingresses
  # can be disabled on specified ingresses when ingress.enableGlobalTlsSecret is set to false (true by default)
  # if ingressTlsSecretName is not specified or empty, the ingress.tls[].secretName will be used as usual
  ingressTlsSecretName: "ingress-tls"
  # Canonical service names for infrastructure dependencies.
  # migration-job auto-derives these from chart config (cn-postgres.clusterName, kafka-cluster.name, etc.).
  # api and disc-api subcharts cannot reach parent-chart config, so set these when you change infra chart names.
  # Leave empty to use auto-derived defaults.
  #
  # in-tree patch (naming migration): the api subchart's CLAMAV_HOST/CLAMAV_PORT
  # already read global.CLAMAV_HOST but it was never declared, so the literal
  # "clamavd" was the only reachable value — and the api chart is aliased five
  # times, so that one line feeds five Deployments. Declared here; empty keeps
  # today's default.
  CLAMAV_HOST: ""
  CLAMAV_PORT: ""
  services:
    postgresRw: "" # auto-derived from cn-postgres.clusterName
    kafkaBootstrap: "" # auto-derived from kafka-cluster.name
    opensearchMaster: "" # auto-derived from opensearch.masterService
    minio: "" # auto-derived from minioop.tenant.name
    redisMaster: "" # auto-derived from redis.fullnameOverride
    # in-tree patch (naming migration): the copilot engines' own dependencies.
    # These were consumed by copilot/copilotv2's wait-dependencies helpers
    # before they were declared here — postgresCopilotRw already was, in the
    # deploy overlay only. Declared now so the map is the complete contract:
    # a component whose name is renamed is corrected ONCE here rather than
    # once per copilot alias (copilot is aliased four times).
    postgresCopilotRw: "" # -> cn-postgres-copilot-rw
    postgresCopilotv2Rw: "" # -> cn-postgres-copilotv2-rw
    terrarium: "" # -> terrarium (also PYTHON_SANDBOX_URL in copilotv2)
    copilotDataAdapter: "" # -> copilot-data-adapter (COPILOT_DATA_ADAPTER_URL)
    postgresPort: 5432
    kafkaPort: 9093
    opensearchPort: 9200
    minioPort: 9000
    redisPort: 6379
  # Network policy configuration for network segmentation
  # Requires a CNI that supports NetworkPolicy (Calico, Cilium, etc.)
  networkPolicy:
    # Enable standard Kubernetes NetworkPolicy resources
    enabled: false
    # Namespace where the ingress controller runs (for allowing ingress traffic)
    ingressNamespace: "ingress-nginx"
    # Enable default-deny policy for the namespace (all traffic blocked except explicit rules)
    defaultDeny: false
  # ingress hostname configuration
  # end result will be https://<basename>.<domain>/
  basename: ""
  domain: ""
  # external HTTPS port used when components construct public ingress URLs.
  # keep 443 for standard environments.
  externalHttpsPort: 443
  # hash of client deployment for Pendo (third-party product-analytics app)
  # the goal is to hide the name of the client from Pendo
  # echo -n "<name>" | sha256sum | cut -d ' ' -f1
  pendoAccountId: ""
  pendoApiKey: ""
  # email server configuration if login codes 2FA method is chosen over SSO with SAML
  emailFrom: ""
  emailHost: ""
  emailPort: ""
  emailUsername: ""
  emailFromName: ""
  emailPassword: ""
  # external subjects/detections/transactions database configuration
  remoteDataDbType: ""
  remoteDataDbHost: ""
  remoteDataDbName: ""
  remoteDataDbPort: ""
  remoteDataDbUsername: ""
  remoteDataDbPassword: ""
  remoteDataDbUseSsl: false
  remoteDataDbSslSelfSigned: false
  # token for Google maps.
  # domain of the environment must be added to an allow list in Google Cloud Console
  # that is managed by the Investigation Hub team
  googleMapsApiKey: ""
  # default value for maximum number of records that can be exported in CSV format
  csvMaxExportRecords: 10000
  # Enable Node.js inspect port for debugging (exposes the Node.js debugger protocol).
  # This allows remote debugging of Node.js processes via Chrome DevTools or similar tools.
  # WARNING: This should only ever be enabled when requested by Engineering.
  enableNodeInspect: false
  # version of Eureka platform
  eurekaVersion: "v1.8.3"
  # main password for the application
  PASSWORD: ""
  secrets:
    # Rotation nonce: change this value to rotate "keep" Secrets that otherwise remain stable.
    # This is still being tested; do not enable in production.
    rotationId: ""
    # When true, render Secrets even if they already exist but are not Helm-owned.
    # Use with care and only when intentionally adopting existing Secrets into this release.
    adoptExisting: false
  # Database connection limit for API pods. When increasing ensure there are enough connections in the database pool
  DB_CONNECTION_LIMIT: 10
  # Seconds the DB client waits when acquiring a connection from the pool (Prisma/pg URL: pool_timeout).
  # Wired into SENSA_DB_URL query string; override per environment in values.overrides.yaml.
  dbPoolTimeout: 4
  # Seconds to wait for a new TCP connection to Postgres before failing (URL: connect_timeout).
  dbConnectTimeout: 4
  # TCP keepalive settings for database connections - enables faster detection of dead connections
  # keepalives=1 enables TCP keepalives, idle=60s before first probe,
  # interval=10s between probes, count=6 failed probes before dead
  # Total detection time: 60s + (10s × 6) = ~2 minutes (vs PostgreSQL's default 2+ hours)
  DB_KEEPALIVES: "&keepalives=1&keepalives_idle=60&keepalives_interval=10&keepalives_count=6"
  # copilot v1 configuration, to be removed in future.
  # copilot is at the moment being migrated to copilot v2 and Flows
  copilot:
    AZURE_OPENAI_ENDPOINT_GPT4O_MINI: https://changeme.openai.azure.com/
    OPENAI_API_KEY_GPT4O_MINI: ""
    DEPLOYMENT_NAME_GPT4O_MINI: gpt-4o-mini
    OPENAI_API_VERSION_GPT4O_MINI: 2024-02-15-preview
    OPENAI_API_TYPE_GPT4O_MINI: azure
    MODEL_NAME_GPT4O_MINI: gpt-4o-mini
    AZURE_OPENAI_ENDPOINT_GPT4O: https://changeme.openai.azure.com/
    OPENAI_API_KEY_GPT4O: ""
    DEPLOYMENT_NAME_GPT4O: gpt-4o
    OPENAI_API_VERSION_GPT4O: 2024-02-15-preview
    OPENAI_API_TYPE_GPT4O: azure
    MODEL_NAME_GPT4O: gpt-4o
    OPENAI_ENDPOINT_EMBEDDING: https://changeme.openai.azure.com/
    OPENAI_API_KEY_EMBEDDING: ""
    AZURE_DEPLOYMENT_NAME_EMBEDDING: text-embedding-ada-002
    OPENAI_API_VERSION_EMBEDDING: 2023-03-15-preview
    OPENAI_MODEL_NAME_EMBEDDING: text-embedding-ada-002
    OPENAI_CLIENT_ID: ""
    OPENAI_TOKEN_URL: ""
    CERT_FILE_PATH: ""
    KEY_FILE_PATH: ""
    SERPAPI_API_KEY: INVHUB_SERPAPI_API_KEY
    GQL_API_KEY: INVHUB_SENSA_API_KEY_SECRET
    INTROSPECTION_GQL_API_KEY: INVHUB_SENSA_API_KEY_SECRET
  # end of copilot v1
  AGENT_BATCH_MAX_CONCURRENT_REQUESTS: 15
  AGENT_REQUESTS_BATCH_CRON: "*/3 * * * *"
  # ── API / migration job defaults ────────────────────────────────────────────
  # Defaults shared by the api subcharts and the parent migration job.
  # Override per environment in your values.overrides.yaml.
  SENSA_API_DOCS: true
  SENSA_SERVICE_USER: "service@symphony.ai"
  SENSA_LOG_LEVEL: "warn"
  SENSA_THROTTLE_LIMIT: 100
  EVENT_SCHEDULER_CRON: "0 0-23/12 * * *"
  ENABLED_DISCLOSURE_TYPES: ""
  ENTITY_RESOLUTION_URL: ""
  SERVICES_MANAGER_URL: ""
  SENSA_JWT_EXPIRESIN: 300
  SENSA_JWT_REFRESH_EXPIRESIN: 3600
  SENSA_CORS_ORIGIN: ""
  KAFKA_CONNECTOR_URL: "http://cdc-connect-api:8083"
  SENSA_KAFKA_BOOTSTRAP: "invhub-kafka-bootstrap:9093"
  SENSA_KAFKA_SSL: "true"
  SENSA_KAFKA_MAX_BYTES: "10485880"
  SENSA_KAFKA_SSL_CA_PATH: "/kafka-ca-cert/ca.crt"
  SENSA_KAFKA_INITIAL_RETRY_TIME: 5000
  SENSA_KAFKA_RETRIES: 3
  SENSA_KAFKA_SESSION_TIMEOUT: 45000
  SENSA_KAFKA_HEARTBEAT_INTERVAL: 15000
  SENSA_PROMETHEUS_URL: "http://prometheus:9090"
  MINIO_SSL_CA_PATH: "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
  INVESTIGATION_HUB_OPEN_SEARCH_URL: "https://opensearch-cluster-master:9200"
  INVESTIGATION_HUB_OPEN_SEARCH_BASIC_AUTH: true

minioop-extensions:
  # P7: the minio-operator Tenant's companion chart (bucket/user provisioning
  # for invhub's own Tenant). Follows minioop.enabled — turn both off when
  # using a shared object store.
  enabled: true


# ── InvHub's own Keycloak provisioning (templates/keycloak-setup-job.yaml) ────
# Registers InvHub's Keycloak material — its SAML client, that client's attribute
# mappers, and the realm roles it authorizes on — into a realm ANOTHER chart owns
# (the platform realm `SRI`). Sibling of detectionhub's Job; the two provision
# disjoint material and may run in any order.
#
# DEFAULT OFF, and note this is not the only switch: InvHub's application-side
# auth is `LOGIN_FORM` (see the `auth:` block above), so provisioning this client
# does NOT by itself put InvHub on SSO. Enabling SSO is an app-side change (auth
# type + SP configuration) that must land in the same change as this flag.
keycloakSetup:
  enabled: false
  # kcadm ships in the Keycloak image; reuse the platform's own so no extra image
  # has to be mirrored into the private registry.
  image: symphonyfs.azurecr.io/bitnami/keycloak:26.3.3-debian-12-r0
  imagePullPolicy: ""            # empty = inherit global.imagePullPolicy
  # REQUIRED for a private registry. This chart's `global` carries no pull
  # secret, so it must be named here — invhub's own pods use `regcred`.
  # Omitting it fails as ImagePullBackOff, not as a template error.
  imagePullSecrets:
    - name: regcred
  # Bitnami's path; the upstream quay.io image uses /opt/keycloak/bin/kcadm.sh.
  kcadmPath: /opt/bitnami/keycloak/bin/kcadm.sh
  # REQUIRED, and must be the IN-CLUSTER URL: the master-realm admin token lives
  # 60 seconds and public-ingress latency has outlived it mid-Job.
  internalUrl: ""
  realm: SRI
  adminRealm: master
  adminUser: admin
  adminPasswordSecret:
    name: ""
    key: admin-password
  # The client body is sent to the admin API verbatim, so anything Keycloak
  # accepts on a client can be set here without touching the template.
  client:
    clientId: investigation-hub
    name: Investigation Hub
    enabled: true
    protocol: saml
    fullScopeAllowed: true
    rootUrl: ""
    # Master SAML Processing URL / assertion consumer service. The published
    # spec is inconsistent about this path (/v1/api/callback in the UI
    # walkthrough vs /v1/auth/callback in the JSON), so it is a value with NO
    # default — set it to whatever the deployed InvHub build actually posts to.
    # A wrong value fails only at login, never at deploy.
    adminUrl: ""
    redirectUris: []
    attributes:
      saml.force.post.binding: "true"
      saml.authnstatement: "true"
      # IdP-initiated SSO name. THE GOTCHA: InvHub must be pointed at
      # {keycloak}/realms/{realm}/protocol/saml/clients/{this-name}, NOT the
      # plain realm SAML URL that Keycloak's metadata advertises by default.
      saml_idp_initiated_sso_url_name: investigation-hub
  # Group list mapper. `Role` / `Groups` are case-sensitive on the InvHub side
  # (they are predefined Keycloak attribute names, referenced there as
  # `attributes, Role` / `attributes, Groups`).
  groupMapper:
    enabled: true
    name: group list
    attributeName: Groups
  # InvHub's documented out-of-the-box realm-role set (HARMONY 193889346).
  # CORRECTED 2026-08-13: two of these were previously misspelled
  # (`-aml-investigator`, `-fin-crime-manager`) because they were copied from an
  # illustrative example on a different page, and three were missing.
  #
  # These names are OURS to choose — the InvHub backend contains no
  # `investigation-hub-*` literal anywhere (verified by grepping the deployed
  # image). They are only ever matched against `samlSettings.groupMappings[].groupId`
  # below. What is NOT ours to choose is the `roleIds` on the other side of that
  # mapping: those must be real ids from InvHub's own `roles` table. Keeping the
  # documented spelling means a customer realm built to the published guide maps
  # straight onto this chart with no edits.
  roles:
    - name: investigation-hub-admin
      description: Investigation Hub administrator
    - name: investigation-hub-aml-l1-investigator
      description: Investigation Hub AML level 1 investigator
    - name: investigation-hub-aml-l2-investigator
      description: Investigation Hub AML level 2 investigator
    - name: investigation-hub-fincrime-manager
      description: Investigation Hub financial crime manager
    - name: investigation-hub-guest
      description: Investigation Hub guest
    - name: investigation-hub-readonly
      description: Investigation Hub read-only user
  # Customer IDPs (Entra ID, Okta, Auth0) federate INTO the realm here. This is
  # CUSTOMER-SPECIFIC and intentionally empty: the chart ships the mechanism, not
  # one customer's federation. Each entry is an admin-API identityProvider body.
  identityProviders: []
  # Only used when identityProviders is non-empty: a copy of `first broker login`
  # with idp-review-profile DISABLED, so brokered users are not prompted to
  # confirm a profile whose attributes are already mapped.
  firstBrokerLoginFlowAlias: first broker login - no review
  roleAssignments: {}
  backoffLimit: 6
  # 7200, not 600: a TTL shorter than helm's wait deletes a completed Job
  # while the watcher still needs it, and the release fails as NotFound
  ttlSecondsAfterFinished: 7200
  resources: {}

# ---------------------------------------------------------------------------
# InvHub's APP-SIDE SAML settings (the other half of keycloakSetup above).
#
# keycloakSetup only ever writes KEYCLOAK material — client, roles, mappers. It
# cannot make InvHub USE any of it: that lives in InvHub's own database, as the
# `SAML_SETTINGS` row of `key_values`, and until it is set the login page shows
# the built-in email-verification-code form and `getSamlSettings.status` is
# `Empty`. This block is that missing half.
#
# WRITE PATH — the `updateSamlSettings` GraphQL mutation on the invhub api
# (`POST /graphql`), NOT a SQL insert. The mutation downloads and parses the IdP
# metadata, validates the payload, writes an audit log, and re-initialises the
# live samlify providers in the running process. A hand-written row would skip
# all four, and would not even take effect: SamlService caches the providers and
# `setupProviders()` early-returns once they are set.
#
# ONE-WAY DOOR, accepted deliberately by the platform owner on 2026-08-13:
# once `status` becomes `Set`, `createNewLoginCode` returns `samlCallbackUrl`
# for EVERY email unconditionally, so the email-code login is gone for all
# users and every account must come from Keycloak. The UI additionally refuses
# to edit or deactivate users. See docs/INVHUB-SSO.md for the reversal path.
samlSettings:
  # OFF by default. A cold install must be able to reach the app to create the
  # Keycloak accounts BEFORE the local login is taken away.
  enabled: false
  # Hook weight 11 — strictly AFTER keycloakSetup (10) so the client and roles
  # exist, and after the configurator (4) which seeds users; enabling SAML
  # blocks in-app user edits, so all user seeding must already have happened.
  hookWeight: "11"
  image:
    repository: curlimages/curl
    tag: "8.10.1"
    pullPolicy: ""            # empty = inherit global.imagePullPolicy
  # Realm SAML descriptor. Fetched SERVER-SIDE by the invhub api pod, so this
  # must be an IN-CLUSTER URL — the api has no route to the public ingress.
  # The raw XML it returns is stored verbatim and is where the IdP signing
  # certificate comes from; there is no separate certificate field.
  samlMetaDataUrl: ""
  # THE DOCUMENTED GOTCHA. Must be the IDP-INITIATED SSO URL
  # (.../protocol/saml/clients/<saml_idp_initiated_sso_url_name>), NOT the plain
  # realm URL `.../protocol/saml` that Keycloak's own metadata advertises. This
  # backend REJECTS SP-initiated login outright ("SP-initiated login is not
  # supported!"), so the plain realm URL yields a login that always fails.
  idpSsoUrl: ""
  # Attribute mappings. The backend splits each value on ", " (comma-SPACE) and
  # walks the result as a path into the parsed assertion, so `attributes, Role`
  # means `extract.attributes.Role`. All four are mandatory for status `Set`.
  #
  # THESE MUST MATCH THE MAPPER NAMES *OUR* CLIENT EMITS, not the ones in the
  # HARMONY guide. The guide specifies `attributes, surname` and `nameID`, which
  # describe a client whose mappers were named to a different convention. The
  # `investigation-hub` client that keycloakSetup creates emits attributes named
  # firstName / lastName / email / username, plus `Role` from the realm's
  # built-in role_list scope. Verified by decoding a real assertion.
  #
  # Using the guide's values verbatim was tried and FAILED SILENTLY — the login
  # succeeded, but InvHub stored an empty surname (no `surname` attribute exists
  # to read) and put the *username* in the email column (nameID is the username,
  # because the client's NameID format is `username`). Nothing errored; the
  # account was simply wrong. Hence:
  #   * last name reads `lastName`, NOT the guide's `surname`
  #   * email reads the `email` ATTRIBUTE, not `nameID` — this also decouples
  #     the email column from the client's NameID format
  # `Role` stays capitalised: it is Keycloak's predefined role-list attribute.
  fieldMappingFirstName: "attributes, firstName"
  fieldMappingLastName: "attributes, lastName"
  fieldMappingEmail: "attributes, email"
  fieldMappingGroup: "attributes, Role"
  # Keycloak realm role -> InvHub role ids. `groupId` and `groupName` are the
  # Keycloak realm role name (for a Keycloak IdP groupName == groupId).
  # `roleIds` MUST be ids from InvHub's `roles` table, not display names.
  #
  # HARD VALIDATION RULE: at least one entry's roleIds must contain the literal
  # string `admin` (AdminRoleValues.ADMIN_ROLE_ID), or the mutation fails with
  # SamlSettingsMissingAdminRoleMappingError and nothing is written.
  #
  # AML L1/L2 both map to `amlInvestigator` because InvHub draws the L1/L2
  # distinction at TEAM level ("AML L1 Team" / "AML L2 Team"), not role level.
  groupMappings:
    - groupId: investigation-hub-admin
      groupName: investigation-hub-admin
      roleIds: ["admin"]
    - groupId: investigation-hub-aml-l1-investigator
      groupName: investigation-hub-aml-l1-investigator
      roleIds: ["amlInvestigator"]
    - groupId: investigation-hub-aml-l2-investigator
      groupName: investigation-hub-aml-l2-investigator
      roleIds: ["amlInvestigator"]
    - groupId: investigation-hub-fincrime-manager
      groupName: investigation-hub-fincrime-manager
      roleIds: ["finCrimeManager"]
    - groupId: investigation-hub-guest
      groupName: investigation-hub-guest
      roleIds: ["guest"]
    - groupId: investigation-hub-readonly
      groupName: investigation-hub-readonly
      roleIds: ["guest"]
  backoffLimit: 6
  # 7200, not 600: a TTL shorter than helm's wait deletes a completed Job
  # while the watcher still needs it, and the release fails as NotFound
  ttlSecondsAfterFinished: 7200
  resources: {}
