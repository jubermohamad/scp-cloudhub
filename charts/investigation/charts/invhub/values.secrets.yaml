---
global:
  PASSWORD: $INVHUB_PASSWORD
  sensaEmailPassword: $INVHUB_SENSA_EMAIL_PASSWORD
  googleMapsApiKey: $INVHUB_GOOGLE_MAPS_API_KEY
  pendoApiKey: $INVHUB_PENDO_API_KEY
  remoteDataDbPassword: $NR_DB_PASSWORD

  copilot:
    OPENAI_API_KEY_GPT4O: $INVHUB_OPENAI_API_KEY_GPT4O
    OPENAI_API_KEY_GPT4O_MINI: $INVHUB_OPENAI_API_KEY_GPT4O_MINI
    OPENAI_API_KEY_EMBEDDING: $INVHUB_OPENAI_API_KEY_EMBEDDING
    SERPAPI_API_KEY: $INVHUB_SERPAPI_API_KEY
    GQL_API_KEY: $INVHUB_SENSA_API_KEY_SECRET
