api:
  calicoNetworkPolicy:
    enabled: false
    ingress:
      - action: Allow
        protocol: TCP
        source: {}
        destination:
          ports:
            - 3001
            - 3003
    egress:
      - action: Allow
        protocol: UDP
        destination:
          ports:
            - 53
      - action: Allow
        metadata:
          annotations:
            from: api
            to: web
        protocol: TCP
        destination:
          ports:
            - 80
      - action: Allow
        protocol: TCP
        destination:
          ports:
            - 587
      - action: Allow
        metadata:
          annotations:
            from: api
            to: postgres
        protocol: TCP
        destination:
          ports:
            - 5432
      - action: Allow
        metadata:
          annotations:
            from: api
            to: kafka
        protocol: TCP
        destination:
          ports:
            - 9092
            - 9093
      - action: Allow
        metadata:
          annotations:
            from: api
            to: opensearch
        protocol: TCP
        destination:
          ports:
            - 9200
      - action: Allow
        metadata:
          annotations:
            from: api
            to: redis
        protocol: TCP
        destination:
          ports:
            - 6379
      - action: Allow
        metadata:
          annotations:
            from: api
            to: copilot
        protocol: TCP
        destination:
          ports:
            - 8001
      - action: Allow
        metadata:
          annotations:
            from: api
            to: clamav
        protocol: TCP
        destination:
          ports:
            - 3310
      - action: Allow
        metadata:
          annotations:
            from: api
            to: minio
        protocol: TCP
        destination:
          ports:
            - 9000

