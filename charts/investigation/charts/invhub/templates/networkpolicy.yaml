{{- /* Kafka-UI NetworkPolicy */ -}}
{{- if index .Values "kafka-ui" }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kafka-ui-network-policy
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: kafka-ui
    app.kubernetes.io/component: network-policy
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kafka-ui
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow ingress from nginx-ingress controller
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.global.networkPolicy.ingressNamespace | default "ingress-nginx" }}
      ports:
        - protocol: TCP
          port: 8080
    # Allow ingress from within the namespace
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 8080
  egress:
    # Allow egress to Kafka
    - to:
        - podSelector:
            matchLabels:
              {{- /* in-tree patch: was the literal `invhub`, the chart's own
                   bundled Kafka name. This installation runs a shared cluster
                   under a different name, so the selector matched nothing —
                   inert only because networkPolicy.enabled is false. Derive it
                   from the same key that names the Kafka CR. */}}
              strimzi.io/cluster: {{ .Values.global.kafkaClusterName | default (index .Values "kafka-cluster" | default dict).name | default "invhub" }}
      ports:
        - protocol: TCP
          port: 9092
        - protocol: TCP
          port: 9093
    # Allow DNS
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
{{- end }}

{{- /* PgAdmin NetworkPolicy */ -}}
