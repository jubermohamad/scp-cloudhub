{{- $hasCalico := .Capabilities.APIVersions.Has "crd.projectcalico.org/v1/NetworkPolicy" -}}
{{- if and $hasCalico .Values.redis.calicoNetworkPolicy.enabled }}
---
apiVersion: crd.projectcalico.org/v1
kind: NetworkPolicy
metadata:
  name: redis-policy
  namespace: {{ .Release.Namespace }}
spec:
  types:
    {{- if .Values.redis.calicoNetworkPolicy.ingress }}
    - Ingress
    {{- end }}
    - Egress
  selector: app.kubernetes.io/name == 'redis'
  {{- if .Values.redis.calicoNetworkPolicy.ingress }}
  {{- with  .Values.redis.calicoNetworkPolicy.ingress }}
  ingress:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- end }}
  {{- if .Values.redis.calicoNetworkPolicy.egress }}
  {{- with  .Values.redis.calicoNetworkPolicy.egress }}
  egress:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- end }}
---
{{- end }}

