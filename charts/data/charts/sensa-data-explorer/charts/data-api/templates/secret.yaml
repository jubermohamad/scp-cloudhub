{{- if not .Values.database.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "data-api.fullname" . }}-db
  labels:
    {{- include "data-api.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.database.secretKey }}: {{ required "Set database.url or database.existingSecret" .Values.database.url | quote }}
{{- end }}
{{- if and .Values.writeStore.url (not .Values.writeStore.existingSecret) }}
---
# Only rendered when the write store has its own DSN. Left unset, the API falls
# back to the source database with schema `writeStore.schema`.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "data-api.fullname" . }}-write-db
  labels:
    {{- include "data-api.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.writeStore.secretKey }}: {{ .Values.writeStore.url | quote }}
{{- end }}
