{{- $api := include "cpr.api.fullname" . -}}
{{- $web := include "cpr.web.fullname" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $web }}
  labels: {{- include "cpr.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.web.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "cpr.name" . }}
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "cpr.name" . }}
        app.kubernetes.io/component: web
    spec:
      {{- include "cpr.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: web
          image: "{{ .Values.images.web.repository }}:{{ .Values.images.web.tag }}"
          imagePullPolicy: {{ .Values.images.pullPolicy | default $.Values.global.imagePullPolicy | default "Always" }}
          ports:
            - containerPort: 80
          env:
            # nginx proxies /api/ here (envsubst'd into the site config at container start).
            - name: CPR_API_UPSTREAM
              value: "http://{{ $api }}:{{ .Values.api.service.port }}"
          readinessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 10
            periodSeconds: 20
          resources: {{- toYaml .Values.web.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $web }}
  labels: {{- include "cpr.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: {{ include "cpr.name" . }}
    app.kubernetes.io/component: web
  ports:
    - port: {{ .Values.web.service.port }}
      targetPort: 80
