---
apiVersion: v1
kind: ConfigMap
metadata:
  name: "{{ .Release.Name }}-minio-customer-policy"
  # in-tree patch: NO namespace stamp. These objects are mounted by
  # provision-job.yaml, which carries no namespace and therefore lands in the
  # RELEASE namespace — as does its target, the dxv-minio Service (the bundled
  # minio chart ignores global.namespace). Stamping global.namespace here put
  # them in sri-dxv where the Job could never mount them; it only ever worked
  # because stale copies from before the dxv namespace rename sat in the
  # release namespace. Exposed by the clean uninstall/reinstall.
  annotations:
    # This is what defines this resource as a hook. Without this line, the
    # job is considered part of the release.
    "helm.sh/hook": pre-install, pre-upgrade, post-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
data:
  customer.policy.json: |
    {
    "Version": "2012-10-17",
    "Statement": [
        {
        "Action": [
                "s3:ListBucket",
                "s3:PutObject",
                "s3:GetObject",
                "s3:DeleteObject"
            ],
        "Effect": "Allow",
        "Resource": [
            "arn:aws:s3:::public-bucket/*","arn:aws:s3:::public-bucket"
        ],
        "Sid": "BucketAccessForUser"
        }
    ]
    }

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: "{{ .Release.Name }}-minio-psql-policy"
  # in-tree patch: NO namespace stamp. These objects are mounted by
  # provision-job.yaml, which carries no namespace and therefore lands in the
  # RELEASE namespace — as does its target, the dxv-minio Service (the bundled
  # minio chart ignores global.namespace). Stamping global.namespace here put
  # them in sri-dxv where the Job could never mount them; it only ever worked
  # because stale copies from before the dxv namespace rename sat in the
  # release namespace. Exposed by the clean uninstall/reinstall.
  annotations:
    # This is what defines this resource as a hook. Without this line, the
    # job is considered part of the release.
    "helm.sh/hook": pre-install, pre-upgrade, post-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
data:
  psql.policy.json: |
    {
    "Version": "2012-10-17",
    "Statement": [
        {
        "Action": [
                "s3:*"
            ],
        "Effect": "Allow",
        "Resource": [
            "arn:aws:s3:::backup/*","arn:aws:s3:::backup"
        ],
        "Sid": "BucketAccessForUser"
        }
    ]
    }
