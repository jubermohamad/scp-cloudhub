{{- /* in-tree patch: the PRESERVATION lookup must read the namespace this
     Secret is actually created in — the RELEASE namespace, not
     global.namespace (see the comment below on why there is no namespace
     stamp). Reading the wrong namespace never finds the existing Secret, so
     every install silently REGENERATED the per-org-unit SFTP usernames and
     passwords: broken idempotency, and credentials that rotate under a running
     consumer. */}}
{{- $secret := lookup "v1" "Secret" .Release.Namespace "org-units-sftp-creds" }}
---
apiVersion: v1
kind: Secret
metadata:
  name: "org-units-sftp-creds"
  # in-tree patch: NO namespace stamp. These objects are mounted by
  # provision-job.yaml, which carries no namespace and therefore lands in the
  # RELEASE namespace — as does its target, the dxv-minio Service (the bundled
  # minio chart ignores global.namespace). Stamping global.namespace here put
  # them in sri-dxv where the Job could never mount them; it only ever worked
  # because stale copies from before the dxv namespace rename sat in the
  # release namespace. Exposed by the clean uninstall/reinstall.
  annotations:
    # This is what defines this resource as a hook. Without this line, the
    # job is considered part of the release.
    "helm.sh/hook": pre-install, pre-upgrade, post-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
type: Opaque
stringData:
  {{- if .Values.global.nrOrgUnits }}
    {{- if ne (len .Values.global.nrOrgUnits) 0 }}
      {{- range $key, $value := .Values.global.nrOrgUnits }}
        {{- $usrKey := (printf "%s%s%s" "USR_" ($value.orgUnitCode | upper | replace "-" "_") "_NAME") }}
        {{- if ne $value.userName "" }}
    {{ $usrKey }}: "{{ $value.userName }}"
        {{- else }}
          {{- if and $secret $secret.data (hasKey $secret.data $usrKey) }}
            {{- $usrValue := index $secret.data $usrKey }}
    {{ $usrKey }}: {{ $usrValue | b64dec | quote }}
          {{- else }}
    {{ $usrKey }}: "{{ default "usr" $.Values.global.orgUnitUserPrefix }}-{{ $value.orgUnitCode | lower }}"
          {{- end }}
        {{- end }}
    {{- $passKey := ( printf "%s%s%s" "USR_" ($value.orgUnitCode | upper | replace "-" "_") "_PASSWORD") }}
        {{- if ne $value.userPassword "" }}
    {{ $passKey }}: "{{ $value.userPassword }}"
        {{- else }}
          {{- if and $secret $secret.data (hasKey $secret.data $passKey) }}
            {{- $passValue := index $secret.data $passKey }}
    {{ $passKey }}: {{ $passValue | b64dec | quote }}
          {{- else }}
    {{ $passKey }}: "{{ randAlphaNum 12 }}"
          {{- end }}
        {{- end }}
      {{- end }}
    {{- end }}
  {{- end }}
