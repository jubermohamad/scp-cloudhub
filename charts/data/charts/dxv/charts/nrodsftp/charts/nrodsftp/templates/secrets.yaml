{{- $root := . -}}
---
apiVersion: v1
kind: Secret
metadata:
  name: "nrodsftp-minio-creds"
  annotations:
    # This is what defines this resource as a hook. Without this line, the
    # job is considered part of the release.
    "helm.sh/hook": pre-install, pre-upgrade, post-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
type: Opaque
stringData:
  config.yaml: |
  {{- /* RUNTIME identity — this is what nrodsftp authenticates to the object
       store with (MINIO_ACCESS_KEY/MINIO_SECRET_KEY), and, when the bundled
       MinIO is enabled, also that Deployment's own root credentials.
       Values-driven so the platform can point nrodsftp at a SCOPED service
       account on the shared store instead of handing a product the shared
       store's root password. Defaults reproduce the previous hardcode
       exactly (user `minio`, global.PASSWORD), so a standalone install where
       app == admin == root is unchanged. */}}
  rootUser: "{{ (.Values.global.minio).appUser | default ((.Values.global.minio).user | default "minio") }}"
  rootPassword: "{{ (.Values.global.minio).appPassword | default ((.Values.global.minio).password | default .Values.global.PASSWORD) }}"

---
apiVersion: v1
kind: Secret
metadata:
  name: "{{ include "secret.s3.private.bucket.name" . }}"
  annotations:
    # This is what defines this resource as a hook. Without this line, the
    # job is considered part of the release.
    "helm.sh/hook": pre-install, pre-upgrade, post-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
type: Opaque
stringData:
  {{- /* ADMIN identity — the minio-provisioner Job authenticates with this. It
       genuinely needs admin rights: `admin config set` (webhook targets),
       `admin service restart`, `admin user add`, `admin policy create`. A
       bucket-scoped account CANNOT do those, which is why this is separate from
       the runtime identity above rather than the same credential. On the shared
       platform store this is the store's root user; nothing is committed. */}}
  MINIO_USER: "{{ (.Values.global.minio).user | default "minio" }}"
  MINIO_PASSWORD: "{{ (.Values.global.minio).password | default .Values.global.PASSWORD }}"
  CLIENT_USER: "{{ .Values.global.minio.clientUser }}"
  CLIENT_PASSWORD: "{{ .Values.global.minio.clientPassword }}"
  PSQL_USER: "{{ .Values.global.minio.psqlUser }}"
  PSQL_PASSWORD: "{{ .Values.global.minio.psqlPassword }}"

---
apiVersion: v1
kind: Secret
metadata:
  name: "nrodsftp-orgunit-json-config"
  annotations:
    reloader.stakater.com/match: "true"
type: Opaque
data:
  orgunits_setup.json: {{ include "nrodsftp.orgUnitsJson" . | b64enc | quote }}
