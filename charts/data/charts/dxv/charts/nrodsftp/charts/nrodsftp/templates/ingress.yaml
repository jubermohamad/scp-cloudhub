{{- /*
GATED (2026-08-13). This template had NO `if` guard — unlike every other ingress
in the tree — so it rendered whenever nrodsftp was enabled, and `minio.enabled:
false` never removed it because it lives in the nrodsftp subchart, not the minio
one. On the consolidated platform its backends follow `global.minioServiceName`,
which the dxv fold-in repointed at the PLATFORM object store. Net effect: the
platform's S3 API (`:9000`) and console (`:9001`) were reachable on the public
load balancer via a `Host:` header — verified, a real MinIO AccessDenied XML and
a 200 console login page — while three separate comments in the deploy values
asserted "the S3 API has NEVER had an ingress". ingress-nginx routes on Host, not
DNS, so the `.local` names hid the route without protecting it.

Default stays `true` so a standalone dxv install is unchanged (org contract); the
umbrella turns it off. Written as an explicit key rather than `default true`,
because Helm's `default` treats `false` as empty and would ignore the override.
*/ -}}
{{- if .Values.ingress.enabled }}
{{- $root := . -}}
{{- $ingClass := coalesce .Values.ingress.className .Values.global.ingress.className "nginx-inc" -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: minio-ingress
  annotations:
    {{- if .Values.ingress.annotations }}
    {{- toYaml .Values.ingress.annotations | nindent 4 }}
    {{- end }}
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.org/redirect-to-https: "true"
    ## WebSocket support - required for MinIO Console UI (bucket browsing, uploads, real-time updates)    
    nginx.org/websocket-services: "{{ (.Values.global).minioServiceName | default "dxv-minio" }}-console"    
    ## Proxy timeouts - MinIO Console uses long-polling; default 60s causes UI to hang    
    nginx.org/proxy-connect-timeout: "300s"    
    nginx.org/proxy-read-timeout: "300s"    
    nginx.org/proxy-send-timeout: "300s"    
    ## Allow large file uploads through MinIO UI (0 = unlimited)    
    nginx.org/client-max-body-size: "0"
    {{- $customerIPs := .Values.ingress.ingressAllowList.customerIPs }}
    {{- $platformIPs := .Values.ingress.ingressAllowList.platformIPs }}
    {{- $allIPs := concat $customerIPs $platformIPs | uniq | compact }}
    {{- if and $allIPs (gt (len $allIPs) 0) }}
    nginx.ingress.kubernetes.io/whitelist-source-range: {{ join ", " $allIPs | quote }}
    nginx.org/ip-allow-list: {{ join ", " $allIPs | quote }}
    {{- end }}
    {{- if not (semverCompare ">=1.18-0" .Capabilities.KubeVersion.GitVersion) }}
    kubernetes.io/ingress.class: {{ $ingClass | quote }}
    {{- end }}
spec:
  {{- if semverCompare ">=1.18-0" .Capabilities.KubeVersion.GitVersion }} 
  ingressClassName: {{ $ingClass | quote }} 
  {{- end }}
  tls:
  - hosts:
    - {{ tpl .Values.global.MINIO_INGRESS_HOST . }}
    - {{ tpl .Values.global.MINIOUI_INGRESS_HOST . }}
    secretName: {{ .Values.global.SSL_SECRETS }}
  rules:
  - host: {{ tpl .Values.global.MINIO_INGRESS_HOST . }}
    http:
      paths:
      - pathType: Prefix
        path: "/"
        backend:
          service:
            name: {{ (.Values.global).minioServiceName | default "dxv-minio" }}
            port:
              number: 9000
  - host: {{ tpl .Values.global.MINIOUI_INGRESS_HOST . }}
    http:
      paths:
      - pathType: Prefix
        path: "/"
        backend:
          service:
            name: {{ (.Values.global).minioServiceName | default "dxv-minio" }}-console
            port:
              number: 9001
{{- end }}
