{{- if .Values.ingress.enabled -}}
{{- $fullName := include "minio.fullname" . -}}
{{- $servicePort := .Values.service.port -}}
{{- $ingressPath := .Values.ingress.path -}}
{{- $ingClass := coalesce .Values.ingress.className .Values.global.ingress.className "nginx-inc" -}}
apiVersion: {{ template "minio.ingress.apiVersion" . }}
kind: Ingress
metadata:
  name: {{ $fullName }}
  labels:
    app: {{ template "minio.name" . }}
    chart: {{ template "minio.chart" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
    {{- with .Values.ingress.labels }}
      {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- $customerIPs := .Values.ingress.ingressAllowList.customerIPs }}
  {{- $platformIPs := .Values.ingress.ingressAllowList.platformIPs }}
  {{- $allIPs := concat $customerIPs $platformIPs | uniq | compact }}
  {{- if or .Values.ingress.annotations (and $allIPs (gt (len $allIPs) 0)) }}
  annotations:
    {{- with .Values.ingress.annotations }}
      {{- tpl (toYaml .) $ | nindent 4 }}
    {{- end }}
    {{- if and $allIPs (gt (len $allIPs) 0) }}
    nginx.ingress.kubernetes.io/whitelist-source-range: {{ join ", " $allIPs | quote }}
    nginx.org/ip-allow-list: {{ join ", " $allIPs | quote }}
    {{- end }}
    {{- if not (semverCompare ">=1.18-0" .Capabilities.KubeVersion.GitVersion) }} 
	  kubernetes.io/ingress.class: {{ $ingClass | quote }} 
	  {{- end }}
  {{- end }}
spec:
  {{- if semverCompare ">=1.18-0" .Capabilities.KubeVersion.GitVersion }} 
	ingressClassName: {{ $ingClass | quote }} 
	{{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
    - hosts:
      {{- range .hosts }}
        - {{ . | quote }}
      {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - http:
        paths:
          - path: {{ $ingressPath }}
            {{- if semverCompare ">=1.19-0" $.Capabilities.KubeVersion.GitVersion }}
            pathType: Prefix
            backend:
              service:
                name: {{ $fullName }}
                port:
                  number: {{ $servicePort }}
            {{- else }}
            backend:
              serviceName: {{ $fullName }}
              servicePort: {{ $servicePort }}
            {{- end }}
      {{- if . }}
      host: {{ tpl . $ | quote }}
      {{- end }}
    {{- end }}
{{- end }}
