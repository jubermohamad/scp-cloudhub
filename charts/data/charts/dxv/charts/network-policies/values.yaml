minio:
  # Namespace names (kubernetes.io/metadata.name) allowed to reach MinIO on API/console/SSH
  # ports via east-west Service DNS. Configure per deployment environment (e.g. consumer workloads
  # in other namespaces). Empty list keeps behavior unchanged aside from ingress + MinIO peers.
  trustedClientNamespaces: []

databaseAccess: []
