# --- Internal Worker Deployment (Temporal's own system workflows) ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aw.prefix" . }}-temporal-worker
  labels:
    app: assembly-temporal-worker
    {{- include "aw.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.infra.temporal.split.worker.replicas }}
  {{- include "aw.noSurgeStrategy" . | nindent 2 }}
  selector:
    matchLabels:
      app: assembly-temporal-worker
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
        # #1322: temporal-split-config/temporal-dynamic-config are subPath-mounted (kubelet never
        # live-refreshes those); neither had a checksum annotation to force a rollout on `helm
        # upgrade` content changes -- same bug class as #1319/#1321.
        checksum/temporal-split-config: {{ include (print $.Template.BasePath "/configmap-temporal-split-config.yaml") . | sha256sum }}
        checksum/temporal-dynamic-config: {{ include (print $.Template.BasePath "/configmap-temporal-dynamic-config.yaml") . | sha256sum }}
      labels:
        app: assembly-temporal-worker
        {{- include "aw.labels" . | nindent 8 }}
    spec:
      {{- include "aw.imagePullSecrets" $ | nindent 6 }}
      {{- include "aw.infraScheduling" . | nindent 6 }}
      initContainers:
        - name: wait-schema
          image: {{ include "aw.infraImage" (dict "ref" $.Values.infra.postgres.image "ctx" $) }}
          imagePullPolicy: {{ $.Values.global.imagePullPolicy | default "Always" }}
          env:
            - name: PGHOST
              value: {{ if .Values.infra.postgresTemporal.enabled }}postgres-temporal{{ else }}postgres{{ end }}
            - name: PGUSER
              value: assembly
            - name: PGPASSWORD
              {{- if .Values.infra.postgresTemporal.enabled }}
              value: {{ .Values.infra.postgresTemporal.password | default .Values.infra.postgres.password | quote }}
              {{- else }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "aw.postgresSecretName" . }}
                  key: password
              {{- end }}
          # Gates this server pod on the schema-migrate Job having finished BOTH
          # databases (visibility is migrated last), since the Job now runs
          # alongside the rollout instead of as a pre-install hook.
          command: ['/bin/sh', '-c', 'until psql -h $PGHOST -d temporal -Atqc "select 1 from schema_version limit 1" 2>/dev/null | grep -q 1 && psql -h $PGHOST -d temporal_visibility -Atqc "select 1 from schema_version limit 1" 2>/dev/null | grep -q 1; do echo "Waiting for schema..."; sleep 5; done']
          resources:
            requests: { memory: 32Mi, cpu: 10m }
            limits: { memory: 64Mi, cpu: 100m }
      containers:
        - name: {{ include "aw.prefix" . }}-temporal
          image: {{ include "aw.infraImage" (dict "ref" $.Values.infra.temporal.splitImage "ctx" $) }}
          imagePullPolicy: {{ $.Values.global.imagePullPolicy | default "Always" }}
          ports:
            - containerPort: 8000
              name: metrics
          env:
            - name: SERVICES
              value: "worker"
            - name: TEMPORAL_SERVICES
              value: "worker"
            - name: TEMPORAL_SERVER_CONFIG_FILE_PATH
              value: "/etc/temporal/config/config_template.yaml"
            - name: POSTGRES_USER
              value: "assembly"
            - name: POSTGRES_PWD
              {{- if .Values.infra.postgresTemporal.enabled }}
              value: {{ .Values.infra.postgresTemporal.password | default .Values.infra.postgres.password | quote }}
              {{- else }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "aw.postgresSecretName" . }}
                  key: password
              {{- end }}
            # GOMAXPROCS / GOMEMLIMIT — Go runtime sizing.
            # MUST match each component's resources.limits or Go's scheduler over-commits
            # OS threads. Default "2"/"900MiB" matches the perf infra 2-CPU split limit.
            # Override per-component via .Values.infra.temporal.split.{component}.gomaxprocs / .gomemlimit.
            - name: GOMAXPROCS
              value: {{ .Values.infra.temporal.split.worker.gomaxprocs | default "2" | quote }}
            - name: GOMEMLIMIT
              value: {{ .Values.infra.temporal.split.worker.gomemlimit | default "900MiB" | quote }}
            - name: TEMPORAL_LOG_LEVEL
              value: "warn"
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          volumeMounts:
            - name: config
              mountPath: /etc/temporal/config
            - name: dynamic-config
              mountPath: /etc/temporal/dynamic_config
          resources:
            {{- toYaml .Values.infra.temporal.split.worker.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "aw.prefix" . }}-temporal-split-config
        - name: dynamic-config
          configMap:
            name: {{ include "aw.prefix" . }}-temporal-dynamic-config
            items:
              - key: docker.yaml
                path: dynamic_config.yaml
---
# --- Frontend Service (named "temporal" so workers connect without config change) ---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "aw.prefix" . }}-temporal
  labels:
    app: assembly-temporal-frontend
    {{- include "aw.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 7233
      targetPort: 7233
  selector:
    app: assembly-temporal-frontend
---
# --- Headless services for membership gossip ---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "aw.prefix" . }}-temporal-frontend-headless
  labels:
    app: assembly-temporal-frontend
    {{- include "aw.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    app: assembly-temporal-frontend
  ports:
    - name: grpc
      port: 7233
    - name: membership
      port: 6933
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "aw.prefix" . }}-temporal-history-headless
  labels:
    app: assembly-temporal-history
    {{- include "aw.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    app: assembly-temporal-history
  ports:
    - name: grpc
      port: 7234
    - name: membership
      port: 6934
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "aw.prefix" . }}-temporal-matching-headless
  labels:
    app: assembly-temporal-matching
    {{- include "aw.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    app: assembly-temporal-matching
  ports:
    - name: grpc
      port: 7235
    - name: membership
      port: 6935
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "aw.prefix" . }}-temporal-worker-headless
  labels:
    app: assembly-temporal-worker
    {{- include "aw.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    app: assembly-temporal-worker
  ports:
    - name: membership
      port: 6939
---
# --- Namespace setup (waits for frontend, then creates namespaces) ---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "aw.prefix" . }}-temporal-namespace-setup
  labels:
    {{- include "aw.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 6
  # 7200, not 300: a TTL shorter than helm's wait deletes a completed Job
  # while the watcher still needs it, and the release fails as NotFound
  ttlSecondsAfterFinished: 7200
  template:
    metadata:
      labels:
        # Required by allow-app-same-namespace-ingress, which keys on `app`
        # Exists at BOTH ends: without it this Job cannot reach Postgres or
        # Temporal once a policy engine enforces (#2111). It polls in an
        # `until` loop, so it would hang forever rather than fail.
        app: assembly-temporal-namespace-setup
    spec:
      {{- include "aw.imagePullSecrets" $ | nindent 6 }}
      restartPolicy: OnFailure
      {{- include "aw.infraScheduling" . | nindent 6 }}
      containers:
        - name: {{ include "aw.prefix" . }}-temporal-namespace-setup
          image: {{ include "aw.infraImage" (dict "ref" $.Values.infra.temporal.adminToolsImage "ctx" $) }}
          imagePullPolicy: {{ $.Values.global.imagePullPolicy | default "Always" }}
          command:
            - /bin/sh
            - -c
            - |
              echo "Waiting for Temporal frontend..."
              until temporal operator cluster health --address {{ include "aw.prefix" . }}-temporal:7233 >/dev/null 2>&1; do sleep 5; done
              echo "Temporal frontend reachable, creating namespaces..."
              retention={{ .Values.infra.temporal.namespaceRetention | quote }}
              for ns in default {{ .Values.externalInfra.temporal.agentBuilderNamespace }} autonomous-executor sandbox; do
                if ! temporal operator namespace describe -n $ns --address {{ include "aw.prefix" . }}-temporal:7233 2>/dev/null; then
                  temporal operator namespace create -n $ns --address {{ include "aw.prefix" . }}-temporal:7233 --retention "$retention"
                  echo "Created temporal namespace: $ns with retention $retention"
                else
                  temporal operator namespace update -n $ns --address {{ include "aw.prefix" . }}-temporal:7233 --retention "$retention"
                  echo "Updated temporal namespace retention: $ns -> $retention"
                fi
              done
              echo "Temporal namespace setup complete"
          resources:
            requests: { memory: 64Mi, cpu: 10m }
            limits: { memory: 128Mi, cpu: 200m }
{{- end }}
