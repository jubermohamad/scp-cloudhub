{{- if .Values.image.createPullSecret.enabled }}
{{- $pw := required "image.createPullSecret.password is required when image.createPullSecret.enabled=true" .Values.image.createPullSecret.password }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.image.createPullSecret.name }}
  labels:
    {{- include "aw.labels" . | nindent 4 }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ printf `{"auths":{"%s":{"username":"%s","password":"%s","auth":"%s"}}}` .Values.image.createPullSecret.registry .Values.image.createPullSecret.username $pw (printf "%s:%s" .Values.image.createPullSecret.username $pw | b64enc) | b64enc }}
{{- end }}
