{{- /*
`postgres`, `redis` and `postgres-temporal` are all hardcoded `replicas: 1` in
infra.yaml with no values key to raise them. Their PDBs were therefore ALWAYS
self-blocking, on every overlay — these three plus temporal-worker are the four
measured at `disruptionsAllowed: 0` on assembly-perf-medium. Single-replica
stateful infra cannot be protected by a PDB; it can only be made undrainable by
one, so none is rendered.
*/ -}}
{{- end }}
