{{- /*
One rule for this whole file: a PodDisruptionBudget exists only where there is
more than one replica to protect.

A PDB over a SINGLE replica cannot protect availability — evicting the only pod
is an outage either way — but it does permit zero disruptions, which converts a
brief, recoverable outage into a drain that hangs forever:

    Drain node ... failed evicting postgres-...
    blocked by pdb postgres-pdb (MinAvailable: 1) (ExpectedPods: 1)

That blocked the Calico rollout (#2111) on assembly-perf-small, and it blocks
Kubernetes upgrades, node resizing and autoscaler consolidation just as hard.
assembly-perf-medium carried four such PDBs, each at `disruptionsAllowed: 0`.

The ten application PDBs below already gated on `replicas > 1`; the infra ones
did not, which is how this shipped. Two conventions in one file is the bug, so
the gate is now applied uniformly and `tests/test_pdb_cannot_block_a_drain.py`
holds it there by computing `disruptionsAllowed` from the RENDERED replica count.

Note percentages round UP here (`maxUnavailable: 25%` of 2 replicas is 1, not 0
— verified against a live cluster), so the `25%` budgets are safe at 2 replicas.
*/ -}}
{{- if .Values.podDisruptionBudgets.enabled }}
{{- if gt (int .Values.apisix.replicas) 1 }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "aw.prefix" . }}-apisix-pdb
  labels:
    {{- include "aw.labels" . | nindent 4 }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: assembly-apisix
{{- end }}
---
{{- if gt (int .Values.frontend.replicas) 1 }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "aw.prefix" . }}-frontend-pdb
