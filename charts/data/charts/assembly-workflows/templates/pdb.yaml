    {{- include "aw.labels" . | nindent 4 }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: assembly-frontend
{{- end }}
---
{{- if gt (int .Values.userProject.replicas) 1 }}
apiVersion: policy/v1
kind: PodDisruptionBudget
