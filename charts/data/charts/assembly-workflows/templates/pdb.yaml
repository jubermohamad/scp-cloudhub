{{- /*
`temporal` (auto-setup) is hardcoded `replicas: 1` in infra.yaml with no values
key, so a PDB here could only ever be self-blocking. Deliberately not rendered.
*/ -}}
{{- if and .Values.infra.enabled (eq .Values.infra.temporal.mode "split") }}
{{- if gt (int .Values.infra.temporal.split.frontend.replicas) 1 }}
