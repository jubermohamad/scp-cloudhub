{{- if .Values.agents.hpa.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "aw.prefix" . }}-agents-hpa
  labels:
    {{- include "aw.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "aw.prefix" . }}-engine
  minReplicas: {{ .Values.agents.hpa.minReplicas }}
  maxReplicas: {{ .Values.agents.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.agents.hpa.targetCPUUtilization }}
{{- end }}
