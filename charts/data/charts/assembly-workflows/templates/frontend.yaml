apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aw.prefix" . }}-frontend
  labels:
    app: assembly-frontend
    tier: ui
    {{- include "aw.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.frontend.replicas }}
  revisionHistoryLimit: 3
  {{- include "aw.noSurgeStrategy" . | nindent 2 }}
  selector:
    matchLabels:
      app: assembly-frontend
  template:
    metadata:
      labels:
        app: assembly-frontend
        tier: ui
        {{- include "aw.labels" . | nindent 8 }}
      annotations:
        # frontend-nginx-conf is subPath-mounted, which kubelet never
        # live-refreshes, so without this a nginx.conf edit deploys the
        # ConfigMap object but never reaches the running pod (#1322, same
        # class as #1319/#1321).
        checksum/frontend-nginx-conf: {{ include (print $.Template.BasePath "/configmap-nginx.yaml") . | sha256sum }}
    spec:
      # This workload does not call the Kubernetes API.
      automountServiceAccountToken: false
      {{- include "aw.imagePullSecrets" . | nindent 6 }}
      {{- include "aw.scheduling" . | nindent 6 }}
      topologySpreadConstraints:
        # Soft: this tier has not been measured as placement-sensitive the way
        # sandbox-execute was (#2123), so the spread stays a preference rather
        # than a scheduling gate.
        #
        # matchLabelKeys still matters even while soft. Without it the scheduler
        # scores a new pod against the OUTGOING revision's placement too, so
        # during a rollout it can "prefer" a node that is only empty of new pods
        # while already crowded with old ones. Per-revision scoring is what makes
        # the preference actually spread the new ReplicaSet.
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          matchLabelKeys:
            - pod-template-hash
          labelSelector:
            matchLabels:
              app: assembly-frontend
      volumes:
        - name: nginx-conf
          configMap:
            name: {{ include "aw.prefix" . }}-frontend-nginx-conf
      containers:
        - name: {{ include "aw.prefix" . }}-frontend
          image: {{ include "aw.image" (dict "registry" .Values.image.registry "repo" .Values.frontend.image.repository "default" "assembly-workflows-frontend" "tag" .Values.frontend.image.tag "globalTag" .Values.image.tag) }}
          imagePullPolicy: {{ .Values.image.pullPolicy | default $.Values.global.imagePullPolicy | default "Always" }}
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
          ports:
            - containerPort: 3000
          env:
            - name: VITE_ASSEMBLY_EDITION
              valueFrom:
                configMapKeyRef:
                  name: {{ include "aw.prefix" . }}-platform-config
                  key: vite-assembly-edition
            - name: VITE_DISABLED_WORKFLOW_NODE_TYPES
              valueFrom:
                configMapKeyRef:
                  name: {{ include "aw.prefix" . }}-platform-config
                  key: disabled-workflow-node-types
            - name: VITE_FEATURE_SANDBOX
              valueFrom:
                configMapKeyRef:
                  name: {{ include "aw.prefix" . }}-platform-config
                  key: vite-feature-sandbox
            - name: VITE_FEATURE_WORKBENCH
              valueFrom:
                configMapKeyRef:
                  name: {{ include "aw.prefix" . }}-platform-config
                  key: vite-feature-workbench
            - name: VITE_FEATURE_WORKBENCH_ASSISTANT
              valueFrom:
                configMapKeyRef:
                  name: {{ include "aw.prefix" . }}-platform-config
                  key: vite-feature-workbench-assistant
            - name: VITE_FEATURE_WORKFLOW_DEPLOYMENTS
              valueFrom:
                configMapKeyRef:
                  name: {{ include "aw.prefix" . }}-platform-config
                  key: vite-feature-workflow-deployments
            - name: VITE_API_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "aw.prefix" . }}-platform-config
                  key: api-url
            - name: VITE_DOCS_SOURCE
              value: "api"
            - name: VITE_AUTH_MODE
              valueFrom:
                configMapKeyRef:
                  name: {{ include "aw.prefix" . }}-platform-config
                  key: auth-mode
            - name: VITE_KEYCLOAK_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "aw.prefix" . }}-platform-config
                  key: keycloak-url
            - name: VITE_KEYCLOAK_REALM
              valueFrom:
                configMapKeyRef:
                  name: {{ include "aw.prefix" . }}-platform-config
                  key: keycloak-realm
            {{- with .Values.frontend.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "aw.prefix" . }}-frontend
  labels:
    app: assembly-frontend
    {{- include "aw.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
  selector:
    app: assembly-frontend