{{- if not .Values.secrets.existingSecret }}
{{- /*
  platform-secrets. Every value comes EXPLICITLY from .Values.secrets — sourced
  at deploy time from 1Password (persistent clusters) or generated-and-passed by
  deploy/bootstrap.sh (throwaway perf clusters). The chart no longer looks up or
  generates anything, so `helm template` == `helm upgrade` byte-for-byte and the
  render is trivially testable. Empty values fail render-time validation
  (aw.validate.secrets) unless validation.allowPlaceholders=true. Callers that
  manage the Secret out of band set secrets.existingSecret to skip this file.

  The llm-gateway VARIANT keys default to their base key when not set explicitly
  (a values-level default, not a cluster lookup) — mirrors how the deploy sources
  only the base key and lets the variants inherit it.
*/}}
{{- $ukey := .Values.secrets.llmGateway.userKeysInternalApiKey -}}
{{- $admin := .Values.secrets.llmGateway.adminKey -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.name }}
  labels:
    {{- include "aw.labels" . | nindent 4 }}
type: Opaque
stringData:
  database-url: {{ .Values.secrets.databaseUrl | default (include "aw.postgresUrl" .) | quote }}
  jwt-secret: {{ .Values.secrets.jwtSecret | quote }}
  fernet-key: {{ .Values.secrets.fernetKey | quote }}
  internal-service-api-key: {{ .Values.secrets.internalServiceApiKey | quote }}
  assembly-llm-gateway-user-keys-internal-api-key: {{ $ukey | quote }}
  assembly-llm-gateway-user-keys-internal-api-key-agents: {{ .Values.secrets.llmGateway.userKeysInternalApiKeyAgents | default $ukey | quote }}
  assembly-llm-gateway-user-keys-internal-api-key-assembly-core: {{ .Values.secrets.llmGateway.userKeysInternalApiKeyUserProject | default $ukey | quote }}
  assembly-llm-gateway-user-keys-internal-api-key-autonomous-executor: {{ .Values.secrets.llmGateway.userKeysInternalApiKeyAutonomousExecutor | default $ukey | quote }}
  assembly-llm-gateway-user-keys-internal-api-key-workspace-runtime-api: {{ .Values.secrets.llmGateway.userKeysInternalApiKeyWorkspaceRuntimeApi | default $ukey | quote }}
  assembly-llm-gateway-admin-key: {{ $admin | quote }}
  assembly-llm-gateway-admin-key-autonomous-executor: {{ .Values.secrets.llmGateway.adminKeyAutonomousExecutor | default $admin | quote }}
  sandbox-internal-service-api-key: {{ .Values.secrets.sandboxInternalServiceApiKey | quote }}
  workspace-manager-internal-service-api-key: {{ .Values.secrets.workspaceManagerInternalServiceApiKey | quote }}
  {{- if .Values.secrets.azureOpenai.apiKey }}
  azure-openai-api-key: {{ .Values.secrets.azureOpenai.apiKey | quote }}
  {{- end }}
  {{- if .Values.secrets.azureOpenai.endpoint }}
  azure-openai-endpoint: {{ .Values.secrets.azureOpenai.endpoint | quote }}
  {{- end }}
  {{- if .Values.secrets.azureFoundry.url }}
  azure-foundry-url: {{ .Values.secrets.azureFoundry.url | quote }}
  {{- end }}
  {{- if .Values.secrets.azureFoundry.apiKey }}
  azure-foundry-api-key: {{ .Values.secrets.azureFoundry.apiKey | quote }}
  {{- end }}
  {{- if .Values.secrets.azureFoundry.anthropicEndpoint }}
  azure-foundry-anthropic-endpoint: {{ .Values.secrets.azureFoundry.anthropicEndpoint | quote }}
  {{- end }}
  {{- if .Values.secrets.anthropicApiKey }}
  anthropic-api-key: {{ .Values.secrets.anthropicApiKey | quote }}
  {{- end }}
  {{- if .Values.secrets.tavilyApiKey }}
  tavily-api-key: {{ .Values.secrets.tavilyApiKey | quote }}
  {{- end }}
  {{- with .Values.secrets.keycloakBackendClientSecret }}
  keycloak-backend-client-secret: {{ . | quote }}
  {{- end }}
  {{- /*
    S3 credentials for assembly-core's file-search / resource storage. Fall back to the
    bundled MinIO's root credentials so an in-cluster install needs no extra config;
    setting them explicitly points core at an external bucket instead.
  */ -}}
  {{- $s3Access := .Values.secrets.fileSearch.s3AccessKey }}
  {{- if and (not $s3Access) .Values.minio.enabled }}{{- $s3Access = .Values.minio.rootUser }}{{- end }}
  {{- with $s3Access }}
  file-search-s3-access-key: {{ . | quote }}
  {{- end }}
  {{- $s3Secret := .Values.secrets.fileSearch.s3SecretKey }}
  {{- if and (not $s3Secret) .Values.minio.enabled }}{{- $s3Secret = .Values.minio.rootPassword }}{{- end }}
  {{- with $s3Secret }}
  file-search-s3-secret-key: {{ . | quote }}
  {{- end }}
{{- end }}
