{{- if and .Values.infra.enabled (eq .Values.infra.temporal.mode "split") }}
# --- Go-template server config ---
# Split into its own file (was inline in temporal-split.yaml) so the checksum/temporal-split-config
# annotation on the temporal-frontend/temporal-history/temporal-matching/temporal-worker
# Deployments can target this ConfigMap specifically, matching the checksum/apisix-config and
# checksum/frontend-nginx-conf pattern (#1319/#1321/#1323) instead of hashing a whole
# multi-resource file (which isn't possible anyway -- a template including its own file causes
# infinite recursion in Helm's template engine). See #1322.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "aw.prefix" . }}-temporal-split-config
  labels:
    {{- include "aw.labels" . | nindent 4 }}
data:
  config_template.yaml: |-
    # enable-template
    log:
      stdout: true
      level: "info"
    persistence:
      numHistoryShards: {{ .Values.infra.temporal.numHistoryShards }}
      defaultStore: default
      visibilityStore: visibility
      datastores:
        default:
          sql:
            pluginName: "postgres12"
            databaseName: "temporal"
            connectAddr: "{{ if .Values.infra.postgresTemporal.enabled }}postgres-temporal{{ else }}postgres{{ end }}:5432"
            connectProtocol: "tcp"
            user: {{`{{ env "POSTGRES_USER" | quote }}`}}
            password: {{`{{ env "POSTGRES_PWD" | quote }}`}}
            maxConns: {{ .Values.infra.temporal.split.postgres.maxConns }}
            maxIdleConns: {{ .Values.infra.temporal.split.postgres.maxIdleConns }}
            maxConnLifetime: "1h"
        visibility:
          sql:
            pluginName: "postgres12"
            databaseName: "temporal_visibility"
            connectAddr: "{{ if .Values.infra.postgresTemporal.enabled }}postgres-temporal{{ else }}postgres{{ end }}:5432"
            connectProtocol: "tcp"
            user: {{`{{ env "POSTGRES_USER" | quote }}`}}
            password: {{`{{ env "POSTGRES_PWD" | quote }}`}}
            maxConns: {{ (.Values.infra.temporal.split.postgres.visibility).maxConns | default 10 }}
            maxIdleConns: {{ (.Values.infra.temporal.split.postgres.visibility).maxIdleConns | default 10 }}
            maxConnLifetime: "1h"
    global:
      membership:
        name: {{ include "aw.prefix" . }}-temporal
        maxJoinDuration: 30s
        broadcastAddress: {{`{{ env "POD_IP" | quote }}`}}
      pprof:
        port: 7936
      # Tier-2 §2.4: server metrics (persistence latency, shard lock
      # contention, task-queue backlog) — the autoscaling prereq.
      metrics:
        prometheus:
          framework: "tally"
          timerType: "histogram"
          listenAddress: "0.0.0.0:8000"
    services:
      frontend:
        rpc:
          grpcPort: 7233
          membershipPort: 6933
          bindOnIP: "0.0.0.0"
      history:
        rpc:
          grpcPort: 7234
          membershipPort: 6934
          bindOnIP: "0.0.0.0"
      matching:
        rpc:
          grpcPort: 7235
          membershipPort: 6935
          bindOnIP: "0.0.0.0"
      worker:
        rpc:
          grpcPort: 7239
          membershipPort: 6939
          bindOnIP: "0.0.0.0"
    clusterMetadata:
      enableGlobalNamespace: false
      failoverVersionIncrement: 10
      masterClusterName: "active"
      currentClusterName: "active"
      clusterInformation:
        active:
          enabled: true
          initialFailoverVersion: 1
          rpcName: "frontend"
          rpcAddress: "localhost:7233"
    dcRedirectionPolicy:
      policy: "noop"
    archival:
      history:
        state: "disabled"
      visibility:
        state: "disabled"
    publicClient:
      hostPort: "{{ include "aw.prefix" . }}-temporal:7233"
    dynamicConfigClient:
      filepath: "/etc/temporal/dynamic_config/dynamic_config.yaml"
      pollInterval: "60s"
{{- end }}
