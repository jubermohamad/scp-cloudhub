      - /api/v1/auth/realms/*/*/*
      - /api/v1/auth/realms/*/*/*/*
      - /api/v1/auth/realms/*/*/*/*/*
      - /api/v1/auth/realms/*/*/*/*/*/*
      - /api/v1/auth/realms/*/*/*/*/*/*/*
    upstream:
      type: roundrobin
      nodes:
        "{{ include "aw.keycloakUpstream" . }}": 1
      timeout:
        connect: 60
        send: 60
        read: 300
    plugins:
      proxy-rewrite:
        regex_uri:
          - "^/api/v1/auth/(.*)"
          - "/$1"
        headers:
          set:
            X-Forwarded-Proto: '{{ if (include "aw.apisixIngressTls" .) }}$http_x_forwarded_proto{{ else }}$scheme{{ end }}'
            X-Forwarded-Host: "$http_host"
            X-Forwarded-Port: "443"
      limit-req:
        rate: 5
        burst: 10
        key: remote_addr
        key_type: var
        rejected_code: 429
        nodelay: true
      prometheus: {}

  - id: assembly-llm-gateway-health
