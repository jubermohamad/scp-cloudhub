    enable_websocket: true
    plugins:
      proxy-rewrite:
        regex_uri:
          - "^/preview/(.*)"
          - "/api/sandbox/api/v1/preview/$1"
      openid-connect:
        client_id: assembly-platform-backend
        discovery: {{ include "aw.keycloakServerUrl" . }}/realms/{{ .Values.externalInfra.keycloak.realm }}/.well-known/openid-configuration
        realm: {{ .Values.externalInfra.keycloak.realm }}
        bearer_only: true
        use_jwks: true
        token_signing_alg_values_expected: RS256
        ssl_verify: false
        unauth_action: deny
      prometheus: {}


  # Fast 404 for genuinely-unmatched /api/* paths (#1588). Without this, an /api/*
  # request that doesn't match any more-specific route above falls through to the
  # frontend catch-all below and gets forwarded to {{ include "aw.prefix" . }}-frontend:3000, whose own
  # nginx.conf has an /api proxy_pass to a docker-compose-only upstream name
  # (apisix-gateway:9080) that doesn't exist in this chart's topology -- nginx
  # then hangs (DNS/connect against a nonexistent host) until its own generous
  # proxy_read_timeout (300s), so the client just sees a slow hang instead of a
  # clean 404. This route is MORE specific than the /* catch-all (radix-tree
  # routing prefers longer prefixes, same reason /api/v1/health etc. above
  # already take priority over /*) but LESS specific than every real /api/...
  # route, so it only catches paths that don't match anything real.
  - id: api-not-found
    uri: /api/*
    # APISIX requires a valid upstream on every route even when a plugin (echo, below)
    # short-circuits the request in the access phase before ever proxying -- omitting
    # it produces "missing upstream configuration" and a 503 instead of echo's intended
    # response. assembly-core is just a formality target here; echo intercepts first.
    upstream:
      type: roundrobin
      nodes:
        "{{ include "aw.prefix" . }}-core:8000": 1
    plugins:
      echo:
        status_code: 404
        body: '{"error":"not_found","message":"No matching API route"}'
        headers:
          Content-Type: application/json

  # Frontend catch-all — MUST be last
  - id: frontend
    uri: /*
    upstream:
      type: roundrobin
      nodes:
        "{{ include "aw.prefix" . }}-frontend:3000": 1
      timeout:
        connect: 60
        send: 60
        read: 180
    plugins:
      prometheus: {}

plugins:
  - name: proxy-rewrite
    enable: true
  - name: cors
    enable: true
    config:
      # Origins come from values (apisix.cors.allowOriginsRegex) so overlays
      # can add per-environment origins without patching this file. Emitted
      # with squote: the regexes carry `\.`, which is valid in single-quoted
      # YAML but an invalid escape in double-quoted YAML.
      allow_origins_by_regex:
{{- range .Values.apisix.cors.allowOriginsRegex }}
        - {{ . | squote }}
{{- end }}
      allow_methods: "*"
      allow_headers: "*"
      expose_headers: "*"
      max_age: 3600
      allow_credential: true
  - name: prometheus
    enable: true
  - name: response-rewrite
    enable: true
  - name: real-ip
    enable: true
  - name: echo
    enable: true

global_rules:
  - id: forwarded-proto-rule
    plugins:
      proxy-rewrite:
        headers:
          set:
            X-Forwarded-Proto: '{{ if (include "aw.apisixIngressTls" .) }}$http_x_forwarded_proto{{ else }}$scheme{{ end }}'
            X-Forwarded-Host: "$http_host"
            X-Real-IP: "$remote_addr"
          # #118: strip the internal-service trust headers from every inbound
          # request. X-Internal-Service-Key/X-Service-Name gate a service's
          # no-bearer-JWT auth fallback meant ONLY for genuine
          # service-to-service calls, which never traverse this gateway (they
          # hit the callee's k8s Service DNS name directly). An external
          # client supplying the well-known default INTERNAL_SERVICE_API_KEY
          # + an arbitrary X-User-ID over this public gateway was accepted as
          # a trusted internal caller -- full cross-user impersonation, no
          # bearer token required. Deliberately merged into THIS existing
          # proxy-rewrite rule rather than added as a second global rule: two
          # global_rules both configuring proxy-rewrite do NOT compose --
          # confirmed live (only the first-listed rule's plugin config takes
          # effect, silently dropping the second) -- the exact same
          # single-vars-condition-per-plugin-instance composition bug that
          # broke response-rewrite here before (#1547, see the sanitize note
          # below). A second proxy-rewrite global rule would have looked
          # correct in the YAML while doing nothing at runtime.
          remove:
            - X-Internal-Service-Key
            - X-Service-Name
            - X-User-ID
  - id: sanitize-upstream-5xx
    plugins:
      response-rewrite:
        vars:
          - - status
            - ">="
            - 500
        headers:
          set:
            Content-Type: application/json
        body: '{"error":"internal_server_error","message":"Internal server error"}'
  # NOTE (#1547): PR #1534's "security-headers" global rule (also using
  # response-rewrite) is REVERTED here. APISIX's response-rewrite plugin gates
  # its ENTIRE behavior -- headers included -- on a single `vars` condition
  # (confirmed by reading apisix/plugins/response-rewrite.lua's vars_matched()/
  # header_filter()/body_filter(): if vars don't match, header_filter returns
  # before setting any headers at all). Two global rules both configuring
  # response-rewrite do not compose the way the original PR assumed -- the
  # 5xx-only body substitution above started firing on EVERY response
  # (including 2xx), while Content-Length stayed at the real pre-rewrite
  # length, hanging every client indefinitely. This was live on `main` and
  # would have broken any real deployment. Re-adding the baseline security
  # headers (#1532) needs a mechanism that doesn't share the response-rewrite
  # global rule with the 5xx sanitizer above -- e.g. a raw nginx `add_header`
  # snippet (this file's `nginx_config.http` block already carries one custom
  # directive, `client_max_body_size`) rather than a second response-rewrite
  # instance. Needs live curl-based validation (not just config-text
  # assertions, which is how #1534 shipped without catching this) before
  # merging. Tracked as a re-implementation follow-up, not fixed here.

upstreams: []

ssls: []

#END
