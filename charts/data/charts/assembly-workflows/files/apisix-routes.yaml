routes:
{{- $shim := .Values.externalInfra.keycloak.frontendRealmShim | default "" }}
{{- $realRealm := .Values.externalInfra.keycloak.realm }}
{{- if and $shim (ne $shim $realRealm) }}
{{- $issuer := .Values.externalInfra.keycloak.expectedIssuer | default "" }}
{{- if $issuer }}
{{- $kcBase := trimSuffix (printf "/realms/%s" $realRealm) $issuer }}
  # INTERACTIVE navigations must complete on the Keycloak host itself: the
  # platform Keycloak PINS its hostname, so the login form's action posts to
  # that host — a same-origin-proxied login sets its auth-session cookies on
  # THIS host and loses them on the cross-host POST ("An error occurred,
  # please login again through your application", verified live). Redirecting
  # the browser up front keeps the whole form flow (and its cookies) on one
  # origin, exactly like every other product's login. The token exchange and
  # discovery are XHR (no cookies) and stay same-origin via the proxy below.
  - id: keycloak-frontend-realm-shim-nav-auth
    uris:
      - /realms/{{ $shim }}/protocol/openid-connect/auth
      - /auth/realms/{{ $shim }}/protocol/openid-connect/auth
    # upstream present as a FALLBACK only: this apisix build 503s a route with
    # no upstream even when a terminating plugin (redirect) is attached
    upstream:
      type: roundrobin
      nodes:
        "{{ include "aw.keycloakUpstream" . }}": 1
      timeout:
        connect: 60
        send: 60
        read: 60
    plugins:
      # response-rewrite, NOT the redirect plugin: on this apisix build the
      # redirect plugin never executes on yaml-provider routes (verified live —
      # requests fell through to the upstream with the plugin loaded and the
      # route accepted). response-rewrite runs reliably; the upstream response
      # is discarded and replaced with the 302.
      response-rewrite:
        status_code: 302
        headers:
          set:
            Location: "{{ $kcBase }}/realms/{{ $realRealm }}/protocol/openid-connect/auth?$args"
      prometheus: {}
  - id: keycloak-frontend-realm-shim-nav-logout
    uris:
      - /realms/{{ $shim }}/protocol/openid-connect/logout
      - /auth/realms/{{ $shim }}/protocol/openid-connect/logout
    # upstream present as a FALLBACK only: this apisix build 503s a route with
    # no upstream even when a terminating plugin (redirect) is attached
    upstream:
      type: roundrobin
      nodes:
        "{{ include "aw.keycloakUpstream" . }}": 1
      timeout:
        connect: 60
        send: 60
        read: 60
    plugins:
      # response-rewrite, NOT the redirect plugin: on this apisix build the
      # redirect plugin never executes on yaml-provider routes (verified live —
      # requests fell through to the upstream with the plugin loaded and the
      # route accepted). response-rewrite runs reliably; the upstream response
      # is discarded and replaced with the 302.
      response-rewrite:
        status_code: 302
        headers:
          set:
            Location: "{{ $kcBase }}/realms/{{ $realRealm }}/protocol/openid-connect/logout?$args"
      prometheus: {}
{{- end }}
  # SAME-REALM SHIM (see values externalInfra.keycloak.frontendRealmShim):
  # the frontend's BAKED realm path is rewritten onto the real realm. Longer
  # prefix than the generic /realms/* route, so it wins radix-tree routing.
  - id: keycloak-frontend-realm-shim
    uris:
      - /realms/{{ $shim }}/*
      - /realms/{{ $shim }}/*/*
      - /realms/{{ $shim }}/*/*/*
      - /realms/{{ $shim }}/*/*/*/*
      - /realms/{{ $shim }}/*/*/*/*/*
      - /auth/realms/{{ $shim }}/*
      - /auth/realms/{{ $shim }}/*/*
      - /auth/realms/{{ $shim }}/*/*/*
      - /auth/realms/{{ $shim }}/*/*/*/*
      - /auth/realms/{{ $shim }}/*/*/*/*/*
    upstream:
      type: roundrobin
      nodes:
        "{{ include "aw.keycloakUpstream" . }}": 1
      timeout:
        connect: 60
        send: 60
        read: 300
    plugins:
      proxy-rewrite:
        regex_uri:
          - "^(?:/auth)?/realms/{{ $shim }}/(.*)"
          - "/realms/{{ $realRealm }}/$1"
        headers:
          set:
            X-Forwarded-Proto: '{{ if (include "aw.apisixIngressTls" .) }}$http_x_forwarded_proto{{ else }}$scheme{{ end }}'
            X-Forwarded-Host: "$http_host"
            X-Forwarded-Port: "443"
      prometheus: {}
{{- end }}
  - id: keycloak-auth-strip
    uris:
      - /auth/*
      - /auth/*/*
      - /auth/*/*/*
      - /auth/*/*/*/*
      - /auth/*/*/*/*/*
      - /auth/*/*/*/*/*/*
      - /auth/*/*/*/*/*/*/*
    upstream:
      type: roundrobin
      nodes:
        "{{ include "aw.keycloakUpstream" . }}": 1
      timeout:
        connect: 60
        send: 60
        read: 300
    plugins:
      proxy-rewrite:
        regex_uri:
          - "^/auth/(.*)"
          - "/$1"
        headers:
          set:
            X-Forwarded-Proto: '{{ if (include "aw.apisixIngressTls" .) }}$http_x_forwarded_proto{{ else }}$scheme{{ end }}'
            X-Forwarded-Host: "$http_host"
            X-Forwarded-Port: "443"
      prometheus: {}
  - id: keycloak-auth
    uris:
      - /realms/*
      - /realms/*/*
      - /realms/*/*/*
      - /realms/*/*/*/*
      - /realms/*/*/*/*/*
      - /realms/*/*/*/*/*/*
      - /resources/*
      - /resources/*/*
      - /resources/*/*/*
    upstream:
      type: roundrobin
      nodes:
        "{{ include "aw.keycloakUpstream" . }}": 1
      timeout:
        connect: 60
        send: 60
        read: 300
    plugins:
      proxy-rewrite:
        headers:
          set:
            X-Forwarded-Proto: '{{ if (include "aw.apisixIngressTls" .) }}$http_x_forwarded_proto{{ else }}$scheme{{ end }}'
            X-Forwarded-Host: "$http_host"
            X-Forwarded-Port: "443"
      limit-req:
        rate: 5
        burst: 10
        key: remote_addr
        key_type: var
        rejected_code: 429
        nodelay: true
      prometheus: {}
  # InvHub-compat: the hardcoded ROPC token path -> assembly-core's compat shim
  # (app/api/v1/auth.py::eureka_auth_token_compat), which normalizes the body
  # to urlencoded before forwarding to Keycloak. NOT a direct-to-Keycloak
  # proxy-rewrite anymore: invhub-disc-web posts a browser FormData (serializes
  # as multipart/form-data), which Keycloak's token endpoint cannot parse
  # (client_id/grant_type never arrive -> 401 with no useful detail) — the old
  # flows-eng-dev platform tolerated multipart, Keycloak does not. The shim
  # accepts either encoding and forwards Keycloak's response byte-for-byte.
  - id: assembly-eureka-auth-token
    uris:
      - /eureka-auth
      - /eureka-auth/*
    upstream:
      type: roundrobin
      nodes:
        "{{ include "aw.prefix" . }}-core:8000": 1
      timeout:
        connect: 60
        send: 60
        read: 60
    plugins:
      proxy-rewrite:
        regex_uri:
          - "^/eureka-auth/release/[^/]+/tenants/get-token$"
          - "/api/v1/auth/eureka-compat/token"
        headers:
          set:
            X-Forwarded-Proto: '{{ if (include "aw.apisixIngressTls" .) }}$http_x_forwarded_proto{{ else }}$scheme{{ end }}'
            X-Forwarded-Host: "$http_host"
            X-Forwarded-Port: "443"
      # Route-level CORS for browser-direct InvHub calls (the get-token POST
      # goes straight from the InvHub origin; Keycloak only CORS-allows the
      # preflight, not the token response). Must define EVERY key: APISIX
      # merges the GLOBAL cors defaults (expose_headers "*" +
      # allow_credential true) into a route-level cors config, and that
      # merged combination FAILS schema validation -- APISIX standalone then
      # SILENTLY DROPS the route (falls through to the frontend catch-all ->
      # 405). Production-verified on dev-assembly. allow_credential stays
      # false (Bearer header, no cookies); origins share the same values knob
      # as the global block.
      cors:
        allow_origins_by_regex:
{{- range .Values.apisix.cors.allowOriginsRegex }}
          - {{ . | squote }}
{{- end }}
        allow_methods: "GET,POST,OPTIONS"
        allow_headers: "Authorization,Content-Type,Tenant,Deployment-Name,X-Requested-With"
        expose_headers: "Content-Type"
        max_age: 3600
        allow_credential: false
      limit-req:
        rate: 5
        burst: 10
        key: remote_addr
        key_type: var
        rejected_code: 429
        nodelay: true
      prometheus: {}
  # InvHub-compat: InvHub's FlowsHealthIndicator GETs
  # /webhook-service/release/0.0.0/health (the releaseId is always 0.0.0,
  # derived from EUREKA_FLOWS with no override). That path does not match the
  # compat proxy's regex_uri below, so without this route it proxied
  # unrewritten to sandbox-trigger and 404'd (IH health showed FLOWS: down).
  # Exact-uri route rewriting to core's real health endpoint; priority pins it
  # above the /webhook-service/* prefix match. NO `vars` matcher on purpose:
  # APISIX standalone's tinyyaml crashes on the nested inline arrays vars
  # requires.
  - id: webhook-service-health
    uri: /webhook-service/release/0.0.0/health
    priority: 100
    upstream:
      type: roundrobin
      nodes:
        "{{ include "aw.prefix" . }}-core:8000": 1
      timeout:
        connect: 60
        send: 60
        read: 180
    plugins:
      proxy-rewrite:
        uri: /api/v1/health
      prometheus: {}
  # InvHub-compat: the hardcoded webhook path -> the sandbox webhook (strips the
  # /webhook-service/release/{id}/webhook/ prefix, preserves {id}[/aliases/{alias}]).
  - id: webhook-service-compat-proxy
    uris:
      - /webhook-service
      - /webhook-service/*
    upstream:
      type: roundrobin
      nodes:
        "{{ include "aw.prefix" . }}-sandbox-trigger:8003": 1
      timeout:
        connect: 60
        send: 60
        read: 600
    plugins:
      proxy-rewrite:
        regex_uri:
          - "^/webhook-service/release/[^/]+/webhook/(.*)"
          - "/api/sandbox/api/v1/webhook/$1"
      # Route-level CORS for browser-direct InvHub agent calls. Every key
      # defined on purpose -- see the cors note on assembly-eureka-auth-token
      # (global-merge schema failure silently drops the route).
      cors:
        allow_origins_by_regex:
{{- range .Values.apisix.cors.allowOriginsRegex }}
          - {{ . | squote }}
{{- end }}
        allow_methods: "GET,POST,OPTIONS"
        allow_headers: "Authorization,Content-Type,Tenant,Deployment-Name,X-Requested-With"
        expose_headers: "Content-Type"
        max_age: 3600
        allow_credential: false
      prometheus: {}
  # Keycloak OIDC paths proxied under /api/v1/auth/realms/... (must stay
