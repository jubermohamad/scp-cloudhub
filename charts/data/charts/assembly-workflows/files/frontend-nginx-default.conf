# Keep in sync with frontend/nginx.conf (Docker image + this ConfigMap use the same server block).
server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Emit relative Location headers so redirects (e.g. /docs -> /docs/) don't
    # leak the internal listen port (3000) or downgrade https when behind APISIX.
    absolute_redirect off;

    # Use Docker DNS resolver
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

    # Security headers.
    #
    # GOTCHA: nginx's `add_header` inheritance is all-or-nothing. If a
    # `location` block contains *any* `add_header` directive, it
    # silently drops every server-level `add_header` for that location.
    # That makes "just set them at server scope" appear to work until
    # you open `/` (served by `location = /index.html` below, which has
    # its own Cache-Control `add_header`) and find the security headers
    # missing. Use this map → `add_header $name $value always;` pattern
    # isn't a win either. Pragmatic fix: repeat the full set in every
    # `location` block that needs any `add_header`. See below.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Explicit noindex robots.txt. Without this, nginx's SPA catch-all
    # below serves index.html for /robots.txt with 200, which both
    # confuses crawlers and misleads security scanners.
    location = /robots.txt {
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Content-Type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # Return a real 404 for well-known discovery paths so scanners
    # don't log them as "exists" just because the SPA fallback returns
    # 200 with index.html. Keep this list tight — aggressive 404ing
    # breaks routes the app actually uses.
    location = /sitemap.xml         { return 404; }
    location = /sitemap_index.xml   { return 404; }
    location = /.env                { return 404; }
    location = /.git/config         { return 404; }

    # Block sourcemaps and other *.map files. The production Vite
    # build doesn't emit any, but the SPA fallback would serve
    # index.html for /assets/foo.js.map — making it look like one
    # exists. Return 404 so scanners move on.
    location ~* \.map$ { return 404; }

    # Proxy API requests to APISIX gateway
    location /api {
        set $upstream {{ include "aw.prefix" . }}-apisix:80;
        proxy_pass http://$upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
    }

    # WebSocket support
    location /ws {
        set $upstream {{ include "aw.prefix" . }}-apisix:80;
        proxy_pass http://$upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # Do not long-cache index.html (SPA shell); hashed /assets/* can still cache but must revalidate
    # so hotfixes and same-filename emergency edits are picked up without year-long stale bundles.
    location = /index.html {
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # Static assets: allow caching but not "immutable" forever (breaks in-cluster JS hotfixes and tunnel testing)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        expires 1h;
        add_header Cache-Control "public, max-age=3600, must-revalidate" always;
    }

    # Bundled documentation site (static Fumadocs build, self-contained under
    # /docs-content). Served same-origin by this nginx — no extra service, no
    # gateway route. /docs itself is a React route (the in-app docs viewer:
    # app shell + iframe) served by the SPA fallback below; /docs-content is the
    # static site it iframes. (No add_header here so the server-level security
    # headers are inherited — see the gotcha above.)
    location = /docs-content {
        return 301 /docs-content/;
    }
    # React Router's client navigation to the docs home (/docs-content) issues a
    # single-fetch data request to /docs-content.data, but the prerenderer emits
    # the index route's data at /docs-content/_.data (RR's `_` index placeholder).
    # Without this bridge the request falls through to the SPA fallback (HTML),
    # RR chokes on the non-data response and hard-navigates to /docs-content.data
    # (404). Map it to the real index data file. =404 if the build layout changes.
    location = /docs-content.data {
        try_files /docs-content/_.data =404;
    }
    # Serve a page directory's index.html DIRECTLY at the no-slash URL
    # (try_files $uri/index.html, not $uri/) — never 301 to a trailing slash.
    # The prerendered pages are canonicalized without a trailing slash
    # (e.g. /docs-content/components), so a slash redirect would desync the URL
    # from the embedded router context and break hydration ("Oops!").
    location /docs-content/ {
        try_files $uri $uri.html $uri/index.html /docs-content/index.html;
    }

    # SPA fallback - serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}
