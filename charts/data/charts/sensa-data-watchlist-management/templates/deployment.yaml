{{- $fullname := default (printf "%s-%s" .Release.Name .Chart.Name) .Values.fullnameOverride }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ $fullname }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/instance: {{ $fullname }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/instance: {{ $fullname }}
    spec:
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ default "docker.io" (.Values.global).imageRegistry }}/{{ .Values.image.repository }}:{{ .Values.image.tag }}"
