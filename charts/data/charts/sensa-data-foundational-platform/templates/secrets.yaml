{{/*
THE CHART CREATES ITS OWN CREDENTIALS.

It used to only REFERENCE these Secrets, so `helm install` produced a stack that
could not start until someone hand-made four objects — and the failure mode was
a CreateContainerConfigError with no hint which key was missing.

Generated once, then PRESERVED: `lookup` reads the value already in the cluster,
so an upgrade re-emits what is there instead of rotating it. Rotating a database
password on upgrade locks the app out of its own data, and rotating NEO4J_AUTH
locks it out of a graph whose auth lives inside the volume.

`lookup` returns nothing during `helm template` and `--dry-run`, so a rendered
manifest shows a FRESH random value. That is expected: it is not what a real
install writes. The value is only ever generated when the Secret genuinely does
not exist.

Set `secrets.<name>Existing` to a Secret you manage (Vault, SOPS, the platform's
generate-mode) and the chart creates nothing for it.
*/}}
{{- $ns := .Release.Namespace }}

{{- /* neo4j: one password, two keys that MUST agree — NEO4J_AUTH is the image's
       "neo4j/<password>" format, and `password` is what the apps read. Deriving
       both from one variable is what stops them drifting apart. */}}
{{- if not .Values.secrets.neo4jAuthExisting }}
{{- $cur := lookup "v1" "Secret" $ns .Values.secrets.neo4jAuth }}
{{- $pw := .Values.secrets.neo4jPassword
           | default (and $cur (index $cur.data "password" | b64dec))
           | default (randAlphaNum 24) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.neo4jAuthExisting | default .Values.secrets.neo4jAuth }}
  namespace: {{ $ns }}
  labels: {{- include "prism.labels" . | nindent 4 }}
  annotations:
    # keep the credential if the release is ever removed — the graph volume
    # outlives the release and its auth is stored inside it
    helm.sh/resource-policy: keep
type: Opaque
data:
  NEO4J_AUTH: {{ printf "%s/%s" (include "prism.neo4jUser" .) $pw | b64enc | quote }}
  password: {{ $pw | b64enc | quote }}
---
{{- end }}

{{- if not .Values.secrets.ledgerPgExisting }}
{{- $cur := lookup "v1" "Secret" $ns .Values.secrets.ledgerPg }}
{{- $pw := .Values.secrets.ledgerPgPassword
           | default (and $cur (index $cur.data "password" | b64dec))
           | default (randAlphaNum 24) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.ledgerPgExisting | default .Values.secrets.ledgerPg }}
  namespace: {{ $ns }}
  labels: {{- include "prism.labels" . | nindent 4 }}
  annotations:
    # TRUTH lives behind this credential; never let an uninstall take it
    helm.sh/resource-policy: keep
type: Opaque
data:
  password: {{ $pw | b64enc | quote }}
---
{{- end }}

{{- if not .Values.secrets.warehousePgExisting }}
{{- $cur := lookup "v1" "Secret" $ns .Values.secrets.warehousePg }}
{{- $pw := .Values.secrets.warehousePgPassword
           | default (and $cur (index $cur.data "password" | b64dec))
           | default (randAlphaNum 24) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.warehousePgExisting | default .Values.secrets.warehousePg }}
  namespace: {{ $ns }}
  labels: {{- include "prism.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  password: {{ $pw | b64enc | quote }}
---
{{- end }}

{{- /* The Anthropic key is the one credential a chart CANNOT invent. Rendered
       only when a value is supplied; otherwise nothing is created and the
       chat-backend mounts it `optional: true`, so the pod still runs and the
       assistant simply reports it is not configured. */}}
{{- if and .Values.secrets.anthropicApiKey (not .Values.secrets.anthropicAuthExisting) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.anthropicAuthExisting | default .Values.secrets.anthropicAuth }}
  namespace: {{ $ns }}
  labels: {{- include "prism.labels" . | nindent 4 }}
type: Opaque
data:
  api_key: {{ .Values.secrets.anthropicApiKey | b64enc | quote }}
{{- end }}
