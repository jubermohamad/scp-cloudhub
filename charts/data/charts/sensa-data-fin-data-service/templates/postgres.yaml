{{- if .Values.postgres.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "finDataService.fullname" . }}-postgres
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "finDataService.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
    app.kubernetes.io/name: {{ include "finDataService.fullname" . }}-postgres
spec:
  clusterIP: None
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: postgres
    app.kubernetes.io/name: {{ include "finDataService.fullname" . }}-postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "finDataService.fullname" . }}-postgres
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "finDataService.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
    app.kubernetes.io/name: {{ include "finDataService.fullname" . }}-postgres
spec:
  replicas: 1
  serviceName: {{ include "finDataService.fullname" . }}-postgres
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: postgres
      app.kubernetes.io/name: {{ include "finDataService.fullname" . }}-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: postgres
        app.kubernetes.io/name: {{ include "finDataService.fullname" . }}-postgres
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          imagePullPolicy: {{ (default dict .Values.global).imagePullPolicy | default "IfNotPresent" }}
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: {{ .Values.postgres.database }}
            - name: POSTGRES_USER
              value: {{ .Values.postgres.username }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: postgres-password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgres.username | quote }}, "-d", {{ .Values.postgres.database | quote }}]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgres.username | quote }}, "-d", {{ .Values.postgres.database | quote }}]
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: pgdata
      spec:
        storageClassName: {{ .Values.postgres.storageClass }}
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: {{ .Values.postgres.storage }}
{{- end }}
