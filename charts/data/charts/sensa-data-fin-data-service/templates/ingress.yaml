{{- if .Values.ingress.enabled }}
{{- if and .Values.ingress.tls.enabled .Values.ingress.tls.cert .Values.ingress.tls.key }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.ingress.tls.secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "finDataService.labels" . | nindent 4 }}
type: kubernetes.io/tls
data:
  tls.crt: {{ .Values.ingress.tls.cert | b64enc }}
  tls.key: {{ .Values.ingress.tls.key | b64enc }}
{{- end }}
---
# Disabled by default (values.yaml: ingress.enabled: false) — this service is
# currently consumed only in-cluster (ClusterIP). Not wired to any real
# hostname/path scheme yet; adjust before turning this on.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "finDataService.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "finDataService.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host }}
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "finDataService.fullname" . }}
                port:
                  number: 8000
{{- end }}
