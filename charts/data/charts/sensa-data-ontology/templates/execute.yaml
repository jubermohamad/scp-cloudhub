---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "lens.fullname" . }}-execute
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lens.labels" . | nindent 4 }}
    app.kubernetes.io/component: execute
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: execute
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "lens.fullname" . }}-execute
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lens.labels" . | nindent 4 }}
    app.kubernetes.io/component: execute
spec:
  replicas: {{ .Values.execute.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: execute
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: execute
    spec:
      imagePullSecrets:
        {{- include "lens.imagePullSecrets" . | nindent 8 }}
      containers:
        - name: execute
          image: {{ .Values.image.registry }}/{{ .Values.image.repository }}/execute:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy | default $.Values.global.imagePullPolicy | default "Always" }}
          ports:
            - containerPort: 8000
          env:
            - name: LENS_REGISTRY_URL
              value: http://{{ include "lens.fullname" . }}-registry:8000
            - name: LENS_COMPILE_URL
              value: http://{{ include "lens.fullname" . }}-compile:8000
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: postgres-password
            - name: DATABASE_URL
              value: {{ include "lens.databaseUrl" . }}
            - name: LENS_BANKING_DSN
              value: postgresql://lens:$(POSTGRES_PASSWORD)@{{ include "lens.postgresHost" . }}:5432/{{ .Values.execute.env.bankingDatabase }}
            - name: LENS_SOURCE_DSN_BANK_WAREHOUSE
              value: postgresql://lens:$(POSTGRES_PASSWORD)@{{ include "lens.postgresHost" . }}:5432/{{ .Values.execute.env.bankWarehouseDatabase }}
            - name: AUTH_ENABLED
              value: {{ .Values.execute.env.authEnabled | quote }}
            - name: KEYCLOAK_URL
              value: {{ .Values.keycloak.url | quote }}
            - name: KEYCLOAK_REALM
              value: {{ .Values.keycloak.realm | quote }}
            - name: JWT_AUDIENCE
              value: {{ .Values.keycloak.audience | quote }}
            {{- if .Values.keycloak.issuer }}
            - name: JWT_ISSUER
              value: {{ .Values.keycloak.issuer | quote }}
            {{- end }}
            - name: KEYCLOAK_CLIENT_ID
              value: {{ .Values.keycloak.clientId | quote }}
            - name: KEYCLOAK_SERVICE_CLIENT_ID
              value: {{ .Values.keycloak.serviceClientId | quote }}
            - name: KEYCLOAK_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: keycloak-client-secret
                  optional: true
            {{- if .Values.keycloak.allowOrigins }}
            - name: LENS_ALLOW_ORIGINS
              value: {{ .Values.keycloak.allowOrigins | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.execute.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
