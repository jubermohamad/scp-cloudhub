---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "lens.fullname" . }}-ai
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lens.labels" . | nindent 4 }}
    app.kubernetes.io/component: ai
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: ai
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "lens.fullname" . }}-ai
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lens.labels" . | nindent 4 }}
    app.kubernetes.io/component: ai
spec:
  replicas: {{ .Values.ai.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: ai
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: ai
    spec:
      imagePullSecrets:
        {{- include "lens.imagePullSecrets" . | nindent 8 }}
      containers:
        - name: ai
          image: {{ .Values.image.registry }}/{{ .Values.image.repository }}/ai:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy | default $.Values.global.imagePullPolicy | default "Always" }}
          ports:
            - containerPort: 8000
          env:
            - name: LENS_REGISTRY_URL
              value: http://{{ include "lens.fullname" . }}-registry:8000
            - name: LENS_COMPILE_URL
              value: http://{{ include "lens.fullname" . }}-compile:8000
            - name: LENS_EXECUTE_URL
              value: http://{{ include "lens.fullname" . }}-execute:8000
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: postgres-password
            - name: DATABASE_URL
              value: {{ include "lens.databaseUrl" . }}
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: anthropic-api-key
            - name: LENS_AI_DEFAULT_MODEL
              value: {{ .Values.ai.env.defaultModel | quote }}
            - name: LENS_AI_ESCALATION_MODEL
              value: {{ .Values.ai.env.escalationModel | quote }}
            - name: LENS_AI_ALLOWED_MODELS
              value: {{ .Values.ai.env.allowedModels | quote }}
            - name: LENS_AI_MAX_RETRIES
              value: {{ .Values.ai.env.maxRetries | quote }}
            - name: AUTH_ENABLED
              value: {{ .Values.ai.env.authEnabled | quote }}
            - name: KEYCLOAK_URL
              value: {{ .Values.keycloak.url | quote }}
            - name: KEYCLOAK_REALM
              value: {{ .Values.keycloak.realm | quote }}
            - name: JWT_AUDIENCE
              value: {{ .Values.keycloak.audience | quote }}
            {{- if .Values.keycloak.issuer }}
            - name: JWT_ISSUER
              value: {{ .Values.keycloak.issuer | quote }}
            {{- end }}
            - name: KEYCLOAK_CLIENT_ID
              value: {{ .Values.keycloak.clientId | quote }}
            - name: KEYCLOAK_SERVICE_CLIENT_ID
              value: {{ .Values.keycloak.serviceClientId | quote }}
            - name: KEYCLOAK_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: keycloak-client-secret
                  optional: true
            {{- if .Values.keycloak.allowOrigins }}
            - name: LENS_ALLOW_ORIGINS
              value: {{ .Values.keycloak.allowOrigins | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.ai.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 40
            periodSeconds: 10
