---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "lens.fullname" . }}-registry
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lens.labels" . | nindent 4 }}
    app.kubernetes.io/component: registry
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: registry
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "lens.fullname" . }}-registry
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lens.labels" . | nindent 4 }}
    app.kubernetes.io/component: registry
spec:
  replicas: {{ .Values.registry.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: registry
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: registry
    spec:
      imagePullSecrets:
        {{- include "lens.imagePullSecrets" . | nindent 8 }}
      containers:
        - name: registry
          image: {{ .Values.image.registry }}/{{ .Values.image.repository }}/registry:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy | default $.Values.global.imagePullPolicy | default "Always" }}
          ports:
            - containerPort: 8000
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: postgres-password
            - name: DATABASE_URL
              value: {{ include "lens.databaseUrl" . }}
            - name: LENS_ROOT_PATH
              value: /api/v1/registry
            - name: RUN_MIGRATIONS
              value: {{ .Values.registry.runMigrations | quote }}
            - name: AUTH_ENABLED
              value: {{ .Values.registry.env.authEnabled | quote }}
            - name: KEYCLOAK_URL
              value: {{ .Values.keycloak.url | quote }}
            - name: KEYCLOAK_REALM
              value: {{ .Values.keycloak.realm | quote }}
            - name: JWT_AUDIENCE
              value: {{ .Values.keycloak.audience | quote }}
            {{- if .Values.keycloak.issuer }}
            - name: JWT_ISSUER
              value: {{ .Values.keycloak.issuer | quote }}
            {{- end }}
            - name: KEYCLOAK_CLIENT_ID
              value: {{ .Values.keycloak.clientId | quote }}
            - name: KEYCLOAK_SERVICE_CLIENT_ID
              value: {{ .Values.keycloak.serviceClientId | quote }}
            {{- if .Values.keycloak.allowOrigins }}
            - name: LENS_ALLOW_ORIGINS
              value: {{ .Values.keycloak.allowOrigins | quote }}
            {{- end }}
            - name: LOG_LEVEL
              value: {{ .Values.registry.env.logLevel | quote }}
          resources:
            {{- toYaml .Values.registry.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 40
            periodSeconds: 10
