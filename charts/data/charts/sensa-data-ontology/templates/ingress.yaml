{{- if .Values.ingress.enabled }}
{{- if and .Values.ingress.tls.enabled (not .Values.ingress.tls.managedExternally) .Values.ingress.tls.cert .Values.ingress.tls.key }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.ingress.tls.secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lens.labels" . | nindent 4 }}
type: kubernetes.io/tls
data:
  tls.crt: {{ .Values.ingress.tls.cert | b64enc }}
  tls.key: {{ .Values.ingress.tls.key | b64enc }}
{{- end }}
---
# API ingress — strips /api/v1/<service> prefix via rewrite-target.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "lens.fullname" . }}-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lens.labels" . | nindent 4 }}
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host }}
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /api/v1/registry(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ include "lens.fullname" . }}-registry
                port:
                  number: 8000
          - path: /api/v1/mcp(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ include "lens.fullname" . }}-mcp
                port:
                  number: 8000
---
# SPA + docs ingress — no rewrite, paths pass through as-is.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "lens.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lens.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host }}
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /docs
            pathType: Prefix
            backend:
              service:
                name: {{ include "lens.fullname" . }}-docs
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "lens.fullname" . }}-console
                port:
                  number: 80
{{- end }}
