{{- if .Values.secrets.create }}
{{- $existingSecret := lookup "v1" "Secret" .Release.Namespace .Values.existingSecret }}

{{/*
Postgres password:
  - New Postgres (enabled: true)  → auto-generate on first install, reuse on upgrade.
  - Existing Postgres (enabled: false) → must be supplied via secrets.postgresPassword.
*/}}
{{- $pgPassword := "" }}
{{- if .Values.postgres.enabled }}
  {{- if $existingSecret }}
    {{- $pgPassword = index $existingSecret.data "postgres-password" | b64dec }}
  {{- else }}
    {{- $pgPassword = randAlphaNum 32 }}
  {{- end }}
{{- else }}
  {{- $pgPassword = .Values.secrets.postgresPassword }}
{{- end }}

---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.existingSecret }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lens.labels" . | nindent 4 }}
type: Opaque
stringData:
  postgres-password: {{ $pgPassword | quote }}
  anthropic-api-key: {{ .Values.secrets.anthropicApiKey | quote }}
  {{- if .Values.secrets.keycloakClientSecret }}
  keycloak-client-secret: {{ .Values.secrets.keycloakClientSecret | quote }}
  {{- end }}
  {{- if .Values.secrets.keycloakAdminUser }}
  keycloak-admin-user: {{ .Values.secrets.keycloakAdminUser | quote }}
  {{- end }}
  {{- if .Values.secrets.keycloakAdminPassword }}
  keycloak-admin-password: {{ .Values.secrets.keycloakAdminPassword | quote }}
  {{- end }}
{{- end }}
