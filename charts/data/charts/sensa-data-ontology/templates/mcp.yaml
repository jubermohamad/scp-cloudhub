---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "lens.fullname" . }}-mcp
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lens.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: mcp
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "lens.fullname" . }}-mcp
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lens.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp
spec:
  replicas: {{ .Values.mcp.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: mcp
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: mcp
    spec:
      imagePullSecrets:
        {{- include "lens.imagePullSecrets" . | nindent 8 }}
      containers:
        - name: mcp
          image: {{ .Values.image.registry }}/{{ .Values.image.repository }}/mcp:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy | default $.Values.global.imagePullPolicy | default "Always" }}
          ports:
            - containerPort: 8000
          env:
            - name: LENS_ROOT_PATH
              value: /api/v1/mcp
            - name: LENS_REGISTRY_URL
              value: http://{{ include "lens.fullname" . }}-registry:8000
            - name: LENS_MCP_LOG
              value: {{ .Values.mcp.env.logLevel | quote }}
            - name: AUTH_ENABLED
              value: {{ .Values.mcp.env.authEnabled | quote }}
            - name: KEYCLOAK_URL
              value: {{ .Values.keycloak.url | quote }}
            - name: KEYCLOAK_REALM
              value: {{ .Values.keycloak.realm | quote }}
            - name: JWT_AUDIENCE
              value: {{ .Values.keycloak.audience | quote }}
            {{- if .Values.keycloak.issuer }}
            - name: JWT_ISSUER
              value: {{ .Values.keycloak.issuer | quote }}
            {{- end }}
            - name: KEYCLOAK_CLIENT_ID
              value: {{ .Values.keycloak.clientId | quote }}
            - name: KEYCLOAK_SERVICE_CLIENT_ID
              value: {{ .Values.keycloak.serviceClientId | quote }}
            - name: KEYCLOAK_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: keycloak-client-secret
                  optional: true
          resources:
            {{- toYaml .Values.mcp.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
