---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "lens.fullname" . }}-docs
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lens.labels" . | nindent 4 }}
    app.kubernetes.io/component: docs
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: docs
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "lens.fullname" . }}-docs
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lens.labels" . | nindent 4 }}
    app.kubernetes.io/component: docs
spec:
  replicas: {{ .Values.docs.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: docs
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: docs
    spec:
      imagePullSecrets:
        {{- include "lens.imagePullSecrets" . | nindent 8 }}
      containers:
        - name: docs
          image: {{ .Values.image.registry }}/{{ .Values.image.repository }}/docs:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy | default $.Values.global.imagePullPolicy | default "Always" }}
          ports:
            - containerPort: 80
          resources:
            {{- toYaml .Values.docs.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
