{{- if and (not .Values.postgres.enabled) .Values.postgres.ensureDatabase }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "lens.fullname" . }}-ensure-database
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lens.labels" . | nindent 4 }}
    app.kubernetes.io/component: ensure-database
  annotations:
    # pre-install/pre-upgrade — must exist before any other resource in this
    # release, so app pods never race a missing database. Runs before the
    # lens-secrets Secret is created too, which is why the password below is
    # taken directly from the Helm value rather than a secretKeyRef.
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: ensure-database
    spec:
      restartPolicy: Never
      imagePullSecrets:
        {{- include "lens.imagePullSecrets" . | nindent 8 }}
      containers:
        - name: ensure-database
          image: postgres:14
          imagePullPolicy: {{ $.Values.global.imagePullPolicy | default "Always" }}
          env:
            - name: PGPASSWORD
              value: {{ .Values.secrets.postgresPassword | quote }}
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail

              HOST={{ .Values.postgres.host | quote }}
              PORT={{ .Values.postgres.port | quote }}
              PGUSER={{ .Values.postgres.username | quote }}
              DB={{ .Values.postgres.database | quote }}

              echo "==> Checking whether database $DB exists on $HOST:$PORT"
              exists=$(psql -h "$HOST" -p "$PORT" -U "$PGUSER" -d postgres -tAc \
                "SELECT 1 FROM pg_database WHERE datname='$DB'")

              if [[ "$exists" == "1" ]]; then
                echo "==> Database $DB already exists, nothing to do"
              else
                echo "==> Creating database $DB"
                psql -h "$HOST" -p "$PORT" -U "$PGUSER" -d postgres -c "CREATE DATABASE \"$DB\""
              fi
{{- end }}
