{{- if .Values.imageCredentials.create }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.imageCredentials.secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lens.labels" . | nindent 4 }}
type: kubernetes.io/dockerconfigjson
data:
  # Three sources, resolved in `lens.dockerConfigJsonB64` — an explicit blob, the
  # legacy registry/username/password triple, or (the normal case now) the
  # platform pull secret this environment already supplies. The three-field form
  # duplicated that credential exactly, in a second file and a second shape.
  .dockerconfigjson: {{ include "lens.dockerConfigJsonB64" . }}
{{- end }}
