apiVersion: v2
name: velero
description: >-
  CloudHub-vendored Velero backup & disaster recovery. Wraps the upstream
  vmware-tanzu/velero chart with SCP defaults (Azure plugin, blob storage
  backup target) so CloudHub Native deployments have no dependency on the
  SymphonyFS/scripts repository.
type: application
version: 1.0.0
appVersion: "1.14"
dependencies:
  - name: velero
    version: "7.2.1"
    repository: https://vmware-tanzu.github.io/helm-charts
    condition: velero.enabled
