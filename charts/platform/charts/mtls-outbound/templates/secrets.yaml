{{- range .Values.mtls.domains }}
apiVersion: v1
kind: Secret
metadata:
  name: mtls-{{ .name }}
  namespace: {{ $.Release.Namespace }}
type: Opaque
stringData:
  client-combined.pem: |-
{{ .clientCombinedPem | b64dec | trim | nindent 4 }}
  ca-bundle.crt: |-
{{ .caBundlePem | b64dec | trim | nindent 4 }}
---
{{- end }}
