{{- if .Values.rbac.create }}
# Read-only: the kube-system namespace (its UID is the cluster fingerprint)
# and the API server version. Nothing else.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "dxa.clusterRoleName" . }}
  labels:
    {{- include "dxa.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    resourceNames: ["kube-system"]
    verbs: ["get"]
  - nonResourceURLs: ["/version", "/version/"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "dxa.clusterRoleName" . }}
  labels:
    {{- include "dxa.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "dxa.clusterRoleName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "dxa.serviceAccountName" . }}
    namespace: {{ include "dxa.namespace" . }}
{{- end }}
