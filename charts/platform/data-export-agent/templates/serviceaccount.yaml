apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "dxa.serviceAccountName" . }}
  namespace: {{ include "dxa.namespace" . }}
  labels:
    {{- include "dxa.labels" . | nindent 4 }}
  annotations:
    azure.workload.identity/client-id: {{ required "workloadIdentity.clientId is required" .Values.workloadIdentity.clientId | quote }}
    {{- with .Values.workloadIdentity.tenantId }}
    azure.workload.identity/tenant-id: {{ . | quote }}
    {{- end }}
    {{- with .Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
