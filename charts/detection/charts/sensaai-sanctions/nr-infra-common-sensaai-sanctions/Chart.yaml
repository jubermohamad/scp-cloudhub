apiVersion: v2
name: k8s-infra-common
description: A Helm chart for installing common infrastructure charts
type: application
version: 2.0.1
appVersion: "9.5.0"

dependencies:
  - name: cert-manager
    version: 1.12.17
    repository: https://charts.jetstack.io
    condition: cert-manager.enabled

  - name: reloader
    version: 1.0.63
    repository: https://stakater.github.io/stakater-charts
    condition: reloader.enabled

  - name: ingress-nginx
    version: 4.11.5
    repository: https://kubernetes.github.io/ingress-nginx
    condition: ingress-nginx.enabled
