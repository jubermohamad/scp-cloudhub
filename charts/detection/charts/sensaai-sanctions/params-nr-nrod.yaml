############################################################################################################################################
global:
  clusterType: "aks" #aks/aks-netapp/nfs/minikube
  dockerRegistryName: "index.docker.io/symphonysensa"
  ingressWildCardDns: "symphonyai.dev"

  pv:
    rwmStorageClassName: "azurefile-csi-nfs"
    # The smallest size for this PVC/PV is 100Gi and it can be extended by 100Gi steps on Azure
    dynamicResourcesStorageSize: 100Gi


