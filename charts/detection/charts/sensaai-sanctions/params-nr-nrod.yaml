############################################################################################################################################
sensaai-sanctions-inference:

  ################################
  # cert-manages
  ################################
  certificate:
    # Extra DNS(s) which needs to be added into certificate
    extraDnsList: []

  ################################
  # Ingress
  ################################
  ingress:
    enabled: true
    className: "nginx"
    annotations:
      nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
      # nginx.ingress.kubernetes.io/affinity: "cookie"
      # nginx.ingress.kubernetes.io/session-cookie-name: "stickcookie"
      nginx.ingress.kubernetes.io/session-cookie-expires: "172800"
      nginx.ingress.kubernetes.io/session-cookie-max-age: "172800"
      nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
      nginx.ingress.kubernetes.io/proxy-buffering: "off"
      nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
      # kubernetes.io/ingress.class: nginx
      # kubernetes.io/tls-acme: "true"
    hosts:
      - host: sensaai-sanctions-inference.{{ .Values.global.ingressWildCardDns }}
        paths:
          # This path has to be defined as .serverConfig.SWAGGER_URL. When this parameter is 'None' then this path can be removed
          # - path: /doc
          #   pathType: ImplementationSpecific
          # This path has to be defined as .serverConfig.REDOC_URL. When this parameter is 'None' then this path can be removed
          # - path: /redoc
          #   pathType: ImplementationSpecific
          - path: /getMatchScore
            pathType: ImplementationSpecific
          - path: /getBatchMatchScore
            pathType: ImplementationSpecific
          - path: /getMetrics
            pathType: ImplementationSpecific
          - path: /healthz
            pathType: ImplementationSpecific
          - path: /token
            pathType: ImplementationSpecific
    tls:
     - secretName: https-certs
       hosts:
         - sensaai-sanctions-inference.{{ .Values.global.ingressWildCardDns }}

