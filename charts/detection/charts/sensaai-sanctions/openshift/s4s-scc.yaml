apiVersion: security.openshift.io/v1
kind: SecurityContextConstraints
metadata:
  annotations:
    include.release.openshift.io/ibm-cloud-managed: "true"
    include.release.openshift.io/self-managed-high-availability: "true"
    include.release.openshift.io/single-node-developer: "true"
    kubernetes.io/description: Custom SCC for initial S4S deployment check on OpenShift to identify issues
       a separate final version must be created after validation.
    release.openshift.io/create-only: "true"
  name: s4s-scc
allowHostDirVolumePlugin: true # Required for /dev/fuse
allowHostIPC: false
allowHostNetwork: false
allowHostPID: false
allowHostPorts: false
allowPrivilegeEscalation: true
allowPrivilegedContainer: true
allowedCapabilities:
- SYS_ADMIN                     # Allow mounting host directories, which is required for the S4S application.
- FOWNER                        # Allow the application to change ownership of files and directories by running chmod and chown.
defaultAddCapabilities: null
fsGroup:
  type: RunAsAny
groups: []
priority: 11
readOnlyRootFilesystem: false
requiredDropCapabilities:
- MKNOD
runAsUser:
  type: RunAsAny
seLinuxContext:
  type: MustRunAs
supplementalGroups:
  type: RunAsAny
users: []
volumes:
- configMap
- csi
- downwardAPI
- emptyDir
- ephemeral
- persistentVolumeClaim
- projected
- secret
- hostPath # Required for /dev/fuse
