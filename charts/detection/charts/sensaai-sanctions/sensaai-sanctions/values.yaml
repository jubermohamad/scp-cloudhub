############################################################################################################################################
sensaai-sanctions-inference:
  networkPolicy:
    enabled: false

  namespace: "{{ .Values.global.namespace }}"

  pod:
    useResourceConstraints: "{{ .Values.global.useResourceConstraints }}"
    useImagePullSecrets: "{{ .Values.global.useImagePullSecrets }}"

    # Docker Image name and Tag without Registry name
    dockerRegistryName: "{{ .Values.global.dockerRegistryName }}"
    #imageRepository: "nri-nrod-k8s-wlm-ai"
    imageRepository: "k8s-sensaai-sanctions"
    imageTag: "9.6.1.5"
    #
    replicas: 2
    minReadySeconds: 60
    strategy:
      type: RollingUpdate
      rollingUpdate:
        maxUnavailable: 0
        maxSurge: 1

    resources:
      requests:
        memory: "5Gi"
        cpu: "2"
      limits:
        memory: "8Gi"
        cpu: "3"

    livenessProbe:
      failureThreshold: 3
      initialDelaySeconds: 60
      periodSeconds: 20
      successThreshold: 1
      timeoutSeconds: 5
    startupProbe:
      failureThreshold: 3
      initialDelaySeconds: 30
      periodSeconds: 20
      successThreshold: 1
      timeoutSeconds: 5

  pv:
    host: "10.222.17.61"
    dynamicResourcesStorageSize: 2Gi
    storageClassName: "{{ .Values.global.pv.rwmStorageClassName}}"
    hostPathDynamicResourcesMinikube: "/opt/netreveal"
    hostPathDynamicResources: "/var/nfs_k8s"

  job:
    ttlSecondsAfterFinished: 7200

  #SideCar configuration
  sideCar:
    resources:
      requests:
        memory: "64Mi"
        cpu: "50m"
      limits:
        memory: "350Mi"
        cpu: "350m"

  python: "python3.13"
  minioPasswordSecret: "mino-creds"

  ################################
  # config.properties
  ################################
  serverConfig:
    ACCESS_TOKEN_EXPIRY_MINUTES: "30"
    LOG_TO_FILE: "False"                        # True|False
    LOGGING_LEVEL: "info"
    MAINTENANCE_MODE_MESSAGE: "Server Drain"
    MAX_TRAINING_DATA_AGE_MONTHS: "24"
    MODEL_RELOAD_INTERVAL: "30"
