minio-provisioner:
  imageRepository: "quay.io/minio/mc"
  imageTag: "RELEASE.2025-08-13T08-35-41Z"

  job:
    ttlSecondsAfterFinished: 600

############################################################################################################################################
#  _____ _____ _   _  _____  ___    ___  _____      _____  ___   _   _ _____ _____ _____ _____ _   _  _____
# /  ___|  ___| \ | |/  ___|/ _ \  / _ \|_   _|    /  ___|/ _ \ | \ | /  __ \_   _|_   _|  _  | \ | |/  ___|
