    maxReplicas: 3
    targetCPU: "90"
    targetMemory: "90"

sensaai-sanctions-training:
  networkPolicy:
    enabled: false

  namespace: "{{ .Values.global.namespace }}"

  pod:
    useResourceConstraints: "{{ .Values.global.useResourceConstraints }}"
    useImagePullSecrets: "{{ .Values.global.useImagePullSecrets }}"

    # Docker Image name and Tag without Registry name
    dockerRegistryName: "{{ .Values.global.dockerRegistryName }}"
    imageRepository: "k8s-sensaai-sanctions"
    imageTag: "9.6.1.5"
    replicas: 1
    minReadySeconds: 60
    strategy:
      type: RollingUpdate
      rollingUpdate:
        maxUnavailable: 0
        maxSurge: 1

    resources:
      requests:
        memory: "12Gi"
        cpu: "4"
      limits:
        memory: "16Gi"
        cpu: "6"

    livenessProbe:
      failureThreshold: 3
      initialDelaySeconds: 60
      periodSeconds: 20
      successThreshold: 1
      timeoutSeconds: 5
    startupProbe:
      failureThreshold: 3
      initialDelaySeconds: 30
      periodSeconds: 20
      successThreshold: 1
      timeoutSeconds: 5

