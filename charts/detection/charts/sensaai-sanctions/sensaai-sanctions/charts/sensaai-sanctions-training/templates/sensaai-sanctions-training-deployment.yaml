---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: "{{ .Release.Name }}-sensaai-sanctions-training"
  namespace: "{{ tpl .Values.global.namespace . }}"
  labels:
    app: "{{ .Release.Name }}-sensaai-sanctions-training"
    app.kubernetes.io/managed-by: {{.Release.Service | quote }}
    app.kubernetes.io/instance: {{.Release.Name | quote }}
    helm.sh/chart: "{{.Chart.Name}}-{{.Chart.Version}}"
  annotations:
    secret.reloader.stakater.com/reload: "{{ .Release.Name }}-sensaai-users,{{ .Values.minioPasswordSecret }},{{ .Release.Name }}-sensaai-sanctions-training"
spec:
  selector:
    matchLabels:
      app: "{{ .Release.Name }}-sensaai-sanctions-training-pod"
  replicas: {{ .Values.pod.replicas }}
  minReadySeconds: {{ .Values.pod.minReadySeconds }}
  strategy:
    type: "{{ .Values.pod.strategy.type }}"
    rollingUpdate:
      maxUnavailable: {{ .Values.pod.strategy.rollingUpdate.maxUnavailable }}
      maxSurge: {{ .Values.pod.strategy.rollingUpdate.maxSurge }}
  template:
    metadata:
      namespace: "{{ tpl .Values.global.namespace . }}"
      labels:
        app: "{{ .Release.Name }}-sensaai-sanctions-training-pod"

    spec:
      hostname: "{{ .Release.Name}}-sensaai-sanctions-training"
      terminationGracePeriodSeconds: 1
      securityContext:
        runAsUser: 200
        runAsGroup: 200
        fsGroup: 200
        fsGroupChangePolicy: OnRootMismatch
      {{- if eq (tpl .Values.pod.useImagePullSecrets .) "true" }}
      imagePullSecrets:
        - name: regcred
      {{- end }}

      initContainers:
      - name: wait-for-sai-dynamic-resources-init
        image: "{{ tpl .Values.pod.dockerRegistryName . }}/{{ .Values.pod.toolsDockerImage }}"
        imagePullPolicy: IfNotPresent
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          runAsNonRoot: true

        volumeMounts:
        - name: {{ .Release.Name }}-sai-home-dir
          mountPath: /home/netreveal

        command:
        - /bin/bash
        - -exec
        - |
          set +x
          set -e

          echo "Wait for MINIO to be ready..."
          timeout 300 bash -c '
            until mc --quiet --no-color alias set minio {{ include "minio.url" . }} ${MINIO_USER} ${MINIO_PASSWORD} > /dev/null 2>&1
            do
              echo "Trying to connect to {{ include "minio.url" . }} server..."
              sleep 10
            done
          '
          if [ $? -ne 0 ]; then
            echo "Failed to connect to MINIO server"
            exit 1
          else
            echo "MINIO is ready"
          fi

          timeout 300 bash -c '
            until mc stat minio/private-bucket/landing/s4s_dynamic_resources/dynamic/init.flag > /dev/null 2>&1
            do
              echo "Trying to get mc stat minio/private-bucket/landing/s4s_dynamic_resources/dynamic/init.flag to validate Minio readiness"
              sleep 10
            done
          '
          if [ $? -ne 0 ]; then
            echo "Failed to get minio/private-bucket/landing/s4s_dynamic_resources/dynamic/init.flag"
            exit 1
          else
            echo "minio/private-bucket/landing/s4s_dynamic_resources/dynamic/init.flag is present."
          fi

        envFrom:
          - secretRef:
              name: "{{ .Values.minioPasswordSecret }}"

      - name: init-sensaai-sanction
        image: "{{ tpl .Values.pod.dockerRegistryName . }}/{{ .Values.pod.imageRepository }}:{{ .Values.pod.imageTag }}"
        imagePullPolicy: IfNotPresent

        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          runAsNonRoot: true

        volumeMounts:
        - name: {{ .Release.Name }}-tmp-static-resources
          mountPath: /tmp/resources/static
        - name: {{ .Release.Name }}-sensaai-users
          mountPath: /server/resources/static/password.json
          subPath: password.json
        - name: {{ .Release.Name}}-sensaai-sanctions-cert
          mountPath: /server/resources/static/server.key
          subPath: server.key
        - name: {{ .Release.Name}}-sensaai-sanctions-cert
          mountPath: /server/resources/static/server.crt
          subPath: server.crt
        - name: {{ .Release.Name }}-tmp-log
          mountPath: /server/logs

        command:
        - /bin/bash
        - -exec
        - |
          set +x
          cp -r /server/resources/static/. /tmp/resources/static
          echo "Update config.properties..."
          sed -r -i -e "s/^(.+LOG_TO_FILE.+)(=)(.+)(True|False)/\1\2\3False/" /tmp/resources/static/config.properties

          {{- if .Values.serverConfig }}
            {{- range $param, $value := .Values.serverConfig }}
          sed -r -i -e 's|^(.+{{ $param }}.+)(=)(.+)|\1\2 {{ $value }}|' /tmp/resources/static/config.properties
            {{- end }}
          {{- end }}

          {{- if .Values.appConfig }}
            {{- range $param, $value := .Values.appConfig }}
          sed -r -i -e 's|^(.+{{ $param }}.+)(=)(.+)|\1\2 {{ $value }}|' /tmp/resources/static/config.properties
            {{- end }}
          {{- end }}

          cat /tmp/resources/static/config.properties

      - name: encode-pass
        image: "{{ tpl .Values.pod.dockerRegistryName . }}/{{ .Values.pod.imageRepository }}:{{ .Values.pod.imageTag }}"
        imagePullPolicy: IfNotPresent

        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          runAsNonRoot: true

        volumeMounts:
        - name: {{ .Release.Name }}-tmp
          mountPath: /tmp
        - name: {{ .Release.Name }}-tmp-static-resources
          mountPath: /server/resources/static
        - name: {{ .Release.Name}}-sensaai-sanctions-cert
          mountPath: /server/resources/static/server.key
          subPath: server.key
        - name: {{ .Release.Name}}-sensaai-sanctions-cert
          mountPath: /server/resources/static/server.crt
          subPath: server.crt
        - name: {{ .Release.Name }}-tmp-log
          mountPath: /server/logs

        command:
        - /bin/bash
        - -exec
        - |
          set +x

          cd /server
          {{ .Values.python }} - <<EOF
          import os.path
          from core.common.auth import OAuthForm, Token, InternalAuthProvider
          auth_provider = InternalAuthProvider()
          auth_provider.hash_plain_passwords()
          EOF

      containers:
      - name: sensaai-sidecar
        image: "{{ tpl .Values.pod.dockerRegistryName . }}/{{ .Values.pod.toolsDockerImage }}"
        imagePullPolicy: IfNotPresent

        lifecycle:
          preStop:
            exec:
              command:
                - /bin/sh
                - -exec
                - |
                  umount -f "/server/resources/dynamic"

        securityContext:
          privileged: true
          capabilities:
            add:
              - SYS_ADMIN
          runAsUser: 0

        {{- if eq (tpl .Values.pod.useResourceConstraints .) "true" }}
        resources:
          requests:
            memory: {{ .Values.sideCar.resources.requests.memory }}
            cpu: {{ .Values.sideCar.resources.requests.cpu }}
          limits:
            memory: {{ .Values.sideCar.resources.limits.memory }}
            cpu: {{ .Values.sideCar.resources.limits.cpu }}
        {{- end }}

        command:
          - /bin/bash
          - -exec
          - |
            set +x; echo "$MINIO_USER:$MINIO_PASSWORD" > /opt/s3-temp/passwd-s3fs && chmod 600 /opt/s3-temp/passwd-s3fs
            set -x;
            s3fs "private-bucket:/landing/s4s_dynamic_resources/dynamic" "/server/resources/dynamic" -o passwd_file=/opt/s3-temp/passwd-s3fs,use_path_request_style,gid=200,uid=200,allow_other,url={{ include "minio.url" . }} -o nonempty -o logfile=/opt/s3-temp/sidecar.log && \
            tail -F /opt/s3-temp/sidecar.log

        envFrom:
          - secretRef:
              name: "{{ .Values.minioPasswordSecret }}"

        volumeMounts:
        - name: {{ .Release.Name }}-sidecar-log
          mountPath: /opt/s3-temp
        - name: {{ .Release.Name }}-sai-dynamic-resources
          mountPath: /server/resources/dynamic
          mountPropagation: Bidirectional

      - name: sensaai-sanctions-training
        image: "{{ tpl .Values.pod.dockerRegistryName . }}/{{ .Values.pod.imageRepository }}:{{ .Values.pod.imageTag }}"
        imagePullPolicy: IfNotPresent

        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: true
          runAsNonRoot: true
          privileged: true
          capabilities:
            add:
              - SYS_ADMIN

        {{- if eq (tpl .Values.pod.useResourceConstraints .) "true" }}
        resources:
          requests:
            memory: {{ .Values.pod.resources.requests.memory }}
            cpu: {{ .Values.pod.resources.requests.cpu }}
          limits:
            memory: {{ .Values.pod.resources.limits.memory }}
            cpu: {{ .Values.pod.resources.limits.cpu }}
        {{- end }}

        command:
          - /bin/bash
          - -exec
          - |

            set +x
            echo "Starting Sensaai Sanctions Server..."
            if [ -f /server/resources/dynamic/init.flag ]; then
              {{ .Values.python }} server.py
            fi

        ports:
          - name: https
            containerPort: 5050
            protocol: TCP

        volumeMounts:
        - name: {{ .Release.Name }}-tmp
          mountPath: /tmp
        - name: {{ .Release.Name }}-tmp-static-resources
          mountPath: /server/resources/static
        - name: {{ .Release.Name }}-sai-dynamic-resources
          mountPath: /server/resources/dynamic
          mountPropagation: Bidirectional
        - name: {{ .Release.Name }}-tmp-application-cache
          mountPath: /home/netreveal/.cache
        - name: {{ .Release.Name }}-tmp-application-cache
          mountPath: /home/netreveal/.config
        - name: {{ .Release.Name }}-tmp-application-cache
          mountPath: /server/resources/tmp
        - name: {{ .Release.Name }}-prometheus
          mountPath: /server/resources/prometheus

        {{- if .Values.pod.startupProbe }}
        startupProbe:
          exec:
            command:
              - /bin/bash
              - -exec
              - |
                if [ "$(curl -k -s -XGET 'https://localhost:5050/healthz' -H 'accept: application/json')" == "Server Up" ]; then
                  exit 0
                else
                  exit 10
                fi

          {{ toYaml .Values.pod.startupProbe | nindent 10 }}
        {{- end }}
        {{- if .Values.pod.livenessProbe }}
        livenessProbe:
          exec:
            command:
              - /bin/bash
              - -exec
              - |
                if [ "$(curl -k -s -XGET 'https://localhost:5050/healthz' -H 'accept: application/json')" == "Server Up" ]; then
                  exit 0
                else
                  exit 10
                fi

          {{ toYaml .Values.pod.livenessProbe | nindent 10 }}
        {{- end }}

      volumes:
        - name: {{ .Release.Name }}-tmp
          emptyDir: {}
        - name: {{ .Release.Name }}-tmp-static-resources
          emptyDir: {}
        - name: {{ .Release.Name }}-sidecar-log
          emptyDir: {}
        - name: {{ .Release.Name }}-tmp-log
          emptyDir: {}
        - name: {{ .Release.Name }}-tmp-application-cache
          emptyDir: {}
        - name: {{ .Release.Name }}-prometheus
          emptyDir: {}
        - name: {{ .Release.Name }}-sai-dynamic-resources
          emptyDir: {}
        - name: {{ .Release.Name }}-sai-home-dir
          emptyDir: {}
        {{- include "sai.user.secret.definition" . | indent 6 }}
        {{- include "sai.certificate.secret.definition" . | indent 6 }}
