---
apiVersion: v1
kind: Service
metadata:
  labels:
    service: "{{ .Release.Name }}-sensaai-sanctions-training"
    app: "{{ .Release.Name }}-sensaai-sanctions-training"
  name: "{{ .Release.Name }}-sensaai-sanctions-training"
  namespace: "{{ tpl .Values.global.namespace . }}"
spec:
  selector:
    app: "{{ .Release.Name }}-sensaai-sanctions-training-pod"
  type: ClusterIP
  ports:
    - name: https
      port: 443
      targetPort: https
