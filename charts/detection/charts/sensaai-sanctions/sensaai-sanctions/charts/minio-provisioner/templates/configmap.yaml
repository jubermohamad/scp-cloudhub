---
apiVersion: v1
kind: ConfigMap
metadata:
  name: "{{ .Release.Name }}-minio-customer-policy"
  namespace: {{ .Values.global.namespace }}
data:
  customer.policy.json: |
    {
    "Version": "2012-10-17",
    "Statement": [
        {
        "Action": [
                "s3:ListBucket",
                "s3:PutObject",
                "s3:GetObject",
                "s3:DeleteObject"
            ],
        "Effect": "Allow",
        "Resource": [
            "arn:aws:s3:::public-bucket/*","arn:aws:s3:::public-bucket"
        ],
        "Sid": "BucketAccessForUser"
        }
    ]
    }
