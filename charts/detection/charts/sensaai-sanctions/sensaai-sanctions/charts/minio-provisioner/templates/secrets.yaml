{{- $root := . -}}
---
apiVersion: v1
kind: Secret
metadata:
  name: "nrod-minio-creds"
type: Opaque
stringData:
  config.yaml: |
  rootUser: "minio"
  rootPassword: "{{ .Values.global.minio.password }}"

---
apiVersion: v1
kind: Secret
metadata:
  name: "mino-creds"
type: Opaque
stringData:
  MINIO_USER: "minio"
  MINIO_PASSWORD: "{{ .Values.global.minio.password }}"
  CLIENT_USER: "{{ .Values.global.minio.clientUser }}"
  CLIENT_PASSWORD: "{{ .Values.global.minio.clientPassword }}"
