replicas: 3
kafka:
  version: "3.8.0"
  listeners:
    - name: plain
      port: 9092
      type: internal
      tls: false
      networkPolicyPeers:
        []
        # - podSelector:
        #     matchLabels:
        #       app.kubernetes.io/instance: datadog-agent
        #   namespaceSelector:
        #     matchLabels:
        #       kubernetes.io/metadata.name: default
    - name: tls
      port: 9093
      type: internal
      tls: true
      networkPolicyPeers:
        []
        # - podSelector:
        #     matchLabels:
        #       app.kubernetes.io/instance: datadog-agent
        #   namespaceSelector:
        #     matchLabels:
        #       kubernetes.io/metadata.name: default
  config:
    offsets.topic.replication.factor: 3
    transaction.state.log.replication.factor: 3
    transaction.state.log.min.isr: 3
    default.replication.factor: 3
    min.insync.replicas: 3
    max.incremental.fetch.session.cache.slots: 10000
    max.message.bytes: 10485880
    message.max.bytes: 10485880
    replica.fetch.max.bytes: 10485880
    producer.compression.type: producer
  storage:
    size: "10Gi"