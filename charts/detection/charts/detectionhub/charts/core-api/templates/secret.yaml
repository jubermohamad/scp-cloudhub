apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-core-api-secrets
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  {{- $existingSecret := (lookup "v1" "Secret" .Release.Namespace (printf "%s-core-api-secrets" .Release.Name)) }}
  {{- if and $existingSecret $existingSecret.data (index $existingSecret.data "jwt.api") }}
  jwt.api: {{ index $existingSecret.data "jwt.api" | b64dec }}
  {{- else }}
  jwt.api: {{ randAlphaNum 64 }}
  {{- end }}
  internal.url: {{ printf "http://%s:%d/smc2" (include "core-api.fullname" . ) ( int .Values.service.port ) }}
