apiVersion: v1
kind: ServiceAccount
metadata:
  name: spark-operator-manipulator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: spark-operator-manipulator-{{ .Release.Namespace }}
rules:
- apiGroups: [""]
  resources: ["*"]
  verbs: ["*"]

  # LIMIT permissions
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: spark-operator-manipulator-{{ .Release.Namespace }}
subjects:
- kind: ServiceAccount
  name: spark-operator-manipulator
  namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: spark-operator-manipulator-{{ .Release.Namespace }}
  apiGroup: rbac.authorization.k8s.io
