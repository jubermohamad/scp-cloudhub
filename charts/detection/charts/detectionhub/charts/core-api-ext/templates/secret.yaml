apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-core-api-ext-secrets
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  {{- if not (lookup "v1" "Secret" .Release.Namespace  (printf "%s-core-api-ext-secrets" .Release.Name)) }}
  jwt.api: {{ randAlphaNum 64 }}
  internal.url: {{ printf "http://%s:%d" (include "core-api-ext.fullname" . ) ( int .Values.service.port ) }}
  {{- end }}