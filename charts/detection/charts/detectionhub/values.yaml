core-api-ext:
  enabled: true
  image:
    repository: symphonyfs.azurecr.io/symphonysensa/dethub-ext-api
    tag: "1.0.0"
    pullPolicy: ""            # empty = inherit global.imagePullPolicy
    
  sparkOperatorEndpoint: ""
  
  minio:
    endpoint: ""
    existingSecret: ""
    secretKey: rootUser
    secretPass: rootPassword
    templatesBucketName: sparktemplates
    configBucketName: conf
    
  service:
    type: ClusterIP  # Internal service, external access via Ingress
    port: 9090
    
  probes:
    startup:
      enabled: true
      type: http
      httpPath: /actuator/health/liveness
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
      successThreshold: 1
    liveness:
      enabled: true
      type: http
      httpPath: /actuator/health/liveness
      initialDelaySeconds: 60
      periodSeconds: 30
      timeoutSeconds: 5
      failureThreshold: 3
      successThreshold: 1
    readiness:
      enabled: true
      type: http
      httpPath: /actuator/health/readiness
      initialDelaySeconds: 5
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 3
      successThreshold: 1
    
  ingress:
    enabled: true  # External access via Ingress only
    className: "nginx"
    annotations:
      nginx.ingress.kubernetes.io/enable-cors: "true"
      nginx.ingress.kubernetes.io/cors-allow-origin: ""
      nginx.ingress.kubernetes.io/proxy-connect-timeout: "300"
      nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    hosts:
      - host: ""  # Updated domain
        paths:
          - path: /
            pathType: Prefix
    tls: []
    ingressAllowList:
      customerIPs: []
      platformIPs: []

# ── DetHub's own Keycloak provisioning (templates/keycloak-setup-job.yaml) ────
# Registers DetHub's Keycloak material — its SAML client, that client's SAML
# attribute mappers, its realm roles and those roles' user grants — into a realm
# ANOTHER chart owns (the platform realm `SRI`).
#
# This replaces the retired `SRIDetectionUI` realm and its `--import-realm`
# bootstrap. Realm import runs only when the realm is ABSENT, so it could never
# ship a change to an existing realm; a Job runs on every install and upgrade.
#
# Default OFF: a standalone `helm install detectionhub` has no platform realm to
# provision into. The umbrella turns it on — see
# deploy/sri-dev-centraindia/values.yaml.
keycloakSetup:
  enabled: false
  # kcadm ships in the Keycloak image; reuse the platform's own so no extra
  # image has to be mirrored into the private registry.
  image: symphonyfs.azurecr.io/bitnami/keycloak:26.3.3-debian-12-r0
  imagePullPolicy: ""            # empty = inherit global.imagePullPolicy
  # Bitnami's path. The upstream quay.io/keycloak image puts it at
  # /opt/keycloak/bin/kcadm.sh — change this with the image.
  kcadmPath: /opt/bitnami/keycloak/bin/kcadm.sh
  # REQUIRED, and must be the IN-CLUSTER URL: the master-realm admin token lives
  # 60 seconds and public-ingress latency has outlived it mid-Job more than once.
  internalUrl: ""
  # the platform realm this material is registered INTO
  realm: SRI
  adminRealm: master
  adminUser: admin
  adminPasswordSecret:
    name: ""
    key: admin-password
  # Secret holding the SP's SAML signing keypair — the same one core-api mounts.
  # The Job reads the certificate from it so Keycloak can validate core-api's
  # signed AuthnRequests, instead of the cert being pasted into values twice.
  samlSecret: dethub-core-api-saml
  samlCertKey: saml-signing-certificate.crt
  client:
    # SP entity ID. Realm-independent — it identifies DETHUB, not the IdP, so it
    # is unchanged by the realm merge.
    clientId: smui
    name: Detection Hub (SMUI)
    description: Symphony Detection Hub core-api SAML service provider
    rootUrl: ""
    baseUrl: /smc2
    # Assertion Consumer Service. MUST match the ACS the SP advertises, exactly.
    # These two are flipped together or login breaks — never one without the other.
    assertionConsumerUrl: ""
    singleLogoutUrl: ""
    # Additional valid redirect URIs kept alongside the ACS. DetHub is moving
    # behind a path on the single platform host, and listing BOTH the old and
    # the new origin here makes that cutover reversible without a second realm
    # edit: the client already trusts the destination before the SP moves to it.
    extraRedirectUris: []
    # Empty means "leave whatever is set"; SAML does not need CORS origins the
    # way OIDC does, but the field is here so the portal-host flip is a values
    # change like everything else.
    webOrigins: []
  # DELIBERATELY no `saml.force.authn`: with ForceAuthn set, Keycloak re-prompts
  # for credentials even when the realm SSO session is already valid, which
  # would break the portal -> Lens -> DetHub single-sign-on chain with a second
  # login box. The realm session cookie is protocol-agnostic, so an OIDC login
  # at the portal satisfies this SAML client silently.
  roles:
    - name: Administrator
      description: System administrator with full access privileges
    - name: Project Owner
      description: Full project management including creation, modification, and deletion capabilities
    - name: Project Contributor
      description: Project modification and viewing access without creation or deletion rights
    - name: Project Observer
      description: Read-only access to project information
    - name: Detection Owner
      description: Full detection management
    - name: Detection Contributor
      description: Detection modification and viewing access
    - name: Detection Observer
      description: Read-only access to detection information
    - name: ROLE_ADMIN
      description: SMUI administrator role
  # Which platform users get which DetHub roles. Users are created by
  # keycloak-config-cli; a user that is absent is skipped, not fatal.
  roleAssignments: {}
  backoffLimit: 6
  # 7200, not 600: a TTL shorter than helm's wait deletes a completed Job
  # while the watcher still needs it, and the release fails as NotFound
  ttlSecondsAfterFinished: 7200
  resources: {}
