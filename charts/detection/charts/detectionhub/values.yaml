  # Superset node configuration
  supersetNode:
    podLabels:
      SRIsolutions: SensaDetection
    replicas:
      enabled: true
      replicaCount: 1
    resources:
      limits:
        cpu: "1000m"
        memory: "2Gi"
      requests:
        cpu: "500m"
        memory: "1Gi"
  
    podDisruptionBudget:
      enabled: false
      
    connections:
      db_host: ""
  
    initContainers:
      - name: wait-for-postgres
        image: "apache/superset:dockerize"
        imagePullPolicy: Always   # inside a container spec emitted via toYaml — global.imagePullPolicy cannot reach it
        envFrom:
          - secretRef:
              name: ""
        command:
          - /bin/sh
          - -c
          - dockerize -wait "tcp://$DB_HOST:$DB_PORT" -timeout 120s
      - name: wait-for-superset-initdb
        image: ghcr.io/cloudnative-pg/postgresql:16.10
        imagePullPolicy: Always   # inside a container spec emitted via toYaml — global.imagePullPolicy cannot reach it
        env:
          - name: DB_PASS
            valueFrom:
              secretKeyRef:
                name: ""
                key: password
          - name: DB_USR
            valueFrom:
              secretKeyRef:
                name: ""
                key: user
          - name: DB_HOST
            valueFrom:
              secretKeyRef:
                name: ""
                key: host
        command:
        - /bin/sh
        - -c
        - >
          timeout=300;
          elapsed=0;
          export PGPASSWORD=$DB_PASS;
          while true; do
            status=$(psql -h $DB_HOST -U $DB_USR -t -A -c "select 1 from ab_user where id=1");
            if [ "$status" = "1" ]; then
              echo "Job completed";
              break;
            fi;
            echo "Waiting for job to complete...";
            if [ $elapsed -ge $timeout ]; then
              echo "Timeout reached while waiting for superset db initialization";
              exit 1;
            fi
            sleep 10;
            elapsed=$((elapsed + 10))
          done
      - name: wait-for-core-db
        image: "apache/superset:dockerize"
        imagePullPolicy: Always   # inside a container spec emitted via toYaml — global.imagePullPolicy cannot reach it
        env:
          - name: DB_PORT
            valueFrom:
              secretKeyRef:
                name: ""
                key: port
          - name: DB_HOST
            valueFrom:
              secretKeyRef:
                name: ""
                key: host
        command:
          - /bin/sh
          - -c
          - dockerize -wait "tcp://$DB_HOST:$DB_PORT" -timeout 120s
      - name: init-superset
        image: "symphonyfs.azurecr.io/symphonysensa/dethub-engine-configuration:1.0.0"
        imagePullPolicy: Always   # inside a container spec emitted via toYaml — global.imagePullPolicy cannot reach it
        env:
          - name: DATABASE_URL
            valueFrom:
              secretKeyRef:
                name: ""
                key: uri
          - name: DATABASE_SCHEMA
            valueFrom:
              secretKeyRef:
                name: ""
                key: dbname
        command:
          - /bin/sh
          - -ce
          - |
            {{- $dbssl := .Values.global.database.ssl | default dict }}
            {{- if $dbssl.enabled | default false }}
            export DATABASE_URL="${DATABASE_URL}?sslmode={{ $dbssl.mode }}\\&sslrootcert=/cacertificates/ca.crt\\&sslcert=/certificates/tls.crt\\&sslkey=/tmp/tls.key"
            {{- end }}
            ./entrypoint.sh
            cp -r SUPERSET /shared-data
        volumeMounts:
          - name: shared-data
            mountPath: "/shared-data"
  
  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      nginx.ingress.kubernetes.io/enable-cors: "true"
      nginx.ingress.kubernetes.io/cors-allow-origin: ""
      nginx.ingress.kubernetes.io/proxy-connect-timeout: "300"
      nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
      nginx.ingress.kubernetes.io/cors-allow-headers: "DNT, Keep-Alive, User-Agent, X-Requested-With, If-Modified-Since, Cache-Control, Content-Type, Range, Authorization, X-CSRFToken"
    path: /
    pathType: Prefix
    hosts:
      - ""
    tls: []
    ingressAllowList:
      customerIPs: []
      platformIPs: []
  
  # Redis configuration for caching
  redis:
    enabled: false
  
  # Configure Celery workers
  supersetWorker:
    replicas:
      enabled: true
      replicaCount: 0
  
  # Configure Celery beat for scheduled jobs
  supersetCeleryBeat:
    enabled: false
  
  # Init configuration
  init:
    enabled: false
    customEnabled: true
    loadExamples: false
    createAdmin: true
    jobAnnotations: {}
    
    # REPLACE: Update admin user configuration
    adminUser:
      username: admin
      firstname: Superset
      lastname: Admin
      email: admin@detectionhub.local  # REPLACE with your email
    
    initscript: |-
      #!/bin/sh
      set -eu
      echo "Upgrading DB schema..."
      superset db upgrade
      echo "Initializing roles..."
      superset init
      {{ if .Values.init.createAdmin }}
      echo "Creating admin user..."
      superset fab create-admin \
                      --username {{ .Values.init.adminUser.username }} \
                      --firstname {{ .Values.init.adminUser.firstname }} \
                      --lastname {{ .Values.init.adminUser.lastname }} \
                      --email {{ .Values.init.adminUser.email }} \
                      --password ${SUPERSET_PASS} \
                      || true
      {{- end }}
      {{ if .Values.init.loadExamples }}
      echo "Loading examples..."
      superset load_examples
      {{- end }}
      if [ -f "{{ .Values.extraConfigMountPath }}/import_datasources.yaml" ]; then
        echo "Importing database connections.... "
        superset import_datasources -p {{ .Values.extraConfigMountPath }}/import_datasources.yaml
      fi
  # Enable built-in PostgreSQL for Superset's metadata
  postgresql:
    enabled: false
  
  # Service configuration
  service:
    type: ClusterIP
    port: 8088
  
  # Monitoring
  serviceMonitor:
    enabled: false
    
superset-updater:
