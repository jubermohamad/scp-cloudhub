{{- if (index .Values "superset" "enabled") }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-superset-secrets
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  {{- if not (lookup "v1" "Secret" .Release.Namespace  (printf "%s-superset-secrets" .Release.Name)) }}
  superset.secret.key: {{ randAlphaNum 64 }}
  superset.ui.pass: {{ randAlphaNum 64 }}
  {{- end }}
{{- end }}