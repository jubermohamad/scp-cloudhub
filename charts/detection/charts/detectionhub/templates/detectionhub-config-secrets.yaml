{{- if (index .Values "cn-postgres" "enabled") }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-config-secrets
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  {{- $db := include "detectionhub.database" (index .Subcharts "cn-postgres") | fromYaml }}
  jdbc.url: "jdbc:postgresql://{{ $db.host }}:{{ $db.port }}/{{ $db.name }}{{ if $db.ssl }}?ssl=true&sslmode={{- $db.sslMode -}}&sslrootcert=/cacertificates/ca.crt&sslcert=/certificates/tls.crt&sslkey=/certificates/tls.key{{- end }}"
{{- end }}