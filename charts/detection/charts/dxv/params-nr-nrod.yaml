############################################################################################################################################
global:

  clusterType: "aks" #aks/nfs/minikube
  # When kubePrometheusStackPresent=true then please define spark-operator.podMonitor.enable=true. Otherwise spark-operator.podMonitor.enable=false
  kubePrometheusStackPresent: false
  useImagePullSecrets: "true"
  # Global time zone identifier used for scheduling in configuration. Default is not set and is using cluster time zone.
  # timeZone: "UTC"
  # timeZone: "Europe/Dublin"
  # timeZone: "Australia/Melbourne"
  timeZone: ""

  # true|false
  # false = it will not use root account for init script. It requires to create directory structure with the proper permissions
  useRootAccountForInit: false

  ingressNamespace: "ingress-nginx"

  pv:
    storageClassName: "managed-csi"
    rwmStorageClassName: "azurefile-csi-nfs"

  # Examples:
  #   ECR: 519876397211.dkr.ecr.eu-west-1.amazonaws.com
  #   ACR: nrengdev.azurecr.io
  #   SCP ACR: symphonyfs.azurecr.io
  #   DockerHub: index.docker.io/symphonysensa
  #
  # spark-operator.image - has to be defined with repository name
  dockerRegistryName: "symphonyfs.azurecr.io/symphonysensa"
  orgUnitUserPrefix: ""
  # @@orgUnitWithMultiplePods
  # When 'true': Multiple PODs are generated (one per Org Unit) and OOTB configuration works (with some project configuration for WLM):
  #   - Standalone
  #   - WLM IGS
  #   - WLM PN RT
  #   - WLM PN SA
  # When 'false': The OOTB configuration requires project updates. The Multi Org Unit setup will be similar to NR 9.4 and 9.5.
  orgUnitWithMultiplePods: true
  nrOrgUnits: []
    # Defaults: when orgUnitCode is defined:
    #   userName - {{ default "usr" .Values.global.orgUnitUserPrefix }}-{{ .Values.global.nrOrgUnits[].orgUnitCode | lower }}
    #   userPassword - {{ randAlphaNum 12 }} when {{ .Values.global.nrOrgUnits[].userPassword }} is empty
    # SCP-2218 pgpPublicKey - optional PGP public key to be used for data encryption for the org unit (outband encryption).
    # Configuration example:
    # - orgUnitCode: "orgUnit1"
    #   userName: "orgUnit1"
    #   pgpPublicKey: ""
    #   userPassword: ""
    #   # End of day for acquisition (yyyymmdd). If empty the current date is used. This property is used only for upgrade for newly created org units.
    #   # Note: Folders structure for new org units will be created by envelope extractor job. This job will also populate the endofday.txt file.
    #   endOfDay: "20160104"
    # - orgUnitCode: "org-unit-2"
    #   pgpPublicKey: |-
    #     -----BEGIN PGP PUBLIC KEY BLOCK-----

    #     mDMEZrSz8RYJKwYBBAHaRw8BAQdAPl6ZPifyJ/95JPhtxsQZxD/7pSMQqkQBQIO6
    #     VULwVdC0K2R4di5zYW5kYm94LmJoZnMuY2xpZW50IDx0ZXN0QG5ldHJldmVhbC5h
    #     aT6ImQQTFgoAQRYhBDUmpsOwU2maohP3D1HDVkH1UYb9BQJmtLPxAhsDBQkDwmcA
    #     BQsJCAcCAiICBhUKCQgLAgQWAgMBAh4HAheAAAoJEFHDVkH1UYb9dPQBAObtzDk0
    #     v3nhO3jnFYoW1sI2wWsnOGsYdEX+N7GQowK5AP43GUocb0vS8FXIFb9NlA3FXjcS
    #     i4mvUHuiuP0pD3wTBLg4BGa0s/ESCisGAQQBl1UBBQEBB0CZO1HowwprfGo+0Jp/
    #     px9pexhPT870+mhgaV+fwVZ2JQMBCAeIfgQYFgoAJhYhBDUmpsOwU2maohP3D1HD
    #     VkH1UYb9BQJmtLPxAhsMBQkDwmcAAAoJEFHDVkH1UYb9JfIA/jib4EgfUjhVut66
    #     AE2wVSAruXdakiZs5G9opxcyorpxAQDDfYbGDOyuJ9/jJkly4OCEXANinmp0PpD8
    #     Mtyw2zPlAQ==
    #     =w1u5
    #     -----END PGP PUBLIC KEY BLOCK-----
    #   userName: "org-unit-2"
    #   userPassword: ""
    #   # End of day for acquisition (yyyymmdd). If empty the current date is used. This property is used only for upgrade for newly created org units.
    #   # Note: Folders structure for new org units will be created by envelope extractor job. This job will also populate the endofday.txt file.
    #   endOfDay: "20180105"
    # - orgUnitCode: "org_unit_3"
    #   userName: "org_unit_3"
    #   userPassword: ""
 #Globally defined ingress class name. It can be overridden in each sub-chart if needed. Please note that when kubePrometheusStackPresent=true then the ingress class for spark-operator has to be set to "nginx-inc" to work properly with kube-prometheus-stack configuration.
  ingress: 
    className: &ingressClass "nginx"
############################################################################################################################################
#  _____ _   _ _____ ______ _____ _____ _____        _   _ _____ _____ _   _ __   __
# |_   _| \ | |  __ \| ___ \  ___/  ___/  ___|      | \ | |  __ \_   _| \ | |\ \ / /
#   | | |  \| | |  \/| |_/ / |__ \ `--.\ `--. ______|  \| | |  \/ | | |  \| | \ V /
#   | | | . ` | | __ |    /|  __| `--. \`--. \______| . ` | | __  | | | . ` | /   \
#  _| |_| |\  | |_\ \| |\ \| |___/\__/ /\__/ /      | |\  | |_\ \_| |_| |\  |/ /^\ \
#  \___/\_| \_/\____/\_| \_\____/\____/\____/       \_| \_/\____/\___/\_| \_/\/   \/
#
############################################################################################################################################
ingress-nginx:
  enabled: true
  tcp:
    8022: netreveal/minio:8022
  controller:
    service:
      nodePorts:
        tcp:
          8022: 30822
      enabled: true
      external:
        enabled: true
      internal:
        enabled: false
      annotations:
        service.beta.kubernetes.io/azure-load-balancer-scheme: internet-facing
        service.beta.kubernetes.io/azure-load-balancer-name: sensa-load-balancer
        service.beta.kubernetes.io/azure-load-balancer-proxy-protocol: "*"
        service.beta.kubernetes.io/azure-load-balancer-ip-address-type: ipv4
        service.beta.kubernetes.io/azure-load-balancer-health-probe-request-path: "/healthz"
        service.beta.kubernetes.io/azure-load-balancer-target-group-attributes: stickiness.enabled=true,stickiness.type=source_ip,preserve_client_ip.enabled=true
      type: LoadBalancer
      externalTrafficPolicy: Local
    config:
      proxy-body-size: "2048m"
      # Cloudflare IP ranges which can be found on https://www.cloudflare.com/ips/
      proxy-real-ip-cidr: "173.245.48.0/20,103.21.244.0/22,103.22.200.0/22,103.31.4.0/22,141.101.64.0/18,108.162.192.0/18,190.93.240.0/20,188.114.96.0/20,197.234.240.0/22,198.41.128.0/17,162.158.0.0/15,104.16.0.0/13,104.24.0.0/14,172.64.0.0/13,131.0.72.0/22,2400:cb00::/32,2606:4700::/32,2803:f800::/32,2405:b500::/32,2405:8100::/32,2a06:98c0::/29,2c0f:f248::/32"
      use-forwarded-headers: "true"

############################################################################################################################################
#          _   _ _____ _____ _   _ __   __    _____ _   _ _____ ______ _____ _____ _____
#         | \ | |  __ \_   _| \ | |\ \ / /   |_   _| \ | |  __ \| ___ \  ___/  ___/  ___|
#         |  \| | |  \/ | | |  \| | \ V /______| | |  \| | |  \/| |_/ / |__ \ `--.\ `--.
#         | . ` | | __  | | | . ` | /   \______| | | . ` | | __ |    /|  __| `--. \`--. \
#         | |\  | |_\ \_| |_| |\  |/ /^\ \    _| |_| |\  | |_\ \| |\ \| |___/\__/ /\__/ /
#         \_| \_/\____/\___/\_| \_/\/   \/    \___/\_| \_/\____/\_| \_\____/\____/\____/
#
############################################################################################################################################
nginx-ingress:
  enabled: true
  controller:
    service:
      enabled: true
      annotations:
        service.beta.kubernetes.io/azure-load-balancer-scheme: internet-facing
        service.beta.kubernetes.io/azure-load-balancer-name: sensa-load-balancer
        service.beta.kubernetes.io/azure-load-balancer-proxy-protocol: "*"
        service.beta.kubernetes.io/azure-load-balancer-ip-address-type: ipv4
        service.beta.kubernetes.io/azure-load-balancer-health-probe-request-path: "/healthz"
        service.beta.kubernetes.io/azure-load-balancer-target-group-attributes: stickiness.enabled=true,stickiness.type=source_ip,preserve_client_ip.enabled=true
      type: LoadBalancer
      externalTrafficPolicy: Local
    config:
      entries:
        client-max-body-size: '2048m'
        real-ip-header: 'X-Forwarded-For'
        # Cloudflare IP ranges which can be found on https://www.cloudflare.com/ips/
        proxy-real-ip-cidr: "173.245.48.0/20,103.21.244.0/22,103.22.200.0/22,103.31.4.0/22,141.101.64.0/18,108.162.192.0/18,190.93.240.0/20,188.114.96.0/20,197.234.240.0/22,198.41.128.0/17,162.158.0.0/15,104.16.0.0/13,104.24.0.0/14,172.64.0.0/13,131.0.72.0/22,2400:cb00::/32,2606:4700::/32,2803:f800::/32,2405:b500::/32,2405:8100::/32,2a06:98c0::/29,2c0f:f248::/32"
        real-ip-recursive: 'True'      

