############################################################################################################################################
minio:
  mode: distributed
  # Number of MinIO containers running
  replicas: 3
  # Number of expanded MinIO clusters
  pools: 1
  persistence:
    storageClass: "managed-csi"
  resources:
    requests:
      memory: "14336Mi"
      cpu: "1000m"
    limits:
      memory: "14336Mi"
      cpu: "1000m"

