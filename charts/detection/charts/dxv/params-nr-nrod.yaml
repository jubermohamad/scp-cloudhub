nrodsftp:
  global:
    MINIO_INGRESS_HOST: "{{ include \"ingress.host.name\" (list $ . \"minio\") }}"
    MINIOUI_INGRESS_HOST: "{{ include \"ingress.host.name\" (list $ . \"minio-ui\") }}"
  nrodsftp:
    image:
      repository: "symphonyfs.azurecr.io/symphonysensa/nrodsftp"
    enablePgp: true
  redis:
    global:
      # SCP-2487 - Azure Support Request - Cache Bitnami images
      imageRegistry: "symphonyfs.azurecr.io"
      imagePullSecrets: [ "regcred" ]
      security:
        allowInsecureImages: true
    master:
      persistence:
        storageClass: "managed-csi"

