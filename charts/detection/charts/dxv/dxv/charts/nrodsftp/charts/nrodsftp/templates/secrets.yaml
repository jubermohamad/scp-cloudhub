{{- $root := . -}}
---
apiVersion: v1
kind: Secret
metadata:
  name: "nrodsftp-minio-creds"
  annotations:
    # This is what defines this resource as a hook. Without this line, the
    # job is considered part of the release.
    "helm.sh/hook": pre-install, pre-upgrade, post-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
type: Opaque
stringData:
  config.yaml: |
  rootUser: "minio"
  rootPassword: "{{ .Values.global.PASSWORD }}"

---
apiVersion: v1
kind: Secret
metadata:
  name: "{{ include "secret.s3.private.bucket.name" . }}"
  annotations:
    # This is what defines this resource as a hook. Without this line, the
    # job is considered part of the release.
    "helm.sh/hook": pre-install, pre-upgrade, post-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
type: Opaque
stringData:
  MINIO_USER: "minio"
  MINIO_PASSWORD: "{{ .Values.global.PASSWORD }}"
  CLIENT_USER: "{{ .Values.global.minio.clientUser }}"
  CLIENT_PASSWORD: "{{ .Values.global.minio.clientPassword }}"
  PSQL_USER: "{{ .Values.global.minio.psqlUser }}"
  PSQL_PASSWORD: "{{ .Values.global.minio.psqlPassword }}"

---
apiVersion: v1
kind: Secret
metadata:
  name: "nrodsftp-orgunit-json-config"
  annotations:
    reloader.stakater.com/match: "true"
type: Opaque
data:
  orgunits_setup.json: {{ include "nrodsftp.orgUnitsJson" . | b64enc | quote }}
