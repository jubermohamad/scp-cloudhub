{{- $secret := lookup "v1" "Secret" .Values.global.namespace "org-units-sftp-creds" }}
---
apiVersion: v1
kind: Secret
metadata:
  name: "org-units-sftp-creds"
  namespace: {{ .Values.global.namespace }}
  annotations:
    # This is what defines this resource as a hook. Without this line, the
    # job is considered part of the release.
    "helm.sh/hook": pre-install, pre-upgrade, post-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
type: Opaque
stringData:
  {{- if .Values.global.nrOrgUnits }}
    {{- if ne (len .Values.global.nrOrgUnits) 0 }}
      {{- range $key, $value := .Values.global.nrOrgUnits }}
        {{- $usrKey := (printf "%s%s%s" "USR_" ($value.orgUnitCode | upper | replace "-" "_") "_NAME") }}
        {{- if ne $value.userName "" }}
    {{ $usrKey }}: "{{ $value.userName }}"
        {{- else }}
          {{- if and $secret $secret.data (hasKey $secret.data $usrKey) }}
            {{- $usrValue := index $secret.data $usrKey }}
    {{ $usrKey }}: {{ $usrValue | b64dec | quote }}
          {{- else }}
    {{ $usrKey }}: "{{ default "usr" $.Values.global.orgUnitUserPrefix }}-{{ $value.orgUnitCode | lower }}"
          {{- end }}
        {{- end }}
    {{- $passKey := ( printf "%s%s%s" "USR_" ($value.orgUnitCode | upper | replace "-" "_") "_PASSWORD") }}
        {{- if ne $value.userPassword "" }}
    {{ $passKey }}: "{{ $value.userPassword }}"
        {{- else }}
          {{- if and $secret $secret.data (hasKey $secret.data $passKey) }}
            {{- $passValue := index $secret.data $passKey }}
    {{ $passKey }}: {{ $passValue | b64dec | quote }}
          {{- else }}
    {{ $passKey }}: "{{ randAlphaNum 12 }}"
          {{- end }}
        {{- end }}
      {{- end }}
    {{- end }}
  {{- end }}
