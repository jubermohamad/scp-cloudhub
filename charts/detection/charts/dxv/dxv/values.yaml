############################################################################################################################################
global:
  toolsDockerImage: "nri-nrod-k8s-tools:1.0.6-20260327201420"
  #####################################################################
  # Section cert-manager and certificate lifecycle management
  issuer:
    ca:
      name: ca
    selfSigned:
      name: selfsigned
      certificate:
        duration: 87600h # 10 years
        renewBefore: 720h # 30 days
  certificate:
    duration: 8760h # 1 year
    renewBefore: 720h # 30 days
    subject:
      organizations:
      - Netreveal
      countries:
      - IE
      organizationalUnits:
      - IT
      localities:
      - Dublin
      provinces:
      - Dublin
    privateKey:
      algorithm: ECDSA
      size: 256
  #####################################################################
  prefixPvcWithReleaseName: false
  oneVolumePerPod: true
  useResourceConstraints: "true" #true|false
  clusterType: "minikube" #aks/nfs/minikube
  # Global time zone identifier used for scheduling in configuration. Examples:
  # timeZone: "UTC"
  # timeZone: "Europe/Dublin"
  # timeZone: "Australia/Melbourne"
  timeZone: ""
  useImagePullSecrets: "true"
  netreveal:
    imagePullSecrets:
      - name: "regcred"
 
  enableDataShim: true
  trustStore:
    password: ""
  prometheus:
    release: "dxv-sri"
  namespace: dxv-sri

  # Set to true to enable Parallel Pod Management Policy for StatefulSets
  # This can improve startup and shutdown times for StatefulSets by allowing pods to be managed in parallel rather than sequentially.
  # However, it may lead to resource contention if multiple pods start or stop simultaneously.
  # STS has to be deleted and recreated to apply this change.
  useParallelPodManagementPolicy: false

  # Ingress properties
  ingressPrefix: "nr"
  ingressWildCardDns: "symphonyai.dev"
  ingressNamespace: "nginx-ingress"
  ingressAllowList:
    customerIPs: []
    platformIPs: []
  # Empty string|prod|production are not added into the ingress host name
  # Ingress host name is generated as:
  #   <global.ingressPrefix>-(<sub-chart-name> if required)-(<global.envType> if not empty or not "prod" or "production")-<global.clientSubDomain>.<global.ingressWildCardDns>
  envType: ""
  clientSubDomain: "clientsubdomain"

  #Globally defined ingress class name. It can be overridden in each sub-chart if needed. Please note that when kubePrometheusStackPresent=true then the ingress class for spark-operator has to be set to "nginx-inc" to work properly with kube-prometheus-stack configuration.
  ingress: 
    className: &ingressClass "nginx"

  pv:
    storageClassName: "standard"
    host: "10.222.17.61"
    rwmStorageClassName: ""

  # Define override for JAVA_OPTS required for JDK 17.
  java:
    java_opts: ""

  # Examples:
  #   ECR: 519876397211.dkr.ecr.eu-west-1.amazonaws.com
  #   ACR: nrengdev.azurecr.io
  #   DockerHub: index.docker.io/symphonysensa
  #
  # spark-operator.image - has to be defined with reposiotry name
  dockerRegistryName: "519876397211.dkr.ecr.eu-west-1.amazonaws.com"
 
  orgUnitUserPrefix: ""
  # @@orgUnitWithMultiplePods
  # When 'true' multiple PODs are generated (one per Org Unit) for OOTB configuration works (with some project configuration for WLM):
  #   Standalone
  #   WLM IGS
  #   WLM PN RT
  #   WLM PN SA
  # When 'false' the OOTB configuration requires project updates. The Multi Org Unit set up will be similar to NR 9.4 and 9.5
  orgUnitWithMultiplePods: true
  nrOrgUnits: []

  # true|false
  # false = it will not use root account for init script. It require to create directory structure with the proper permissions
  useRootAccountForInit: true


  externalCertificates: {}
    # external:
    #   # Secret name for external certificates
    #   secretName: "external-certificates"
    #   # Please provide:
    #   #   - cert and key: certificate and private key in PEM format
    #   #   - signedCertificate: signed certificate in PEM format
    #   # signedCertificate is used when all properties are defined.
    #   cert: "external.cert.crt"
    #   key: "external.cert.key"
    #   signedCertificate: "external.cert.cer"


  # minio credentials
  minio:
    user: "minio"
    password: ""
    clientUser: "customer"
    psqlUser: "psqlbackup"
    clientPassword: ""
    psqlPassword: ""

  # Extra annotations required for PVC based on a StorageClass name
  pvcAnnotations:
    "managed-csi":
      annotations:
        velero.io/csi-volumesnapshot-class: "azure-disk-csi-snapshotclass"
    "azurefile-csi-nfs":
      annotations:
        velero.io/csi-volumesnapshot-class: "trident-snapshotclass"
    "azure-netapp-files":
      annotations:
        velero.io/csi-volumesnapshot-class: "trident-snapshotclass"

  database:
   
    testBackupMode: false

  operatorsNamespaces:
    - nr-infra-common
    - common-res

# Subchart: network-policies (installed when global.nrSubChartSwitches.enableNetworkPolicies is true).
network-policies:
  minio:
    trustedClientNamespaces: []


