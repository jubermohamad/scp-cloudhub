# | . ` ||    /| | | | | | | `--. \  _|   | | |  __/
# | |\  || |\ \\ \_/ / |/ / /\__/ / |     | | | |
# \_| \_/\_| \_|\___/|___/  \____/\_|     \_/ \_|
#
############################################################################################################################################
nrodsftp:
  minio-provisioner:
    imageRepository: "quay.io/minio/mc"
    imageTag: "RELEASE.2025-08-13T08-35-41Z"

    notifyWebhook:
      queueDir: "/export/events"
      queueLimit: "10000"

    # MinIO Site Replication Configuration (Active-Active)
    # Enables bi-directional replication between two MinIO deployments
    minio:
      # All replication buckets must have versioning enabled. On both sites, ensure that versioning is
      # enabled for the buckets listed in `bucketsWithVersioning`.
      bucketsWithVersioning: []
        # - "private-bucket"
        # - "public-bucket"
      replication:
        enabled: false
        # The replication endpoint has to be up and accessible from the source MinIO deployment. It it is not then the replication set up will fail.
        # The endpoint has to be defined with ${MINIO_USER}:${MINIO_PASSWORD} for authentication
        buckets: []
          # - bucket: "private-bucket"
          #   # The endpoint has to be defined with ${MINIO_USER}:${MINIO_PASSWORD} for authentication
          #   endpoint: "http://${MINIO_USER}:${MINIO_PASSWORD}@minio.netreveal.svc.cluster.local:9000"
          #   # Specify the integer priority of the replication rule. The value must be unique among all other rules on the source bucket. Higher values imply a higher priority than all other rules.
          #   priority: 0
          #   enabled: true
          #   extraOptions: ""
          #   replicateOptions: "delete,delete-marker,existing-objects,metadata-sync"
          # - bucket: "public-bucket"
          #   # The endpoint has to be defined with ${MINIO_USER}:${MINIO_PASSWORD} for authentication
          #   endpoint: "http://${MINIO_USER}:${MINIO_PASSWORD}@minio.netreveal.svc.cluster.local:9000"
          #   priority: 0
          #   enabled: true
          #   extraOptions: "--healthcheck-seconds 60 "
          #   replicateOptions: "delete,delete-marker,existing-objects,metadata-sync"

  nrodsftp:
    # MinIO Ingress properties
    ingress:
      annotations:
        nginx.ingress.kubernetes.io/proxy-body-size: 100m
        nginx.org/client-max-body-size: "100m"
      ingressAllowList:
        customerIPs: []
        platformIPs: []
    fullnameOverride: "nrodsftp"
    image:
      repository: "symphonyfs.azurecr.io/symphonysensa/nrodsftp"
      tag: "v1.2.4"
      pullPolicy: IfNotPresent

    imagePullSecrets:
      - name: "regcred"

    resources:
      requests:
        memory: "1500Mi"
        cpu: "1000m"
      limits:
        memory: "3072Mi"
        cpu: "1000m"

    livenessProbe:
      failureThreshold: 3
      initialDelaySeconds: 60
      periodSeconds: 20
      successThreshold: 1
      timeoutSeconds: 5
    readinessProbe:
      failureThreshold: 3
      initialDelaySeconds: 60
      periodSeconds: 20
      successThreshold: 1
      timeoutSeconds: 5
    # startupProbe:
    #   failureThreshold: 3
    #   initialDelaySeconds: 60
    #   periodSeconds: 20
    #   successThreshold: 1
    #   timeoutSeconds: 5

    moveToPublicDirectories: ""
    enablePgp: false
    encryptOutgoingData: false

    #Pod security context
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000

    #Container security context
    securityContext:
      allowPrivilegeEscalation: false
      runAsNonRoot: true

    # Enable/disable archiving feature.
    archivingEnabled: false
    # Comma separated list of folders to be archived. Extension to the default list.
    archivingDirectories: ""
    # This will add such folders into the archive folder list:
    #   landing/acquisition{{ orgUnitCode }}/waiting
    #   landing/acquisition/waiting
    archiveAcquisitionWaitingDirectories: true
    # This will add such folders into the archive folder list (example):
    #   landing/listImport/UN List@XML-list'
    #   landing/listImport/UN Country List@default'
    #   (...)
    archiveListImportDirectories: true
    # This will add such folder into the archive folder list:
    #   landing/fpfa
    archiveFpfaDirectory: true
    # This will add such folder into the archive folder list:
    #   landing/worldcheck
    archiveWorldcheckDirectory: true
    # This will add such folders into the archive folder list:
    #   landing/batchwatch/SWIFT@SWIFT'
    #   landing/batchwatch/Subject@GSV'
    #   landing/batchwatch/SWIFT@SWIFT_FLTS'
    #   landing/batchwatch/GenericTransaction@SWIFT_FLTS_MX'
    archiveBatchwatchDirectories: true
    # this will add such folders into the archive folder list:
    #   landing/amlopt/data
    #   landing/amlopt{{ orgUnitCode }}/data
    archiveAmloptDataDirectories: true
    # PGP public key to be used for encrypting the archived files. It is required if nrodsftp.nrodsftp.archivingEnabled=true and nrodsftp.nrodsftp.archivingEnabled=true.
    archivingPgpPublicKey:
      secretName: "nrodsftp-archiving-pgp-key"
      secretKey: "public-key"
    # Number of seconds files archivek9sd files should be retained before being deleted.
    # Default value is 1 year (31536000 seconds).
    archivingRetentionPeeriodInSeconds: "31536000"
    # This environment variable defines the cron expression for the archiving cleanup polling frequency.
    # By default the job will run daily at midnight.
    archivingCleanupCronExpression: "0 0 * * *"

  redis:
    fullnameOverride: "redis"
    image:
      tag: 7.4.7-patched-debian-12-r0
    architecture: standalone

    master:
      resources:
        requests:
          memory: "1024Mi"
          cpu: "500m"
        limits:
          memory: "1500Mi"
          cpu: "1000m"
      persistence:
        ## @param master.persistence.enabled Enable persistence on Redis&reg; master nodes using Persistent Volume Claims
        ##
        enabled: false

    replica:
      resources:
        requests:
          memory: "1024Mi"
          cpu: "500m"
        limits:
          memory: "1500Mi"
          cpu: "1000m"
      ## Persistence Parameters
      ## ref: https://kubernetes.io/docs/user-guide/persistent-volumes/
      ##
      persistence:
        enabled: false

    auth:
      enabled: false
    commonConfiguration: |-
      appendonly no
      save ""

  global:
    PASSWORD: ""
    MINIO_INGRESS_HOST: "{{ .Release.Name }}-minio.local"
    MINIOUI_INGRESS_HOST: "{{ .Release.Name }}-minio-ui.local"
    SSL_SECRETS: "https-certs"





