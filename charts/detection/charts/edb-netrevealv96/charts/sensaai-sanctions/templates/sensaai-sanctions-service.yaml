---
apiVersion: v1
kind: Service
metadata:
  labels:
    service: {{ .Release.Name }}-sensaai-sanctions
    app: "{{ .Release.Name }}-sensaai-sanctions"
  name: {{ .Release.Name }}-sensaai-sanctions
  namespace: "{{ tpl .Values.namespace . }}"
spec:
  selector:
    app: "{{ .Release.Name }}-sensaai-sanctions-pod"
  type: ClusterIP
  ports:
    - name: https
      port: 443
      targetPort: https
