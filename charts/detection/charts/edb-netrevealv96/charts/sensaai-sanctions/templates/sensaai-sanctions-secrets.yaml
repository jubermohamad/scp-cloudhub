{{- if not (tpl .Values.userPasswordSecretName .) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-sensaai-users
  namespace: "{{ tpl .Values.namespace . }}"
  labels:
    app: {{ .Release.Name }}-sensaai-users
  annotations:
    reloader.stakater.com/match: "true"
type: Opaque
data:
  password.json: {{ include "generate.user.password" . | b64enc }}
{{- end }}
