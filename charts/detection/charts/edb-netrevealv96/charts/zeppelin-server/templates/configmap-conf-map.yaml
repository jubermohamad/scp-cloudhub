apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-zeppelin-server-conf-map
  namespace: {{ .Values.global.namespace }}
data:
  SERVICE_DOMAIN: {{ .Values.config.SERVICE_DOMAIN | quote }}
  ZEPPELIN_HOME: {{ .Values.config.ZEPPELIN_HOME | quote }}
  ZEPPELIN_SERVER_RPC_PORTRANGE: {{ .Values.config.ZEPPELIN_SERVER_RPC_PORTRANGE | quote }}
  SPARK_MASTER: {{ .Values.config.SPARK_MASTER | quote }}
  SPARK_HOME: {{ .Values.config.SPARK_HOME | quote }}
  ZEPPELIN_RUN_MODE: {{ .Values.config.ZEPPELIN_RUN_MODE | quote }}
  ZEPPELIN_K8S_NAMESPACE: {{ .Values.config.ZEPPELIN_K8S_NAMESPACE | quote }}