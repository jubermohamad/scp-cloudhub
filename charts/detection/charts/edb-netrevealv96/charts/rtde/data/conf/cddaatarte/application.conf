smart.output.skipSchema=true

smart.model.optimizations={{ .Values.solutionsParameters.cddaatarte.smart.model.optimizations }}

smart.dateFormat={{ .Values.solutionsParameters.cddaatarte.smart.dateFormat }}
smart.timestampFormat={{ .Values.solutionsParameters.cddaatarte.smart.timestampFormat }}

smart.domainCode=CDDAAT

smart.set.nested.records.generate.alert.flag.false=true

smart.outputDecorator.modelId={{ .Values.solutionsParameters.cddaatarte.smart.output.decoratorModelId }}
smart.outputDecorator.modelIdColumnName=ScenarioModelId

#Options are: File, Topic, DB
processingmodel.persistence.type={{ .Values.solutionsParameters.cddaatarte.processingmodel.persistence.type }}

#processingmodel.xmlFilePath is only relevant when processingmodel.persistence.type=File
#In Cluster mode config files should be directly in home, eg.
processingmodel.xmlFilePath=./conf/model/processingmodel.xml

processingmodel.score.combiner.concat.separator={{ .Values.solutionsParameters.cddaatarte.processingmodel.score.combiner.concat.separator | quote}}

processingconfig.xmlFilePath=./conf/Processing_config.xml
thresholdingconfig.xmlFilePath=./conf/ScoreThresholding_config.xml

processingmodel.refreshing.signalType={{ .Values.solutionsParameters.cddaatarte.processingmodel.refreshing.signalType }}
processingmodel.refreshing.topicSignal.topicName={{ .Values.solutionsParameters.cddaatarte.processingmodel.refreshing.topicSignal.topicName }}

# Extra cddaatarte configuration parameters
{{- if .Values.solutionsParameters.cddaatarte.applicationConf.extraParameters }}
{{ include "rtde.application.conf.extra.params" .Values.solutionsParameters.cddaatarte.applicationConf.extraParameters }}
{{- end }}
