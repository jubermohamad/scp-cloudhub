{{- $rootContext := . -}}
{{- range $solution := .Values.global.nrSparkSolutionSwitches.rtde }}

apiVersion: v1
kind: Secret
metadata:
  name: "{{ $.Release.Name }}-{{ $.Chart.Name }}-{{ $solution }}-secret-configs"
  namespace: {{ $.Values.global.namespace }}
type: Opaque

data:
  {{- range $path, $_ := $.Files.Glob (printf "data/conf/%s/**" $solution) }}
  {{- if or (hasSuffix "application.conf" $path) (hasSuffix "environment.conf" $path) }}
  {{ trimPrefix (printf "data/conf/%s/" $solution) $path  |  replace "/" "__" |  replace " " "--"}}: {{ tpl ($.Files.Get $path) $| b64enc | quote }}
  {{- end }}
  {{- end }}
---
{{- end }}
