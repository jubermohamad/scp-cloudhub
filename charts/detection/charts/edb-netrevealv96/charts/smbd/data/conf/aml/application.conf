#######################
##                   ##
## SMBD Properties   ##
##                   ##
#######################

#data source(s) location
smbd.datasource.config.location=${smbd.home}/conf
smbd.keystore.file=${smbd.home}/conf/norkom.nks

# Use command line parameters to build location depending on the parameter value e.g.  ${orgUnit}, it's optional.
# smbd.profile.output.location=${smbd.home}/profile_storage/${orgUnit}

{{- if .Values.global.nrOrgUnits }}
  {{- if ne (len .Values.global.nrOrgUnits) 0 }}
smbd.profile.output.location=${smbd.home}/profile_storage/${orgUnit}
  {{- else }}
smbd.profile.output.location=${smbd.home}/profile_storage
  {{- end }}
{{- else }}
smbd.profile.output.location=${smbd.home}/profile_storage
{{- end }}
smbd.profile.output.mode=parquet

smbd.lastDayOfWeek={{ .Values.solution.aml.applicationConf.lastDayOfWeek }}

#The date format of the datasource date field. This is also the format of the processing_date passed from the command line for profiling.
smbd.dateFormat=yyyyMMdd

#Detection persister type. Possible values: simulator, production, risk_score
smbd.detectionpersister.type=production

#Scenario state
smbd.scenariostate.active=ON
#Possible configurations: LOG, DB.
smbd.scenariostate.persister=DB

#set true, to add extra information (like processing date and domain) to Spark application name (true is default)
smbd.addExtraInfoToAppName=true

#[SMBD Processor setting] set true, to throw RuntimeException when any service throws an error (for onError = STOP or CONTINUE)
smbd.processor.throwGeneralErrorOnAllCaughtExceptions=true

#######################################
## Oracle jdbc datasource properties ##
#######################################

jdbc.driver="{{ .Values.jdbc.driver }}"
jdbc.url="{{- template "db.jdbc.url" . }}"
jdbc.userid="{{ .Values.jdbc.userid }}"
jdbc.passwd="{{ .Values.jdbc.passwd }}"
# Possible values plainText, encrypted, kerberos
jdbc.encryptionMethod="{{ .Values.jdbc.encryptionMethod }}"

# If you're using db encryption (jdbc.encryptionMethod="encrypted" or "encrypted2")
# then following password related settings should be uncommented
# and filled with relevant values in double quotes.
# ex. smbd.keystore.password = "a6l6c7h5e6m6ist"

smbd.keystore.filename="{{ .Values.keystore.filename }}"
smbd.keystore.password="{{ .Values.keystore.password }}"
smbd.key.password="{{ .Values.keystore.key_password }}"

# Possible values OFF, LOW, HIGH, ALL
smbd.trace.mode.level={{ .Values.solution.aml.applicationConf.traceModeLevel }}

# Specifies the format of the EVENT_DATE column in an Alert
smbd.timestampFormat=yyyyMMddHHmmss

# Alert-Saver Fingerprinting Properties
smbd.fingerprint.columns="EVENT_DATE,CHECK_NAME,ENTITY_NAME,VIEW_NAME,VIEW_ID,DATASOURCE_ID"
smbd.fingerprint.algorithm=MD5
#Possible values ON, OFF
smbd.fingerprint.legacyformat=OFF

#a pipe separated list of datasource(s) to run out of order alerting against for time-based detections
smbd.detection.oooalerting.timebased.datasources=Transaction|IETAlert

#If true, any numbers in alert info will be truncated to a maximum of 2 decimal places
smbd.detection.alert.info.truncate.numbers={{ .Values.solution.aml.applicationConf.detectionAlertInfoTruncateNumbers }}

#If true, the alert weight will be truncated to a maximum of 2 decimal places
smbd.detection.alert.weight.truncate={{ .Values.solution.aml.applicationConf.detectionAlertWeightTruncate }}

#Optional configuration of custom date formats for event date parameter in GetTotalSinceDate
#smbd.detection.functions.gettotalsincedate.supportExtraEventDateFormats=true|false (default is false)
#smbd.detection.functions.gettotalsincedate.extraEventDateFormatsSep=<separator string> (default is comma , )
#smbd.detection.functions.gettotalsincedate.extraEventDateFormats=<String of date formats, separated by extraEventDateFormatsSep, for example: "ddMMyyyy,yyyyMMdd,dd/MM/yyyy">

#Enables MEMBEROF function to determine if the feature of the current record was not in the previous n reme,bered time periods. (i.e. NOT(MEMBEROF()) true/false
#smbd.profile.field.memory.skipPresentDay=false

#################################################################
##The configuration for timebase detection for SIMULATOR_ALERT
#################################################################
#smbd.simulator_alert_table_timebase.mappings{
#  ORGUNIT_CODE: "segment_Organisation",
#  CUSTOMER_SEGMENT: "segment_Type"
#}

# PMML files and model location
processingmodel.learnermodel.file.location=${smbd.home}/conf/${domain}
processingmodel.learnermodel.pmml.location=${smbd.home}/conf/${domain}/pmml

# Show only the most relevant explanations
processingmodel.learnermodel.pmml.reasons.maxPositiveFeatures={{ .Values.solution.aml.applicationConf.processingmodel.learnermodelPmmlReasonsMaxPositiveFeatures }}
processingmodel.learnermodel.pmml.reasons.maxNegativeFeatures={{ .Values.solution.aml.applicationConf.processingmodel.learnermodelPmmlReasonsMaxNegativeFeatures }}
processingmodel.learnermodel.pmml.reasons.maxPositiveDistance={{ .Values.solution.aml.applicationConf.processingmodel.learnermodelPmmlReasonsMaxPositiveDistance }}
processingmodel.learnermodel.pmml.reasons.maxNegativeDistance={{ .Values.solution.aml.applicationConf.processingmodel.learnermodelPmmlReasonsMaxNegativeDistance }}

#Possible values: DB, FILE
processingmodel.learnermodel.persistenceType=DB

#Possible values: DB (default), FILE (reading form file produces empty list)
#smbd.exempt.lists.source=DB

#Possible values: DB (default), FILE (supported list file location is model base path)
#smbd.parameters.lists.source=DB

#Possible values: DB, FILE (default - supported list file location $SMBD_HOME/conf)
#smbd.info.lists.source=FILE

#Turns off the loading of defined list types. Default: ""
#smbd.info.lists.skip.type="Info list, Blacklist"

#Turns off the loading of defined list names. Default: ""
#smbd.info.lists.skip.name="TransactionTypeList"

#Turns on the feature in the tagging to load only transactions that contributes to the detection in the SMBD detections (true/false)
#smbd.features.tagging.limit.datasource.byDetections=false

# Possible values OFF(default), ALL, EXCLUDEDATASOURCE
#smbd.configration.dumping=ALL

# Turns on the floating segmentation feature. Possible values false(default), true
#smbd.floatingSegmentation=false

#scriptrunner service script location details
#smbd.script.runner.shellcmd=bash
#smbd.script.runner.scriptpath=${smbd.home}/bin/
#smbd.script.runner.scriptfilename=run_compound_profiles_druid_loader.sh
#smbd.script.runner.parametername.processingdate=-processingDate
#######################
## AML Properties    ##
#######################

smbd.detectionpersister.readytooutput=true

smbd.info.lists.source=DB

# AML Opt Alert-Saver Fingerprinting Properties

smbd.process.log.filepath=${smbd.home}/logs/smbd
processingconfig.xmlFilePath=${smbd.home}/conf/processing-config.xml

# AML IET Dataset Generator Properties
smbd.datasetgenerator.outputDots=true

# Defines the output location for raw detection parquet files
smbd.rawdetection.output.location=${smbd.home}/rawDir/rawDetectionLocation
#######################
## AML Properties    ##
#######################

# If you're using db encryption (jdbc.encryptionMethod="encrypted" or "encrypted2")
# then following password related settings should be uncommented
# and filled with relevant values in double quotes.
# ex. smbd.keystore.password = "a6l6c7h5e6m6ist"

# AML Opt Alert-Saver Fingerprinting Properties

# load only transactions that contributes to the detection in the SMBD detections
smbd.features.tagging.limit.datasource.byDetections=true

# Extra AML SMBD configuration parameters
{{- if .Values.solution.aml.applicationConf.extraParameters }}
{{ include "smbd.application.conf.extra.params" .Values.solution.aml.applicationConf.extraParameters }}
{{- end }}
