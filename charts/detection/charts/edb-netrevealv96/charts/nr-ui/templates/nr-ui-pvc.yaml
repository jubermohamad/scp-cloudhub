{{- if (or (eq .Values.global.clusterType "nfs") (eq .Values.global.clusterType "minikube")) }}

{{ $currentScope := .}}

{{- range $i, $e := until (.Values.pod.replicas | int) }}
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ $.Release.Name }}-ui-logs-{{ $i }}
  labels:
    resource/type: pv
    {{- with $currentScope }}
    {{- include "common.helm.metadata.labels" . | indent 4 }}
    {{- end }}
  namespace: {{ $.Values.global.namespace }}
spec:
  {{- with $currentScope }}
  storageClassName: {{ include "storage.storageClassName" . }}
  {{- end }}
  capacity:
    {{- with $currentScope }}
    storage: {{ include "nrUi.pvcApplicationLogsStorage" . }}
    {{- end }}
  accessModes:
    - ReadWriteOnce
  claimRef:
    namespace: {{ $.Values.global.namespace }}
    kind: PersistentVolumeClaim
    {{- with $currentScope }}
    {{- $stsName := include "generate.name.with.release.name" (list $ . "nr-ui") }}
    name: {{ include "generate.name.with.release.name" (list $ . (printf "%s-%s-%d" "ui-logs" $stsName $i)) | quote }}
    {{- end }}
  {{- if eq $.Values.global.clusterType "minikube" }}
  hostPath:
    path: {{ $.Values.pv.hostPathMinikube }}/{{ $.Release.Name }}-{{ $.Values.global.namespace }}/nr-ui-{{ $i }}/logs
  {{- else }}
  nfs:
    server: {{ $.Values.global.pv.host }}
    path: {{ $.Values.pv.hostPath }}/{{ $.Release.Name }}-{{ $.Values.global.namespace }}/nr-ui-{{ $i }}/logs
  {{- end }}
{{- end }}

