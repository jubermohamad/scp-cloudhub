apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: "{{ .Release.Name }}-aap-application-config"
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "common.helm.metadata.labels" . | nindent 4 }}
data:
  application.json: |-
    {{ tpl (.Files.Get "data/conf/application.json") .| b64enc }}
