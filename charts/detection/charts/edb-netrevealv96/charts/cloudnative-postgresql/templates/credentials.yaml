---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credential-apps-user-cnpg
  namespace: {{ .Values.global.namespace }}
  annotations:
    # This is what defines this resource as a hook. Without this line, the job is considered part of the release.
    "helm.sh/hook": pre-install, pre-upgrade, post-upgrade
    "helm.sh/hook-weight": "-9"
    "helm.sh/hook-delete-policy": before-hook-creation
type: kubernetes.io/basic-auth
stringData:
  password: "{{ .Values.global.baseConfigProperties.clusterdb.AppPassword }}"
  pgpass: "{{ .Values.global.baseConfigProperties.clusterdb.AppPassword }}"
  username: apps
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credential-postgres-user-cnpg
  namespace: {{ .Values.global.namespace }}
type: kubernetes.io/basic-auth
stringData:
  password: "{{ .Values.global.baseConfigProperties.clusterdb.PostgresPassword }}"
  pgpass: "{{ .Values.global.baseConfigProperties.clusterdb.PostgresPassword }}"
  username: postgres
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credential-aapsparkuser-user-cnpg
  namespace: {{ .Values.global.namespace }}
type: kubernetes.io/basic-auth
stringData:
  password: "{{ .Values.global.baseConfigProperties.clusterdb.AapsparkuserPassword }}"
  pgpass: "{{ .Values.global.baseConfigProperties.clusterdb.AapsparkuserPassword }}"
  username: aapsparkuser
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credential-appskeycloak-user-cnpg
  namespace: {{ .Values.global.namespace }}
type: kubernetes.io/basic-auth
stringData:
  password: "{{ .Values.global.baseConfigProperties.clusterdb.KeycloakPassword }}"
  pgpass: "{{ .Values.global.baseConfigProperties.clusterdb.KeycloakPassword }}"
  username: appskeycloak
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credential-entres-user-cnpg
  namespace: {{ .Values.global.namespace }}
type: kubernetes.io/basic-auth
stringData:
  password: "{{ .Values.global.baseConfigProperties.clusterdb.EntresPassword }}"
  pgpass: "{{ .Values.global.baseConfigProperties.clusterdb.EntresPassword }}"
  username: entres
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credential-apps-import-user-cnpg
  namespace: {{ .Values.global.namespace }}
type: kubernetes.io/basic-auth
stringData:
  password: "{{ .Values.global.baseConfigProperties.clusterdb.nrImportUserPassword | default .Values.global.baseConfigProperties.clusterdb.AppPassword }}"
  pgpass: "{{ .Values.global.baseConfigProperties.clusterdb.nrImportUserPassword | default .Values.global.baseConfigProperties.clusterdb.AppPassword }}"
  username: apps_import
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credential-users-sql
  namespace: {{ .Values.global.namespace }}
type: Opaque
data:
  aap_role_and_schema.sql: {{ tpl (.Files.Get "sql/aap_role_and_schema.sql") . | b64enc }}
  apps_schema.sql: {{ tpl (.Files.Get "sql/apps_schema.sql") . | b64enc }}
  apps_import_schema.sql: {{ tpl (.Files.Get "sql/apps_import_schema.sql") . | b64enc }}
  appskeycloak_role_and_schema.sql: {{ tpl (.Files.Get "sql/appskeycloak_role_and_schema.sql") . | b64enc }}
