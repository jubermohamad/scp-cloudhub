            claimName: {{ include "generate.name.with.release.name" (list $ . "wlm-indexes-claim") | quote }}
        - name: {{ .Release.Name }}-wlm-pn-rt-server-conf-log-prop
          secret:
            secretName: {{ .Release.Name }}-wlm-pn-rt-logging-property
            items:
            - key: logging.properties
              path: logging.properties
        {{- include "wlm.pn.rt.log4j2.volume" . | indent 8 }}
        - name: {{ .Release.Name }}-wlm-pn-rt-import-base-config-property
          configMap:
            name: {{ .Release.Name }}-wlm-pn-rt-import-base-config-property
            items:
            - key: base_config.properties
              path: base_config.properties
        - name: "{{ .Release.Name }}-wlm-pn-rt-token-script"
          configMap:
            name: "{{ .Release.Name }}-wlm-pn-rt-token-script"
            defaultMode: 488
        - name: {{ .Release.Name }}-nr-ui-server-jks
          secret:
            secretName: {{ .Release.Name }}-cert-nr-ui
            items:
            - key: keystore.p12
              path: nr-ui.jks
        - name: {{ .Release.Name }}-wlm-pn-rt-server-jks
          secret:
            secretName: {{ .Release.Name }}-cert-wlm-pn-rt
            items:
            - key: keystore.p12
              path: wlm-pn-rt.jks
        - name: {{ .Release.Name }}-wlm-merged-keystore
          emptyDir: {}
        - name:  {{ .Release.Name }}-wlm-pn-rt-merged-config
          emptyDir: {}
        - name: {{ .Release.Name }}-wlm-pn-rt-base-config
          configMap:
            name: {{ .Release.Name }}-wlm-pn-rt-base-config-property
            items:
            - key: base_config.properties
              path: base_config.properties
      restartPolicy: Always
