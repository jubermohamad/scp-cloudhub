apiVersion: v1
kind: Service
metadata:
  labels:
    service: {{ .Release.Name }}-wlm-pn-rt
    app: {{ .Release.Name }}-wlm-pn-rt
  name: {{ .Release.Name }}-wlm-pn-rt
  namespace: {{ .Values.global.namespace }}
spec:
  selector:
    app: {{ .Release.Name }}-wlm-pn-rt-instance-pod
  type: ClusterIP
  ports:
    - name: ui-port
      port: 8443
      targetPort: 8443
# http://localhost:<metrics-port>/metrics
    - name: metrics-port
      port: 9990
      targetPort: 9990

{{- if .Values.global.kubePrometheusStackPresent }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ .Release.Name }}-wlm-pn-rt-monitor
  labels:
    release: {{ .Values.global.prometheus.release }}
  namespace: {{ .Values.global.namespace }}
spec:
  selector:
   matchLabels:
      app: {{ .Release.Name }}-wlm-pn-rt
  namespaceSelector:
    matchNames:
    - {{ .Values.global.namespace }}
  endpoints:
  - port: metrics-port
    interval: 1s
{{- end }}
