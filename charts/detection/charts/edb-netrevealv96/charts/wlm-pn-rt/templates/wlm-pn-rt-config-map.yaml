---
apiVersion: v1
kind: ConfigMap
metadata:
  name: "{{ .Release.Name }}-wlm-pn-rt-log4j2"
  namespace: {{ .Values.global.namespace }}
  labels:
    app: "{{ .Release.Name }}-wlm-pn-rt-log4j2"
data:
  log4j2.xml: |
{{- include "log4j2.xml" . | indent 4 }}

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: "{{ .Release.Name }}-wlm-pn-rt-token-script"
  namespace: {{ .Values.global.namespace }}
  labels:
    app: "{{ .Release.Name }}-wlm-pn-rt-token-script"
    {{- include "common.helm.metadata.labels" . | indent 4 }}
data:
  tokenGen.sh: |
    #!/bin/bash

    #set -eu -o pipefail

    TOKEN_USER=""
    TOKEN_PASS=""
    TOKEN_AUTHENTICATION_ID=""
    TMP_TOKEN_PASS=""
    # "true" to enable debug mode
    DEBUG="false"

    # Wildfly
    readonly WILDFLY_HOME=/opt/wildfly
    readonly WILDFLY_BASE_DIR=${WILDFLY_HOME}/netreveal

    readonly HSQLDB_HOME=/opt/netreveal/uiHome/hsqldb
    readonly HSQLDB_CONFIG_FILE=${HSQLDB_HOME}/hsqldb.properties

    readonly WLM_PN_RT_TOKEN_DIR=/opt/WLM/wlm-pn-rt-token
    WLM_PN_RT_TOKEN_FILE=${WLM_PN_RT_TOKEN_DIR}/${TOKEN_USER}_wlm-pn-rt-token.properties

    readonly WLM_PN_RT_IMPORT_TOKEN_BLOB_FILE=wlm-pn-rt-token.blob
    WLM_PN_RT_EXPORT_TOKEN_BLOB_FILE=${WLM_PN_RT_TOKEN_DIR}/${WLM_PN_RT_IMPORT_TOKEN_BLOB_FILE}
    WLM_PN_RT_TOKEN_EXPORT_SQL_FILE=${WLM_PN_RT_TOKEN_DIR}/${TOKEN_USER}_wlm-pn-rt-export-token-blob.sql

    readonly WLM_PN_RT_IMPORT_AUTHENTICATION_BLOB_FILE=wlm-pn-rt-authentication.blob
    WLM_PN_RT_EXPORT_AUTHENTICATION_BLOB_FILE=${WLM_PN_RT_TOKEN_DIR}/${WLM_PN_RT_IMPORT_AUTHENTICATION_BLOB_FILE}
    WLM_PN_RT_AUTHENTICATION_EXPORT_SQL_FILE=${WLM_PN_RT_TOKEN_DIR}/${TOKEN_USER}_wlm-pn-rt-export-authentication-blob.sql


    function _getCurrentTimestamp() {
        local TIMESTAMP=`date "+%Y-%m-%d %H:%M:%S"`

        echo ${TIMESTAMP}
    }

    function _log() {
        local echoLevel=${1}
        local echoMessage=${2}
        local currentTime=$(_getCurrentTimestamp)

        echo -e "${echoLevel}:\t${currentTime}:\t${echoMessage}"
    }

    function _runSQL() {
      local sql=${1}
      local _result=${2}

      if [ ! -f ${HSQLDB_CONFIG_FILE} ]; then
        _log "INFO" "Creating file: ${HSQLDB_CONFIG_FILE}"
        echo "org.hsqldb.persist = WARNING" > ${HSQLDB_CONFIG_FILE}
        echo "" >> ${HSQLDB_CONFIG_FILE}
      fi

      if [ "${DEBUG}" == "true" ]; then
        _log "DEBUG" "Running SQL: ${sql}"
      fi
      local sqlOut=$(${JAVA_HOME}/bin/java -Djava.util.logging.config.file=${HSQLDB_CONFIG_FILE} -cp /opt/tools/hsqldb/sqltool.jar org.hsqldb.cmdline.SqlTool --autoCommit --inlineRC=url=jdbc:hsqldb:${HSQLDB_HOME}/data/mydb\;hsqldb.lock_file=true,user=sa,password= --sql="${sql}" | xargs)

      eval $_result="'${sqlOut}'"
    }

    function _initTokenVars() {
      _log "INFO" "Reading token user..."
      local sql="SELECT VALUE FROM SYSTEM_PARAMETERS WHERE PARAMETER_KEY = 'services.manager.external.security.username';"
      _runSQL "${sql}" result
      TOKEN_USER=${result}
      if [ "${DEBUG}" == "true" ]; then
        _log "DEBUG" "Token user: ${TOKEN_USER}"
      fi

      _log "INFO" "Reading token password..."
      sql="SELECT VALUE FROM SYSTEM_PARAMETERS WHERE PARAMETER_KEY = 'services.manager.external.security.token';"
      _runSQL "${sql}" result
      TOKEN_PASS=${result}
      if [ "${DEBUG}" == "true" ]; then
        _log "DEBUG" "Token password: ${TOKEN_PASS}"
      fi

      WLM_PN_RT_TOKEN_FILE=${WLM_PN_RT_TOKEN_DIR}/${TOKEN_USER}_wlm-pn-rt-token.properties
      WLM_PN_RT_EXPORT_TOKEN_BLOB_FILE=${WLM_PN_RT_TOKEN_DIR}/${TOKEN_USER}_${WLM_PN_RT_IMPORT_TOKEN_BLOB_FILE}
      WLM_PN_RT_TOKEN_EXPORT_SQL_FILE=${WLM_PN_RT_TOKEN_DIR}/${TOKEN_USER}_wlm-pn-rt-export-token-blob.sql
      WLM_PN_RT_EXPORT_AUTHENTICATION_BLOB_FILE=${WLM_PN_RT_TOKEN_DIR}/${TOKEN_USER}_${WLM_PN_RT_IMPORT_AUTHENTICATION_BLOB_FILE}
      WLM_PN_RT_AUTHENTICATION_EXPORT_SQL_FILE=${WLM_PN_RT_TOKEN_DIR}/${TOKEN_USER}_wlm-pn-rt-export-authentication-blob.sql
    }

    function _updateRestPass() {
      local charset='A-Za-z0-9'
      local length=10
      local tmpRestPass=$(head /dev/urandom | tr -dc "$charset" | head -c "$length")
      local sql="UPDATE SYSTEM_PARAMETERS SET VALUE = '${tmpRestPass}' WHERE PARAMETER_KEY = 'services.manager.external.security.token';"
      _runSQL "${sql}" result

      sql="SELECT VALUE FROM SYSTEM_PARAMETERS WHERE PARAMETER_KEY = 'services.manager.external.security.token';"
      _runSQL "${sql}" result
      TMP_TOKEN_PASS=${result}
      if [ "${DEBUG}" == "true" ]; then
        _log "DEBUG" "Rest pass updated: ${TMP_TOKEN_PASS}"
      fi
    }

    function _restoreRestPass() {
      local sql="UPDATE SYSTEM_PARAMETERS SET VALUE = '${TOKEN_PASS}' WHERE PARAMETER_KEY = 'services.manager.external.security.token';"
      _runSQL "${sql}" result
      if [ "${DEBUG}" == "true" ]; then
        sql="SELECT VALUE FROM SYSTEM_PARAMETERS WHERE PARAMETER_KEY = 'services.manager.external.security.token';"
        _runSQL "${sql}" result
        _log "DEBUG" "Rest pass restored: ${result}"
      fi
    }

    function _startWildfly() {
      _log "INFO" "Starting Wildfly Server..."
      ${WILDFLY_BASE_DIR}/startApplication.sh >>/dev/null &
      #Wait for CLI Start up
      local count=120
      local initialised=N
      while [ $count -ge 1 ];
      do
        if ${WILDFLY_HOME}/bin/jboss-cli.sh --controller=localhost:9990 -c --command=" :read-attribute(name=server-state) " | grep success
        then
          _log "INFO" "Wildfly server up..."
          initialised=Y
          break
        else
          count=`expr $count - 1`
          _log "INFO" "Waiting for Wildfly start up. count=${count}"
          sleep 10s
        fi
      done
      if [ ! "${initialised}" == "Y" ];
      then
        _log "ERROR" "Wildfly has not been initialised on time... Exiting..."
        exit 1
      fi
    }

    function _generateToken() {
      _log "INFO" "Generating token..."
      local tokenResponse=$(curl -k --ciphers DEFAULT@SECLEVEL=1 --user ${TOKEN_USER}:${TMP_TOKEN_PASS} -X POST "https://localhost:8443/netreveal/rest-external/oauth/token?grant_type=client_credentials")
      if [ "${DEBUG}" == "true" ]; then
        _log "DEBUG" "Token response: ${tokenResponse}"
      fi
    }

    function _stopWildfly() {
      _log "INFO" "Stopping Wildfly Server..."
      ${WILDFLY_HOME}/bin/jboss-cli.sh -c --commands=":shutdown"
    }

    function _exportToken() {
      if [ ! -d ${WLM_PN_RT_TOKEN_DIR} ]; then
        _log "INFO" "Creating directory: ${WLM_PN_RT_TOKEN_DIR}"
        mkdir -p ${WLM_PN_RT_TOKEN_DIR}
      fi

      _log "INFO" "Exporting token..."

      #TOKEN_ID
      sql="SELECT CONCAT('TOKEN_ID=', TOKEN_ID, CHAR(10)) FROM OAUTH_ACCESS_TOKEN;"
      _runSQL "${sql}" result
      if [ "${DEBUG}" == "true" ]; then
        _log "DEBUG" "Token ID: ${result}"
      fi
      echo "${result}" > ${WLM_PN_RT_TOKEN_FILE}

      sql="SELECT CONCAT('TOKEN=', RAWTOHEX(TOKEN), CHAR(10)) FROM OAUTH_ACCESS_TOKEN;"
      _runSQL "${sql}" result
      if [ "${DEBUG}" == "true" ]; then
        _log "DEBUG" "Token: ${result}"
      fi
      echo "${result}" >> ${WLM_PN_RT_TOKEN_FILE}

      sql="SELECT CONCAT('AUTHENTICATION_ID=', AUTHENTICATION_ID, CHAR(10)) FROM OAUTH_ACCESS_TOKEN;"
      _runSQL "${sql}" result
      if [ "${DEBUG}" == "true" ]; then
        _log "DEBUG" "Authentication ID: ${result}"
      fi
      echo "${result}" >> ${WLM_PN_RT_TOKEN_FILE}

      sql="SELECT CONCAT('USER_NAME=', USER_NAME, CHAR(10)) FROM OAUTH_ACCESS_TOKEN;"
      _runSQL "${sql}" result
      if [ "${DEBUG}" == "true" ]; then
        _log "DEBUG" "User Name: ${result}"
      fi
      if [ "${result}" == "[null]" ]; then
        echo "USER_NAME=null" >> ${WLM_PN_RT_TOKEN_FILE}
      else
        echo "${result}" >> ${WLM_PN_RT_TOKEN_FILE}
      fi

      sql="SELECT CONCAT('CLIENT_ID=', CLIENT_ID, CHAR(10)) FROM OAUTH_ACCESS_TOKEN;"
      _runSQL "${sql}" result
      if [ "${DEBUG}" == "true" ]; then
        _log "DEBUG" "Client ID: ${result}"
      fi
      echo "${result}" >> ${WLM_PN_RT_TOKEN_FILE}

      sql="select CONCAT('AUTHENTICATION=', RAWTOHEX(AUTHENTICATION), CHAR(10)) from OAUTH_ACCESS_TOKEN;"
      _runSQL "${sql}" result
      if [ "${DEBUG}" == "true" ]; then
        _log "DEBUG" "Authentication: ${result}"
      fi
      echo "${result}" >> ${WLM_PN_RT_TOKEN_FILE}

      sql="SELECT CONCAT('REFRESH_TOKEN=', REFRESH_TOKEN, CHAR(10)) FROM OAUTH_ACCESS_TOKEN;"
      _runSQL "${sql}" result
      if [ "${DEBUG}" == "true" ]; then
        _log "DEBUG" "Refresh Token: ${result}"
      fi
      if [ "${result}" == "[null]" ]; then
        echo "REFRESH_TOKEN=null" >> ${WLM_PN_RT_TOKEN_FILE}
      else
        echo "${result}" >> ${WLM_PN_RT_TOKEN_FILE}
      fi

      _log "INFO" "Export BLOB data..."
      if [ -f ${WLM_PN_RT_EXPORT_TOKEN_BLOB_FILE} ]; then
        rm -f ${WLM_PN_RT_EXPORT_TOKEN_BLOB_FILE}
      fi
      if [ ! -f ${WLM_PN_RT_TOKEN_EXPORT_SQL_FILE} ]; then
        _log "INFO" "Create export SQL file: ${WLM_PN_RT_TOKEN_EXPORT_SQL_FILE}"
        echo "SELECT TOKEN FROM OAUTH_ACCESS_TOKEN;" > ${WLM_PN_RT_TOKEN_EXPORT_SQL_FILE}
        echo "\bd ${WLM_PN_RT_EXPORT_TOKEN_BLOB_FILE}" >> ${WLM_PN_RT_TOKEN_EXPORT_SQL_FILE}
        echo "" >> ${WLM_PN_RT_TOKEN_EXPORT_SQL_FILE}
        if [ "${DEBUG}" == "true" ]; then
          _log "DEBUG" cat ${WLM_PN_RT_TOKEN_EXPORT_SQL_FILE}
        fi
      fi
      ${JAVA_HOME}/bin/java -Djava.util.logging.config.file=${HSQLDB_CONFIG_FILE} -cp /opt/tools/hsqldb/sqltool.jar org.hsqldb.cmdline.SqlTool --autoCommit --inlineRC=url=jdbc:hsqldb:${HSQLDB_HOME}/data/mydb\;hsqldb.lock_file=true,user=sa,password= < ${WLM_PN_RT_TOKEN_EXPORT_SQL_FILE}

      if [ -f ${WLM_PN_RT_EXPORT_AUTHENTICATION_BLOB_FILE} ]; then
        rm -f ${WLM_PN_RT_EXPORT_AUTHENTICATION_BLOB_FILE}
      fi
      if [ ! -f ${WLM_PN_RT_AUTHENTICATION_EXPORT_SQL_FILE} ]; then
        _log "INFO" "Create export SQL file: ${WLM_PN_RT_AUTHENTICATION_EXPORT_SQL_FILE}"
        echo "SELECT AUTHENTICATION FROM OAUTH_ACCESS_TOKEN;" > ${WLM_PN_RT_AUTHENTICATION_EXPORT_SQL_FILE}
        echo "\bd ${WLM_PN_RT_EXPORT_AUTHENTICATION_BLOB_FILE}" >> ${WLM_PN_RT_AUTHENTICATION_EXPORT_SQL_FILE}
        echo "" >> ${WLM_PN_RT_AUTHENTICATION_EXPORT_SQL_FILE}
        if [ "${DEBUG}" == "true" ]; then
          _log "DEBUG" cat ${WLM_PN_RT_AUTHENTICATION_EXPORT_SQL_FILE}
        fi
      fi
      ${JAVA_HOME}/bin/java -Djava.util.logging.config.file=${HSQLDB_CONFIG_FILE} -cp /opt/tools/hsqldb/sqltool.jar org.hsqldb.cmdline.SqlTool --autoCommit --inlineRC=url=jdbc:hsqldb:${HSQLDB_HOME}/data/mydb\;hsqldb.lock_file=true,user=sa,password= < ${WLM_PN_RT_AUTHENTICATION_EXPORT_SQL_FILE}
    }

    function _updateTokenInDB() {
      local tokenID=${1}
      local authenticationID=${2}
      local userName=${3}
      local clientID=${4}
      local refreshToken=${5}

      _log "INFO" "Update token in DB..."

      local sql="INSERT INTO OAUTH_ACCESS_TOKEN (TOKEN_ID, TOKEN, AUTHENTICATION_ID, USER_NAME, CLIENT_ID, AUTHENTICATION, REFRESH_TOKEN) VALUES ("

      sql="${sql}'${tokenID}',"

      if [ -f ${WLM_PN_RT_EXPORT_TOKEN_BLOB_FILE} ]; then
        cp -f ${WLM_PN_RT_EXPORT_TOKEN_BLOB_FILE} ${HSQLDB_HOME}/data/${WLM_PN_RT_IMPORT_TOKEN_BLOB_FILE}
        sql="${sql} LOAD_FILE('${WLM_PN_RT_IMPORT_TOKEN_BLOB_FILE}'),"
      else
        _log "ERROR" "TOKEN BLOB file not found: ${WLM_PN_RT_EXPORT_TOKEN_BLOB_FILE}. Reverse the token update in DB."
        exit 1
      fi

      sql="${sql} '${authenticationID}',"
      if [ "${userName}" == "null" ]; then
        sql="${sql} NULL,"
      else
        sql="${sql} '${userName}',"
      fi
      sql="${sql} '${clientID}',"

      if [ -f ${WLM_PN_RT_EXPORT_AUTHENTICATION_BLOB_FILE} ]; then
        cp -f ${WLM_PN_RT_EXPORT_AUTHENTICATION_BLOB_FILE} ${HSQLDB_HOME}/data/${WLM_PN_RT_IMPORT_AUTHENTICATION_BLOB_FILE}
        sql="${sql} LOAD_FILE('${WLM_PN_RT_IMPORT_AUTHENTICATION_BLOB_FILE}'),"
      else
        _log "ERROR" "AUTHENTICATION BLOB file not found: ${WLM_PN_RT_EXPORT_AUTHENTICATION_BLOB_FILE}. Reverse the token update in DB."
        exit 1
      fi

      if [ "${refreshToken}" == "null" ]; then
        sql="${sql} NULL);"
      else
        sql="${sql} '${refreshToken}');"
      fi

      _runSQL "${sql}" result
      if [ "${DEBUG}" == "true" ]; then
        _log "DEBUG" "Token updated in DB: ${result}"
      fi
      echo ""

      rm ${HSQLDB_HOME}/data/${WLM_PN_RT_IMPORT_TOKEN_BLOB_FILE} ${HSQLDB_HOME}/data/${WLM_PN_RT_IMPORT_AUTHENTICATION_BLOB_FILE}
    }

    function _createTokenFromFile() {
      _log "INFO" "Read token file..."
      while IFS= read -r line
      do
        if [ "${DEBUG}" == "true" ]; then
          _log "DEBUG" "Line: ${line}"
        fi
        if [[ ${line} == TOKEN_ID=* ]]; then
          local TOKEN_ID=${line#TOKEN_ID=}
          if [ "${DEBUG}" == "true" ]; then
            _log "DEBUG" "TOKEN_ID: ${TOKEN_ID}"
          fi
        elif [[ ${line} == AUTHENTICATION_ID=* ]]; then
          local AUTHENTICATION_ID=${line#AUTHENTICATION_ID=}
          if [ "${DEBUG}" == "true" ]; then
            _log "DEBUG" "AUTHENTICATION_ID: ${AUTHENTICATION_ID}"
          fi
        elif [[ ${line} == USER_NAME=* ]]; then
          local USER_NAME=${line#USER_NAME=}
          if [ "${DEBUG}" == "true" ]; then
            _log "DEBUG" "USER_NAME: ${USER_NAME}"
          fi
        elif [[ ${line} == CLIENT_ID=* ]]; then
          local CLIENT_ID=${line#CLIENT_ID=}
          if [ "${DEBUG}" == "true" ]; then
            _log "DEBUG" "CLIENT_ID: ${CLIENT_ID}"
          fi
        elif [[ ${line} == REFRESH_TOKEN=* ]]; then
          local REFRESH_TOKEN=${line#REFRESH_TOKEN=}
          if [ "${DEBUG}" == "true" ]; then
            _log "DEBUG" "REFRESH_TOKEN: ${REFRESH_TOKEN}"
          fi
        fi
      done < ${WLM_PN_RT_TOKEN_FILE}

      _updateTokenInDB "${TOKEN_ID}" "${AUTHENTICATION_ID}" "${USER_NAME}" "${CLIENT_ID}" "${REFRESH_TOKEN}"
    }

    function _validateToken() {
      _log "INFO" "Validating token..."

      sql="SELECT AUTHENTICATION_ID FROM OAUTH_ACCESS_TOKEN WHERE CLIENT_ID = '${TOKEN_USER}';"
      _runSQL "${sql}" result
      if [ "${DEBUG}" == "true" ]; then
        _log "DEBUG" "Authentication ID: ${result}"
      fi

      tokenAuthenticationID=$(grep AUTHENTICATION_ID ${WLM_PN_RT_TOKEN_FILE} | cut -d'=' -f2)
      if [ "${DEBUG}" == "true" ]; then
        _log "DEBUG" "Token Authentication ID: ${tokenAuthenticationID}"
      fi

      if [ "${result}" == "${tokenAuthenticationID}" ]; then
        _log "INFO" "Token is valid."
      else
        _log "INFO" "Token is invalid. Updating token..."
        sql="DELETE FROM OAUTH_ACCESS_TOKEN WHERE CLIENT_ID = '${TOKEN_USER}';"
        _runSQL "${sql}" result
        if [ "${DEBUG}" == "true" ]; then
          _log "DEBUG" "Token deleted: ${result}"
        fi
        _createTokenFromFile
      fi
    }

    #####################################################################################
    # Main
    #####################################################################################
    _log "INFO" "Initializing token generation."
    _initTokenVars

    _log "INFO" "Get number of token records."
    sql="SELECT COUNT(*) FROM OAUTH_ACCESS_TOKEN WHERE CLIENT_ID = '${TOKEN_USER}';"
    _runSQL "${sql}" result
    tokenCount=${result}
    if [ "${DEBUG}" == "true" ]; then
      _log "DEBUG" "Token count: ${tokenCount}"
    fi

    if [ "x${TOKEN_USER}" == "x" ]; then
      _log "WARN" "Rest user not found. Skipping token creation."
    else
      if [ "${tokenCount}" == "0" ]; then
        _log "INFO" "Rest user found. Generating token."
        if [ -f ${WLM_PN_RT_TOKEN_FILE} ]; then
          _log "INFO" "Token file found. Use file to set up the token."
          _createTokenFromFile
        else
          _log "INFO" "Token file not found. Generating token."
          _updateRestPass
          _startWildfly
          _generateToken
          _stopWildfly
          _restoreRestPass
          _exportToken
        fi
      else
        _log "INFO" "Token records found."
        _validateToken
      fi
    fi

    _log "INFO" "Token generation completed."
