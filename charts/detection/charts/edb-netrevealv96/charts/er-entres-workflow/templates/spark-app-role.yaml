apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-spark-app-role
  namespace: {{ include "er.namespace" . }}
  labels:
    rbac.authorization.kubeflow.org/aggregate-to-kubeflow-edit: "true"
rules:
  - apiGroups:
      - sparkoperator.k8s.io
      - argoproj.io
    resources:
      - sparkapplications
      - cronworkflows
    verbs:
      - '*'
