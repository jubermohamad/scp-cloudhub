apiVersion: v2
name: netrevealv96
appVersion: "9.6.0.0"
description: CloudHub-vendored NetReveal chart (netrevealv96, platform 9.6.0.0). Vendored from SymphonySensa/helm nrod/netreveal - no SymphonyFS/scripts dependency.
version: 1.0.23
type: application
dependencies:
  - name: opensearch
    version: 2.19.0
    repository: https://opensearch-project.github.io/helm-charts
    condition: global.nrSubChartSwitches.enableOpenSearch
  - name: opensearch-extras
    version: 2.19.0
    repository: file://./charts/opensearch-extras
  - name: cluster-issuer
    version: "1.0.0"
    repository: file://./charts/cluster-issuer
  - name: network-policies
    version: "1.0.6"
    repository: file://./charts/network-policies
    condition: global.nrSubChartSwitches.enableNetworkPolicies
  - name: nr-dpa
    version: "1.0.5"
    repository: file://./charts/nr-dpa
    condition: global.nrSubChartSwitches.enableDpa
  - name: spark-operator
    version: "1.3.2"
    repository: "https://kubeflow.github.io/spark-operator"
    condition: global.nrSubChartSwitches.enableSparkOperator
  - name: kube-prometheus-stack
    version: "51.3.0"
    repository: "https://prometheus-community.github.io/helm-charts"
    condition: global.kubePrometheusStackPresent
  - name: kafka-ui
    version: 0.7.6
    repository: https://provectus.github.io/kafka-ui-charts
    condition: global.nrSubChartSwitches.enableKafkaUI
  - name: wlm-igs-sa
    version: "1.0.15"
    repository: file://./charts/wlm-igs-sa
    condition: global.nrSubChartSwitches.enableWlm
  - name: wlm-pn-rt
    version: "1.0.18"
    repository: file://./charts/wlm-pn-rt
    condition: global.nrSubChartSwitches.enableWlm
  - name: wlm-pn-sa
    version: "1.0.16"
    repository: file://./charts/wlm-pn-sa
    condition: global.nrSubChartSwitches.enableWlm
  - name: wlm-pn-sa-sim
    version: "1.0.14"
    repository: file://./charts/wlm-pn-sa-sim
    condition: global.nrSubChartSwitches.enableWlmSim
  - name: sensaai-sanctions
    version: "1.0.5"
    repository: file://./charts/sensaai-sanctions
    condition: global.nrSubChartSwitches.enableSensaAiSanctions
  - name: smbd
    version: "1.0.12"
    repository: file://./charts/smbd
    condition: global.nrSubChartSwitches.enableSmbd
  - name: rtde
    version: "1.0.13"
    repository: file://./charts/rtde
    condition: global.nrSubChartSwitches.enableRtde
  - name: keycloak
    version: "16.1.5"
    repository: oci://registry-1.docker.io/bitnamicharts
    condition: global.nrSubChartSwitches.enableKeycloak
  - name: er-init
    version: "1.15.0+RELEASE9.4.9"
    repository: file://./charts/er-init
    condition: global.nrSubChartSwitches.enableER
  - name: er-entres-workflow
    version: "1.15.0+RELEASE9.4.9"
    repository: file://./charts/er-entres-workflow
    condition: global.nrSubChartSwitches.enableER
  - name: aap
    condition: global.nrSolutionsSwitches.aml.enableAmlAlertGeneration.enabled
    version: "1.0.9"
    repository: file://./charts/aap
  - name: kafka-cluster
    version: "1.0.6"
    repository: file://./charts/kafka-cluster
  - name: nr-ui
    version: "1.0.18"
    repository: file://./charts/nr-ui
  - name: common
    version: "1.0.1"
    repository: file://./charts/common
  - name: cloudnative-postgresql
    version: "1.0.10"
    repository: file://./charts/cloudnative-postgresql
  - name: grafana-dashboards
    version: "1.0.0"
    repository: file://./charts/grafana-dashboards
    condition: global.kubePrometheusStackPresent
  - name: nrodsftp
    version: "1.0.11"
    repository: file://./charts/nrodsftp
  - name: backups
    version: "1.0.2"
    repository: file://./charts/backup
  - name: standalone
    version: "1.0.22"
    repository: file://./charts/standalone
  - name: minio
    version: "5.1.0"
    repository: file://./charts/minio
  - name: nr-custom-metrics
    version: "1.0.10"
    repository: file://charts/nr-custom-metrics
    condition: global.nrSubChartSwitches.enableNrCustomMetrics
  - name: adminerevo
    version: "1.0.3"
    repository: file://./charts/adminerevo
    condition: global.nrSubChartSwitches.enableAdminerEvo
  - name: zeppelin-server
    version: "0.1.0"
    repository: file://./charts/zeppelin-server
    condition: global.nrSubChartSwitches.enableZeppelinServer
