smart.output.skipSchema=true

smart.model.optimizations={{ .Values.solutionsParameters.obdetarte.smart.model.optimizations }}

smart.dateFormat={{ .Values.solutionsParameters.obdetarte.smart.dateFormat }}
smart.timestampFormat={{ .Values.solutionsParameters.obdetarte.smart.timestampFormat }}
#smart.timestampFormat=yyyyMMddHHmmss

#Separator for LISTTOMAP  datatype property and keyvalue separator property
smart.listToMap.separator={{ .Values.solutionsParameters.obdetarte.smart.listToMap.separator | quote }}
smart.listToMap.keyValueSeparator={{ .Values.solutionsParameters.obdetarte.smart.listToMap.keyValueSeparator | quote }}

#Separator for MULTIVALUE  datatype property
smart.multiValueSeparator={{ .Values.solutionsParameters.obdetarte.smart.multiValueSeparator | quote }}

smart.domainCode=CDD

smart.set.nested.records.generate.alert.flag.false=false

smart.outputDecorator.modelId={{ .Values.solutionsParameters.obdetarte.smart.output.decoratorModelId }}
smart.outputDecorator.modelIdColumnName=ScenarioModelId
smart.features.processing.subrecords.mode=SINGLEROW

#Options are: File, Topic, DB
processingmodel.persistence.type={{ .Values.solutionsParameters.obdetarte.processingmodel.persistence.type }}

# In Cluster mode config files should be directly in home, eg.
# processingmodel.xmlFilePath=./ProcessingModel.xml
processingmodel.xmlFilePath=./conf/model/processingmodel.xml
#processingmodel.learnermodel.filePath=./conf/model/processingmodel-learnermodel.xml
#processingmodel.learnermodel.directory=./conf/model/pmml

processingmodel.score.combiner.concat.separator={{ .Values.solutionsParameters.obdetarte.processingmodel.score.combiner.concat.separator | quote }}

processingconfig.xmlFilePath=./conf/Processing_config.xml
thresholdingconfig.xmlFilePath=./conf/ScoreThresholding_config.xml

riskmodel.persistence.type=DB

processingmodel.refreshing.signalType={{ .Values.solutionsParameters.obdetarte.processingmodel.refreshing.signalType }}
processingmodel.refreshing.topicSignal.topicName={{ .Values.solutionsParameters.obdetarte.processingmodel.refreshing.topicSignal.topicName }}

# Extra obdetarte configuration parameters
{{- if .Values.solutionsParameters.obdetarte.applicationConf.extraParameters }}
{{ include "rtde.application.conf.extra.params" .Values.solutionsParameters.obdetarte.applicationConf.extraParameters }}
{{- end }}
