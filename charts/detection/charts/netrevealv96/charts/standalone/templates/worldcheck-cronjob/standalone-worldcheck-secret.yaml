{{- if or .Values.worldcheck.job.enableDailyJob .Values.worldcheck.job.enableWeeklyJob }}
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: "{{ include "secret.standalone.worldcheck.script.name" . }}"
  namespace: {{ .Values.global.namespace }}
  labels:
    app: "{{ include "secret.standalone.worldcheck.script.name" . }}"
data:
  downloadWorldcheck.sh: {{ tpl (.Files.Get "scripts/worldcheck/downloadWorldcheck.sh") . | b64enc  }}
  getWorldcheckDoneFiles.sql: {{ tpl (.Files.Get "scripts/worldcheck/sql/getWorldcheckDoneFiles.sql") . | b64enc  }}
  getWorldcheckTotalFiles.sql: {{ tpl (.Files.Get "scripts/worldcheck/sql/getWorldcheckTotalFiles.sql") . | b64enc  }}
  triggerStopWorldcheckIndexRebuild.sql: {{ tpl (.Files.Get "scripts/worldcheck/sql/triggerStopWorldcheckIndexRebuild.sql") . | b64enc  }}
  triggerWorldcheckIndexRebuild.sql: {{ tpl (.Files.Get "scripts/worldcheck/sql/triggerWorldcheckIndexRebuild.sql") . | b64enc  }}
{{- end }}