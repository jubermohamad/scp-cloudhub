apiVersion: v1
kind: ConfigMap
metadata:
  name: "{{ include "config.map.standalone.posteim.lst.name" . }}"
  namespace: {{ .Values.global.namespace }}
  labels:
    app: "{{ include "config.map.standalone.posteim.lst.name" . }}"
data:
  postEIM.lst: |
{{- if .Values.global.nrSolutionsSwitches.aml.enabled }}
    # AML Command & Control reports
    #
    import|commandandcontrol|/opt/netreveal/standaloneHome/configuration/AML/commandAndControl/AML-command-and-control-configuration.xml
    import|commandandcontrol|/opt/netreveal/standaloneHome/configuration/AML/commandAndControl/AML - Detection Reports-command-and-control-configuration.xml

    {{- if .Values.global.nrSolutionsSwitches.qaUsers.enabled}}
    # AML Workflow Rules/Queue configuration
    import|queuesrules|/opt/netreveal/standaloneHome/configuration/AML/AML-queues-and-rules-configuration.xml|importSubscribers=true
    {{- else }}
    # AML Workflow Rules/Queue configuration
    import|queuesrules|/opt/netreveal/standaloneHome/configuration/AML/AML-queues-and-rules-configuration.xml|importSubscribers=false
    {{- end }}
    #AML-SIM processing model
    #reload|permissions

    # AML-SIM Command & Control reports
    #
    #AML processing model
    reload|permissions
    import|monitoring[operation=import to production,domainName=AML - Suspicious Activity,dataTypeModel=/opt/netreveal/standaloneHome/conf/monitoring/datatypemodel.xml]|/opt/netreveal/standaloneHome/configuration/AMLDET/scenario_engine/processingmodel-AML-Suspicious Activity.xml
  {{- end }}
  {{- if or .Values.global.nrSolutionsSwitches.aml.amlcb.enabled (not (hasKey .Values.global.nrSolutionsSwitches.aml.amlcb "enabled") ) }}
    # AMLCB Command & Control reports
    #
    import|commandandcontrol|/opt/netreveal/standaloneHome/configuration/AMLCB/commandAndControl/CB - Detection Reports-command-and-control-configuration.xml

    #AMLCB processing model
    #reload|permissions
    import|monitoring[operation=import to production,domainName=AML - Correspondent Banking,dataTypeModel=/opt/netreveal/standaloneHome/conf/monitoring/datatypemodel.xml]|/opt/netreveal/standaloneHome/configuration/AMLCBDET/scenario_engine/processingmodel_AML_CB.xml
  {{- end }}
  {{- if .Values.global.nrSolutionsSwitches.aml.amlcust.enabled }}
    #AMLCUSTDET processing model
    reload|permissions
    import|monitoring[operation=import to production,domainName=AMLCUST - AML Customer Behaviour,dataTypeModel=/opt/netreveal/standaloneHome/conf/monitoring/datatypemodel.xml]|/opt/netreveal/standaloneHome/configuration/AMLCUSTDET/scenario_engine/Reporting_procesing_model.xml
  {{- end }}


  {{- if .Values.global.nrSolutionsSwitches.cdd.enabled }}
    #
    # CDD Command & Control reports
    #
    import|commandandcontrol|/opt/netreveal/standaloneHome/configuration/CDD/commandAndControl/CDD - Customer Acceptance-command-and-control-configuration.xml
    import|commandandcontrol|/opt/netreveal/standaloneHome/configuration/CDD/commandAndControl/CDD - ODD-command-and-control-configuration.xml

    ##Update/add system parameters
    import|base|/opt/netreveal/standaloneHome/configuration/CDD/CDD_system_parameters_base_configuration.xml

    {{- if .Values.global.nrSolutionsSwitches.qaUsers.enabled}}
    # CDD Workflow Rules/Queue configuration
    import|queuesrules|/opt/netreveal/standaloneHome/configuration/CDD/CDD-queues-and-rules-configuration.xml|importSubscribers=true
    {{- else }}
    # CDD Workflow Rules/Queue configuration
    import|queuesrules|/opt/netreveal/standaloneHome/configuration/CDD/CDD-queues-and-rules-configuration.xml|importSubscribers=false
    {{- end }}
    #CDD scoring model
    reload|permissions
    import|monitoring[operation=import to production,domainName=CDD - Customer Acceptance,dataTypeModel=/opt/netreveal/standaloneHome/conf/acquisition/datatypemodel.xml]|/opt/netreveal/standaloneHome/configuration/ODDDET/scenario_engine/processingmodel.xml
    import|cddriskmodel|/opt/netreveal/standaloneHome/configuration/ODDDET/scenario_engine/RiskModel.xml|setToProduction
    #CDDAAT scoring model
    reload|permissions
    import|monitoring[operation=import to production,domainName=CDD - Automated Alert Triage,dataTypeModel=/opt/netreveal/standaloneHome/conf/acquisition/datatypemodel.xml]|/opt/netreveal/standaloneHome/configuration/CDDAAT/scenario_engine/processingmodel.xml
  {{- end }}

  {{- if .Values.global.nrSolutionsSwitches.wlm.enabled }}
    import|normalization|/opt/netreveal/standaloneHome/configuration/WLM/normalization/text-normalization-config.xml
    import|commandandcontrol|/opt/netreveal/standaloneHome/configuration/WLM/commandAndControl/WLM-command-and-control-configuration-cases.xml
    import|commandandcontrol|/opt/netreveal/standaloneHome/configuration/WLM/commandAndControl/WLM-command-and-control-configuration-alerts.xml
    import|commandandcontrol|/opt/netreveal/standaloneHome/configuration/WLM/commandAndControl/WLM-command-and-control-configuration-AlertedTran.xml
    import|commandandcontrol|/opt/netreveal/standaloneHome/configuration/WLM/commandAndControl/WLM-command-and-control-configuration-AlertedTranByWatchlist.xml
    import|commandandcontrol|/opt/netreveal/standaloneHome/configuration/WLM/commandAndControl/WLM-command-and-control-configuration-AlertedTranByCheck.xml
    import|commandandcontrol|/opt/netreveal/standaloneHome/configuration/WLM/commandAndControl/WLM-command-and-control-configuration-AlertedSubjectsByWatchlist.xml
    import|commandandcontrol|/opt/netreveal/standaloneHome/configuration/WLM/commandAndControl/WLM-command-and-control-configuration-detections.xml
    import|commandandcontrol|/opt/netreveal/standaloneHome/configuration/WLM/commandAndControl/WLM-command-and-control-configuration-matches.xml
  {{- end }}
  {{- if .Values.global.nrSolutionsSwitches.wlm.wlmTf.enabled }}
    import|wlm|/opt/netreveal/standaloneHome/configuration/WLMTF/wlm_engine/wlm-filtering-config-tf.zip|PARTIALMERGE
    {{- if .Values.global.nrSolutionsSwitches.qaUsers.enabled}}
    # WLMFT Workflow Rules/Queue configuration
    import|queuesrules|/opt/netreveal/standaloneHome/configuration/WLMTF/WLMTF-queues-and-rules-configuration.xml|importSubscribers=true
    {{- else }}
    # WLMFT Workflow Rules/Queue configuration
    import|queuesrules|/opt/netreveal/standaloneHome/configuration/WLMTF/WLMTF-queues-and-rules-configuration.xml|importSubscribers=false
    {{- end }}
  {{- end }}
  {{- if .Values.global.nrSolutionsSwitches.wlm.wlmSp.enabled }}
    import|wlm|/opt/netreveal/standaloneHome/configuration/WLMSP/wlm_engine/wlm-filtering-config-sp-subject.zip|PARTIALMERGE
    import|wlm|/opt/netreveal/standaloneHome/configuration/WLMSP/wlm_engine/wlm-filtering-config-validator.zip|PARTIALMERGE
    {{- if .Values.global.nrSolutionsSwitches.qaUsers.enabled}}
    # WLMSP Workflow Rules/Queue configuration
    import|queuesrules|/opt/netreveal/standaloneHome/configuration/WLMSP/WLMSP-queues-and-rules-configuration.xml|importSubscribers=true
    {{- else }}
    # WLMSP Workflow Rules/Queue configuration
    import|queuesrules|/opt/netreveal/standaloneHome/configuration/WLMSP/WLMSP-queues-and-rules-configuration.xml|importSubscribers=false
    {{- end }}
  {{- end }}
  {{- if .Values.global.nrSolutionsSwitches.wlm.wlmTf.enabled }}
    {{- if .Values.global.nrSolutionsSwitches.qaUsers.enabled}}
    # IETWLM Workflow Rules/Queue configuration
    import|queuesrules|/opt/netreveal/standaloneHome/configuration/IETWLM/IETWLM-queues-and-rules-configuration.xml|importSubscribers=true
    {{- else }}
    # IETWLM Workflow Rules/Queue configuration
    import|queuesrules|/opt/netreveal/standaloneHome/configuration/IETWLM/IETWLM-queues-and-rules-configuration.xml|importSubscribers=false
    {{- end }}
    #IETWLM scoring model
    reload|permissions
    import|monitoring[operation=import to production,domainName=Transaction Filtering,dataTypeModel=/opt/netreveal/standaloneHome/conf/acquisition/datatypemodel.xml]|/opt/netreveal/standaloneHome/configuration/IETWLM/scenario_engine/processingmodel.xml
  {{- end }}
  {{- if .Values.global.nrSolutionsSwitches.wlm.wlmSp.enabled }}
    {{- if .Values.global.nrSolutionsSwitches.qaUsers.enabled}}
    # IETWLMSP Workflow Rules/Queue configuration
    import|queuesrules|/opt/netreveal/standaloneHome/configuration/IETWLMSP/IETWLMSP-queues-and-rules-configuration.xml|importSubscribers=true
    {{- else }}
    # IETWLMSP Workflow Rules/Queue configuration
    import|queuesrules|/opt/netreveal/standaloneHome/configuration/IETWLMSP/IETWLMSP-queues-and-rules-configuration.xml|importSubscribers=false
    {{- end }}
    #IETWLMSP scoring model
    reload|permissions
    import|monitoring[operation=import to production,domainName=Sanctions & PEP,dataTypeModel=/opt/netreveal/standaloneHome/conf/acquisition/datatypemodel.xml]|/opt/netreveal/standaloneHome/configuration/IETWLMSP/scenario_engine/processingmodel.xml
  {{- end }}
  {{- if .Values.global.nrSolutionsSwitches.wlm.enabled }}
    #
    # WLMEN
    #
    import|wlm-synonym|/opt/netreveal/standaloneHome/configuration/WLMEN/synonyms/synonyms-config_nick_name.zip|MERGE
    import|wlm-synonym|/opt/netreveal/standaloneHome/configuration/WLMEN/synonyms/synonyms-config_weighted_words.zip|MERGE
  {{- end }}

