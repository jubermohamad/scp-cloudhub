apiVersion: v1
kind: Service
metadata:
  name: {{ include "nrodsftp.fullname" . }}
  labels:
    {{- include "nrodsftp.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
      protocol: TCP
      name: ssh
  selector:
    {{- include "nrodsftp.selectorLabels" . | nindent 4 }}

---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "nrodsftp.fullname" . }}-node
  labels:
    {{- include "nrodsftp.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: 3000
      targetPort: 3000
      protocol: TCP
      name: node
  selector:
    {{- include "nrodsftp.selectorLabels" . | nindent 4 }}
