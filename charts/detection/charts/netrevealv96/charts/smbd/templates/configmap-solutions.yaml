### Volumes generation ####
{{- define "smbd.standalone-config-volumes" -}}
{{- $solution := .solution -}}
{"configMap": { "name": "{{ .Release.Name }}-{{ .Chart.Name }}-init-script", "defaultMode": 493, "items": \[ {"key": "smbdInitScript.sh", "path": "smbdInitScript.sh"} \] }, "name": "{{ .Release.Name }}-{{ .Chart.Name }}-init-script" }, {"configMap": { "name": "{{ $.Release.Name }}-{{ $.Chart.Name }}-{{ $solution }}-configs" }, "name": "{{ $.Release.Name }}-{{ $.Chart.Name }}-{{ $solution }}-configs" }, { "name": "{{ $.Release.Name }}-{{ $.Chart.Name }}-{{ $solution }}-secret-configs", "secret": { "secretName": "{{ $.Release.Name }}-{{ $.Chart.Name }}-{{ $solution }}-secret-configs" }}
{{- end -}}

{{- define "smbd.standalone-qa-volumes" -}}
{{- $solution := .solution -}}
{"configMap": { "name": "{{ $.Release.Name }}-{{ $.Chart.Name }}-dir-aml-{{ $solution }}-configs" }, "name": "{{ $.Release.Name }}-{{ $.Chart.Name }}-dir-aml-{{ $solution }}-configs"}, {"configMap": { "name": "{{ $.Release.Name }}-{{ $.Chart.Name }}-dir-aml2-{{ $solution }}-configs" }, "name": "{{ $.Release.Name }}-{{ $.Chart.Name }}-dir-aml2-{{ $solution }}-configs"}, {"configMap": { "name": "{{ $.Release.Name }}-{{ $.Chart.Name }}-dir-model-{{ $solution }}-configs" }, "name": "{{ $.Release.Name }}-{{ $.Chart.Name }}-dir-model-{{ $solution }}-configs" }
{{- end -}}

{{- define "smbd.standalone-data-volumes" -}}
{{- $solution := .solution -}}
{"configMap": { "name": "{{ $.Release.Name }}-{{ $.Chart.Name }}-data-{{ $solution }}-dir" }, "name": "{{ $.Release.Name }}-{{ $.Chart.Name }}-data-{{ $solution }}-dir"}
{{- end -}}

{{- define "smbd.postgres.server.secret-volume" -}}
{"name": "postgresql-cert-ca", "secret": { "secretName": "{{ .Release.Name }}-postgres-server-cert", "items": [{"key": "ca.crt", "path": "ca.crt"}] }}
{{- end -}}

{{- define "smbd.standalone-pv-volumes" -}}
{{- $rootContext := . -}}
{{- $solution := .solution -}}
{{- $first_element := true -}}
{{- $volumes := index .Values (printf "%sVolumes" $solution) -}}
{{- range $volumes }}
{{- $persistentVolumeClaimclaimName := .persistentVolumeClaim.claimName -}}
{{- if not $first_element }},{{ end -}}
{{- with $rootContext -}}
{ "name": "{{ printf "%s-%s" .Release.Name $persistentVolumeClaimclaimName  }}", "persistentVolumeClaim": { "claimName": {{ include "generate.name.with.release.name" (list $ . $persistentVolumeClaimclaimName) | quote }} } }
{{- end -}}
{{- $first_element = false -}}
{{- end }}
{{- end }}

{{- define "smbd.standalone-volumes-include" -}}
{{- $solution := .solution -}}
{{- $mounts := list -}}
{{- $context := . -}}
{{- $includes_list := list -}}
{{- $includes_list = append $includes_list "smbd.standalone-config-volumes"  -}}
{{- $includes_list = append $includes_list "smbd.standalone-pv-volumes"  -}}
{{- $includes_list = append $includes_list "smbd.standalone-data-volumes"  -}}
{{- if and .Values.global.baseConfigProperties.db.postgresql.sslmode (ne .Values.global.baseConfigProperties.db.postgresql.sslmode "disable") -}}
{{- $includes_list = append $includes_list "smbd.postgres.server.secret-volume" -}}
{{- end -}}
{{- if eq .Values.app_env "qa" -}}
  {{- $includes_list = append $includes_list "smbd.standalone-qa-volumes" -}}
{{- end -}}
{{- range $include := $includes_list -}}
{{- $mount := include $include  (merge (dict "solution" $solution)  $context ) -}}
{{- if not (empty $mount) -}}
{{- $mounts = append $mounts $mount -}}
{{- end -}}
{{- end -}}
{{ join ", " $mounts }}
{{- end -}}

