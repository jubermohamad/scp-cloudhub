{{- define "smbd.postgres.server.secret-mount" -}}
{"name": "postgresql-cert-ca", "mountPath": "{{ .Values.global.baseConfigProperties.db.postgresql.sslrootcert }}", "subPath": "ca.crt"}
{{- end -}}

{{- define "smbd.standalone-volumes-mount" -}}
{{- $solution := .solution -}}
