{{- range $volumemounts }}
{{- if not $first_element }},{{ end -}}
{{- $name := .name -}}
{{- $mountPath := .mountPath -}}
{{- $subPath := .subPath -}}
{ "name": "{{ $.Release.Name }}-{{ $name }}", "mountPath": "{{ $mountPath }}"{{- if $subPath }}, "subPath": "{{ $subPath }}"  {{- end }}}
