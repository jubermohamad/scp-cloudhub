{{- if not $first_element }},{{ end -}}
{{ include "smbd.postgres.server.secret-mount" . }}
{{- $first_element = false -}}
{{- end -}}
{{- end -}}

{{- define "smbd.init-script-volume-mount" -}}
{ "name": "{{ .Release.Name }}-{{ .Chart.Name }}-init-script", "mountPath": "/opt/smbdInitScript.sh", "subPath": "smbdInitScript.sh" }
{{- end -}}

