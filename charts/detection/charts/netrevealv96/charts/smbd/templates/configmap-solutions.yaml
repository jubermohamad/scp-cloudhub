---
apiVersion: v1
kind: ConfigMap
metadata:
  name: "{{ .Release.Name }}-{{ .Chart.Name }}-init-script"
  namespace: {{ .Values.global.namespace }}
data:
  smbdInitScript.sh: |
    #!/bin/bash
    solution=$1
    cp -r /opt/tmpConf/. /opt/smbd/conf/
    {{- if and .Values.global.override.overrideDockerImageName .Values.global.override.chartEnable.smbd }}
    if [ -f /opt/override/override_version.properties ]; then
      cp /opt/override/override_version.properties /opt/smbd/conf
    fi
    if [ -d  /opt/override/conf/smbd/${solution} ]; then
      cp -r /opt/override/conf/smbd/${solution}/. /opt/smbd/conf/
    fi
    {{- end }}
    if [ -d /opt/tmpData ]; then
      cp -r /opt/tmpData/. /opt/smbd/data
    fi
    chown -R 200:200 /opt/smbd


