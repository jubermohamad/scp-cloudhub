##########################
##File Layout Properties##
##########################

# The location of the datasource file(s) and corresponding header file, e.g. ../aml/transactions
# This corresponds to the location for the transactions datasource and aml domain
smbd.datasource.file.location=${smbd.home}/conf

#DataSource
smbd.datasource.input.type="RDBMS"
smbd.datasource.input.location=""

smbd.header=""
smbd.datasource.delimiter="|"

smbd.datasource.filename.prefix=""
smbd.datasource.filename.suffix=""
smbd.datasource.filename.extension=""
smbd.datasource.filename.dateFormat="dd-MMM-yy"

# Optional parameter indicating if dataSource column names should named based on dbSpec columnname value. Related to RDBMS input only.
smbd.datasource.apply.db.column.name.alias=true

# Read transaction data from parquet or raw files during for each detections
smbd.readTransactionsFromParquet=false

# Location for storing transactions
smbd.transaction.output.location=${smbd.home}/transaction_storage

#turns out of order alerting ON/OFF for this datasource. Set to ON by default
smbd.detection.outoforderalerting=OFF

#Location for storing the invalid transaction records
smbd.datasource.invalid.record.location=${smbd.home}/invalidrecords/alert

#Inverse profiling
smbd.inverseProfiling=false

# Tagging
#smbd.datasource.tagging.config.location=${smbd.home}/conf/taggingconfig.xml
#smbd.datasource.tagging.transaction.id="TransactionID"

#Exclude entities with the following id from profiling
smbd.datasource.entity.value.toIgnore = ""

#Skip empty key true/false for this datasource. Set to true by default
#When running compound key this need to be set to false
smbd.datasource.entity.value.skipEmptyKey = {{ .Values.solution.amlopt.ietAlertAppConfigDSG.smbd.datasource.entityValueSkipEmptyKey }}

#Exclude from the output dataset the .size value of Memory profiles and technical .present value of PeerGroup profiles
smbd.exclude.fields.datasetGenerator="*.size|PeerGroup.*.present"

##########################
##Entity View Properties##
##########################


smbd.view.DataSourceColumns {
	"AlertID":"String"
	"AlertDate":"Date"
	"CustomerID":"String"
	"AccountID":"String"
	"OrgunitID":"String"
	"OrgunitCode":"String"
	"AlertStatusMapped":"String"
	"AlertStatusCode":"String"
}

# It requires to provide mapping for CURRENCY_CODE_BASE and AMOUNT_BASE
# CURRENCY_CODE_BASE will be null and AMOUNT_BASE will contain AlertWeight
smbd.smbd_detection_table.mappings{
	DATASOURCE_ID:"AlertID"
}

smbd.validation.failures.file.location=${smbd.home}/failures
