# Root Logger
log4j.rootLogger=INFO, smbd, console
log4j.rootCategory=INFO, smbd, console

# Set everything to be logged to the console
log4j.appender.console=org.apache.log4j.ConsoleAppender
log4j.appender.console.target=System.err
log4j.appender.console.layout=org.apache.log4j.PatternLayout
log4j.appender.console.layout.ConversionPattern=%d{ISO8601} %p [%c{1} (%F:%L)] %m%n

# Spark Profiler application logging - file appender
log4j.appender.smbd=org.apache.log4j.RollingFileAppender
log4j.appender.smbd.layout=org.apache.log4j.PatternLayout
log4j.appender.smbd.layout.ConversionPattern=%d{ISO8601} %p [%c{1} (%F:%L)] %m%n
log4j.appender.smbd.Threshold=DEBUG
log4j.appender.smbd.File=${smbd.home}/logs/smbd.log
log4j.appender.smbd.MaxFileSize=10MB
log4j.appender.smbd.MaxBackupIndex=50

# Exempt list logging
log4j.logger.com.netreveal.sparkprofiler.list.ExemptList$=INFO, exemptListAppender
log4j.appender.exemptListAppender=org.apache.log4j.RollingFileAppender
log4j.appender.exemptListAppender.File=${smbd.home}/logs/detectionExemptions.log
log4j.appender.exemptListAppender.layout=org.apache.log4j.PatternLayout
log4j.appender.exemptListAppender.MaxFileSize=10MB
log4j.appender.exemptListAppender.MaxBackupIndex=50

# Process Log
log4j.logger.com.netreveal.sparkprofiler.logging.ProcessLog= INFO, process
log4j.appender.process=org.apache.log4j.RollingFileAppender
log4j.appender.process.File=${smbd.home}/logs/process.log
log4j.appender.process.layout=org.apache.log4j.PatternLayout
log4j.appender.process.Threshold=DEBUG
log4j.appender.process.MaxFileSize=10MB
log4j.appender.process.MaxBackupIndex=50

log4j.category.com=INFO
log4j.category.org=WARN
log4j.category.net=WARN
log4j.logger.org.spark_project.jetty.util.component.AbstractLifeCycle=ERROR
log4j.logger.org.apache.parquet=ERROR
log4j.logger.parquet=ERROR

# SPARK-9183: Settings to avoid annoying messages when looking up nonexistent UDFs in SparkSQL with Hive support
log4j.logger.org.apache.hadoop.hive.metastore.RetryingHMSHandler=FATAL
log4j.logger.org.apache.hadoop.hive.ql.exec.FunctionRegistry=ERROR


log4j.appender.process.layout.ConversionPattern=%d{ISO8601} %m%n
