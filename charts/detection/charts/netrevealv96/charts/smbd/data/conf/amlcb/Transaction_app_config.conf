			"OriginCountryCode":"String"
			"OriginBankCountryCode":"String"
			"CrRespOrgUnitCode":"String"
			"CrRespAccountSrcUniqueId":"String"
			"CrRespCustSrcUniqueId":"String"
			"BeneSubCustSrcUniqueId":"String"
			"BeneCpartyAccountId":"String"
			"BeneAccountNumber":"String"
			"BeneCountryCode":"String"
			"BeneBankCountryCode":"String"
			"CurrencyCodeOrig":"String"
			"TxnAmountBase":"Double"
			"TxnAmountOrig":"Double"
