#################################################################
##Properties to map Datasource fields to SMBD_DETECTION columns##
#################################################################
smbd.smbd_detection_table.mappings{
	DATASOURCE_ID:"SrcTxnUniqueId",
	CURRENCY_CODE_BASE:"CurrencyCodeOrig",
	AMOUNT_BASE:"TxnAmountBase"
}

