##############################
##Data Enrichment Properties##
##############################

smbd.enrichment.CParty_CParty {
	"tablename":"CB_TRANSACTIONS",
	"inputDataFieldToMatch":"SrcTxnUniqueId",
	"enrichmentColumnToMatch":"TXN_ID",
	"columnsToAdd":[{"ORIG_CPARTY_ID":"OriginCPartySrcUniqueId"},{"BENE_CPARTY_ID":"BeneCPartySrcUniqueId"}]
}

################################
##File Verification Properties##
################################

smbd.validation.failures.file.location=${smbd.home}/failures
smbd.datasource.invalid.record.location=${smbd.home}/invalidrecords/transaction



#Exclude entities with the following id from profiling
smbd.datasource.entity.value.toIgnore=""|"null"

#Skip empty key true/false for this datasource. Set to true by default
#When running compound key this need to be set to false
smbd.datasource.entity.value.skipEmptyKey={{ .Values.solution.amlcb.transactionAppConfig.smbd.datasource.entityValueSkipEmptyKey }}
