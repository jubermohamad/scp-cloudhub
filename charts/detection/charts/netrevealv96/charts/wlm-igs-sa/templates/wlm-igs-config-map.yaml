---
apiVersion: v1
kind: ConfigMap
metadata:
  name: "{{ .Release.Name }}-wlm-igs-sa-base-config-property"
  namespace: {{ .Values.global.namespace }}
  labels:
    app: "{{ .Release.Name }}-wlm-igs-sa-base-config-property"
  annotations:
    reloader.stakater.com/match: "true"
data:
  base_config.properties: |
    server.name=IGSStNode
    application.name={{ .Values.global.baseConfigProperties.applicationName }}
    system.default.timezone=UTC
    system.default.language={{ .Values.global.baseConfigProperties.systemDefaultLanguage }}
    system.default.country={{ .Values.global.baseConfigProperties.systemDefaultCountry }}
    system.encoding=UTF8
    system.authentication=INTERNAL
    saml.user.groupSync=true
    mailserver={{ .Values.global.baseConfigProperties.mail.server }}
    frommailid={{ .Values.global.baseConfigProperties.mail.fromMailId }}
    mailpassword={{ .Values.global.baseConfigProperties.mail.password }}
    mailuser={{ .Values.global.baseConfigProperties.mail.user }}
    transaction.manager.name=
    jndi.dataSource=java:/datasource/ApplicationBaseDS
    jdbc.driver=org.postgresql.Driver
    jdbc.url={{- template "db.jdbc.url" . }}
    hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
    jdbc.userid={{ .Values.global.baseConfigProperties.db.postgresql.userid }}
    jdbc.passwd={{ .Values.global.baseConfigProperties.db.postgresql.password }}
    jdbc.schema={{ .Values.global.baseConfigProperties.db.postgresql.schema }}
    hibernate.show_sql=false
    hibernate.cache.use_query_cache=true
    hibernate.cache.use_second_level_cache=true
    max.threads.batch.processing=5
    max.threads.batch.transformation=1
    max.threads.list.import=1
    dbloader.home=/opt/netreveal/standaloneHome/conf/monitoring/dbloader
    dbloader.data=/opt/netreveal/standaloneHome/data/dbloader
    notification.email.jndi=
    notification.email.from={{ .Values.global.baseConfigProperties.mail.notificationEmailFrom }}
    notification.email.subject=Notification
    hibernate.hikariCP.autoCommit={{ .Values.baseConfigProperties.hibernate.hikari.autoCommit }}
    hibernate.hikariCP.connectionTimeout={{ .Values.baseConfigProperties.hibernate.hikari.connectionTimeout }}
    hibernate.hikariCP.idleTimeout={{ .Values.baseConfigProperties.hibernate.hikari.idleTimeout }}
    hibernate.hikariCP.maxLifetime={{ .Values.baseConfigProperties.hibernate.hikari.maxLifetime }}
    hibernate.hikariCP.minimumIdle={{ .Values.baseConfigProperties.hibernate.hikari.minimumIdle }}
    hibernate.hikariCP.maximumPoolSize={{ .Values.baseConfigProperties.hibernate.hikari.maximumPoolSize }}
    scenariomanager.gui.validation=false
    scenariomanager.gui.debugger=true
    scenariomanager.gui.debugger.maxrecords=100
    scenariomanager.gui.background.gradient.begin.color=237,237,237
    scenariomanager.gui.background.gradient.end.color=237,237,237
    scenariomanager.gui.control.highlight.color=255,255,255
    scenariomanager.gui.control.shadow.color=128,128,128
    scenariomanager.gui.in.focus.color=247,0,74
    scenariomanager.gui.out.of.focus.color=288,244,0
    scenariomanager.gui.panel.background.color=237,237,237
    scenariomanager.gui.panel.text.color=0,28,63
    scenariomanager.gui.errorpanel.text.color=0,28,63
    scenariomanager.gui.titlepanel.background.gradient.begin.color=70,103,144
    scenariomanager.gui.titlepanel.background.gradient.end.color=70,103,144
    scenariomanager.gui.titlepanel.text.color=255,255,255
    scenariomanager.gui.row.sortable.header.color=237,237,237
    scenariomanager.gui.row.sortable.header.text.color=70,103,144
    scenariomanager.gui.selected.button.color=239,239,239
    scenariomanager.gui.selected.row.color=240,173,69
    scenariomanager.gui.table.row.color=209,229,251
    scenariomanager.gui.toolbar.location=top
    scenariomanager.gui.graph.logicaloperator.color=220,145,145
    scenariomanager.gui.graph.numericaloperator.color=220,145,145
    scenariomanager.gui.graph.identifier.color=145,145,220
    scenariomanager.gui.graph.literal.color=145,220,145
    scenariomanager.gui.graph.function.color=220,220,145
    scenariomanager.gui.graph.listcontains.color=220,145,220
    scenariomanager.gui.graph.layout=hierarchical
    scenariomanager.gui.graph.orientation=left_to_right
    scenariomanager.gui.graph.checkDefinition.layout=hvtree
    scenariomanager.gui.graph.checkDefinition.orientation=top_to_bottom
    scenariomanager.gui.graph.checkOverview.layout=hvtree
    scenariomanager.gui.graph.checkOverview.orientation=top_to_bottom
    scenariomanager.gui.graph.scenarioChain.layout=hvtree
    scenariomanager.gui.graph.scenarioChain.orientation=top_to_bottom
    scenariomanager.gui.graph.configurationVersion.layout=hierarchical
    scenariomanager.gui.graph.configurationVersion.orientation=left_to_right
    scenariomanager.gui.graph.layout.animate=false
    kafka.topic.name.prefix={{ .Values.global.baseConfigProperties.kafka.topicNamePrefix }}
    filtering.batch.transformer.max_row_count={{ .Values.baseConfigProperties.filteringBatchTransformerMaxRowCount }}
    filtering.batch.processor.max_processing_row_amount={{ .Values.baseConfigProperties.filteringBatchProcessorMaxProcessingRowAmount }}
    filtering.editable={{ .Values.baseConfigProperties.filteringEditable }}
    filtering.editablelists={{ .Values.baseConfigProperties.filteringEditableLists }}
    filtering.root.dir=/opt/netreveal/standaloneHome/conf/wlm
    filtering.24x7.node.type=IGS
    filtering.initialise.used.indexes=true
    filtering.staging.dir=/opt/WLM/staging
    filtering.24x7.staging.sublocation.indexes.dir=indexes
    filtering.24x7.staging.sublocation.model.dir=model
    filtering.24x7.ags.backup.recovery.interval={{ .Values.baseConfigProperties.filtering24x7AgsBackupRecorveryInterval }}
    filter.serializedMessages.dir=${filtering.root.dir}/serializedMessages
    filtering.build.used.mem.indexes=true
    filtering.build.indexes.onstartup={{ .Values.baseConfigProperties.filteringBuildIndexesOnStartup }}
    filtering.db.statement.batch.size={{ .Values.baseConfigProperties.filteringDbStatementBatchSize }}
    filtering.settings.dir=${filtering.root.dir}/settings
    filtering.alert.saver.extension.dir=${filtering.root.dir}/alertsaver
    filtering.alert.saver.extension.config.group=
    filtering.archive.root.dir=${filtering.root.dir}/archive
    filtering.archive.lists.dir=${filtering.archive.root.dir}/lists
    filtering.archive.lists=true
    filtering.archive.batches.dir=${filtering.archive.root.dir}/batches
    filtering.archive.batches=true
    filtering.archive.wlmconfig.dir=${filtering.archive.root.dir}/wlmconfig
    filtering.archive.wlmconfig=true
    baseplatform.root.dir=${filtering.root.dir}
    baseplatform.transliteration.dir=${baseplatform.root.dir}/trans/file
    eim.entity.archive.dir=/opt/netreveal/standaloneHome/archives/attachments
    workflow.enable.rule.scheduler=true
    filtering.ftp.folder=filterImport
    filtering.worldcheck.automatic.import.dir=${filtering.root.dir}/worldcheck
    filtering.batch.watch.import.root.dir=${filtering.root.dir}/batchwatch
    filtering.custom.list.import.root.dir=${filtering.root.dir}/listImport
    filtering.shared.dir=${filtering.root.dir}/shared
    filtering.reports.dir=${filtering.root.dir}/reports
    filtering.templates.dir=${filtering.root.dir}/templates
    filtering.number.fraction.separator.is.point=true
    filtering.controller.closesession.rollback=false
    org.quartz.scheduler.instanceName=FilteringScheduler
    org.quartz.scheduler.instanceId=one
    org.quartz.threadPool.class=org.quartz.simpl.SimpleThreadPool
    org.quartz.threadPool.threadCount=5
    org.quartz.threadPool.threadPriority=1
    org.quartz.jobStore.misfireThreshold=5000
    org.quartz.jobStore.class=org.quartz.simpl.RAMJobStore
    filtering.statistics.watchlist.matching.skip.scoring=false
    filtering.wc.list.automatic.build.on.import=true
    filtering.adapter.name=com.norkom.wlm.business.adapter.DefaultRealtimeFilteringAdapter
    filtering.realtime.classname.logic.TrxAcqQueue=com.norkom.wlm.business.realtime.LinkRealtimeLogicImpl
    filtering.realtime.classname.adapter.TrxAcqQueue=com.norkom.wlm.business.adapter.DefaultRealtimeFilteringAdapter
    filtering.realtime.classname.jmsservice.TrxAcqQueue=com.norkom.wlm.business.realtime.DefaultRealtimeJMSService
    filtering.default.encoding=UTF-8
    filtering.xsl.dir=${filtering.root.dir}/config
    filtering.gsv.transformation.encoding=default
    filtering.eim.ags.alertSaver.sequenceName.ultimate_default=WLM-Alert-Seq
    filtering.eim.ags.nonAlertSaver.sequenceName.ultimate_default=WLM-NonAlert-Seq
    filtering.singlelookup.alert.saver.classname=com.norkom.wlm.business.alert.plugin.AGSAlertSaver
    filtering.singlelookup.nonalert.saver.classname=com.norkom.wlm.business.alert.plugin.AGSNonAlertSaver
    filtering.realtime.alert.saver.classname=com.norkom.wlm.business.alert.plugin.AGSAlertSaver
    filtering.realtime.nonalert.saver.classname=com.norkom.wlm.business.alert.plugin.AGSNonAlertSaver
    filtering.batch.alert.saver.classname=com.norkom.wlm.business.alert.plugin.AGSAlertSaver
    filtering.batch.nonalert.saver.classname=com.norkom.wlm.business.alert.plugin.AGSNonAlertSaver
    filtering.interactive.alert.saver.classname=com.norkom.wlm.business.alert.plugin.InteractiveSearchResultSaver;EIM_WLMAlertSaverExtension.xml
    filtering.fpfa.list.automatic.build.on.import=true
    filtering.fpfa.automatic.import.dir=${filtering.root.dir}/fpfa
    filtering.gwl.automatic.import.dir=${filtering.root.dir}/gwl
    filtering.gwl.list.automatic.build.on.import=true
    norkom.reports.templates.dir=conf/templates/notifications
    norkom.velocity.templates.dir=/conf/templates
    services.errorhandling.enabled=true
    services.errorhandling.primaryauditor.name=er_database
    services.errorhandling.er_database.class=com.norkom.acquisition.business.errorauditors.DbAuditor
    filtering.batch.recovery.location=${filtering.root.dir}/shared/batch-recovery
    filtering.batch.dbrecovery.location=${filtering.root.dir}/batch/dbrecovery
    velocity.runtime.log.logsystem.class=org.apache.velocity.runtime.log.NullLogSystem
    database.type=postgresql
    {{- template "kafka.bootstrap.servers" . }}
    kafka.consumers.list=-no-kafka-consumers-
    filtering.batch.processing.kafka.consumer.startup=false
    filtering.batch.transformation.kafka.consumer.startup=true
    filtering.list.import.kafka.consumer.startup=true
    filtering.24x7.igs.reply.producer=IGS_REPLY_PRODUCER
    filtering.24x7.igs.reply.consumer=MASTER_IGS_RESPONSE
    filtering.24x7.wlm.igs.write.sleep.time={{ .Values.baseConfigProperties.filtering24x7WlmProcWriteSleepTime }}
    filtering.indexes.dir=${filtering.root.dir}/indexes
    filtering.24x7.processing.node.registration.start.delay={{ .Values.baseConfigProperties.filtering24x7ProcessingNodeRegistrationStartDelay }}
    filtering.24x7.processing.node.registration.retry.interval={{ .Values.baseConfigProperties.filtering24x7ProcessingNodeRegistrationRetryInterval }}
    filtering.24x7.processing.node.swift.mt.linking.job.retry.interval={{ .Values.baseConfigProperties.filtering24x7ProcessingNodeSwiftMtLinkingJobRetryInerval }}
    filtering.24x7.processing.node.swift.mt.linking.job.start.delay={{ .Values.baseConfigProperties.filtering24x7ProcessingNodeSwiftMtLinkingJobStartDelay }}
    mailprotocol={{ .Values.global.baseConfigProperties.mail.protocol }}
    services.errorhandling.secondaryauditor.name=er_file
    services.errorhandling.er_file.class=com.norkom.acquisition.business.errorauditors.FileAuditor
    services.errorhandling.er_file.path=/opt/netreveal/standaloneHome/logs/services/services-errors.txt
    router.dhc.myNode=0
    apps.performance.monitoring.class.list=
    process.inbound.emails=false
    installed.apps.vertical.wlm=Y
    filtering.server.id=${pod.name}
    filtering.fpfalist.import.append.stop.on.duplicate.detection=false
    filtering.fpfalist.import.inmemory.processing=true
    filtering.fpfa.xmlreader.inputbuffer.size=16384
    default.timestamp=9999/01/01 00:00:00
    batch.default.timestamp=1970/01/01 00:00:00
    wlm.single.pass.mode=Y
    wlm.wait.for.latest.indexes=Y
    wlm.batch.proc.group.name=
    WLM_Fingerprint_Customer=CustomerName,FirstName,LastName,Address,DateOfBirth,CustomerCategoryCode
    WLM_Fingerprint_CustomerCustomerLink=PercentageOwnership,LinkType
    WLM_Fingerprint_ConnParty=ConnectedPartyName,FirstName,LastName,Address,DateOfBirth
    WLM_Fingerprint_ConnPartyCustomerLink=PercentageOwnership,LinkType
    installed.apps.vertical.wlmags=Y
    installed.apps.vertical.wlmtf=Y
    installed.apps.vertical.wlmsp=Y
    kafka.producer.EIM-Default-Producer.bootstrap.servers={{ include "kafka.bootstrap.servers.service.name" . }}
    {{- include "kafka.default.producer.security" (list $ . "/opt/netreveal/standaloneHome") }}
    kafka.producer.EIM-Default-Producer.metrics.interval={{ .Values.baseConfigProperties.kafka.producer.EIMDefaultProducer.metricsInterval }}
    kafka.producer.EIM-Default-Producer.interceptor.enabled={{ .Values.baseConfigProperties.kafka.producer.EIMDefaultProducer.interceptorEnabled }}
    base.normalization.cache=true
    datasource.dataSource.dbType=PostgreSQL
    {{- include "base.config.properties.custom.parameters" . | nindent 4 }}

