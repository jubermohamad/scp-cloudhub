{{- if .Values.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: zeppelin-notebook-storage
  labels:
    {{- include "zeppelin-server.labels" . | nindent 4 }}
  annotations:
    {{- include "storage.pvc.annotations" (list $ . "without-annotation-label" (include "storage.class.name.selectStorageClassName" .)) | indent 4 }}
  {{- with .Values.persistence.annotations }}
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  accessModes:
    - {{ .Values.persistence.accessMode }}
  storageClassName: {{ include "storage.storageClassName" . }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
{{- end }}
