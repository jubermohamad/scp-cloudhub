apiVersion: v1
kind: Service
metadata:
  labels:
    service: {{ .Release.Name }}-wlm-igs-sa
    app: {{ .Release.Name }}-wlm-igs-sa
  name: {{ .Release.Name }}-wlm-igs-sa
  namespace: {{ .Values.global.namespace }}
spec:
  selector:
    app: {{ .Release.Name }}-wlm-igs-sa-instance-pod
  type: ClusterIP
  ports:
    {{- if eq .Values.pod.java.switchOnDebug true }}
    - name: standalone-debug-port
      port: 8788
      targetPort: 8788
    {{- end }}
    - name: jmx-metrics
      port: 8080
      targetPort: 8080

{{- if .Values.global.kubePrometheusStackPresent }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ .Release.Name }}-wlm-igs-sa-monitor
  labels:
    release: {{ .Values.global.prometheus.release }}
  namespace: {{ .Values.global.namespace }}
spec:
  selector:
   matchLabels:
      app: {{ .Release.Name }}-wlm-igs-sa
  namespaceSelector:
    matchNames:
    - {{ .Values.global.namespace }}
  endpoints:
  - port: jmx-metrics
    interval: 1s
{{- end }}
