apiVersion: v1
kind: ConfigMap
metadata:
  name: "{{ .Release.Name }}-aap-log4j2"
  namespace: "{{ .Values.global.namespace }}"
  labels:
    {{- include "common.helm.metadata.labels" . | nindent 4 }}
data:
  log4j2.xml: |
    <?xml version="1.0" encoding="UTF-8"?>
    <!--
      ~ Copyright 2016 BAE Systems Applied Intelligence (Ireland) Limited. All Rights reserved.
      -->
    <Configuration status="WARN" monitorInterval="30">
        <Appenders>
            <Console name="Console" target="SYSTEM_OUT">
                <PatternLayout pattern="%d{yyyy-MM-dd HH:mm:ss.SSS} [%t] %-5level %logger{36}:%L - %msg%n"/>
            </Console>
            <RollingFile name="File" fileName="./logs/application.log" ignoreExceptions="false" filePattern="./logs/application.log.%i.gz">
                <PatternLayout pattern="%d{yyyy-MM-dd HH:mm:ss.SSS} [%t] %-5level %logger{36}:%L - %msg%n"/>
                <Policies>
                    <SizeBasedTriggeringPolicy size="10MB"/>
                </Policies>
                <DefaultRolloverStrategy max="50"/>
            </RollingFile>
        </Appenders>
        <Loggers>
            <Root level="info">
                <AppenderRef ref="Console"/>
                <AppenderRef ref="File"/>
            </Root>
            <Logger name="com" level="info" additivity="false">
                <AppenderRef ref="Console"/>
                <AppenderRef ref="File"/>
            </Logger>
            <Logger name="org" level="info" additivity="false">
                <AppenderRef ref="Console"/>
                <AppenderRef ref="File"/>
            </Logger>
            <Logger name="io" level="info" additivity="false">
                <AppenderRef ref="Console"/>
                <AppenderRef ref="File"/>
            </Logger>
            <Logger name="com.baesystems.ai.analytics.amp" level="info" additivity="false">
                <AppenderRef ref="Console"/>
                <AppenderRef ref="File"/>
            </Logger>
            <Logger name="com.baesystems.ai.analytics.amp.web.rest.NamedRestAPI" level="debug" additivity="false">
                <AppenderRef ref="Console"/>
                <AppenderRef ref="File"/>
            </Logger>
            <Logger name="com.baesystems.ai.analytics.amp.data.DatasetAccessor" level="debug" additivity="false">
                <AppenderRef ref="Console"/>
                <AppenderRef ref="File"/>
            </Logger>
        </Loggers>
    </Configuration>
