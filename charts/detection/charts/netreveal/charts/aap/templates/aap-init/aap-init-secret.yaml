---
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: "{{ .Release.Name }}-aap-install-config"
  namespace: {{ .Values.global.namespace }}
  labels:
    app.kubernetes.io/name: {{ include "aap.fullname" . }}
    {{- include "common.helm.metadata.labels" . | nindent 4 }}
data:
  install-config.json: |-
    {{ tpl (.Files.Get "data/conf/install-config.json") .| b64enc }}
