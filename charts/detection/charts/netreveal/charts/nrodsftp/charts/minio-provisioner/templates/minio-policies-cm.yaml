---
apiVersion: v1
kind: ConfigMap
metadata:
  name: "{{ .Release.Name }}-minio-customer-policy"
  namespace: {{ .Values.global.namespace }}
  annotations:
    # This is what defines this resource as a hook. Without this line, the
    # job is considered part of the release.
    "helm.sh/hook": pre-install, pre-upgrade, post-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
data:
  customer.policy.json: |
    {
    "Version": "2012-10-17",
    "Statement": [
        {
        "Action": [
                "s3:ListBucket",
                "s3:PutObject",
                "s3:GetObject",
                "s3:DeleteObject"
            ],
        "Effect": "Allow",
        "Resource": [
            "arn:aws:s3:::public-bucket/*","arn:aws:s3:::public-bucket"
        ],
        "Sid": "BucketAccessForUser"
        }
    ]
    }

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: "{{ .Release.Name }}-minio-psql-policy"
  namespace: {{ .Values.global.namespace }}
  annotations:
    # This is what defines this resource as a hook. Without this line, the
    # job is considered part of the release.
    "helm.sh/hook": pre-install, pre-upgrade, post-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
data:
  psql.policy.json: |
    {
    "Version": "2012-10-17",
    "Statement": [
        {
        "Action": [
                "s3:*"
            ],
        "Effect": "Allow",
        "Resource": [
            "arn:aws:s3:::backup/*","arn:aws:s3:::backup"
        ],
        "Sid": "BucketAccessForUser"
        }
    ]
    }
