apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-spark-operator
  namespace: {{ include "er.namespace" . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-spark-app-role
subjects:
  - kind: ServiceAccount
    name: spark-app
    namespace: {{ include "er.namespace" . }}
