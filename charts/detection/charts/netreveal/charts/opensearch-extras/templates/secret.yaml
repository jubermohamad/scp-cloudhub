{{- if .Values.global.nrSubChartSwitches.enableOpenSearch }}
apiVersion: v1
kind: Secret
metadata:
  name: "opensearch-internal-users-secret"
  namespace: {{ .Values.global.namespace }}
  labels:
    app: "opensearch-internal-users-secret"
type: Opaque
data:
  internal_users.yml: {{ tpl (.Files.Get "internal_users.yml") . | b64enc }}
{{- end }}
