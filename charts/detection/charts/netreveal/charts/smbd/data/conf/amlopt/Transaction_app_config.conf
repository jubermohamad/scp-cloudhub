##########################
##File Layout Properties##
##########################

# The location of the datasource file(s) and corresponding header file, e.g. ../aml/transactions
# This corresponds to the location for the transactions datasource and aml domain
smbd.datasource.file.location=${smbd.home}/data

#DataSource
smbd.datasource.input.type="CSV"
smbd.datasource.input.location=${smbd.home}/transaction_storage

# The location of the header file. Only the header file corresponding to the datasource files to be processed should be placed in this directory
smbd.header={{ .Values.solution.amlopt.transactionAppConfig.smbdHeader | quote }}

# The delimiter of the datasource file
smbd.datasource.delimiter=|

smbd.datasource.filename.prefix="TRANSACTIONS_"
smbd.datasource.filename.suffix=""
smbd.datasource.filename.extension="txt"
smbd.datasource.filename.dateFormat="yyyyMMdd"

# Read transaction data from parquet or raw files during for each detections
smbd.readTransactionsFromParquet=false
# Location for storing transactions
smbd.transaction.output.location=${smbd.home}/transaction_storage

#turns out of order alerting ON/OFF for this datasource. Set to ON by default. If this property does not exist it is assumed to be OFF
smbd.detection.outoforderalerting={{ .Values.solution.amlopt.transactionAppConfig.smbd.detection.outoforderalerting }}

#Location for storing the invalid transaction records
smbd.datasource.invalid.record.location=${smbd.home}/invalidrecords/transaction

#property for transaction tagging
smbd.datasource.tagging.transaction.id="TransactionID"
smbd.datasource.tagging.config.location=${smbd.home}/conf/taggingconfig.xml

