##############################
##Data Enrichment Properties##
##############################

# These must be called smbd.enrichment.<name> 
# <name> can be whatever you want but must be unique in this file


smbd.enrichment.CustomerID_Customer_ID  {
	"tablename":"(SELECT TO_CHAR(EXPIRY_DATE,'YYYYMMDD') AS EXPIRY_DATE,CUSTOMER_ID FROM CUSTOMER_MONITORING_LIST) CUSTOMER_MONITORING_LIST",
	"inputDataFieldToMatch":"CustomerID",
	"enrichmentColumnToMatch":"Customer_ID",
	"columnsToAdd":[{"Expiry_date":"CustomerMonitoringList_Expiry_date"}]
}

smbd.enrichment.SecondPartyCountry_Country_code  {
	"tablename":"COUNTRY",
	"inputDataFieldToMatch": "SecondPartyCountry",
	"enrichmentColumnToMatch": "Country_code",
	"columnsToAdd":[{"Tax_Haven_flag":"CountryFlagList_Tax_Haven_flag"},{"HighRisk_flag":"CountryFlagList_HighRisk_flag"},{"TerroristHaven_flag":"CountryFlagList_TerroristHaven_flag"},{"HumanTraffic_flag":"CountryFlagList_HumanTraffic_flag"},{"Wildlife_flag":"CountryFlagList_Wildlife_flag"}]
}

smbd.enrichment.TransactionType_Txn_Type_code {
	"tablename":"TRANSACTION_TYPE",
	"inputDataFieldToMatch": "TransactionType",
	"enrichmentColumnToMatch": "Txn_Type_code",
	"columnsToAdd":[{"Region":"TransactionTypeList_Region"},{"Scope":"TransactionTypeList_Scope"},{"Instrument":"TransactionTypeList_Instrument"}]
}

smbd.enrichment.Customers_Customer_Segment_1 {
	"tablename":"CUSTOMERS",
	"inputDataFieldToMatch": "CustomerID",
	"enrichmentColumnToMatch": "Customer_ID",
	"columnsToAdd":[{"CUSTOMER_SEGMENT_1":"CustomerSegment"}]
}

smbd.enrichment.Accounts {
	"tablename":"(SELECT a.account_id as account_id,a.account_balance, pst.product_id as product_id FROM accounts a JOIN product_source_type pst ON a.product_source_type_code=pst.product_source_type_code) ACCOUNTS",
	"inputDataFieldToMatch": "AccountID",
	"enrichmentColumnToMatch": "account_id",
	"columnsToAdd":[{"product_id":"AccountType"},{"account_balance":"AccountBalance"}]
}

smbd.enrichment.CreditDebit  {
	"filename":${smbd.home}/data/SUSPICIOUS_ACTIVITY/enrichments/CreditDebit.txt,
	"inputDataFieldToMatch":"CreditDebitCode",
	"enrichmentColumnToMatch":"Code",
	"columnsToAdd":[{"Credit_Debit":"CreditOrDebit"}]
}

smbd.enrichment.AccountID_Account_ID  {
        "tablename":"(SELECT TO_CHAR(EXPIRY_DATE,'YYYYMMDD') AS EXPIRY_DATE,ACCOUNT_ID FROM ACCOUNT_MONITORING_LIST) ACCOUNT_MONITORING_LIST",
        "inputDataFieldToMatch":"AccountID",
        "enrichmentColumnToMatch":"Account_ID",
        "columnsToAdd":[{"Expiry_date":"AccountMonitoringList_Expiry_date"}]
}

