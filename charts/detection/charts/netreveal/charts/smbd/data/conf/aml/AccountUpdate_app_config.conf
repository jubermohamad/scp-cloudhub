##########################
##File Layout Properties##
##########################

# The location of the datasource file(s) and corresponding header file, e.g. ../aml/AccountUpdate
# This corresponds to the location for the AccountUpdate datasource and aml domain
smbd.datasource.file.location=${smbd.home}/conf

#DataSource
smbd.datasource.input.type="RDBMS"
smbd.datasource.input.location=${smbd.home}/transaction_storage

# The location of the header file. Only the header file corresponding to the datasource files to be processed should be placed in this directory
smbd.header={{ .Values.solution.aml.accountUpdateAppConfig.smbdHeader | quote }}

# The delimiter of the datasource file
smbd.datasource.delimiter=|

smbd.datasource.filename.prefix="AccountUpdate_"
smbd.datasource.filename.suffix=""
smbd.datasource.filename.extension="txt"
smbd.datasource.filename.dateFormat="yyyyMMdd"

# Read transaction data from parquet or raw files during for each detections
smbd.readTransactionsFromParquet=false

# Location for storing transactions
smbd.transaction.output.location=${smbd.home}/transaction_storage

#turns out of order alerting ON/OFF for this datasource. Set to ON by default
smbd.detection.outoforderalerting={{ .Values.solution.aml.accountUpdateAppConfig.smbd.detection.outoforderalerting }}

#Location for storing the invalid transaction records
smbd.datasource.invalid.record.location=${smbd.home}/invalidrecords/accountUpdate

##########################
##Entity View Properties##
##########################

# Data Source Columns
smbd.view.DataSourceColumns {
			"RunDate":"String"
			"AccountBalanceBase":"Double"
			"RecordId":"String"
			"AccountID":"String"
			"CustomerID":"String"
			"CustomerSegment":"String"
			"OrganisationalUnit":"String"
			"DateOpened":"String"
			"DateClosed":"String"
}

#################################################################
##Properties to map Datasource fields to SMBD_DETECTION columns##
#################################################################

smbd.smbd_detection_table.mappings{
	DATASOURCE_ID:"AccountID",
}

##############################
##Data Enrichment Properties##
##############################


################################
##File Verification Properties##
################################

smbd.validation.failures.file.location=${smbd.home}/failures
