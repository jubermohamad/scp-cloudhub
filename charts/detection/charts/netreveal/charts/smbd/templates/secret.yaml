{{- $releaseName := .Release.Name -}}
{{- $chartName := .Chart.Name -}}
{{- $rootContext := . -}}
{{- $files := .Files -}}
{{- range $solution := .Values.global.nrSparkSolutionSwitches.smbd }}
apiVersion: v1
kind: Secret
metadata:
  name: "{{ $releaseName }}-{{ $chartName }}-{{ $solution }}-secret-configs"
  namespace: {{ $.Values.global.namespace }}
type: Opaque
data:
  {{- range $path, $_ := $files.Glob (printf "data/conf/%s/**" $solution) }}
  {{- if or (hasSuffix "application.conf" $path) (hasSuffix "environment.conf" $path) }}
  {{ trimPrefix (printf "data/conf/%s/" $solution) $path  |  replace "/" "__" |  replace " " "--"}}: {{ tpl ($files.Get $path) $| b64enc | quote }}
  {{- end }}
  {{- end }}
---
{{- end }}
