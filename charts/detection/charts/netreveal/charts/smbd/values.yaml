# Setting the environment for the application (e.g., "qa" for quality assurance, "dev" for development, "prod" for production)
app_env: "prod"
# Specifies whether to use NodeSelector, if true - NodeSelector will be used.
useNodeSelector: "false"
# NodeSelector configuration, specifically targeting nodes with the specified label (Will work only if useNodeSelector is set to true) Node should also have the same label.
nodeSelector:
  smbd-node: "true"
# Additional labels for SparkApplication
labels:
  app: smbd

helmSolution: "amlopt"

solution:
  aml:
    applicationConf:
      lastDayOfWeek: "friday"
      traceModeLevel: "OFF"
      detectionAlertInfoTruncateNumbers: "false"
      detectionAlertWeightTruncate: "false"
      processingmodel:
        learnermodelPmmlReasonsMaxPositiveFeatures: "20"
        learnermodelPmmlReasonsMaxNegativeFeatures: "20"
        learnermodelPmmlReasonsMaxPositiveDistance: "0.8"
        learnermodelPmmlReasonsMaxNegativeDistance: "0.8"
      profileFieldMemorySkipPresentDay: "false" #Enables MEMBEROF function to determine if the feature of the current record was not in the previous n reme,bered time periods. (i.e. NOT(MEMBEROF()) true/false
      timestampFormat: "yyyyMMddHHmmss" # Specifies the format of the EVENT_DATE column in an Alert
      scenariostate:
        active: "ON" # Scenario state
        persister: "DB" #Possible configurations: LOG, DB.
      fingerprint:
        columns: "EVENT_DATE,CHECK_NAME,ENTITY_NAME,VIEW_NAME,VIEW_ID,DATASOURCE_ID" # Alert-Saver Fingerprinting Properties
        legacyFormat: "OFF" # #Possible values ON, OFF
      simulatorAlertTableTimebaseMappings:
        orgunitCode: "segment_Organisation"
        customerSegment: "segment_Type"
      processorThrowGeneralErrorOnAllCaughtExceptions: "true" # #[SMBD Processor setting] set true, to throw RuntimeException when any service throws an error (for onError = STOP or CONTINUE)
      configurationDumping: "ALL" # # Possible values OFF(default), ALL, EXCLUDEDATASOURCE
      detection:
        oooalertingTimebasedDatasources: "Transaction|IETAlert" # #a pipe separated list of datasource(s) to run out of order alerting against for time-based detections
        profileReaderMode: "true"
        functions:
          getTotalsSinceDate: # Optional configuration of custom date formats for event date parameter in GetTotalSinceDate
            supportExtraEventDateFormats: "false" # true|false (default is false)
            extraEventDateFormatsSep: "," # <separator string> (default is comma , )
            extraEventDateFormats: "ddMMyyyy,yyyyMMdd,dd/MM/yyyy" # # <String of date formats, separated by extraEventDateFormatsSep, for example: "ddMMyyyy,yyyyMMdd,dd/MM/yyyy">
      infoListsSkip:
        type: "" # "Info list, Blacklist" -  #Turns off the loading of defined list types. Default: ""
        name: "" # Turns off the loading of defined list names. Default: "", "TransactionTypeList"
      floatingSegmentation: "false" # Turns on the floating segmentation feature. Possible values false(default), true
      datasetgenerator:
        outputDots: "true" # AML IET Dataset Generator Properties - default "true"
      # Extra list of parameters for AML application.conf
      # Example: ["param1=value1", "param2=value2"]
      extraParameters: []
    accountUpdateAppConfig:
      smbdHeader: "RecordId|RunDate|AccountID|CustomerID|CustomerSegment|OrganisationalUnit|DateOpened|DateClosed|AccountBalanceBase"
      smbd:
        detection:
          outoforderalerting: "OFF" #turns out of order alerting ON/OFF for this datasource. Set to ON by default
    alertFeedbackAppConfig:
      smbdHeader: "AlertId|RunDate|AccountID|CustomerID|CustomerSegment|OrganisationalUnit|CheckName|AlertWeight|AlertInfo"
      smbd:
        datasource:
          entityValueSkipEmptyKey: "true"
        detection:
          outoforderalerting: "OFF" #turns out of order alerting ON/OFF for this datasource. Set to ON by default
    ietAlertAppConfig:
      smbdHeader: ""
      smbd:
        datasource:
          entityValueSkipEmptyKey: "false"
        detection:
          outoforderalerting: "ON" #turns out of order alerting ON/OFF for this datasource. Set to ON by default
        inverseProfiling: "false"
    ietAlertAppConfigDSG:
      smbd:
        datasource:
          entityValueSkipEmptyKey: "false"
    internalAppConfig:
      smbdHeader: "CHECK_NAME|OrganisationalUnit|VIEW_ID|TxnDate"
      smbd:
        detection:
          outoforderalerting: "OFF" #turns out of order alerting ON/OFF for this datasource. Set to ON by default
    iuCustomerAppConfig:
      # The location of the header file. Only the header file corresponding to the datasource files to be processed should be placed in this directory
      smbdHeader: "RunTimestamp|CustomerID|OrganisationalUnit|CustomerSourceRefId|PersonTitle|FirstName|MiddleNames|LastName|Suffix|CustomerName|CompanyName|CompanyForm|RegisteredNumber|IncorporationDate|IncorporationCountryCode|BusinessType|BusinessSegment1|BusinessSegment2|Initials|DateOfBirth|NameOfBirth|Address|Zone|City|PostalCode|CountryOfResidence|CountryOfOrigin|NationalityCode|PlaceofBirth|GenderCode|PrimeBranchId|RelationshipMgrId|EmployeeFlag|EmployeeNumber|MaritalStatus|Occupation|EmploymentStatus|AcquisitionDate|CancelledDate|CustomerTypeCode|CustomerStatusCode|CustomerSegment1|CustomerSegment2|CustomerSegment3|ResidenceFlag|SpecialAttentionFlag|DeceasedFlag|DormantOverrideDate|RiskScore|BankruptFlag|CompensationReqdFlag|CustomerComplaintFlag|EndRelationshipFlag|MerchantNumber|FaceToFaceFlag|Channel|Age|NearBorderFlag|IntendedProductUse|SourceOfFunds|ComplexStructure|ExpectedAnnualTurnover|TradingDuration|BalanceSheetTotal|VatNumber|BrokerCode|BlackListedFlag|DomainCode|Comments|PepFlag|WireInMonNum|WireOutMonNum|WireInMonVol|WireOutMonVol|CashInMonVol|CashOutMonVol|ChkInMonVol|ChkOutMonVol|OverallScoreAdjustment|TaxNumber|TaxNumberIssuedBy|CustomerCategoryCode|OwnAffiliateFlag|MarketingServiceLevel|SanctionedFlag|PepType|PepRelatedFlag|AddressValidFrom|AddressValidTo|Email|EmailValidFrom|EmailValidTo|CountryCode|AreaCode|PhoneNumber|PhoneExtension|PhoneValidFrom|PhoneValidTo|AlternateName|TaxNumberType|BusinessClassificationCode|BusinessClassificationSystem"
      smbd:
        detection:
          outoforderalerting: "OFF" #turns out of order alerting ON/OFF for this datasource. Set to ON by default
    sensaAalAppConfigDSG:
      smbd:
        datasource:
          entityValueSkipEmptyKey: "false"
    sensaAlertScoreAppConfig:
      smbdHeader: "RunTimestamp|AlertID|CustomerID|OrganisationalUnit|OverallRiskScore|AnomalyDetectionScore|ChangeInBehaviourScore|HotspotScore|RiskSimilarityScore"
      smbd:
        detection:
          outoforderalerting: "OFF" #turns out of order alerting ON/OFF for this datasource. Set to ON by default
    sensaAlertScoreAppConfigDSG:
      smbd:
        datasource:
          entityValueSkipEmptyKey: "false"
    sensaCustomerScoreAppConfig:
      smbdHeader: "RunTimestamp|CustomerID|OrganisationalUnit|OverallRiskScore|AnomalyDetectionScore|ChangeInBehaviourScore|HotspotScore"
      smbd:
        detection:
          outoforderalerting: "OFF" #turns out of order alerting ON/OFF for this datasource. Set to ON by default
    transactionAppConfig:
      smbdHeader: "TxnDate|TransactionID|SourceTxnNum|AccountID|AccountSourceRefID|CustomerID|CustomerSourceRefID|BranchID|TransactionType|OwnAccountTransfer|CurrencyCodeOrig|Currency|RegisterDate|PostingDate|ValueDate|SystemTimestamp|LocalTimestamp|ProductSourceTypeCode|TxnVolume|DeviceId|AmountCurrency|AmountBaseCurrency|CreditOrDebit|TransRefDesc|TransRefDesc2|TransRefDesc3|TransRefDesc4|TransRefDesc5|TransRefDesc6|ClientDePassage|TxnStatusCode|TxnChannelCode|SourceSystemCode|ErrorCorrectFlag|TransactionLocation|OrganisationalUnit|TxnUsrDtls|DvcPosEntryMode|PinVerifyCd|CardID|EmployeeID|SecondPartyName|SecondPartyAddress|SecondPartyZone|SecondPartyPostalCode|SecondPartyCity|SecondPartyCountry|SecondPartyAccount|SecondPartyAccountName|SecondPartyAccountType|SecondPartyAccountIban|SecondPartyBIC|SecondPartyBankName|SecondPartyBankCode|SecondPartyBankAddress|SecondPartyBankCity|SecondPartyBankZone|SecondPartyBankPostalCode|SecondPartyBnkCntryCd|OriginatorName|BeneficiaryName|OriginatorBankName|BeneficiaryBankName|TellerId|CardSourceRefId|CheckNumber|CheckAccountNumber|CheckAmount|CashbackAMT"
      smbd:
        detection:
          outoforderalerting: "OFF" #turns out of order alerting ON/OFF for this datasource. Set to ON by default
      inverseProfiling: "false"
    sparkConf:
      "spark.sql.shuffle.partitions": "1"
      "spark.sql.autoBroadcastJoinThreshold": "-1"
      "spark.driver.userClassPathFirst": "false"
      "spark.kubernetes.submission.connectionTimeout": "60000000"
      "spark.kubernetes.submission.requestTimeout": "60000000"
      "spark.kubernetes.driver.connectionTimeout": "60000000"
      "spark.kubernetes.driver.requestTimeout": "60000000"
    driver:
      cores: 1
      coreLimit: "1000m"
      memory: "3000m"
    executor:
      cores: 1
      instances: 1
      memory: "3000m"
