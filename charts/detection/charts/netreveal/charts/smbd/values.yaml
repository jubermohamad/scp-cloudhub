# Used only in example SparkApplication configuration. It is not used for SMBD job run from Application.
driver:
  cores: 1
  coreLimit: "1000m"
  memory: "2000m"
  javaOptions: "-Dsmbd.home=/opt/smbd -Dlog4j.configuration=file:/opt/smbd/conf/log4j.properties"

# Used only in example SparkApplication configuration. It is not used for SMBD job run from Application.
executor:
  cores: 1
  instances: 3
  memory: "3000m"
  javaOptions: "-Dsmbd.home=/opt/smbd -Dlog4j.configuration=file:/opt/smbd/conf/log4j.properties"

#DATABASE CONNECTION
jdbc:
  driver: "org.postgresql.Driver"
  userid: ""
  passwd: ""
  encryptionMethod: "plainText"
keystore:
  filename: ""
  password: ""
  key_password: ""

#STORAGE
storage:
  # nfs_server_endpoint: "10.222.17.49"
  nfs_server_dir: "/var/nfs_k8s/smbd"
  storage: "5Gi"
  storageClassName: ""
  hostPathMinikube: "/opt/netreveal/smbd"

# SMBD
# week
timeToLiveSeconds: 604800
imageRepository: "nri-nrod-k8s-smbd"
imageTag: "9.6.0.4-3.5.6-jdk17-20260305152857"
imagePullPolicy: IfNotPresent
mainClass: com.netreveal.processor.SmbdProcessorRunner
mainApplicationFile: "local:///opt/smbd/lib/smbd.jar"
arguments: "-beginDate; 20160120; -endDate; 20160121; -processName; OutOfBox"
sparkVersion: "3.5.6"
serviceAccount: spark-app
restartPolicy:
  type: Never
  retries:
    onFailureRetries: 22
    onFailureRetryInterval: 20
    onSubmissionFailureRetries: 20
    onSubmissionFailureRetryInterval: 20

# This configuration is required for the default SparkApplication and for generating "spark.operator.spark.conf" (will not be required in future).
# sparkConf.spark.driver.extraClassPath and sparkConf.spark.executor.extraClassPath are also used for Solution specific parameters.
sparkConf:
  "spark.driver.extraClassPath": "local:///opt/smbd/lib/bcprov.jar:local:///opt/smbd/lib/postgresql.jar"
  "spark.executor.extraClassPath": "local:///opt/smbd/lib/bcprov.jar:local:///opt/smbd/lib/postgresql.jar"
  "spark.sql.shuffle.partitions": "1"
  "spark.sql.autoBroadcastJoinThreshold": "-1"
  "spark.driver.userClassPathFirst": "false"
  "spark.kubernetes.submission.connectionTimeout": "60000000"
  "spark.kubernetes.submission.requestTimeout": "60000000"
  "spark.kubernetes.driver.connectionTimeout": "60000000"
  "spark.kubernetes.driver.requestTimeout": "60000000"

monitoring:
  exposeDriverMetrics: true
  exposeExecutorMetrics: true
  prometheus:
    jmxExporterJar: "/opt/smbd/lib/jmx_prometheus_javaagent.jar"
    port: 8090

# Primary Volume, Release Name will be added to the volume name
amlVolumes:
- name: aml-smbd-data-pvc
  persistentVolumeClaim:
    claimName: aml-smbd-data-pvc
amlcbVolumes:
- name: amlcb-smbd-data-pvc
  persistentVolumeClaim:
