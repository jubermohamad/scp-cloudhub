---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-ui-configmap
  namespace: "{{ .Values.global.namespace }}"
data:
  config.yml: |-
    kafka:
      clusters:
        - name: dev
          bootstrapServers: {{ include "generate.name.with.release.name" (list $ . "kafka") }}-kafka-bootstrap.{{ .Values.global.namespace }}.svc:9092
    auth:
      type: "LOGIN_FORM"
    management:
      health:
        ldap:
          enabled: false
