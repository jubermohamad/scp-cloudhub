---
apiVersion: v1
kind: Secret
metadata:
  name: "{{ .Release.Name }}-wlm-pn-rt-logging-property"
  namespace: {{ .Values.global.namespace }}
  labels:
    app: "{{ .Release.Name }}-wlm-pn-rt-logging-property"
type: Opaque
data:
  {{- if .Files.Get "property/logging.properties" }}
  logging.properties: {{ .Files.Get "property/logging.properties" | b64enc }}
  {{- else }}
  {{ fail "You need to supply your logging.properties file! Add 'logging.properties' to your chart 'property' directory." }}
  {{- end }}
