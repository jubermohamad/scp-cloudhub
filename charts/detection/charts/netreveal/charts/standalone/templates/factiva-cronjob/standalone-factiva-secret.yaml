{{- if or .Values.factiva.job.enableDailyJob .Values.factiva.job.enableWeeklyJob }}
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: "{{ include "secret.standalone.factiva.script.name" . }}"
  namespace: {{ .Values.global.namespace }}
  labels:
    app: "{{ include "secret.standalone.factiva.script.name" . }}"
data:
  downloadFactiva.sh: {{ tpl (.Files.Get "scripts/factiva/downloadFactiva.sh") . | b64enc  }}
  netreveal_batch.conf: {{ tpl (.Files.Get "scripts/factiva/netreveal_batch.conf") . | b64enc  }}
  executeDBScript.sh: {{ tpl (.Files.Get "scripts/factiva/executeDBScript.sh") . | b64enc  }}
  isBatchWLMRunning.sql: {{ tpl (.Files.Get "scripts/factiva/isBatchWLMRunning.sql" ) . |  b64enc }}
  isListImported.sql: {{ tpl (.Files.Get "scripts/factiva/isListImported.sql" ) . |  b64enc }}
  getListImportStartDate.sql: {{ tpl (.Files.Get "scripts/factiva/getListImportStartDate.sql" ) . |  b64enc }}
{{- end }}