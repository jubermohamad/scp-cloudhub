---
apiVersion: v1
kind: Secret
metadata:
  name: minio-creds
  namespace: {{ .Values.global.namespace }}
type: Opaque
stringData:
  config.yaml: |
  root-user: "{{ .Values.global.minio.user }}"
  root-password: "{{ .Values.global.minio.password }}"
---
apiVersion: v1
kind: Secret
metadata:
  name: minio-creds-operator
  namespace: {{ .Values.global.namespace }}
type: Opaque
stringData:
  config.env: |-
    export MINIO_ROOT_USER="{{ .Values.global.minio.user }}"
    export MINIO_ROOT_PASSWORD="{{ .Values.global.minio.password }}"
