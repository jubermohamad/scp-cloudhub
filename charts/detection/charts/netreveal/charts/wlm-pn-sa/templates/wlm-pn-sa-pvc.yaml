{{- if (or (eq .Values.global.clusterType "nfs") (eq .Values.global.clusterType "minikube")) }}
{{ $currentScope := .}}

{{- range $i, $e := until (.Values.pod.replicas | int) }}
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ $.Release.Name }}-wlm-pn-sa-logs-{{ $i }}
  labels:
    resource/type: pv
  namespace: {{ $.Values.global.namespace }}
spec:
  {{- with $currentScope }}
  storageClassName: {{ include "storage.storageClassName" . }}
  {{- end }}
  capacity:
    {{- with $currentScope }}
    storage: {{ include "wlmPnSa.pvcApplicationLogsStorage" . }}
    {{- end }}
  accessModes:
    - ReadWriteOnce
  claimRef:
    {{- with $currentScope }}
    namespace: {{ $.Values.global.namespace }}
    {{- end }}
    kind: PersistentVolumeClaim
    {{- with $currentScope }}
    {{- $stsName := include "generate.name.with.release.name" (list $ . "wlm-pn-sa") }}
    name: {{ include "generate.name.with.release.name" (list $ . (printf "%s-%s-%d" "wlm-pn-sa-logs" $stsName $i)) | quote }}
    {{- end }}
  {{- if eq $.Values.global.clusterType "minikube" }}
  hostPath:
    path: {{ $.Values.pv.hostPathMinikube }}/{{ $.Release.Name }}-{{ $.Values.global.namespace }}/wlm-pn-sa-{{ $i }}/logs
  {{- else }}
  nfs:
    server: {{ $.Values.global.pv.host }}
    path: {{ $.Values.pv.hostPath }}/{{ $.Release.Name }}-{{ $.Values.global.namespace }}/wlm-pn-sa-{{ $i }}/logs
  {{- end }}
{{- end }}

