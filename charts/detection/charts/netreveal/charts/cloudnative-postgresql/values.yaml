# ER configuration settings
er:
  entresRole: nr_uel_user_role
  entresUser: entres
  tablespace:
    nrUel:
      name: nr_uel
      size: "10Gi"
    nrUelIdx:
      name: nr_uel_idx
      size: "20Gi"

bootstrap:
  enabled: true
  config:
    bootstrap:
      initdb: true # placeholder for a condition to be evaluated
# Here is the example for enabling recovery
# bootstrap:
#   enabled: true
#   config:
#     bootstrap:
#       recovery:
#         source: netreveal-postgresql-cluster

dbstats:
  schedule: "0 22 * * *"
  # This field defines a deadline (in whole seconds) for starting the Job, if that Job misses its scheduled time for any reason.
  startingDeadlineSeconds: 3600

backup:
  enabled: true
  retentionPolicy: "7d"
  barmanObjectStore:
    destinationPath: s3://backup/
    wal:
      compression: bzip2
    data:
      compression: bzip2
    s3Credentials:
      accessKeyId:
        name: psql-minio-creds
        key: rootUser
      secretAccessKey:
        name: psql-minio-creds
        key: rootPassword

# https://cloudnative-pg.io/documentation/1.20/scheduling/
affinity:
  # Default affinity generated by cnpg. This requires to define:
  #   - enablePodAntiAffinity: true
  enablePodAntiAffinity: false
  podAntiAffinityType: "preferred"
  topologyKey: "topology.kubernetes.io/zone"

  additionalPodAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchLabels:
              cnpg.io/cluster: '{{ include "postgresql.service.name.no.quotes" . }}'
              app.kubernetes.io/release.name: "{{ .Release.Name }}"
          topologyKey: "topology.kubernetes.io/zone"

image:
  repository: ghcr.io/cloudnative-pg/postgresql
  tag: "16.3"
instances: 3
logLevel: info
backups:
  schedule: "0 0 0 * * 0"

# primaryUpdateStrategy: unsupervised
superuserSecret: postgres-credential-postgres-user-cnpg

postgresql:
  parameters:
    shared_buffers: "512MB"
    max_connections: "300"
    lc_messages: "en_US.utf8"
    lc_monetary: "en_US.utf8"
    lc_numeric: "en_US.utf8"
    lc_time: "en_US.utf8"
#     pg_stat_statements.max: '10000'
#     pg_stat_statements.track: all
#     auto_explain.log_min_duration: '10s'

storage:
  size: 10Gi
  storageClass: standard

managed:
  roles:
  - name: apps
    ensure: present
    comment: apps
    login: true
    superuser: false
    passwordSecret:
      name: postgres-credential-apps-user-cnpg
# - name: aapsparkuser
#   ensure: present
#   comment: aapsparkuser
#   login: true
#   superuser: false
#   passwordSecret:
#     name: postgres-credential-aapsparkuser-user-cnpg

resources:
  requests:
    memory: "1024Mi"
    cpu: 1
  limits:
    memory: "1024Mi"
    cpu: 1

cronjob:
  psqlInitDockerImage: "nri-nrod-k8s-db:16.10-20250917073342"

commonAnnotations:
  prometheus.io/port: "9187"
  prometheus.io/scrape: "true"
