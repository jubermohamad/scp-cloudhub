smart.output.skipSchema=true


smart.dateFormat={{ .Values.solutionsParameters.ietwlmarte.smart.dateFormat }}
smart.timestampFormat={{ .Values.solutionsParameters.ietwlmarte.smart.timestampFormat }}

#Separator for MULTIVALUE  datatype property
smart.multiValueSeparator={{ .Values.solutionsParameters.ietwlmarte.smart.multiValueSeparator | quote }}

smart.domainCode=WLM_TRA

#Options are: File, Topic, DB
processingmodel.persistence.type={{ .Values.solutionsParameters.ietwlmarte.processingmodel.persistence.type }}
#When modelId=-1, lists will also be loaded from file
processingmodel.modelId={{ .Values.solutionsParameters.ietwlmarte.processingmodel.modelId }}
# In Cluster mode config files should be directly in home, eg.
processingmodel.xmlFilePath=./conf/model/processingmodel.xml

processingmodel.score.combiner.concat.separator={{ .Values.solutionsParameters.ietwlmarte.processingmodel.score.combiner.concat.separator | quote }}

processingconfig.xmlFilePath=./conf/Processing_config.xml
thresholdingconfig.xmlFilePath=./conf/ScoreThresholding_config.xml

# Extra ietwlmarte configuration parameters
{{- if .Values.solutionsParameters.ietwlmarte.applicationConf.extraParameters }}
{{ include "rtde.application.conf.extra.params" .Values.solutionsParameters.ietwlmarte.applicationConf.extraParameters }}
{{- end }}
