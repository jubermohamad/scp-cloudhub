#resources.SqlLiteLookupJdbcConnection.jdbc.driver=org.sqlite.JDBC
#resources.SqlLiteLookupJdbcConnection.jdbc.url="jdbc:sqlite::memory:"
#resources.SqlLiteLookupJdbcConnection.jdbc.url="jdbc:sqlite:SLQLite/profileLookup.db"
