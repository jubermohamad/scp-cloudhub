# Database properties
jdbc.driver="{{ .Values.jdbc.driver }}"
jdbc.url="{{- template "db.jdbc.url" . }}"
jdbc.userid="{{ .Values.jdbc.userid }}"
jdbc.passwd="{{ .Values.jdbc.passwd }}"

# Possible values plainText, encrypted, encrypted2
jdbc.encryptionMethod="{{ .Values.jdbc.encryptionMethod }}"
# Default value {smart.home}/conf/norkom.nks
#jdbc.encryptionKeyFile=./conf/norkom.nks

# Spark checkpoint location (also it can be set by environment variable spark.sql.streaming.checkpointLocation)
#spark.streaming.checkpointLocation=/path/to/checkpoint/location

# Kafka propertiess
kafka.bootstrap.servers="{{ include "kafka.bootstrap.servers.service.name" . }}"
kafka.startingOffsets=latest
kafka.includeTimestamp=true
kafka.failOnDataLoss=false
kafka.fetch.message.max.bytes={{ .Values.solutionsParameters.odddetarte.kafka.fetch.message.maxBytes }}
kafka.model.fetch.message.max.bytes={{ .Values.solutionsParameters.odddetarte.kafka.model.message.maxBytes }}
kafka.max.request.size={{ .Values.solutionsParameters.odddetarte.kafka.maxRequestSize }}

{{- if .Values.solutionsParameters.odddetarte.kafka.extraParameters }}
{{ include "rtde.environment.conf.kafka.extra.params" .Values.solutionsParameters.odddetarte.kafka.extraParameters }}
{{- end }}

{{ include "rtde.kafka.security" . | nindent 0 }}

# [Optional] Interval in seconds of how often Kafka offsets should be taken from checkpoint to be available after RTDE restart.
# If not set, the minimum intervalSeconds value from all processes will be used.
#kafka.offsetsMonitoringIntervalSec=5

# Custom Kafka properties
# Here you can use kafka.customConfig.* prefix to add every Kafka property supported by Spark
# Kafka client or native Kafka client. Please remember that Spark-Kafka properties may require
# extra kafka.* prefix in comparison to original Kafka properties names. For encrypted property
# values like passwords you can mark them using kafka.customConfigEncrypted.* prefix with 'true'
# value. Custom configuration example for Kafka SSL connection:
#kafka.customConfig.kafka.security.protocol=SSL
#kafka.customConfig.kafka.ssl.truststore.location=/path/to/keys/and/certificates/kafka.server.truststore.jks
#kafka.customConfig.kafka.ssl.truststore.password=<encrypted password value>
#kafka.customConfig.kafka.ssl.keystore.location=/path/to/keys/and/certificates/kafka.server.keystore.jks
#kafka.customConfig.kafka.ssl.keystore.password=<encrypted password value>
#kafka.customConfig.kafka.ssl.key.password=<encrypted password value>
#kafka.customConfig.kafka.ssl.endpoint.identification.algorithm=
# Properties containing encrypted values:
#kafka.customConfigEncrypted.kafka.ssl.truststore.password=true
#kafka.customConfigEncrypted.kafka.ssl.keystore.password=true
#kafka.customConfigEncrypted.kafka.ssl.key.password=true
# To enable SASL/PLAIN
#kafka.customConfig.kafka.security.protocol=SASL_PLAINTEXT
#kafka.customConfig.kafka.sasl.mechanism=PLAIN

# HDFS path to Kafka Internal Offsets Store (Yarn clusters only!)
#kafka.internalOffsetsStore.hdfs=hdfs://path_to_internal_kafka_offsets_store


# List of Hadoop configuration files required to enable HDFS support (Yarn clusters only!)
#hadoop.conf.resources.0=/etc/hadoop/conf/core-site.xml
#hadoop.conf.resources.1=/etc/hadoop/conf/yarn-site.xml
#hadoop.conf.resources.2=/etc/hadoop/conf/hdfs-site.xml
# Read all RTDE shared files from HDFS (no need of providing hdfs:// protocol prefix in file paths).
# It is for Model Refreshing File Signal, Spark Checkpoint, Kafka Internal Offsets Store
#hadoop.smart.sharedFiles.useHdfs=true|false


profiles.compound.filePath=./profile_output_location/compound


# Possible values json, binary. json is the default value.
kafka.internal.message.format={{ .Values.solutionsParameters.odddetarte.kafka.internal.message.format }}

# List of used named resources:
resources.list.0 = CommonCacheManager
resources.list.1 = InMemorySharedListJdbcConnection
#resources.list.2 = ServicesManagerHttpConnection
#resources.list.3 = SqlLiteLookupJdbcConnection
#resources.list.4 = JdbcPooledConnection
#resources.list.N = OtherResource


# Parameters of each resource (resources.<resource name>.<parameter path>)

resources.CommonCacheManager.class=com.netreveal.resources.impl.cache.NearCacheManager

resources.InMemorySharedListJdbcConnection.class=com.netreveal.resources.impl.jdbc.JdbcPooledConnection
resources.InMemorySharedListJdbcConnection.jdbc.driver=org.h2.Driver
resources.InMemorySharedListJdbcConnection.jdbc.url="jdbc:h2:mem:test;DB_CLOSE_DELAY=-1"
