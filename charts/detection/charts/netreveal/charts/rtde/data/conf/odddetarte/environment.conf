## Custom HikariCP properties follow this syntax: resources.<resource name>.dataSource.<property name>=<property value>
## Examples:
#resources.JdbcPooledConnection.dataSource.cachePrepStmts=true
#resources.JdbcPooledConnection.dataSource.prepStmtCacheSize=250

# List of used named resource access objects:

resources.accessLayerObjects.0 = InMemoryDBBasedSharedList
resources.accessLayerObjects.1 = cacheForARowWhere
resources.accessLayerObjects.2 = cacheContainsARowWhere
#resources.accessLayerObjects.3 = ServicesManagerEnhancer
#resources.accessLayerObjects.4 = SqlProfileWriter
#resources.accessLayerObjects.5 = JdbcSqliteShortTermProfiles
#resources.accessLayerObjects.M = OtherResourceAccessObject

resources.accessLayerObject.InMemoryDBBasedSharedList.class=com.netreveal.resources.impl.sharedlists.InMemoryDBBasedSharedList
resources.accessLayerObject.InMemoryDBBasedSharedList.resourceName=InMemorySharedListJdbcConnection

resources.accessLayerObject.cacheForARowWhere.class=com.netreveal.resources.impl.cache.NearCache
resources.accessLayerObject.cacheForARowWhere.resourceName=CommonCacheManager
resources.accessLayerObject.cacheForARowWhere.valueDataType=String
resources.accessLayerObject.cacheForARowWhere.heap=2000
# possible TTL options: resources.accessLayerObject.<resource name>.timeToLive.sec|mins|hours|days=<integer>
resources.accessLayerObject.cacheForARowWhere.timeToLive.sec=30

resources.accessLayerObject.cacheContainsARowWhere.class=com.netreveal.resources.impl.cache.NearCache
resources.accessLayerObject.cacheContainsARowWhere.resourceName=CommonCacheManager
resources.accessLayerObject.cacheContainsARowWhere.valueDataType=Boolean
resources.accessLayerObject.cacheContainsARowWhere.heap=2000
# possible TTL options: resources.accessLayerObject.<resource name>.timeToLive.sec|mins|hours|days=<integer>
resources.accessLayerObject.cacheContainsARowWhere.timeToLive.sec=30

#resources.accessLayerObject.SqlProfileWriter.class=com.netreveal.resources.impl.writers.sql.JdbcProfileWriter
#resources.accessLayerObject.SqlProfileWriter.resourceName=SqlLiteLookupJdbcConnection
#resources.accessLayerObject.SqlProfileWriter.sql.timestamp.column.type=PROCESSING_MODEL_DEFINED

# Parameters of each resource access object (RAO) (resources.accessLayerObject.<RAO name>.<parameter path>)

#Example:
#resources.accessLayerObject.<RAO name>.class=com.netreveal.resources.impl...ResourceAccessObjectClass
#resources.accessLayerObject.<RAO name>.resourceName=<name of resource which provides the connection for this RAO>
#resources.accessLayerObject.<RAO name>.<RAO implementation property path> = ...
#resources.accessLayerObject.<RAO name>.<RAO implementation property path> = ...

#resources.accessLayerObject.ServicesManagerEnhancer.class=com.netreveal.resources.impl.lookups.webservice.ServicesManager
#resources.accessLayerObject.ServicesManagerEnhancer.resourceName=ServicesManagerHttpConnection
#resources.accessLayerObject.ServicesManagerEnhancer.servicesManager.http.urlEndpoint=/norkom/services/process
#resources.accessLayerObject.ServicesManagerEnhancer.servicesManager.http.urlParameter.type=GSV

# List of used named resource access objects for reading sql like db:

#resources.accessLayerObject.JdbcSqliteShortTermProfiles.class=com.netreveal.resources.impl.lookups.sql.JdbcSqlTable
#resources.accessLayerObject.JdbcSqliteShortTermProfiles.resourceName=SqlLiteLookupJdbcConnection
#resources.accessLayerObject.JdbcSqliteShortTermProfiles.sql.timestamp.column.type=PROCESSING_MODEL_DEFINED
#SQL Query type corresponds to structure of the table storing profiles data: CLASSIC (default) = table with separate columns for profile fields; PROFILE_JSON = table generated by SMBD Profile Exporter
#resources.accessLayerObject.JdbcSqliteShortTermProfiles.sql.query.type=CLASSIC

#Optional property, default value is "".
#kafka.topic.name.prefix=dev_

resources.list.3= cacheBinaryRowParser

resources.cacheBinaryRowParser.class=com.netreveal.resources.impl.cache.NearCache
resources.cacheBinaryRowParser.valueDataType=Any
resources.cacheBinaryRowParser.heap=1000
# possible TTL options: resources.<resource name>.timeToLive.sec|mins|hours|days=<integer>
resources.cacheBinaryRowParser.timeToLive.sec=600

#keystore properties
smart.keystore.password="{{ .Values.keystore.password }}"
smart.keystore.filename="{{ .Values.keystore.filename }}"
smart.key.password="{{ .Values.keystore.key_password }}"

# Extra odddetarte configuration parameters
{{- if .Values.solutionsParameters.odddetarte.environmentConf.extraParameters }}
{{ include "rtde.application.conf.extra.params" .Values.solutionsParameters.odddetarte.environmentConf.extraParameters }}
{{- end }}
