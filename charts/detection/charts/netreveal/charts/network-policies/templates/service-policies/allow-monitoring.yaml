---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-nr-ui-metrics
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app: {{ .Release.Name }}-nr-ui-instance-pod
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: {{ .Values.global.grafanaNamespace }}
    ports:
    - protocol: TCP
      port: 9990
