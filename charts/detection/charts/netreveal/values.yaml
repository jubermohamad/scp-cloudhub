zeppelin-server:
  replicaCount: 1

  image:
    zeppelin: nri-nrod-k8s-zeppelin:0.12.0-20260225113445
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    ports:
      http: 8080
      rpc: 12320
    targetPorts:
      http: 8080

  serviceAccount:
    create: true
    name: zeppelin-server

  resources:
    requests:
      memory: "1500Mi"
      cpu: "1000m"
    limits:
      memory: "3072Mi"
      cpu: "1000m"

  livenessProbe:
    httpGet:
      path: /health/liveness
      port: 8080
    failureThreshold: 3
    initialDelaySeconds: 60
    periodSeconds: 20
    successThreshold: 1
    timeoutSeconds: 5
  readinessProbe:
    httpGet:
      path: /health/readiness
      port: 8080
    failureThreshold: 3
    initialDelaySeconds: 60
    periodSeconds: 20
    successThreshold: 1
    timeoutSeconds: 5

  nodeSelector: {}
  tolerations: []
  affinity: {}

  auth:
    enabled: true
    users:
      - username: "admin"
        password: ""  # Leave empty to auto-generate on first install (persists across upgrades)
        roles: "admin"
      - username: "user"
        password: ""  # Leave empty to auto-generate on first install (persists across upgrades)
        roles: "user"

  persistence:
    enabled: true
    accessMode: ReadWriteOnce
    size: 10Gi
    annotations: {}

  config:
    SERVICE_DOMAIN: local.zeppelin-project.org:8080
    ZEPPELIN_HOME: /opt/zeppelin
    ZEPPELIN_SERVER_RPC_PORTRANGE: 12320:12320
    SPARK_MASTER: local[*]
    SPARK_HOME: /spark
    ZEPPELIN_RUN_MODE: local
    ZEPPELIN_K8S_NAMESPACE: netreveal

  ingress:
    enabled: true
    ingressAllowList:
      customerIPs: []
      platformIPs: []
    className: "nginx"
    annotations:
      nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
      nginx.ingress.kubernetes.io/affinity: "cookie"
      nginx.ingress.kubernetes.io/session-cookie-name: "stickcookie"
      nginx.ingress.kubernetes.io/session-cookie-expires: "172800"
      nginx.ingress.kubernetes.io/session-cookie-max-age: "172800"
      # kubernetes.io/ingress.class: nginx
      # kubernetes.io/tls-acme: "true"
    hosts:
      - host: "{{ include \"ingress.host.name\" (list $ . \"zeppelin\") }}"
        paths:
          - path: /
            pathType: ImplementationSpecific
    tls: []
