  replicas: 1
  clusterName: "opensearch-cluster"
  nodeGroup: "master"

  pv:
    hostPath: "/var/nfs_k8s/opensearch"
    hostPathMinikube: "/opt/netreveal/opensearch"

  persistence:
    size: 8Gi

  secret:
    hash: ""

