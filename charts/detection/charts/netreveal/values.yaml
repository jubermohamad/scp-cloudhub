smbd:
  #DATABASE CONNECTION
  jdbc:
    driver: "org.postgresql.Driver"
    userid: "apps"
    passwd: "RgUUblVfxebljNENGukrcJbiy1hqixiOZvc9V8IvYUs="
    encryptionMethod: "encrypted2"
  keystore:
    filename: "norkom.nks"
    password: ""
    key_password: ""
  storage:
    storage: 10Gi
    nfs_server_dir: "/var/nfs_k8s/smbd"
    storageClassName: ""
    hostPathMinikube: "/opt/netreveal/smbd"
  # week
  timeToLiveSeconds: 604800
  # Docker Image name and Tag without Registry name
  imageRepository: "nri-nrod-k8s-smbd"
  imageTag: "9.6.0.4-3.5.6-jdk17-20260305152857"
  imagePullPolicy: IfNotPresent
  # Used only in example SparkApplication configuration. It is not used for SMBD job run from Application.
  driver:
    cores: 1
    coreLimit: "1000m"
    memory: "2000m"
    javaOptions: "-Dsmbd.home=/opt/smbd -Dlog4j.configuration=file:/opt/smbd/conf/log4j.properties"
  # Used only in example SparkApplication configuration. It is not used for SMBD job run from Application.
  executor:
    cores: 1
    instances: 1
    memory: "2000m"
    javaOptions: "-Dsmbd.home=/opt/smbd -Dlog4j.configuration=file:/opt/smbd/conf/log4j.properties"
  solution:
    aml:
      applicationConf:
        lastDayOfWeek: "friday"
        traceModeLevel: "OFF"
        detectionAlertInfoTruncateNumbers: "false"
        detectionAlertWeightTruncate: "false"
        processingmodel:
          learnermodelPmmlReasonsMaxPositiveFeatures: "20"
          learnermodelPmmlReasonsMaxNegativeFeatures: "20"
          learnermodelPmmlReasonsMaxPositiveDistance: "0.8"
          learnermodelPmmlReasonsMaxNegativeDistance: "0.8"
        profileFieldMemorySkipPresentDay: "false" #Enables MEMBEROF function to determine if the feature of the current record was not in the previous n reme,bered time periods. (i.e. NOT(MEMBEROF()) true/false
        timestampFormat: "yyyyMMddHHmmss" # Specifies the format of the EVENT_DATE column in an Alert
        scenariostate:
          active: "ON" # Scenario state
          persister: "DB" #Possible configurations: LOG, DB.
        fingerprint:
          columns: "EVENT_DATE,CHECK_NAME,ENTITY_NAME,VIEW_NAME,VIEW_ID,DATASOURCE_ID" # Alert-Saver Fingerprinting Properties
          legacyFormat: "OFF" # #Possible values ON, OFF
        simulatorAlertTableTimebaseMappings:
          orgunitCode: "segment_Organisation"
          customerSegment: "segment_Type"
        processorThrowGeneralErrorOnAllCaughtExceptions: "true" # #[SMBD Processor setting] set true, to throw RuntimeException when any service throws an error (for onError = STOP or CONTINUE)
        configurationDumping: "ALL" # # Possible values OFF(default), ALL, EXCLUDEDATASOURCE
        detection:
