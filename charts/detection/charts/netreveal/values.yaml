############################################################################################################################################
opensearch:
  replicas: 1
  clusterName: opensearch-cluster
  imagePullSecrets:
    - name: "regcred"
  # soft: preferredDuringSchedulingIgnoredDuringExecution
  # hard: requiredDuringSchedulingIgnoredDuringExecution
  # custom: custom affinity rules defined with customAffinityRules
  antiAffinity: "soft"
  antiAffinityTopologyKey: "topology.kubernetes.io/zone"
  sysctlInit:
    enabled: true
  persistence:
    accessModes:
      - ReadWriteOnce
    size: 8Gi
    annotations: {}
  resources:
    requests:
      memory: "1024Mi"
      cpu: "1000m"
    limits:
      memory: "2048Mi"
      cpu: "1000m"

  livenessProbe:
    periodSeconds: 20
    timeoutSeconds: 5
    failureThreshold: 10
    successThreshold: 1
    initialDelaySeconds: 10
    tcpSocket:
      port: 9200

  opensearchJavaOpts: "-Xmx512M -Xms512M"
  secretMounts:
    - secretName: cert-opensearch
      name: tls-cert
      path: /usr/share/opensearch/config/tls/tls.crt
      subPath: tls.crt
      defaultMode: "0600"
    - secretName: cert-opensearch
      name: tls-key
      path: /usr/share/opensearch/config/tls/tls.key
      subPath: tls.key
      defaultMode: "0600"
    - secretName: cert-opensearch
      name: ca-cert
      path: /usr/share/opensearch/config/tls/ca.crt
      subPath: ca.crt
      defaultMode: "0600"
  extraEnvs:
    - name: DISABLE_INSTALL_DEMO_CONFIG
      value: "true"
  config:
    opensearch.yml: |
      cluster.name: opensearch-cluster
      network.host: 0.0.0.0
      plugins:
        security:
          ssl:
            transport:
              pemcert_filepath: /usr/share/opensearch/config/tls/tls.crt
              pemkey_filepath: /usr/share/opensearch/config/tls/tls.key
              pemtrustedcas_filepath: /usr/share/opensearch/config/tls/ca.crt
              enforce_hostname_verification: false
            http:
              enabled: true
              pemcert_filepath: /usr/share/opensearch/config/tls/tls.crt
              pemkey_filepath: /usr/share/opensearch/config/tls/tls.key
              pemtrustedcas_filepath: /usr/share/opensearch/config/tls/ca.crt
