            cpu: "250m"
          limits:
            memory: "1024Mi"
            cpu: "500m"
    pvc:
      pvcStorage: "10Gi"
    pv:
      hostPath: "/var/nfs_k8s/factiva"
      hostPathMinikube: "/opt/netreveal/factiva"
    factivaParameters:
      customFactivaInUse: "FALSE"
      customFactivaFilePrefix: ""
      checkWatchListIngestion: "FALSE"
      watchListTriggerOnlyAfterBatchFinishes: "TRUE"
      watchListBatchCompleteCheckRetryXTimes: "3"
      watchListBatchCompleteCheckRetryIntervalSeconds: "3600"
      watchListLoadRunningCheckRequired: "FALSE"
      watchListLoadRunningCheckRetryXTimes: "10"
      watchListLoadRunningCheckRetryIntervalInSeconds: "1800"
      username: ""
      password: ""
      url: ""

  worldcheck:
    job:
      enableDailyJob: false
      enableSmartDeleteJob: false
      enableWeeklyJob: false
      dailySchedule: "0 8 * * *"
      smartDeleteSchedule: "30 9 * * *"
      weeklySchedule: "0 10 * * 1"
      ttlSecondsAfterFinished: 7776000
      successfulJobsHistoryLimit: 10
      failedJobsHistoryLimit: 10
      pod:
