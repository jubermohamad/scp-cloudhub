############################################################################################################################################
global:
  toolsDockerImage: "nri-nrod-k8s-tools:1.0.5-20260312081036"
  #####################################################################
  # Section cert-manager and certificate lifecycle management
  issuer:
    ca:
      name: ca
    selfSigned:
      name: selfsigned
      certificate:
        duration: 87600h # 10 years
        renewBefore: 24h
  certificate:
    duration: 8760h # 1 year
    renewBefore: 24h
    subject:
      organizations:
      - Netreveal
      countries:
      - IE
      organizationalUnits:
      - IT
      localities:
      - Dublin
      provinces:
      - Dublin
    privateKey:
      algorithm: ECDSA
      size: 256
  #####################################################################
  prefixPvcWithReleaseName: true
  useResourceConstraints: "true" #true|false
  clusterType: "minikube" #aks/nfs/minikube
  # Global time zone identifier used for scheduling in configuration. Examples:
  # timeZone: "UTC"
  # timeZone: "Europe/Dublin"
  # timeZone: "Australia/Melbourne"
  timeZone: ""
  useImagePullSecrets: "true"
  netreveal:
    imagePullSecrets:
      - name: "regcred"
  # When kubePrometheusStackPresent=true then please define spark-operator.podMonitor.enable=true. Otherwise spark-operator.podMonitor.enable=false
  kubePrometheusStackPresent: false
  grafanaNamespace: "nr-monitoring"
  enableIngressNginx: false
  enableDataShim: true
  trustStore:
    password: ""
  prometheus:
    release: "netreveal"
  namespace: netreveal

  # Ingress properties
  ingressPrefix: "nr"
  ingressWildCardDns: "symphonyai.dev"
  ingressNamespace: "nr-infra-common"
  ingressAllowList:
    customerIPs: []
    platformIPs: []
  # Empty string|prod|production are not added into the ingress host name
  # Ingress host name is generated as:
  #   <global.ingressPrefix>-(<sub-chart-name> if required)-(<global.envType> if not empty or not "prod" or "production")-<global.clientSubDomain>.<global.ingressWildCardDns>
  envType: ""
  clientSubDomain: "clientsubdomain"

  pv:
    storageClassName: "standard"
    host: "10.222.17.61"
    rwmStorageClassName: ""

  # Define override for JAVA_OPTS required for JDK 17.
  java:
    java_opts: ""

  # Examples:
  #   ECR: 519876397211.dkr.ecr.eu-west-1.amazonaws.com
  #   ACR: nrengdev.azurecr.io
  #   DockerHub: index.docker.io/symphonysensa
  #
  # spark-operator.image - has to be defined with reposiotry name
  dockerRegistryName: "519876397211.dkr.ecr.eu-west-1.amazonaws.com"
  override:
    # Docker Image with project override configuration (<docker_image_name>:<docker_image_version>. Example: nri-nrod-k8s-nrod-override:9.2.0-1708615281000
    # Please keep this empty when there is no project override configuration.
    # Also together with the Docker Image chartEnable.<chart_name> should be set to "true".
    overrideDockerImageName: ""
    chartEnable:
      nrDpa: false
      nrUi: false
      standalone: false
      standaloneVersions:
        configuration: []
        database: []
      dbExtract: false
      wlmIgsSa: false
      wlmPnRt: false
      wlmPnRtVersions:
        configuration: []
      wlmPnSa: false
      wlmPnSaVersions:
        configuration: []
      wlmPnSaSim: false
      wlmPnSaSimVersions:
        configuration: []
      smbd: false
      rtde: false

  # Here you can enable or disable some subcharts for netreveal
  # true|false
  nrSubChartSwitches:
    enableAdminerEvo: false
    enableDpa: true
    enableER: false
    enableKafkaUI: true
    enableKeycloak: false
    enableKubePrometheusStack: false
    enableNetworkPolicies: true
    enableNrCustomMetrics: true
    enableOpenSearch: true
    enableRtde: true
    enableSensaAiSanctions: false
    enableSmbd: true
    enableSparkOperator: true
    enableWlm: true
    enableWlmSim: true
    enableZeppelinServer: false

  saml:
    enabled: false

  # Here you can enable or disable some configuration for netreveal
  # true|false
  nrSolutionsSwitches:
    aml:
      enabled: true
      modelOps:
        enabled: true
      amlOpt:
        enabled: true
      amlcust:
        enabled: true
      amlcb:
        enabled: false
      enableAmlAlertGeneration:
        enabled: true
    wlm:
      enabled: true
      wlmSp:
        enabled: true
      wlmTf:
        enabled: true
      sensaAiSanctions:
        enabled: false
    cdd:
      enabled: true
    fincen:
      enabled: true
    qaUsers:
      enabled: false

  # Here you can enable or disable spark solitions for SMBD and RTDE
  nrSparkSolutionSwitches:
    smbd:
      - aml
      - amlcust
      #      - amlcb
      - amlopt
    rtde:
      - odddetarte
      - obdetarte
      - ietwlmsparte
      - ietwlmarte
      - cddaatarte

  orgUnitUserPrefix: ""
  nrOrgUnits: []

  # true|false
  # false = it will not use root account for init script. It require to create directory structure with the proper permissions
  useRootAccountForInit: true

  sparkOperator:
    enabled: "true"
    protocol: "https"
    host: "kubernetes.default.svc"
    port: "443"
    apiVersion: "sparkoperator.k8s.io/v1beta2"
    serviceaccount: "/var/run/secrets/kubernetes.io/serviceaccount"

  externalCertificates: {}
    # external:
    #   # Secret name for external certificates
    #   secretName: "external-certificates"
    #   # Please provide:
    #   #   - cert and key: certificate and private key in PEM format
    #   #   - signedCertificate: signed certificate in PEM format
    #   # signedCertificate is used when all properties are defined.
    #   cert: "external.cert.crt"
    #   key: "external.cert.key"
    #   signedCertificate: "external.cert.cer"

  kafka:
    externalKafkaCertificates: {}
      # external:
      #   secretName: "external-kafka-certificates"
      #   # Please provide (truststoreCert) or (truststoreCertP12 and truststoreCertP12Password)
      #   # (truststoreCertP12 and truststoreCertP12Password) will be used when all properties are defined
      #   truststoreCert: "external.kafka.truststore.crt"
      #   truststoreCertP12: ""
      #   truststoreCertP12Password: ""
      #   # Please provide (keystoreCert and keystoreCertKey) or (keystoreCertP12 and keystoreCertP12Password)
      #   # (keystoreCertP12 and keystoreCertP12Password) will be used when all properties are defined
      #   keystoreCert: "external.kafka.keystore.crt"
      #   keystoreCertKey: "external.kafka.keystore.key"
      #   # keystore in PKCS12 format
      #   keystoreCertP12: "external.kafka.keystore.p12"
      #   # keystore password
      #   keystoreCertP12Password: "external.kafka.keystore.p12.password"
      # invhub:
      #   secretName: "external-kafka-certificates"
      #   truststoreCert: "invhub.kafka.truststore.crt"
      #   # Please provide (truststoreCert) or (truststoreCertP12 and truststoreCertP12Password)
      #   # (truststoreCertP12 and truststoreCertP12Password) will be used when all properties are defined
      #   truststoreCertP12: ""
      #   truststoreCertP12Password: ""
      #   # Please provide (keystoreCert and keystoreCertKey) or (keystoreCertP12 and keystoreCertP12Password)
      #   # (keystoreCertP12 and keystoreCertP12Password) will be used when all properties are defined
      #   keystoreCert: "invhub.kafka.keystore.crt"
      #   keystoreCertKey: "invhub.kafka.keystore.key"
      #   # keystore in PKCS12 format
      #   keystoreCertP12: "invhub.kafka.keystore.p12"
      #   # keystore password
      #   keystoreCertP12Password: "invhub.kafka.keystore.p12.password"

  # Common base_platform.properties parameters
  baseConfigProperties:
    applicationName: "Netreveal Application"
    # system.default.language
    systemDefaultLanguage: "en"
    # system.default.country
    systemDefaultCountry: "GB"
    mail:
      server: "localhost"
      # mailprotocol
      protocol: "smtp"
      # frommailid
      fromMailId: "eim@netreveal.ai"
      # mailpassword
      password: ""
      # mailuse
      user: ""
      # notification.email.from
      notificationEmailFrom: "Admin <test@netreveal.ai>"

    kafka:
      useExternalKafka: false
      # PLAINTEXT|SSL
      # For SSL proper certificates are required
      securityProtocol: SSL
      # kafka.topic.name.prefix
      topicNamePrefix: ""
      # kafka.bootstrap.servers (external). Required only when .globa.baseConfigProperties.kafka.useExternalKafka == true
      bootstrapServersSsl: "broker.netreveal.svc.cluster.local:9093"
      bootstrapServersPlaintext: "broker.netreveal.svc.cluster.local:9092"
      # Kafla SSL passwords
      sslKeystorePassword: "ENC:SuRl28t5Mrs+yfNrp2snxcUEAT6Inr7OMBTfTgzABDtzi5Djjg=="
      sslTrustorePassword: "ENC:SuRl28t5Mrs+yfNrp2snxcUEAT6Inr7OMBTfTgzABDtzi5Djjg=="
      sslKeyPassword: "ENC:SuRl28t5Mrs+yfNrp2snxcUEAT6Inr7OMBTfTgzABDtzi5Djjg=="
      rtde:
        encryptedKeystorePassword: true
        encryptedTruststorePassword: true
        encryptedKeyPassword: true

    db:
      postgresql:
        port: "5432"
        database: "netreveal"
        userid: "apps"
        password: "ENC:RgUUblVfxebljNENGukrcJbiy1hqixiOZvc9V8IvYUs="
        schema: "apps"
        sslmode: "verify-full"
        sslrootcert: /etc/postgresql/ssl/ca.crt
    # Whether DB cluster info
    clusterdb:
      AapsparkuserPassword: ""
      AppPassword: ""
      EntresPassword: ""
      nrImportUserPassword: ""
      PostgresPassword: ""
      KeycloakPassword: ""
  # minio credentials
  minio:
    user: "minio"
    password: ""
    clientUser: "customer"
    psqlUser: "psqlbackup"
    clientPassword: ""
    psqlPassword: ""

  standalone:
    acquisition:
      # End of day for acquisition (yyyymmdd). If empty the current date is used.
      endOfDay: "20160104"
    dbInit:
      dbJobFileFlagTimeout: "1200"
    override:
      initialisedFileFlagTimeout: "1200"

  # Extra annotations required for PVC based on a StorageClass name
  pvcAnnotations:
    "managed-csi":
      annotations:
        velero.io/csi-volumesnapshot-class: "azure-disk-csi-snapshotclass"
    "azurefile-csi-nfs":
      annotations:
        velero.io/csi-volumesnapshot-class: "trident-snapshotclass"
    "azure-netapp-files":
      annotations:
        velero.io/csi-volumesnapshot-class: "trident-snapshotclass"

  database:
    dbMainInstanceName: "postgresql-cluster"
    dbBackUpInstanceName: "postgresql-cluster-restored"
    # initdb|recovery
    bootstrapType: "initdb"
    testBackupMode: false

  cnpgOperatorNamespaces:
    - nr-infra-common
    - common-res

