            memory: "1024Mi"
            cpu: "500m"
    worldcheckParameters:
      envelopeCheckerEnabled: "FALSE"
      username: ""
      password: ""

  appsSchemaImportJob:
    job:
      enableJob: false
      schedule: "0 * * * *"
      ttlSecondsAfterFinished: 7776000
      successfulJobsHistoryLimit: 10
      failedJobsHistoryLimit: 10
      pod:
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1024Mi"
            cpu: "500m"
    script:
      batches: 100

  dbextract:
    job:
      enableHourlyJob: false
      enableDailyJob: false
      enableWeeklyJob: false
      enableMonthlyJob: false
      hourlySchedule: "0 9-17 * * *"
      dailySchedule: "0 14 * * *"
      weeklySchedule: "0 16 * * 6"
      monthlySchedule: "0 16 1 * *"
      ttlSecondsAfterFinished: 7776000
      successfulJobsHistoryLimit: 10
      failedJobsHistoryLimit: 10
      pod:
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1024Mi"
            cpu: "500m"
    script:
      # Log level for the dbextract script
      # info|debug
      logLevel: "info"
      # Add query limit to the SQLs
      # true|false
      addQueryLimit: "true"
      # Query limit value
      queryLimit: "1000000"
      # Avoid sending datafiles of 0 size if 'sendEmptyFiles' is set to 'false'
      sendEmptyFiles: "false"
      # Select which db URL to use: "ro" - for ReadOnly, "rw" - for ReadWrite
      dbConnectionType: "ro"
      # Perfix for the output zip file name
      zipFileName: "netreveal"
      # Prefix for extracted file name, defaults to none. Example: nrodExtract_
      extractFilePrefix: ""
      # Extention for extracted file, defaults to csv
      extractFileExtention: "csv"
      # Maximum number of retries for a retryable error in SQL execution
      maxRetries: 3
      # Initial wait time before retrying a failed SQL execution (in seconds)
      baseRetryDelay: 60
      # Maximum wait time between retries (in seconds)
      maxRetryDelay: 300
      hourly:
        # Text File that contains lines of SQLS to run
        # Deprecated: Use 'inputFilePaths' instead.
        inputFileName: ""
        # List of input files to be used in the SQLs
        # The path inside of the 'input' folder. For multi-org, the path should be 'orgName/fileName'
        inputFilePaths: []
