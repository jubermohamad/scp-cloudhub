  httpRelativePath: "/auth/"

  # TLS configuration is required except when using proxy=edge.
  #
  production: false

  service:
    # Kubernetes service type
    type: ClusterIP
    # Enable http port on service
    http:
      enabled: false
    # Keycloak service HTTP port
    # Keycloak service HTTPS port
    ports:
      http: 80
      https: 443
    # Control where client requests go, to the same pod or round-robin
    # Values: ClientIP or None
    # ref: https://kubernetes.io/docs/concepts/services-networking/service/
    sessionAffinity: None
    # Additional settings for the sessionAffinity
    # sessionAffinityConfig:
    #   clientIP:
    #     timeoutSeconds: 300
    #
    sessionAffinityConfig: {}
    # Keycloak service clusterIP IP
    # e.g:
    # clusterIP: None
    clusterIP: ""
    # loadBalancerIP for the SuiteCRM Service (optional, cloud specific)
    # ref: https://kubernetes.io/docs/concepts/services-networking/service/#type-loadbalancer
    loadBalancerIP: ""
    # Address that are allowed when service is LoadBalancer
    # https://kubernetes.io/docs/tasks/access-application-cluster/configure-cloud-provider-firewall/#restrict-access-for-loadbalancer-service
    # Example:
    # loadBalancerSourceRanges:
    #   - 10.10.10.0/24
    loadBalancerSourceRanges: []
    # Enable client source IP preservation
    # ref https://kubernetes.io/docs/tasks/access-application-cluster/create-external-load-balancer/#preserving-the-client-source-ip
    externalTrafficPolicy: Cluster
    # Additional custom annotations for Keycloak service
    annotations: {}
    # Extra port to expose on Keycloak service
    extraPorts: []
    # Headless service properties
    headless:
      # Annotations for the headless service.
      annotations: {}
      # Extra ports to expose on Keycloak headless service
      extraPorts: []

  containerPorts:
    http: 8080
    https: 8450

  auth:
    # Keycloak administrator user
    adminUser: netreveal
    # Keycloak administrator password for the new user

    adminPassword: ""
    # Existing secret containing Keycloak admin password
  #existingSecret: ""
  # Key where the Keycloak admin password is being stored inside the existing secret.
  #passwordSecretKey: ""

  tls:
    # Enable TLS encryption. Required for HTTPs traffic.
    enabled: true
    # Generate automatically self-signed TLS certificates. Currently only supports PEM certificates
    autoGenerated: false
    ## @param tls.existingSecret Existing secret containing the TLS certificates per Keycloak replica
    ## Create this secret following the steps below:
    ## 1) Generate your truststore and keystore files (more info at https://www.keycloak.org/docs/latest/server_installation/#_setting_up_ssl)
    ## 2) Rename your truststore to `keycloak.truststore.jks` or use a different name overwriting the value 'tls.truststoreFilename'.
    ## 3) Rename your keystores to `keycloak.keystore.jks` or use a different name overwriting the value 'tls.keystoreFilename'.
    ## 4) Run the command below where SECRET_NAME is the name of the secret you want to create:
    ##       kubectl create secret generic SECRET_NAME --from-file=./keycloak.truststore.jks --from-file=./keycloak.keystore.jks
    ## NOTE: If usePem enabled, make sure the PEM key and cert are named 'tls.key' and 'tls.crt' respectively.
    ##
    existingSecret: "{{ .Release.Name }}-keycloak-crt"
    # Use PEM certificates as input instead of PKS12/JKS stores
    # If "true", the Keycloak chart will look for the files keycloak.key and keycloak.crt inside the secret provided with 'existingSecret'.
    usePem: true
    # Truststore filename inside the existing secret
  #truststoreFilename: "keycloak.truststore.jks"
  # Keystore filename inside the existing secret
  #keystoreFilename: "keycloak.keystore.jks"
  # Password to access the keystore when it's password-protected
  #keystorePassword: ""
  # Password to access the truststore when it's password-protected
  #truststorePassword: ""
  # Secret containing the Keystore and Truststore passwords.
  #passwordsSecret: ""

  ingress:
    enabled: false
    ingressClassName: nginx
    hostname: "{{ .Values.global.namespace }}-keycloak.symphonyai.cloud"
    servicePort: https
    annotations:
      nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
      nginx.ingress.kubernetes.io/affinity: "cookie"
      nginx.ingress.kubernetes.io/session-cookie-name: "stickcookie"
      nginx.ingress.kubernetes.io/session-cookie-expires: "172800"
      nginx.ingress.kubernetes.io/session-cookie-max-age: "172800"
      # nginx.ingress.kubernetes.io/whitelist-source-range: ""
      # appgw.ingress.kubernetes.io/ssl-redirect: "true"
      # appgw.ingress.kubernetes.io/use-private-ip: "true"
      # kubernetes.io/ingress.class: azure/application-gateway
    pathType: ImplementationSpecific
    extraTls:
    - hosts:
      - "{{ .Values.global.namespace }}-keycloak.symphonyai.cloud"
      secretName: https-certs

  postgresql:
    enabled: false

  externalDatabase:
    host: "{{ include \"generate.name.with.release.name\" (list $ . \"postgresql-cluster-rw\") }}"
    port: 5432
    user: appskeycloak
    database: netreveal
    existingSecret: postgres-credential-appskeycloak-user-cnpg
    existingSecretPasswordKey: password

  autoscaling:
    enabled: false
  #  minReplicas: 1
  #  maxReplicas: 3

