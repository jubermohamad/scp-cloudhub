############################################################################################################################################
kafka-cluster:
  replicas: 3
  apiVersion: "kafka.strimzi.io/v1beta2"

  kafka:
    version: "3.8.0"
    # soft: preferredDuringSchedulingIgnoredDuringExecution
    # hard: requiredDuringSchedulingIgnoredDuringExecution
    # custom: custom affinity rules defined with customAffinityRules
    antiAffinity: "soft"
    customAffinityRules: {}
      # preferredDuringSchedulingIgnoredDuringExecution:
      #   - weight: 100
      #     podAffinityTerm:
      #       labelSelector:
      #         matchLabels:
      #           strimzi.io/component-type: kafka
      #           app-release-name: "{{ .Release.Name }}"
      #       topologyKey: "topology.kubernetes.io/zone"
    resources:
      requests:
        memory: 2Gi
        cpu: 500m
      limits:
        memory: 2Gi
        cpu: "1"
    jvmOptions:
      # -Xms - Minimum initial heap size when JVM starts
      xms: 2048m
      # -Xmx - Maximum heap size
      xmx: 2048m
      # -XX - Advanced runtime options for JVM
      # Example:
      # xx:
      #   - name: "UseG1GC"
      #     value: "true"
      #   - name: "MaxGCPauseMillis"
      #     value: "20"
      #   - name: "ExplicitGCInvokesConcurrent"
      #     value: "true"
      #
      # Empty list
      # xx: []
      xx:
        - name: "UseG1GC"
          value: "true"
        - name: "MaxGCPauseMillis"
          value: "20"
        - name: "ExplicitGCInvokesConcurrent"
          value: "true"
      # Enables garbage collection logging
      gcLoggingEnabled: false
      # Additional system properties
      # Example:
      #   javaSystemProperties:
      #     - name: javax.net.debug
      #       value: ssl
      javaSystemProperties: []
    networkPolicyPeers: []
    config:
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2
      default.replication.factor: 3
      min.insync.replicas: 2
      log.retention.hours: 48
      log.segment.bytes: 1073741824
      log.retention.check.interval.ms: 300000
      num.network.threads: 3
      num.recovery.threads.per.data.dir: 1
      socket.send.buffer.bytes: 102400
      socket.receive.buffer.bytes: 102400
      socket.request.max.bytes: 10485760
      group.initial.rebalance.delay.ms: 0
      zookeeper.connection.timeout.ms: 6000
      num.io.threads: 4
      num.partitions: 1
      max.incremental.fetch.session.cache.slots: 10000
      auto.create.topics.enable: false
      #auto.create.topics.enable: true
    pvc:
      storage: "10Gi"
    pv:
      hostPath: "/var/nfs_k8s/kafka-cluster"
      hostPathMinikube: "/opt/netreveal/kafka-cluster"
    podAnnotations: {}
    kafkaExporter:
      groupRegex: .*
      logging: warn
      podAnnotations:
        prometheus.io/port: "9404"
        prometheus.io/scrape: "true"
    livenessProbe:
      failureThreshold: 3
      initialDelaySeconds: 15
      periodSeconds: 10
      successThreshold: 1
      timeoutSeconds: 15
    readinessProbe:
      failureThreshold: 3
      initialDelaySeconds: 15
      periodSeconds: 10
      successThreshold: 1
      timeoutSeconds: 15
  zookeeper:
    # soft: preferredDuringSchedulingIgnoredDuringExecution
    # hard: requiredDuringSchedulingIgnoredDuringExecution
    # custom: custom affinity rules defined with customAffinityRules
    antiAffinity: "soft"
    customAffinityRules: {}
      # preferredDuringSchedulingIgnoredDuringExecution:
      #   - weight: 100
      #     podAffinityTerm:
      #       labelSelector:
      #         matchLabels:
      #           strimzi.io/component-type: zookeeper
      #           app-release-name: "{{ .Release.Name }}"
      #       topologyKey: "topology.kubernetes.io/zone"
    ssl:
      hostnameVerification: "false"
      quorum:
        hostnameVerification: "false"
    resources:
      requests:
        memory: 1Gi
        cpu: "300m"
      limits:
        memory: 1Gi
        cpu: "500m"
    jvmOptions:
      # -Xms - Minimum initial heap size when JVM starts
      xms: ""
      # -Xmx - Maximum heap size
      xmx: ""
      # -XX - Advanced runtime options for JVM
      # Example:
      # xx:
      #   - name: "UseG1GC"
      #     value: "true"
      #   - name: "MaxGCPauseMillis"
      #     value: "20"
      #   - name: "ExplicitGCInvokesConcurrent"
      #     value: "true"
      #
      # Empty list
      # xx: []
      xx:
        - name: "UseG1GC"
          value: "true"
        - name: "MaxGCPauseMillis"
          value: "20"
        - name: "ExplicitGCInvokesConcurrent"
          value: "true"
      # Enables garbage collection logging
      gcLoggingEnabled: false
      # Additional system properties
      # Example:
      #   javaSystemProperties:
      #     - name: javax.net.debug
      #       value: ssl
      javaSystemProperties: []
    pvc:
