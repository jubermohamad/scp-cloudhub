{{- if .Values.global.nrOrgUnits }}
  {{- if ne (len .Values.global.nrOrgUnits) 0 }}
    {{- range $key, $value := .Values.global.nrOrgUnits }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: "{{ $.Release.Name }}-s3-{{ $value.orgUnitCode | lower | replace "_" "-" }}-policy"
  namespace: {{ $.Values.global.namespace }}
  annotations:
    # This is what defines this resource as a hook. Without this line, the
    # job is considered part of the release.
    "helm.sh/hook": pre-install, pre-upgrade, post-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
data:
  s3-{{ $value.orgUnitCode | lower | replace "_" "-" }}-policy.json: |
    {
        "Version":"2012-10-17",
        "Statement": [
        {
            "Sid": "AllowUserToSeeBucketListInTheConsole-{{ $value.orgUnitCode | lower }}",
            "Action": ["s3:ListAllMyBuckets", "s3:GetBucketLocation"],
            "Effect": "Allow",
            "Resource": ["arn:aws:s3:::public-bucket"]
        },
        {
            "Sid": "AllowRootListingOfRootFolders",
            "Action": ["s3:ListBucket"],
            "Effect": "Allow",
            "Resource": ["arn:aws:s3:::public-bucket"],
            "Condition":{
              "StringEquals":{
                "s3:prefix":[
                  "",
                  "landing/"
                ],
                "s3:delimiter":["/"]
              }
            }
        },

        {
            "Sid": "AllowListingOfSubFolders-{{ $value.orgUnitCode | lower }}",
            "Action": ["s3:ListBucket"],
            "Effect": "Allow",
            "Resource": ["arn:aws:s3:::public-bucket"],
            "Condition":{
              "StringLike":{
                "s3:prefix":[
                  "landing/fpfa/*",
                  "landing/listImport/*",
                  "landing/batchwatch/*",
                  "landing/acquisition{{ $value.orgUnitCode }}/*",
                  "landing/amlopt{{ $value.orgUnitCode }}/*",
                  "landing/worldcheck/*"
                ]
              }
            }
        },
        {
            "Sid": "AllowAllS3ActionsInUserFolder-{{ $value.orgUnitCode | lower }}",
            "Effect": "Allow",
            "Action": [
                    "s3:ListBucket",
                    "s3:PutObject",
                    "s3:GetObject",
                    "s3:DeleteObject"
            ],
            "Resource": [
              "arn:aws:s3:::public-bucket/landing/fpfa/*",
              "arn:aws:s3:::public-bucket/landing/listImport/*",
              "arn:aws:s3:::public-bucket/landing/batchwatch/*",
              "arn:aws:s3:::public-bucket/landing/acquisition{{ $value.orgUnitCode }}/*",
              "arn:aws:s3:::public-bucket/landing/amlopt{{ $value.orgUnitCode }}/*",
              "arn:aws:s3:::public-bucket/landing/worldcheck/*"
            ]
        }
      ]
    }
---
    {{- end }}
  {{- end }}
{{- end }}
