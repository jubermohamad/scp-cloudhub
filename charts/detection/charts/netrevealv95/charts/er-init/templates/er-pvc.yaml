apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "generate.name.with.release.name" (list $ . "er-pvc-config") | quote }}
  namespace: {{ include "er.namespace" . }}
  {{- include "storage.pvc.annotations" (list $ . "with-annotation-label" .Values.pv.className) | indent 2 }}
  labels:
    app: er-init
spec:
  storageClassName: {{ .Values.pv.className }}
  accessModes:
    - {{ .Values.pv.accessMode }}
  resources:
    requests:
      storage: {{ .Values.pv.size }}
