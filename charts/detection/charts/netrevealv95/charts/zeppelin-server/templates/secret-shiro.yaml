{{- if .Values.auth.enabled }}
{{- range .Values.auth.users }}
{{- if or (not .username) (eq .username "") }}
{{- fail "Zeppelin authentication is enabled but username is empty. Please provide a valid username in values.yaml under auth.users" }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-zeppelin-shiro-config
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "zeppelin-server.labels" . | nindent 4 }}
  annotations:
    "helm.sh/resource-policy": keep
type: Opaque
{{- $passwords := dict }}
{{- range .Values.auth.users }}
{{- $password := include "zeppelin-server.getPassword" (dict "username" .username "password" .password "context" $) }}
{{- $_ := set $passwords .username $password }}
{{- end }}
data:
{{- range .Values.auth.users }}
  {{ .username }}: {{ index $passwords .username | b64enc | quote }}
{{- end }}
stringData:
  shiro.ini: |
    [users]
    {{- range .Values.auth.users }}
    {{ .username }} = {{ index $passwords .username }}, {{ .roles }}
    {{- end }}

    [main]
    sessionManager = org.apache.shiro.web.session.mgt.DefaultWebSessionManager
    securityManager.sessionManager = $sessionManager
    securityManager.sessionManager.globalSessionTimeout = 86400000
    shiro.loginUrl = /api/login

    [roles]
    admin = *
    user = *

    [urls]
    /api/version = anon
    /api/cluster/address = anon
    /api/health = anon
    /health/** = anon
    /** = authc
{{- end }}
