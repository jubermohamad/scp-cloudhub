{{- if .Values.ingress.enabled -}}
{{- $svcPort := .Values.service.port -}}
{{- if and .Values.ingress.className (not (semverCompare ">=1.18-0" .Capabilities.KubeVersion.GitVersion)) }}
  {{- if not (hasKey .Values.ingress.annotations "kubernetes.io/ingress.class") }}
  {{- $_ := set .Values.ingress.annotations "kubernetes.io/ingress.class" .Values.ingress.className}}
  {{- end }}
{{- end }}
{{- if semverCompare ">=1.19-0" .Capabilities.KubeVersion.GitVersion -}}
apiVersion: networking.k8s.io/v1
{{- else if semverCompare ">=1.14-0" .Capabilities.KubeVersion.GitVersion -}}
apiVersion: networking.k8s.io/v1beta1
{{- else -}}
apiVersion: extensions/v1beta1
{{- end }}
kind: Ingress
metadata:
  name: {{ include "adminerevo.name" $ }}-ingress
  labels:
    service: {{ include "adminerevo.name" . }}
    app: {{ include "adminerevo.name" . }}
    {{- include "common.helm.metadata.labels" $ | nindent 4 }}
  {{- $customerIPs := .Values.ingress.ingressAllowList.customerIPs }}
  {{- $platformIPs := .Values.ingress.ingressAllowList.platformIPs }}
  {{- $allIPs := concat $customerIPs $platformIPs | uniq | compact }}
  {{- if or .Values.ingress.annotations (and $allIPs (gt (len $allIPs) 0)) }}
  annotations:
    {{- with .Values.ingress.annotations }}
      {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- if and $allIPs (gt (len $allIPs) 0) }}
    nginx.ingress.kubernetes.io/whitelist-source-range: {{ join ", " $allIPs | quote }}
    {{- end }}
  {{- end }}
spec:
  {{- if and .Values.ingress.className (semverCompare ">=1.18-0" .Capabilities.KubeVersion.GitVersion) }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
    - hosts:
        {{- range $key, $value := .hosts }}
        - {{ tpl . $ | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range $key, $value := .Values.ingress.hosts }}
    {{- $_ := set $ "key" $key }}
    {{- $_ := set $ "value" $value }}
    - host: {{ tpl .host $ }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            {{- if and .pathType (semverCompare ">=1.18-0" $.Capabilities.KubeVersion.GitVersion) }}
            pathType: {{ .pathType }}
            {{- end }}
            backend:
              {{- if semverCompare ">=1.19-0" $.Capabilities.KubeVersion.GitVersion }}
              service:
                name: {{ include "adminerevo.name" $ }}
                port:
                  number: {{ $svcPort }}
              {{- else }}
              serviceName: {{ include "adminerevo.name" $ }}
              servicePort: {{ $svcPort }}
              {{- end }}
          {{- end }}
    {{- end }}
{{- end }}
