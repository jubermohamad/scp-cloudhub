# Setting the environment for the application (e.g., "qa" for quality assurance, "dev" for development, "prod" for production)
app_env: "prod"
# Specifies whether to use NodeSelector, if true - NodeSelector will be used.
useNodeSelector: "false"
# NodeSelector configuration, specifically targeting nodes with the specified label (Will work only if useNodeSelector is set to true) Node should also have the same label.
nodeSelector:
  rtde-node: "true"
# Additional labels for SparkApplication
labels:
  app: rtde

#DATABASE CONNECTION
jdbc:
  driver: "org.postgresql.Driver"
  userid: ""
  passwd: ""
  encryptionMethod: "plainText"

#KEY STORE
keystore:
  filename: ""
  password: ""
  key_password: ""

solutionsParameters:
  odddetarte:
    driver:
      cores: 1
      coreLimit: "1000m"
      memory: "2000m"
    executor:
      cores: 1
      instances: 1
      memory: "3000m"
    smart:
      # application.conf parameter
      dateFormat: "yyyyMMdd"
      # application.conf parameter
      timestampFormat: "yyyyMMdd"
      # application.conf parameter
      multiValueSeparator: ","
      # application.conf parameter
      listToMap:
        separator: ","
        keyValueSeparator: ":"
      # application.conf parameter
      model:
        optimizations: "false"
    # application.conf parameter
    processingmodel:
      persistence:
        type: "DB" #Options are: File, Topic, DB
      refreshing:
        signalType: "Topic"
        topicSignal:
          topicName: "nr-refresh_cdd"
    kafka:
      internal:
        message:
          format: "binary"
      fetch:
        message:
          maxBytes: "1048576"
      model:
        message:
          maxBytes: "10485760"
      maxRequestSize: "1048576"
      extraParameters: []
    # list of additional parameters to be added to the application.conf
    # Example: extraParameters: ["param1=value1", "param2=value2"]
    applicationConf:
      extraParameters: []
    # list of additional parameters to be added to the environment.conf
    # Example: extraParameters: ["param1=value1", "param2=value2"]
    environmentConf:
      extraParameters: []

