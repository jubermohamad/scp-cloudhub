#
# netreveal_batch.conf v1.0
# Configuration properties for the NetReveal batch scripts.
#

PATH=$PATH:/usr/local/bin/

FAILURE=1
SUCCESS=0

TRUE=1
FALSE=0

#DATABASE
DBNAME={{ .Values.global.baseConfigProperties.db.postgresql.database }}
DBUSERNAME={{ .Values.global.baseConfigProperties.db.postgresql.userid }}
DBENDPOINT={{ include "db.host" . }}
DBENGINE=postgres

# DXVSERVER=dxv.$ENV_TYPE.$CUSTOMER_NAME.nrod

# SERVERNAME=nrod_batch


# Set directories
STGHOME=/opt/netreveal/staging/landing
FDBKHOME=/opt/netreveal/staging/feedback
ETLHOME=/opt/netreveal/etl
NRHOME=/opt/netreveal/batch
EIMHOME=/opt/netreveal/eim
LOGHOME=/var/log/netreveal
SCRIPTHOME=$NRHOME/bin
ACQHOME=$NRHOME/data/acquisition
ACQDONE=$ACQHOME/done
ACQWAIT=$ACQHOME/waiting
ACQBAD=$ACQHOME/bad

# #User to SSH into data exchange vault server
# SSHUSER=netreveal

# Define which batch process a client uses - set with $TRUE/$FALSE values defined above
NR_WLM_BATCH=\{\{NRWLMBatch\}\}
NR_AML_BATCH=\{\{NRAMLBatch\}\}
NR_CDD_BATCH=\{\{NRCDDBatch\}\}
NR_TRANSACTION_COUNT=1

SIGNAL_TIME_OUT=20         # Setting to check how long to wait for Calendar Signal to pick up a trigger

# Acquisition Parameters
ACQ_TIME_OUT=230
BAD_CUST_THRESHOLD=5       # Percentage threshold of bad records allowed per successful records
BAD_TXN_THRESHOLD=1        # Percentage threshold of bad records allowed per successful records

# WLM Batch Parameters
WLM_TIME_OUT=150           # WLM Batch Timeout
WLM_INDEX_TIME_OUT=120
WATCHLIST_IMPORT_TIME_OUT=120
BATCH_TYPE_FULL="WLM Full"
BATCH_TYPE_DELTA="WLM Delta"
WLM_DELTA_GROUP=WLMDeltaSubjectVsFullListGroup
WLM_FULL_GROUP=WLMFullSubjectVsDeltaListGroup
SINGLE_PASS=\{\{WLMSinglePass\}\}
WATCHLIST=\{\{Watchlist\}\}

FACTIVA_URL={{ .Values.factiva.factivaParameters.url }}
CUSTOM_FACTIVA_IN_USE={{ .Values.factiva.factivaParameters.customFactivaInUse }}
CUSTOM_FACTIVA_FILE_PREFIX={{ .Values.factiva.factivaParameters.customFactivaFilePrefix }}

## Check if batch processing is running, and if it is running wait before creating the watchlist flag file by setting the WATCHLIST_TRIGGER_ONLY_AFTER_BATCH_FINISHES=${TRUE} - set with $TRUE/$FALSE values defined above
WATCHLIST_TRIGGER_ONLY_AFTER_BATCH_FINISHES={{ .Values.factiva.factivaParameters.watchListTriggerOnlyAfterBatchFinishes }}
## & Control how many attempts to recheck if batch processing is running, if it is found to be currently running on a given attempt & the interval between each attempt.
WATCHLIST_BATCH_COMPLETE_CHECK_RETRY_X_TIMES={{ .Values.factiva.factivaParameters.watchListBatchCompleteCheckRetryXTimes }}
WATCHLIST_BATCH_COMPLETE_CHECK_RETRY_INTERVAL_IN_SECONDS={{ .Values.factiva.factivaParameters.watchListBatchCompleteCheckRetryIntervalSeconds }}
## Control how many attempts to retry the download of the Watchlist, if it fails on a given attempt & the interval between each attempt.
WATCHLIST_DOWNLOAD_RETRY_X_TIMES=5
WATCHLIST_DOWNLOAD_RETRY_INTERVAL_IN_SECONDS=60
## NRDVO-1395: Control if you would like to check if a current Watchlist load is currently running to prevent another one from running at the same time,
## how many attempts to retry checking, and the interval between checks, of the Watchlist load process completing for the previous run if necessary and for the current run.
### Acceptable values are "${TRUE}" for true, "${FALSE}" for false
WATCHLIST_LOAD_RUNNING_CHECK_REQUIRED={{ .Values.factiva.factivaParameters.watchListLoadRunningCheckRequired }}
### The following 2 must be positive integer values and must not be longer than 24 hours (when multiplied together), to allow for error detection and notification of this.
WATCHLIST_LOAD_RUNNING_CHECK_RETRY_X_TIMES={{ .Values.factiva.factivaParameters.watchListLoadRunningCheckRetryXTimes }}
WATCHLIST_LOAD_RUNNING_CHECK_RETRY_INTERVAL_IN_SECONDS={{ .Values.factiva.factivaParameters.watchListLoadRunningCheckRetryIntervalInSeconds }}
## Control how many attempts to create flag.txt	file to start import of file.
FLAGFILE_CREATE_RETRY_X_TIMES=5
FLAGFILE_CREATE_INTERVAL_IN_SECONDS=10


CHECKWATCHLISTINGESTION={{ .Values.factiva.factivaParameters.checkWatchListIngestion }}

# Scenario Manager Batch Parameters
SCM_TIME_OUT=120           # AML/CDD SCM Timeout

# DPA_MIN_MEMORY_IN_MB=128
# DPA_MAX_MEMORY_IN_MB=384