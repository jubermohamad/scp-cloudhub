{{- if or .Values.dbextract.job.enableHourlyJob .Values.dbextract.job.enableDailyJob .Values.dbextract.job.enableWeeklyJob .Values.dbextract.job.enableMonthlyJob }}
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: "{{ include "secret.standalone.dbextract.script.name" . }}"
  namespace: {{ .Values.global.namespace }}
  labels:
    app: "{{ include "secret.standalone.dbextract.script.name" . }}"
data:
  dbExtract.sh: {{ tpl (.Files.Get "scripts/dbextract/dbExtract.sh") . | b64enc  }}
{{- end }}
