{{- if .Values.appsSchemaImportJob.job.enableJob }}
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: "{{ include "secret.standalone.apps-schema-import.script.name" . }}"
  namespace: {{ .Values.global.namespace }}
  labels:
    app: "{{ include "secret.standalone.apps-schema-import.script.name" . }}"
    {{- include "common.helm.metadata.labels" . | nindent 4 }}
data:
  apps-schema-importer.sh: {{ tpl (.Files.Get "scripts/apps-schema-import/apps-schema-importer.sh") . | b64enc  }}
{{- end }}