---
apiVersion: v1
kind: Secret
metadata:
  name: "{{ include "secret.standalone.db.init.script.insert.license.name" . }}"
  namespace: {{ .Values.global.namespace }}
  annotations:
    # This is what defines this resource as a hook. Without this line, the job is considered part of the release.
    "helm.sh/hook": pre-install, pre-upgrade, post-upgrade
    "helm.sh/hook-weight": "-9"
    "helm.sh/hook-delete-policy": before-hook-creation
  labels:
    app: "{{ include "secret.standalone.db.init.script.insert.license.name" . }}"
    {{- include "common.helm.metadata.labels" . | nindent 4 }}
type: Opaque
stringData:
  Insert_license.sql: |
    INSERT INTO LICENCE (VERSION_ID, ID, CLIENT_NAME, PROJECT_CODE, LICENCE_KEY) VALUES (0, 0, '{{ .Values.dbInit.licence.clientName }}', '{{ .Values.dbInit.licence.projectCode }}', '{{ .Values.dbInit.licence.licenceKey }}' );

    COMMIT;

  Update_license.sql: |
    UPDATE LICENCE SET CLIENT_NAME = '{{ .Values.dbInit.licence.clientName }}', PROJECT_CODE = '{{ .Values.dbInit.licence.projectCode }}', LICENCE_KEY = '{{ .Values.dbInit.licence.licenceKey }}' WHERE ID = 0;
    COMMIT;
