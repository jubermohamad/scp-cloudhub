---
apiVersion: v1
kind: ConfigMap
metadata:
  name: "{{ include "config.map.saml.script.name" . }}"
  namespace: {{ .Values.global.namespace }}
  labels:
    app: "{{include "config.map.saml.script.name" . }}"
data:
  SAML_Enable.sql: |
    UPDATE SECURITY_PLUGINS SET PLUGIN_CLASS_NAME = 'com.norkom.base.business.interfaces.impl.SAMLAuthenticationPlugin' WHERE PLUGIN_TYPE = 'authentication';

    DELETE FROM SECURITY_PLUGIN_PROPERTIES WHERE ID IN (SELECT ID FROM SECURITY_PLUGINS where PLUGIN_TYPE = 'loginValve');
    DELETE FROM SECURITY_PLUGINS WHERE PLUGIN_TYPE = 'loginValve';

    DELETE FROM SECURITY_PLUGIN_PROPERTIES WHERE ID IN (SELECT ID FROM SECURITY_PLUGINS where PLUGIN_TYPE = 'passwordValve');
    DELETE FROM SECURITY_PLUGINS WHERE PLUGIN_TYPE = 'passwordValve';

    DELETE FROM SECURITY_PLUGIN_PROPERTIES WHERE ID IN (SELECT ID FROM SECURITY_PLUGINS where PLUGIN_TYPE = 'newUserPasswordValve');
    DELETE FROM SECURITY_PLUGINS WHERE PLUGIN_TYPE = 'newUserPasswordValve';

    COMMIT;

  00_override_enable_saml.lst: |
    SAML_Enable.sql

  SAML_Disable.sql: |
    UPDATE SECURITY_PLUGINS SET PLUGIN_CLASS_NAME = 'com.norkom.base.business.interfaces.impl.DatabaseAuthenticationPlugin' WHERE PLUGIN_TYPE = 'authentication';

    -- SECURITY_PLUGINS
    INSERT INTO SECURITY_PLUGINS ( ID, PLUGIN_TYPE, PLUGIN_CLASS_NAME ) SELECT 1 AS ID, 'loginValve' AS PLUGIN_TYPE, 'com.norkom.base.business.interfaces.impl.PasswordRenewalLoginValve' AS PLUGIN_CLASS_NAME WHERE NOT EXISTS (SELECT 1 FROM SECURITY_PLUGINS WHERE ID = 1 AND PLUGIN_TYPE = 'loginValve');
    INSERT INTO SECURITY_PLUGINS ( ID, PLUGIN_TYPE, PLUGIN_CLASS_NAME ) SELECT 2 AS ID, 'loginValve' AS PLUGIN_TYPE, 'com.norkom.base.business.interfaces.impl.ConcurrentUsersLoginValve' AS PLUGIN_CLASS_NAME WHERE NOT EXISTS (SELECT 1 FROM SECURITY_PLUGINS WHERE ID = 2 AND PLUGIN_TYPE = 'loginValve');
    INSERT INTO SECURITY_PLUGINS ( ID, PLUGIN_TYPE, PLUGIN_CLASS_NAME ) SELECT 3 AS ID, 'loginValve' AS PLUGIN_TYPE, 'com.norkom.base.business.interfaces.impl.DisableUserIfIdleTooLongValve' AS PLUGIN_CLASS_NAME WHERE NOT EXISTS (SELECT 1 FROM SECURITY_PLUGINS WHERE ID = 3 AND PLUGIN_TYPE = 'loginValve');
    INSERT INTO SECURITY_PLUGINS ( ID, PLUGIN_TYPE, PLUGIN_CLASS_NAME ) SELECT 4 AS ID, 'loginValve' AS PLUGIN_TYPE, 'com.norkom.base.business.interfaces.impl.DeleteUserIfIdleTooLongValve' AS PLUGIN_CLASS_NAME WHERE NOT EXISTS (SELECT 1 FROM SECURITY_PLUGINS WHERE ID = 4 AND PLUGIN_TYPE = 'loginValve');
    INSERT INTO SECURITY_PLUGINS ( ID, PLUGIN_TYPE, PLUGIN_CLASS_NAME ) SELECT 5 AS ID, 'loginValve' AS PLUGIN_TYPE, 'com.norkom.base.business.interfaces.impl.MaxLoginAttemptsBlocker' AS PLUGIN_CLASS_NAME WHERE NOT EXISTS (SELECT 1 FROM SECURITY_PLUGINS WHERE ID = 5 AND PLUGIN_TYPE = 'loginValve');
    INSERT INTO SECURITY_PLUGINS ( ID, PLUGIN_TYPE, PLUGIN_CLASS_NAME ) SELECT 14 AS ID, 'loginValve' AS PLUGIN_TYPE, 'com.norkom.base.business.interfaces.impl.LoginTemporaryLockoutBlocker' AS PLUGIN_CLASS_NAME WHERE NOT EXISTS (SELECT 1 FROM SECURITY_PLUGINS WHERE ID = 14 AND PLUGIN_TYPE = 'loginValve');

    -- SECURITY_PLUGIN_PROPERTIES
    INSERT INTO SECURITY_PLUGIN_PROPERTIES ( ID, PROPERTY_KEY, PROPERTY_VALUE ) SELECT 2 AS ID, 'maxConcurrentLogins' AS PROPERTY_KEY, '50' AS PROPERTY_VALUE WHERE NOT EXISTS (SELECT 1 FROM SECURITY_PLUGIN_PROPERTIES WHERE ID = 2);
    INSERT INTO SECURITY_PLUGIN_PROPERTIES ( ID, PROPERTY_KEY, PROPERTY_VALUE ) SELECT 3 AS ID, 'maxInactiveDays' AS PROPERTY_KEY, '60' AS PROPERTY_VALUE WHERE NOT EXISTS (SELECT 1 FROM SECURITY_PLUGIN_PROPERTIES WHERE ID = 3);
    INSERT INTO SECURITY_PLUGIN_PROPERTIES ( ID, PROPERTY_KEY, PROPERTY_VALUE ) SELECT 4 AS ID, 'maxInactiveDays' AS PROPERTY_KEY, '90' AS PROPERTY_VALUE WHERE NOT EXISTS (SELECT 1 FROM SECURITY_PLUGIN_PROPERTIES WHERE ID = 4);
    INSERT INTO SECURITY_PLUGIN_PROPERTIES ( ID, PROPERTY_KEY, PROPERTY_VALUE ) SELECT 5 AS ID, 'maxLoginAttempts' AS PROPERTY_KEY, '3' AS PROPERTY_VALUE WHERE NOT EXISTS (SELECT 1 FROM SECURITY_PLUGIN_PROPERTIES WHERE ID = 5);
    INSERT INTO SECURITY_PLUGIN_PROPERTIES ( ID, PROPERTY_KEY, PROPERTY_VALUE ) SELECT 14 AS ID, 'passwordLockoutPeriod' AS PROPERTY_KEY, '-1' AS PROPERTY_VALUE WHERE NOT EXISTS (SELECT 1 FROM SECURITY_PLUGIN_PROPERTIES WHERE ID = 14 AND PROPERTY_KEY = 'passwordLockoutPeriod');
    INSERT INTO SECURITY_PLUGIN_PROPERTIES ( ID, PROPERTY_KEY, PROPERTY_VALUE ) SELECT 14 AS ID, 'lockoutMaxLoginAttempts' AS PROPERTY_KEY, '-1' AS PROPERTY_VALUE WHERE NOT EXISTS (SELECT 1 FROM SECURITY_PLUGIN_PROPERTIES WHERE ID = 14 AND PROPERTY_KEY = 'lockoutMaxLoginAttempts');

    -- SECURITY_PLUGINS
    INSERT INTO SECURITY_PLUGINS ( ID, PLUGIN_TYPE, PLUGIN_CLASS_NAME ) SELECT 9 AS ID, 'passwordValve' AS PLUGIN_TYPE, 'com.norkom.base.business.interfaces.impl.PasswordComplexityValve' AS PLUGIN_CLASS_NAME WHERE NOT EXISTS (SELECT 1 FROM SECURITY_PLUGINS WHERE ID = 9 AND PLUGIN_TYPE = 'passwordValve');
    INSERT INTO SECURITY_PLUGINS ( ID, PLUGIN_TYPE, PLUGIN_CLASS_NAME ) SELECT 10 AS ID, 'passwordValve' AS PLUGIN_TYPE, 'com.norkom.base.business.interfaces.impl.PasswordHistoryValve' AS PLUGIN_CLASS_NAME WHERE NOT EXISTS (SELECT 1 FROM SECURITY_PLUGINS WHERE ID = 10 AND PLUGIN_TYPE = 'passwordValve');
