{{- if and .Values.enabled .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "monitoring-tool.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "monitoring-tool.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "monitoring-tool.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ default (include "monitoring-tool.fullname" .) .Values.serviceAccount.name }}
    namespace: {{ .Release.Namespace }}
{{- end }}
