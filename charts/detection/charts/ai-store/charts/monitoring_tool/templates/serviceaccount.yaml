{{- if and .Values.enabled .Values.rbac.create .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ default (include "monitoring-tool.fullname" .) .Values.serviceAccount.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "monitoring-tool.labels" . | nindent 4 }}
{{- end }}
