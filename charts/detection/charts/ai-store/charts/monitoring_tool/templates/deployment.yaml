{{- if .Values.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "monitoring-tool.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "monitoring-tool.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "monitoring-tool.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    {{- $g := index .Values "global" | default dict }}
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "monitoring-tool.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        modelhub.dev/monitoring-entrypoint: venv-python
        {{- range $k, $v := (.Values.podAnnotations | default dict) }}
        {{ $k }}: {{ $v | quote }}
        {{- end }}
        {{- if $g.rolloutOnHelmUpgrade }}
        modelhub.dev/helm-release-revision: {{ .Release.Revision | quote }}
        modelhub.dev/helm-release-name: {{ .Release.Name | quote }}
        {{- end }}
    spec:
      {{- with $g.imagePullSecrets }}
      imagePullSecrets:
        {{- range . }}
        - name: {{ .name | default . }}
        {{- end }}
      {{- end }}
      serviceAccountName: {{ include "monitoring-tool.serviceAccountName" . }}
      initContainers:
        - name: migrate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy | default $.Values.global.imagePullPolicy | default "Always" }}
          command: ["/app/.venv/bin/alembic", "upgrade", "head"]
          env:
            # alembic/env.py imports Settings(); API_KEY required when APP_ENV!=dev (image default prod).
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.secretName }}
                  key: {{ .Values.secretKeys.apiKey }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.secretName }}
                  key: {{ .Values.secretKeys.databaseUrl }}
      containers:
        - name: monitoring-tool
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy | default $.Values.global.imagePullPolicy | default "Always" }}
          command:
            - "/app/.venv/bin/python"
            - "-m"
            - "src.run_api_mcp"
          ports:
            - name: http
              containerPort: {{ .Values.service.httpPort }}
            - name: mcp
              containerPort: {{ .Values.service.mcpPort }}
          env:
            {{- include "monitoring-tool.containerEnv" . | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 45
            periodSeconds: 30
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
{{- end }}
