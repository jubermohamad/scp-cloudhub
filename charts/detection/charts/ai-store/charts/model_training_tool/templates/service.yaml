{{- if .Values.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "model-training-tool.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "model-training-tool.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.httpPort }}
      targetPort: http
      name: http
    - port: {{ .Values.service.mcpPort }}
      targetPort: mcp
      name: mcp
  selector:
    app.kubernetes.io/name: {{ include "model-training-tool.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}
