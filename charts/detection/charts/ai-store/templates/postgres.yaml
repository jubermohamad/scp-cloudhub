{{- if .Values.postgres.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "model-store.componentName" (list . "postgres-pvc") }}
  namespace: {{ include "model-store.namespace" . }}
  labels:
    app: postgres
    {{- include "model-store.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.postgres.storage.size }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "model-store.componentName" (list . "postgres") }}
  namespace: {{ include "model-store.namespace" . }}
  labels:
    app: postgres
    {{- include "model-store.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "model-store.componentName" (list . "postgres") }}
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
        {{- include "model-store.labels" . | nindent 8 }}
    spec:
      {{- include "model-store.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: postgres
          image: "{{ .Values.postgres.image.repository }}:{{ .Values.postgres.image.tag }}"
          imagePullPolicy: {{ .Values.postgres.image.pullPolicy | default $.Values.global.imagePullPolicy | default "Always" }}
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.secretName }}
                  key: postgres-db
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.secretName }}
                  key: postgres-user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.secretName }}
                  key: postgres-password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
            {{- $mt := index .Values "model_training_tool" | default dict }}
            {{- $mtEnabled := default false $mt.enabled }}
            {{- $mon := index .Values "monitoring_tool" | default dict }}
            {{- $monEnabled := default false $mon.enabled }}
            {{- $mlflowInternal := and (index .Values "internalServices") (index .Values "internalServices" "enabled") (index .Values "internalServices" "mlflow") (index .Values "internalServices" "mlflow" "enabled") }}
            {{- if and .Values.postgres.enabled (or $mlflowInternal $mtEnabled $monEnabled) }}
            - name: mlflow-init-scripts
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
            {{- end }}
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: {{ include "model-store.componentName" (list . "postgres-pvc") }}
        {{- $mt := index .Values "model_training_tool" | default dict }}
        {{- $mtEnabled := default false $mt.enabled }}
        {{- $mon := index .Values "monitoring_tool" | default dict }}
        {{- $monEnabled := default false $mon.enabled }}
        {{- $mlflowInternal := and (index .Values "internalServices") (index .Values "internalServices" "enabled") (index .Values "internalServices" "mlflow") (index .Values "internalServices" "mlflow" "enabled") }}
        {{- if and .Values.postgres.enabled (or $mlflowInternal $mtEnabled $monEnabled) }}
        - name: mlflow-init-scripts
          configMap:
            name: {{ include "model-store.componentName" (list . "postgres-mlflow-init") }}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "model-store.componentName" (list . "postgres") }}
  namespace: {{ include "model-store.namespace" . }}
  labels:
    app: postgres
    {{- include "model-store.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres
  selector:
    app: postgres
{{- end }}
