{{- if .Values.backend.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "model-store.componentName" (list . "backend") }}
  namespace: {{ include "model-store.namespace" . }}
  labels:
    app: backend
    {{- include "model-store.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
        monitoring.modelhub.io/scrape: "true"
        {{- include "model-store.labels" . | nindent 8 }}
      {{- $roll := include "model-store.helmRolloutPodAnnotations" . | trim }}
      {{- if $roll }}
      annotations:
        {{- $roll | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: modelhub-deployer
      imagePullSecrets:
        {{- range .Values.global.imagePullSecrets }}
        - name: {{ .name | default . }}
        {{- end }}
      initContainers:
        - name: migrate
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy | default $.Values.global.imagePullPolicy | default "Always" }}
          command: ["alembic", "upgrade", "head"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.secretName }}
                  key: database-url
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy | default $.Values.global.imagePullPolicy | default "Always" }}
          ports:
            - containerPort: 8000
              name: http-metrics
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.secretName }}
                  key: database-url
            - name: ENVIRONMENT
              value: {{ .Values.backend.env.environment | default "prod" | quote }}
            - name: REDIS_URL
              value: {{ include "model-store.redisUrl" . }}
            - name: CELERY_BROKER_URL
              value: {{ include "model-store.redisUrl" . }}
            - name: CELERY_RESULT_BACKEND
              value: {{ include "model-store.redisUrl" . }}
            {{- if eq (toString .Values.backend.env.globalStoreEnabled) "true" }}
            - name: AZURE_SUBSCRIPTION_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.secretName }}
                  key: azure-subscription-id
            - name: AZURE_RESOURCE_GROUP
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.secretName }}
                  key: azure-resource-group
            - name: AZURE_WORKSPACE_NAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.secretName }}
                  key: azure-workspace-name
            - name: AZURE_REGISTRY_NAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.secretName }}
                  key: azure-registry-name
            - name: AZURE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.secretName }}
                  key: azure-client-id
            - name: AZURE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.secretName }}
                  key: azure-client-secret
            - name: AZURE_TENANT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.secretName }}
                  key: azure-tenant-id
            {{- end }}
            - name: ACR_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.secretName }}
                  key: acr-url
            - name: ACR_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.secretName }}
                  key: acr-username
            - name: ACR_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.secretName }}
                  key: acr-password
            - name: PROD_DEPLOYMENT_TYPE
              value: {{ .Values.backend.env.prodDeploymentType | quote }}
            - name: AKS_CLUSTER_NAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.secretName }}
                  key: aks-cluster-name
            - name: AKS_CONTEXT
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.secretName }}
                  key: aks-context
            - name: AKS_INGRESS_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.secretName }}
                  key: aks-ingress-base-url
            - name: AKS_INGRESS_HOST
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.secretName }}
                  key: aks-ingress-host
            - name: MCP_ROOT_DOMAIN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.secretName }}
                  key: mcp-root-domain
            - name: MCP_TLS_SECRET_NAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.secretName }}
                  key: mcp-tls-secret-name
            - name: MCP_SERVER_URL
              value: {{ (printf "http://%s:8081" (include "model-store.componentName" (list . "mcp-server"))) | quote }}
            {{- $mt := index .Values "model_training_tool" | default dict }}
            {{- if and $mt.enabled $mt.image.repository $mt.image.tag }}
            {{- $segs := splitList "/" $mt.image.repository }}
            {{- if gt (len $segs) 1 }}
            - name: MODEL_TRAINING_TOOL_ACR_REPOSITORY
              value: {{ join "/" (slice $segs 1) | quote }}
            - name: MODEL_TRAINING_TOOL_ACR_TAG
              value: {{ $mt.image.tag | quote }}
            {{- end }}
            {{- $ing := $mt.ingress | default dict }}
            {{- $trainHost := default .Values.domain.trainingServiceHost $ing.host }}
            {{- if $trainHost }}
            - name: TRAINING_SERVICE_DOCS_BASE_URL
              value: {{ printf "https://%s" $trainHost | quote }}
            - name: TRAINING_SERVICE_MCP_BASE_URL
              value: {{ printf "https://%s" $trainHost | quote }}
            {{- end }}
            {{- end }}
            {{- $mon := index .Values "monitoring_tool" | default dict }}
            {{- if and $mon.enabled $mon.image.repository $mon.image.tag }}
            {{- $monSegs := splitList "/" $mon.image.repository }}
            {{- if gt (len $monSegs) 1 }}
            - name: MONITORING_TOOL_ACR_REPOSITORY
              value: {{ join "/" (slice $monSegs 1) | quote }}
            - name: MONITORING_TOOL_ACR_TAG
              value: {{ $mon.image.tag | quote }}
            {{- end }}
            {{- $monIng := $mon.ingress | default dict }}
            {{- $monHost := default .Values.domain.monitoringServiceHost $monIng.host }}
            {{- if $monHost }}
            - name: MONITORING_SERVICE_DOCS_BASE_URL
              value: {{ printf "https://%s" $monHost | quote }}
            - name: MONITORING_SERVICE_MCP_BASE_URL
              value: {{ printf "https://%s" $monHost | quote }}
            {{- end }}
            {{- end }}
            - name: MODEL_STORE_PROVIDER
              value: {{ .Values.backend.env.modelStoreProvider | quote }}
            {{- if default false .Values.internalServices.zot.enabled }}
            - name: ZOT_REGISTRY_URL
              value: {{ include "model-store.zotRegistryHost" . | quote }}
            {{- if .Values.zot.auth.enabled }}
            - name: ZOT_REGISTRY_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "model-store.zotAuthSecretName" . }}
                  key: ZOT_REGISTRY_USERNAME
            - name: ZOT_REGISTRY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "model-store.zotAuthSecretName" . }}
                  key: ZOT_REGISTRY_PASSWORD
            {{- end }}
            {{- end }}
            - name: GLOBAL_STORE_ENABLED
              value: {{ .Values.backend.env.globalStoreEnabled | quote }}
            - name: DEPLOYMENT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.secretName }}
                  key: deployment-api-key
            - name: BACKEND_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.secretName }}
                  key: backend-api-key
            - name: EXTERNAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.secretName }}
                  key: external-api-key
                  optional: true
            - name: EXTERNAL_API_TRUST_FORWARDED_FOR
              value: {{ .Values.backend.env.externalApiTrustForwardedFor | quote }}
            - name: DEPLOYMENT_NAME_PREFIX
              value: {{ default "" .Values.namePrefix | quote }}
            - name: SINGLE_NAMESPACE_MODE
              value: {{ .Values.singleNamespace.enabled | quote }}
            - name: DEFAULT_NAMESPACE
              value: {{ include "model-store.defaultNamespace" . | quote }}
            - name: MODELS_NAMESPACE
              value: {{ include "model-store.defaultNamespace" . | quote }}
            - name: MCP_NAMESPACE
              value: {{ include "model-store.defaultNamespace" . | quote }}
            - name: AGENTS_NAMESPACE
              value: {{ include "model-store.defaultNamespace" . | quote }}
            # Env fallback for the payload-size cap when no runtime override exists in
            # app_settings. The backend reads the override from Postgres first (see
            # services/platform_settings.resolve_ingress_proxy_body_size); this keeps the
            # static default aligned with the celery worker.
            - name: INGRESS_PROXY_BODY_SIZE
              value: {{ .Values.ingress.proxyBodySize | quote }}
            - name: MLFLOW_TRACKING_URI
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.secretName }}
                  key: mlflow-tracking-uri
                  optional: true
            - name: MLFLOW_TRACKING_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.secretName }}
                  key: mlflow-tracking-username
                  optional: true
            - name: MLFLOW_TRACKING_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.secretName }}
                  key: mlflow-tracking-password
                  optional: true
            - name: MLFLOW_S3_ENDPOINT_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.secretName }}
                  key: mlflow-s3-endpoint-url
                  optional: true
            - name: MLFLOW_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.secretName }}
                  key: mlflow-database-url
                  optional: true
            - name: AZURE_STORAGE_CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.secretName }}
                  key: azure-storage-connection-string
                  optional: true
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.secretName }}
                  key: aws-access-key-id
                  optional: true
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.secretName }}
                  key: aws-secret-access-key
                  optional: true
            - name: MLFLOW_EXTERNAL_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.secretName }}
                  key: mlflow-external-url
                  optional: true
            - name: MLFLOW_S3_ENDPOINT_URL_EXTERNAL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.secretName }}
                  key: mlflow-s3-endpoint-url-external
                  optional: true
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "model-store.componentName" (list . "backend") }}
  namespace: {{ include "model-store.namespace" . }}
  labels:
    app: backend
    monitoring.modelhub.io/scrape: "true"
    {{- include "model-store.labels" . | nindent 4 }}
spec:
  type: {{ .Values.backend.service.type }}
  ports:
    - port: {{ .Values.backend.service.port }}
      targetPort: 8000
      name: http-metrics
  selector:
    app: backend
{{- end }}
