{{- if and (default false .Values.internalServices.zot.enabled) .Values.zot.tls.enabled .Values.zot.tls.selfSignedJob.enabled (not .Values.zot.tls.certManager.enabled) }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-zot-tls-bootstrap
  namespace: {{ include "model-store.namespace" . }}
  labels:
    {{- include "model-store.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "4"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-zot-tls-bootstrap
  namespace: {{ include "model-store.namespace" . }}
  labels:
    {{- include "model-store.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "4"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-zot-tls-bootstrap
  namespace: {{ include "model-store.namespace" . }}
  labels:
    {{- include "model-store.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "4"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-zot-tls-bootstrap
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-zot-tls-bootstrap
    namespace: {{ include "model-store.namespace" . }}
{{- end }}
