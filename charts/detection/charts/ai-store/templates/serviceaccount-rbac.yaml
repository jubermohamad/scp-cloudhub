{{- /* Sprig `default true` treats boolean false as empty — use explicit key check so rbac.create: false works (e.g. internal-stack-only Helm release). */ -}}
{{- $rbac := .Values.rbac | default dict -}}
{{- $rbacCreate := true -}}
{{- if hasKey $rbac "create" -}}
  {{- $rbacCreate = index $rbac "create" -}}
{{- end -}}
{{- if $rbacCreate }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: modelhub-deployer
  namespace: {{ include "model-store.namespace" . }}
  labels:
    {{- include "model-store.labels" . | nindent 4 }}
---
# ClusterRole for namespaces (read-only) - required by K8sClient._ensure_namespace
# Name includes release namespace so multiple model-store deployments can coexist
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: modelhub-deployer-namespaces-{{ include "model-store.namespace" . }}
  labels:
    {{- include "model-store.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: modelhub-deployer-namespaces-{{ include "model-store.namespace" . }}
  labels:
    {{- include "model-store.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: modelhub-deployer
    namespace: {{ include "model-store.namespace" . }}
roleRef:
  kind: ClusterRole
  name: modelhub-deployer-namespaces-{{ include "model-store.namespace" . }}
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: modelhub-deployer-role
  namespace: {{ include "model-store.namespace" . }}
  labels:
    {{- include "model-store.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps", "secrets", "persistentvolumeclaims", "serviceaccounts", "events"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "replicasets", "daemonsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get", "list"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["monitoring.coreos.com"]
    resources: ["servicemonitors", "podmonitors", "prometheusrules", "alertmanagers", "prometheuses"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: modelhub-deployer-rolebinding
  namespace: {{ include "model-store.namespace" . }}
  labels:
    {{- include "model-store.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: modelhub-deployer
    namespace: {{ include "model-store.namespace" . }}
roleRef:
  kind: Role
  name: modelhub-deployer-role
  apiGroup: rbac.authorization.k8s.io
{{- end }}
