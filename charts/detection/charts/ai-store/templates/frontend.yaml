{{- if .Values.frontend.enabled }}
# Nginx config with correct backend service name (namePrefix-aware). Image has hardcoded "backend" which fails in K8s.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "model-store.componentName" (list . "frontend-nginx-config") }}
  namespace: {{ include "model-store.namespace" . }}
  labels:
    app: frontend
    {{- include "model-store.labels" . | nindent 4 }}
data:
  default.conf: |
    server {
        listen 80;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;
        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_proxied any;
        gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml;
        location /api/ {
            proxy_pass http://{{ include "model-store.componentName" (list . "backend") }}:8000/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
        location / {
            try_files $uri $uri/ /index.html;
        }
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "model-store.componentName" (list . "frontend") }}
  namespace: {{ include "model-store.namespace" . }}
  labels:
    app: frontend
    {{- include "model-store.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
        {{- include "model-store.labels" . | nindent 8 }}
      {{- $roll := include "model-store.helmRolloutPodAnnotations" . | trim }}
      {{- if $roll }}
      annotations:
        {{- $roll | nindent 8 }}
      {{- end }}
    spec:
      imagePullSecrets:
        {{- range .Values.global.imagePullSecrets }}
        - name: {{ .name | default . }}
        {{- end }}
      containers:
        - name: frontend
          image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy | default $.Values.global.imagePullPolicy | default "Always" }}
          ports:
            - containerPort: 80
              name: http
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: nginx-config
          configMap:
            name: {{ include "model-store.componentName" (list . "frontend-nginx-config") }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "model-store.componentName" (list . "frontend") }}
  namespace: {{ include "model-store.namespace" . }}
  labels:
    app: frontend
    {{- include "model-store.labels" . | nindent 4 }}
spec:
  type: {{ .Values.frontend.service.type }}
  ports:
    - port: {{ .Values.frontend.service.port }}
      targetPort: 80
      name: http
  selector:
    app: frontend
{{- end }}
