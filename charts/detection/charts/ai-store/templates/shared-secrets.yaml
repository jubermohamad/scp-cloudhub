{{- if .Values.global.manageSecrets }}
{{- /* Core secrets - always required */}}
{{- if not .Values.global.secrets.databaseUrl }}
{{- fail "ERROR: You must set global.secrets.databaseUrl at deployment time." }}
{{- end }}
{{- if not .Values.global.secrets.redisUrl }}
{{- fail "ERROR: You must set global.secrets.redisUrl at deployment time." }}
{{- end }}
{{- /* Azure ML - required only when globalStoreEnabled is true */}}
{{- if eq (toString .Values.backend.env.globalStoreEnabled) "true" }}
{{- if not .Values.global.secrets.azureSubscriptionId }}
{{- fail "ERROR: You must set global.secrets.azureSubscriptionId at deployment time when globalStoreEnabled is true." }}
{{- end }}
{{- if not .Values.global.secrets.azureResourceGroup }}
{{- fail "ERROR: You must set global.secrets.azureResourceGroup at deployment time when globalStoreEnabled is true." }}
{{- end }}
{{- if not .Values.global.secrets.azureWorkspaceName }}
{{- fail "ERROR: You must set global.secrets.azureWorkspaceName at deployment time when globalStoreEnabled is true." }}
{{- end }}
{{- if not .Values.global.secrets.azureRegistryName }}
{{- fail "ERROR: You must set global.secrets.azureRegistryName at deployment time when globalStoreEnabled is true." }}
{{- end }}
{{- if not .Values.global.secrets.azureTenantId }}
{{- fail "ERROR: You must set global.secrets.azureTenantId at deployment time when globalStoreEnabled is true." }}
{{- end }}
{{- if not .Values.global.secrets.azureClientId }}
{{- fail "ERROR: You must set global.secrets.azureClientId at deployment time when globalStoreEnabled is true." }}
{{- end }}
{{- if not .Values.global.secrets.azureClientSecret }}
{{- fail "ERROR: You must set global.secrets.azureClientSecret at deployment time when globalStoreEnabled is true." }}
{{- end }}
{{- end }}
{{- if not .Values.global.secrets.acrUrl }}
{{- fail "ERROR: You must set global.secrets.acrUrl at deployment time." }}
{{- end }}
{{- if not .Values.global.secrets.acrUsername }}
{{- fail "ERROR: You must set global.secrets.acrUsername at deployment time." }}
{{- end }}
{{- if not .Values.global.secrets.acrPassword }}
{{- fail "ERROR: You must set global.secrets.acrPassword at deployment time." }}
{{- end }}
{{- if not .Values.global.secrets.mcpRootDomain }}
{{- fail "ERROR: You must set global.secrets.mcpRootDomain at deployment time." }}
{{- end }}
{{- if not .Values.global.secrets.mcpApiKey }}
{{- fail "ERROR: You must set global.secrets.mcpApiKey at deployment time." }}
{{- end }}
{{- if not .Values.global.secrets.deploymentApiKey }}
{{- fail "ERROR: You must set global.secrets.deploymentApiKey at deployment time." }}
{{- end }}
{{- if not .Values.global.secrets.backendApiKey }}
{{- fail "ERROR: You must set global.secrets.backendApiKey at deployment time." }}
{{- end }}
{{- if not .Values.global.secrets.aksClusterName }}
{{- fail "ERROR: You must set global.secrets.aksClusterName at deployment time." }}
{{- end }}
{{- if not .Values.global.secrets.aksContext }}
{{- fail "ERROR: You must set global.secrets.aksContext at deployment time." }}
{{- end }}
{{- /* aksIngressHost / aksIngressBaseUrl may both be empty for in-cluster-only model endpoints (see README). */}}
{{- $aksHost := .Values.global.secrets.aksIngressHost | default "" | trim }}
{{- $aksBase := .Values.global.secrets.aksIngressBaseUrl | default "" | trim }}
{{- if and (eq $aksHost "") (ne $aksBase "") }}
{{- fail "ERROR: global.secrets.aksIngressBaseUrl is set but aksIngressHost is empty. Set both for public ingress, or set both empty for cluster-local model URLs only." }}
{{- end }}
{{- if and (ne $aksHost "") (eq $aksBase "") }}
{{- fail "ERROR: global.secrets.aksIngressHost is set but aksIngressBaseUrl is empty. Set both for public ingress, or set both empty for cluster-local model URLs only." }}
{{- end }}
{{- if not .Values.global.secrets.mcpTlsSecretName }}
{{- fail "ERROR: You must set global.secrets.mcpTlsSecretName at deployment time." }}
{{- end }}
{{- if not .Values.global.secrets.modelsNamespace }}
{{- fail "ERROR: You must set global.secrets.modelsNamespace at deployment time." }}
{{- end }}
{{- if not .Values.global.secrets.mcpNamespace }}
{{- fail "ERROR: You must set global.secrets.mcpNamespace at deployment time." }}
{{- end }}
{{- if not .Values.global.secrets.agentsNamespace }}
{{- fail "ERROR: You must set global.secrets.agentsNamespace at deployment time." }}
{{- end }}
{{- /* MLflow/Azure - conditional: internal mode uses our MLflow; external mode uses global.secrets */}}
{{- if and (index .Values "internalServices") (index .Values "internalServices" "enabled") }}
{{- if not (index .Values "internalServices" "secrets" "minioRootUser") }}
{{- fail "ERROR: You must set internalServices.secrets.minioRootUser at deployment time when internalServices.enabled is true." }}
{{- end }}
{{- if not (index .Values "internalServices" "secrets" "minioRootPassword") }}
{{- fail "ERROR: You must set internalServices.secrets.minioRootPassword at deployment time when internalServices.enabled is true." }}
{{- end }}
{{- if and (index .Values "internalServices" "mlflow") (index .Values "internalServices" "mlflow" "enabled") }}
{{- if not (index .Values "internalServices" "secrets" "mlflowAdminUser") }}
{{- fail "ERROR: You must set internalServices.secrets.mlflowAdminUser at deployment time when internalServices.mlflow.enabled is true." }}
{{- end }}
{{- if not (index .Values "internalServices" "secrets" "mlflowAdminPassword") }}
{{- fail "ERROR: You must set internalServices.secrets.mlflowAdminPassword at deployment time when internalServices.mlflow.enabled is true." }}
{{- end }}
{{- end }}
{{- if and (index .Values "internalServices" "zot") (index .Values "internalServices" "zot" "enabled") .Values.zot.auth.enabled }}
{{- $zpass := include "model-store.zotAuthPassword" . | trim -}}
{{- if not $zpass }}
{{- fail "ERROR: You must set internalServices.secrets.zotRegistryPassword in secrets.values.yaml (or zot.auth.password) when zot.auth.enabled is true." }}
{{- end }}
{{- end }}
{{- else }}
{{- /* When modelStoreProvider=azureml, no MLflow credentials required (Azure ML only) */}}
{{- if ne (index .Values "backend" "env" "modelStoreProvider") "azureml" }}
{{- if not .Values.global.secrets.mlflowTrackingUri }}
{{- fail "ERROR: You must set global.secrets.mlflowTrackingUri at deployment time when internalServices.enabled is false and modelStoreProvider is not azureml." }}
{{- end }}
{{- if not .Values.global.secrets.mlflowTrackingUsername }}
{{- fail "ERROR: You must set global.secrets.mlflowTrackingUsername at deployment time when internalServices.enabled is false and modelStoreProvider is not azureml." }}
{{- end }}
{{- if not .Values.global.secrets.mlflowTrackingPassword }}
{{- fail "ERROR: You must set global.secrets.mlflowTrackingPassword at deployment time when internalServices.enabled is false and modelStoreProvider is not azureml." }}
{{- end }}
{{- if not .Values.global.secrets.azureStorageConnectionString }}
{{- fail "ERROR: You must set global.secrets.azureStorageConnectionString at deployment time when internalServices.enabled is false and modelStoreProvider is not azureml." }}
{{- end }}
{{- end }}
{{- end }}

{{- /* Postgres - required when postgres.enabled */}}
{{- if .Values.postgres.enabled }}
{{- if not .Values.global.secrets.postgresUser }}
{{- fail "ERROR: You must set global.secrets.postgresUser at deployment time when postgres.enabled is true." }}
{{- end }}
{{- if not .Values.global.secrets.postgresPassword }}
{{- fail "ERROR: You must set global.secrets.postgresPassword at deployment time when postgres.enabled is true." }}
{{- end }}
{{- if not .Values.global.secrets.postgresDb }}
{{- fail "ERROR: You must set global.secrets.postgresDb at deployment time when postgres.enabled is true." }}
{{- end }}
{{- end }}

{{- /* OAuth2 Proxy - required when oauth2Proxy.enabled */}}
{{- if .Values.oauth2Proxy.enabled }}
{{- if not .Values.global.secrets.oauth2ProxyClientId }}
{{- fail "ERROR: You must set global.secrets.oauth2ProxyClientId at deployment time when oauth2Proxy.enabled is true." }}
{{- end }}
{{- if not .Values.global.secrets.oauth2ProxyClientSecret }}
{{- fail "ERROR: You must set global.secrets.oauth2ProxyClientSecret at deployment time when oauth2Proxy.enabled is true." }}
{{- end }}
{{- if not .Values.global.secrets.oauth2ProxyCookieSecret }}
{{- fail "ERROR: You must set global.secrets.oauth2ProxyCookieSecret at deployment time when oauth2Proxy.enabled is true." }}
{{- end }}
{{- if not .Values.global.secrets.oauth2ProxyEmailDomains }}
{{- fail "ERROR: You must set global.secrets.oauth2ProxyEmailDomains at deployment time when oauth2Proxy.enabled is true." }}
{{- end }}
{{- if not .Values.global.secrets.oauth2ProxyRedirectUrl }}
{{- fail "ERROR: You must set global.secrets.oauth2ProxyRedirectUrl at deployment time when oauth2Proxy.enabled is true." }}
{{- end }}
{{- if not .Values.global.secrets.oauth2ProxyOidcIssuerUrl }}
{{- fail "ERROR: You must set global.secrets.oauth2ProxyOidcIssuerUrl at deployment time when oauth2Proxy.enabled is true." }}
{{- end }}
{{- end }}

{{- /* Dex - required when dex.enabled */}}
{{- if .Values.dex.enabled }}
{{- if not .Values.global.secrets.dexIssuer }}
{{- fail "ERROR: You must set global.secrets.dexIssuer at deployment time when dex.enabled is true." }}
{{- end }}
{{- if not .Values.global.secrets.dexStaticUserEmail }}
{{- fail "ERROR: You must set global.secrets.dexStaticUserEmail at deployment time when dex.enabled is true." }}
{{- end }}
{{- if not .Values.global.secrets.dexStaticUserUsername }}
{{- fail "ERROR: You must set global.secrets.dexStaticUserUsername at deployment time when dex.enabled is true." }}
{{- end }}
{{- if not .Values.global.secrets.dexOauth2ProxyClientId }}
{{- fail "ERROR: You must set global.secrets.dexOauth2ProxyClientId at deployment time when dex.enabled is true." }}
{{- end }}
{{- if not .Values.global.secrets.dexOauth2ProxyClientSecret }}
{{- fail "ERROR: You must set global.secrets.dexOauth2ProxyClientSecret at deployment time when dex.enabled is true." }}
{{- end }}
{{- if not .Values.global.secrets.dexOauth2ProxyRedirectUri }}
{{- fail "ERROR: You must set global.secrets.dexOauth2ProxyRedirectUri at deployment time when dex.enabled is true." }}
{{- end }}
{{- if .Values.dex.microsoft.enabled }}
{{- if not .Values.global.secrets.dexMicrosoftClientId }}
{{- fail "ERROR: You must set global.secrets.dexMicrosoftClientId at deployment time when dex.microsoft.enabled is true." }}
{{- end }}
{{- if not .Values.global.secrets.dexMicrosoftClientSecret }}
{{- fail "ERROR: You must set global.secrets.dexMicrosoftClientSecret at deployment time when dex.microsoft.enabled is true." }}
{{- end }}
{{- if not .Values.global.secrets.dexMicrosoftRedirectUri }}
{{- fail "ERROR: You must set global.secrets.dexMicrosoftRedirectUri at deployment time when dex.microsoft.enabled is true." }}
{{- end }}
{{- if not .Values.global.secrets.dexMicrosoftDomainHint }}
{{- fail "ERROR: You must set global.secrets.dexMicrosoftDomainHint at deployment time when dex.microsoft.enabled is true." }}
{{- end }}
{{- end }}
{{- end }}

apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.global.secretName }}
  namespace: {{ include "model-store.namespace" . }}
  labels:
    {{- include "model-store.labels" . | nindent 4 }}
type: Opaque
stringData:
  database-url: {{ .Values.global.secrets.databaseUrl | quote }}
  redis-url: {{ .Values.global.secrets.redisUrl | quote }}
  {{- if eq (toString .Values.backend.env.globalStoreEnabled) "true" }}
  azure-subscription-id: {{ .Values.global.secrets.azureSubscriptionId | quote }}
  azure-resource-group: {{ .Values.global.secrets.azureResourceGroup | quote }}
  azure-workspace-name: {{ .Values.global.secrets.azureWorkspaceName | quote }}
  azure-registry-name: {{ .Values.global.secrets.azureRegistryName | quote }}
  azure-tenant-id: {{ .Values.global.secrets.azureTenantId | quote }}
  azure-client-id: {{ .Values.global.secrets.azureClientId | quote }}
  azure-client-secret: {{ .Values.global.secrets.azureClientSecret | quote }}
  {{- end }}
  acr-url: {{ .Values.global.secrets.acrUrl | quote }}
  acr-username: {{ .Values.global.secrets.acrUsername | quote }}
  acr-password: {{ .Values.global.secrets.acrPassword | quote }}
  mcp-root-domain: {{ .Values.global.secrets.mcpRootDomain | quote }}
  mcp-api-key: {{ .Values.global.secrets.mcpApiKey | quote }}
  deployment-api-key: {{ .Values.global.secrets.deploymentApiKey | quote }}
  backend-api-key: {{ .Values.global.secrets.backendApiKey | quote }}
  external-api-key: {{ .Values.global.secrets.externalApiKey | default .Values.global.secrets.backendApiKey | quote }}
  aks-cluster-name: {{ .Values.global.secrets.aksClusterName | quote }}
  aks-context: {{ .Values.global.secrets.aksContext | quote }}
  aks-ingress-host: {{ .Values.global.secrets.aksIngressHost | quote }}
  aks-ingress-base-url: {{ .Values.global.secrets.aksIngressBaseUrl | quote }}
  mcp-tls-secret-name: {{ .Values.global.secrets.mcpTlsSecretName | quote }}
  models-namespace: {{ .Values.global.secrets.modelsNamespace | quote }}
  mcp-namespace: {{ .Values.global.secrets.mcpNamespace | quote }}
  agents-namespace: {{ .Values.global.secrets.agentsNamespace | quote }}
  {{- if and (index .Values "internalServices") (index .Values "internalServices" "enabled") }}
  {{- /* In-cluster MLflow/MinIO charts are named by their own fullnameOverride, NOT
       by namePrefix (which applies to model-store components only) — so this URL
       resolves through model-store.mlflowEndpoint rather than repeating the name. */}}
  mlflow-tracking-uri: {{ include "model-store.mlflowEndpoint" . | quote }}
  mlflow-tracking-username: {{ index .Values "internalServices" "secrets" "mlflowAdminUser" | quote }}
  mlflow-tracking-password: {{ index .Values "internalServices" "secrets" "mlflowAdminPassword" | quote }}
  admin-user: {{ index .Values "internalServices" "secrets" "mlflowAdminUser" | quote }}
  admin-password: {{ index .Values "internalServices" "secrets" "mlflowAdminPassword" | quote }}
  flask-server-secret-key: {{ index .Values "internalServices" "secrets" "mlflowFlaskSecretKey" | default "mlflow-flask-secret-change-me" | quote }}
  {{- /* in-tree patch: values-driven S3 endpoint (was hardcoded
       "http://minio:9000", which in a multi-chart release resolved to
       whatever OTHER chart owned a Service called "minio") */}}
  mlflow-s3-endpoint-url: {{ include "model-store.minioEndpoint" . | quote }}
  {{- /* in-tree patch: with an external postgres (postgres.enabled=false),
       take the host from global.secrets.postgresHost instead of dropping
       the key entirely (backend reads MLFLOW_DATABASE_URL from it) */}}
  {{- if and (index .Values "internalServices" "mlflow") (index .Values "internalServices" "mlflow" "enabled") (or .Values.postgres.enabled .Values.global.secrets.postgresHost) }}
  mlflow-database-url: {{ printf "postgresql://%s:%s@%s:5432/mlflow" .Values.global.secrets.postgresUser .Values.global.secrets.postgresPassword (ternary (include "model-store.componentName" (list . "postgres")) .Values.global.secrets.postgresHost (.Values.postgres.enabled | default false)) | quote }}
  {{- end }}
  azure-storage-connection-string: {{ .Values.global.secrets.azureStorageConnectionString | default "" | quote }}
  aws-access-key-id: {{ index .Values "internalServices" "secrets" "minioRootUser" | quote }}
  aws-secret-access-key: {{ index .Values "internalServices" "secrets" "minioRootPassword" | quote }}
  root-user: {{ index .Values "internalServices" "secrets" "minioRootUser" | quote }}
  root-password: {{ index .Values "internalServices" "secrets" "minioRootPassword" | quote }}
  rootUser: {{ index .Values "internalServices" "secrets" "minioRootUser" | quote }}
  rootPassword: {{ index .Values "internalServices" "secrets" "minioRootPassword" | quote }}
  {{- if and (index .Values "internalServices") (index .Values "internalServices" "mlflow") (index .Values "internalServices" "mlflow" "externalUrl") }}
  mlflow-external-url: {{ index .Values "internalServices" "mlflow" "externalUrl" | quote }}
  {{- end }}
  {{- if and (index .Values "internalServices") (index .Values "internalServices" "minio") (index .Values "internalServices" "minio" "externalUrl") }}
  mlflow-s3-endpoint-url-external: {{ index .Values "internalServices" "minio" "externalUrl" | quote }}
  {{- end }}
  {{- if and (index .Values "internalServices" "zot") (index .Values "internalServices" "zot" "enabled") .Values.zot.auth.enabled }}
  zot-registry-username: {{ include "model-store.zotAuthUsername" . | quote }}
  zot-registry-password: {{ include "model-store.zotAuthPassword" . | quote }}
  {{- end }}
  {{- else }}
  {{- if eq (index .Values "backend" "env" "modelStoreProvider") "azureml" }}
  {{- /* Azure ML only: no MLflow; use empty placeholders */}}
  mlflow-tracking-uri: ""
  mlflow-tracking-username: ""
  mlflow-tracking-password: ""
  mlflow-s3-endpoint-url: ""
  azure-storage-connection-string: ""
  {{- else }}
  mlflow-tracking-uri: {{ .Values.global.secrets.mlflowTrackingUri | quote }}
  mlflow-tracking-username: {{ .Values.global.secrets.mlflowTrackingUsername | quote }}
  mlflow-tracking-password: {{ .Values.global.secrets.mlflowTrackingPassword | quote }}
  mlflow-s3-endpoint-url: {{ .Values.global.secrets.mlflowS3EndpointUrl | default "" | quote }}
  azure-storage-connection-string: {{ .Values.global.secrets.azureStorageConnectionString | quote }}
  {{- end }}
  {{- end }}
  {{- /* in-tree patch: same fix as mlflow-database-url below/above — these were
       rendered ONLY for the bundled postgres, but mlflow's backendStore and auth
       reference them through existingSecret (postgres-user / postgres-password)
       regardless of who hosts the database. With postgres.enabled=false the keys
       disappeared and mlflow-tracking wedged in CreateContainerConfigError
       ("couldn't find key postgres-password in Secret modelhub-secrets"). It only
       ever worked because a long-lived Secret still carried the stale keys —
       exposed by the clean uninstall/reinstall. */}}
  {{- if or .Values.postgres.enabled .Values.global.secrets.postgresHost }}
  postgres-user: {{ .Values.global.secrets.postgresUser | quote }}
  postgres-password: {{ .Values.global.secrets.postgresPassword | quote }}
  postgres-db: {{ .Values.global.secrets.postgresDb | quote }}
  {{- $mt := index .Values "model_training_tool" | default dict }}
  {{- if and (default false $mt.enabled) }}
  model-training-database-url: {{ printf "postgresql://%s:%s@%s:5432/model_training" .Values.global.secrets.postgresUser .Values.global.secrets.postgresPassword (include "model-store.componentName" (list . "postgres")) | quote }}
  {{- end }}
  {{- $mon := index .Values "monitoring_tool" | default dict }}
  {{- if and (default false $mon.enabled) }}
  monitoring-database-url: {{ printf "postgresql://%s:%s@%s:5432/model_monitoring" .Values.global.secrets.postgresUser .Values.global.secrets.postgresPassword (include "model-store.componentName" (list . "postgres")) | quote }}
  {{- end }}
  {{- end }}
  {{- if .Values.oauth2Proxy.enabled }}
  oauth2-proxy-client-id: {{ .Values.global.secrets.oauth2ProxyClientId | quote }}
  oauth2-proxy-client-secret: {{ .Values.global.secrets.oauth2ProxyClientSecret | quote }}
  oauth2-proxy-cookie-secret: {{ .Values.global.secrets.oauth2ProxyCookieSecret | quote }}
  oauth2-proxy-email-domains: {{ .Values.global.secrets.oauth2ProxyEmailDomains | quote }}
  oauth2-proxy-redirect-url: {{ .Values.global.secrets.oauth2ProxyRedirectUrl | quote }}
  oauth2-proxy-oidc-issuer-url: {{ .Values.global.secrets.oauth2ProxyOidcIssuerUrl | quote }}
  {{- end }}
  {{- if .Values.dex.enabled }}
  dex-issuer: {{ .Values.global.secrets.dexIssuer | quote }}
  dex-static-user-email: {{ .Values.global.secrets.dexStaticUserEmail | quote }}
  dex-static-user-username: {{ .Values.global.secrets.dexStaticUserUsername | quote }}
  dex-oauth2-proxy-client-id: {{ .Values.global.secrets.dexOauth2ProxyClientId | quote }}
  dex-oauth2-proxy-client-secret: {{ .Values.global.secrets.dexOauth2ProxyClientSecret | quote }}
  dex-oauth2-proxy-redirect-uri: {{ .Values.global.secrets.dexOauth2ProxyRedirectUri | quote }}
  {{- if .Values.dex.microsoft.enabled }}
  dex-microsoft-client-id: {{ .Values.global.secrets.dexMicrosoftClientId | quote }}
  dex-microsoft-client-secret: {{ .Values.global.secrets.dexMicrosoftClientSecret | quote }}
  dex-microsoft-redirect-uri: {{ .Values.global.secrets.dexMicrosoftRedirectUri | quote }}
  dex-microsoft-domain-hint: {{ .Values.global.secrets.dexMicrosoftDomainHint | quote }}
  {{- end }}
  {{- end }}
{{- end }}
