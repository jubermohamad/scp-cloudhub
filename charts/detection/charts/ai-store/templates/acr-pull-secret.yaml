{{- if .Values.global.manageImagePullSecrets }}
{{- $root := . -}}
{{- $releaseNs := include "model-store.namespace" . -}}
{{- $modelsNs := include "model-store.modelsNamespace" . -}}
{{- range .Values.global.imagePullSecrets }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .name }}
  namespace: {{ $releaseNs }}
  labels:
    {{- include "model-store.labels" $root | nindent 4 }}
    app.kubernetes.io/component: acr-pull-secret
type: kubernetes.io/dockerconfigjson
data:
{{- include "model-store.acrPullSecretData" $root | nindent 2 }}
{{- end }}
{{- if ne $releaseNs $modelsNs }}
{{- range .Values.global.imagePullSecrets }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .name }}
  namespace: {{ $modelsNs }}
  labels:
    {{- include "model-store.labels" $root | nindent 4 }}
    app.kubernetes.io/component: acr-pull-secret
type: kubernetes.io/dockerconfigjson
data:
{{- include "model-store.acrPullSecretData" $root | nindent 2 }}
{{- end }}
{{- end }}
{{- end }}
