{{- if and (default false .Values.internalServices.zot.enabled) .Values.zot.tls.enabled .Values.zot.tls.selfSignedJob.enabled (not .Values.zot.tls.certManager.enabled) }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-zot-tls-bootstrap
  namespace: {{ include "model-store.namespace" . }}
  labels:
    {{- include "model-store.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  # 7200, not 120: a TTL shorter than helm's wait deletes a completed Job
  # while the watcher still needs it, and the release fails as NotFound
  ttlSecondsAfterFinished: 7200
  backoffLimit: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zot-tls-bootstrap
        {{- include "model-store.labels" . | nindent 8 }}
    spec:
      {{- include "model-store.imagePullSecrets" . | nindent 6 }}
      restartPolicy: Never
      serviceAccountName: {{ .Release.Name }}-zot-tls-bootstrap
      containers:
        - name: bootstrap
          image: "{{ (((.Values.zotBootstrap).image).repository) | default "alpine" }}:{{ (((.Values.zotBootstrap).image).tag) | default "3.19" }}"
          imagePullPolicy: {{ $.Values.global.imagePullPolicy | default "Always" }}
          env:
            - name: TARGET_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: TLS_SECRET_NAME
              value: {{ include "model-store.modelhubTlsSecret" . | quote }}
            - name: ZOT_SHORT
              value: {{ .Values.zot.fullnameOverride | default "zot" | quote }}
            - name: ZOT_FQDN
              value: {{ printf "%s.%s.svc.cluster.local" (.Values.zot.fullnameOverride | default "zot") (include "model-store.namespace" .) | quote }}
          command:
            - /bin/sh
            - -c
            - |
              set -e
              APISERVER="https://kubernetes.default.svc"
              CA=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt
              TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
              code=$(curl -s -o /dev/null -w "%{http_code}" --cacert "$CA" \
                -H "Authorization: Bearer $TOKEN" \
                "$APISERVER/api/v1/namespaces/${TARGET_NAMESPACE}/secrets/${TLS_SECRET_NAME}" || true)
              if [ "$code" = "200" ]; then
                echo "TLS secret already exists, skipping"
                exit 0
              fi
              apk add --no-cache openssl curl >/dev/null
              openssl req -x509 -newkey rsa:2048 -nodes \
                -keyout /tmp/tls.key -out /tmp/tls.crt -days 825 \
                -subj "/CN=${ZOT_SHORT}" \
                -addext "subjectAltName=DNS:${ZOT_SHORT},DNS:${ZOT_FQDN}"
              if base64 -w0 /tmp/tls.crt >/dev/null 2>&1; then
                CRT_B64=$(base64 -w0 /tmp/tls.crt)
                KEY_B64=$(base64 -w0 /tmp/tls.key)
              else
                CRT_B64=$(base64 < /tmp/tls.crt | tr -d '\n')
                KEY_B64=$(base64 < /tmp/tls.key | tr -d '\n')
              fi
              payload=$(printf '%s' "{\"apiVersion\":\"v1\",\"kind\":\"Secret\",\"metadata\":{\"name\":\"${TLS_SECRET_NAME}\",\"namespace\":\"${TARGET_NAMESPACE}\"},\"type\":\"kubernetes.io/tls\",\"data\":{\"tls.crt\":\"${CRT_B64}\",\"tls.key\":\"${KEY_B64}\"}}")
              curl --fail --cacert "$CA" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
                -X POST "$APISERVER/api/v1/namespaces/${TARGET_NAMESPACE}/secrets" \
                -d "$payload"
              echo "Created TLS secret ${TLS_SECRET_NAME}"
{{- end }}
