{{- if .Values.mcpServer.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "model-store.componentName" (list . "mcp-server") }}
  namespace: {{ include "model-store.namespace" . }}
  labels:
    app: mcp-server
    {{- include "model-store.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.mcpServer.replicaCount }}
  selector:
    matchLabels:
      app: mcp-server
  template:
    metadata:
      labels:
        app: mcp-server
        monitoring.modelhub.io/scrape: "true"
        {{- include "model-store.labels" . | nindent 8 }}
      {{- $roll := include "model-store.helmRolloutPodAnnotations" . | trim }}
      {{- if $roll }}
      annotations:
        {{- $roll | nindent 8 }}
      {{- end }}
    spec:
      imagePullSecrets:
        {{- range .Values.global.imagePullSecrets }}
        - name: {{ .name | default . }}
        {{- end }}
      containers:
        - name: mcp-server
          image: "{{ .Values.mcpServer.image.repository }}:{{ .Values.mcpServer.image.tag }}"
          imagePullPolicy: {{ .Values.mcpServer.image.pullPolicy | default $.Values.global.imagePullPolicy | default "Always" }}
          ports:
            - containerPort: 8081
              name: http-metrics
          env:
            - name: MCP_PORT
              value: "8081"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.secretName }}
                  key: database-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.secretName }}
                  key: redis-url
            - name: MCP_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.secretName }}
                  key: mcp-api-key
            - name: DEPLOYMENT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.secretName }}
                  key: deployment-api-key
            - name: MCP_PREDICT_GUARD_ENABLED
              value: {{ .Values.mcpServer.guard.enabled | quote }}
            - name: MCP_PREDICT_REQUEST_LIMIT
              value: {{ .Values.mcpServer.guard.requestLimit | quote }}
            - name: MCP_PREDICT_REQUEST_WINDOW_SECONDS
              value: {{ .Values.mcpServer.guard.requestWindowSeconds | quote }}
            - name: MCP_PREDICT_ROW_LIMIT
              value: {{ .Values.mcpServer.guard.rowLimit | quote }}
            - name: MCP_PREDICT_ROW_WINDOW_SECONDS
              value: {{ .Values.mcpServer.guard.rowWindowSeconds | quote }}
            - name: MCP_MAX_BODY_BYTES
              value: {{ .Values.mcpServer.guard.maxBodyBytes | quote }}
            - name: MCP_TRUST_FORWARDED_FOR
              value: {{ .Values.mcpServer.guard.trustForwardedFor | quote }}
          resources:
            {{- toYaml .Values.mcpServer.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "model-store.componentName" (list . "mcp-server") }}
  namespace: {{ include "model-store.namespace" . }}
  labels:
    app: mcp-server
    monitoring.modelhub.io/scrape: "true"
    {{- include "model-store.labels" . | nindent 4 }}
spec:
  type: {{ .Values.mcpServer.service.type }}
  ports:
    - port: {{ .Values.mcpServer.service.port }}
      targetPort: 8081
      name: http-metrics
  selector:
    app: mcp-server
{{- end }}
