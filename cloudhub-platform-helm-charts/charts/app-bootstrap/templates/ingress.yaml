{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "app-bootstrap.name" . }}
  namespace: {{ include "app-bootstrap.namespace" . }}
  labels:
    {{- include "app-bootstrap.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls }}
  tls:
    - hosts: [{{ .Values.ingress.host | quote }}]
      secretName: {{ include "app-bootstrap.name" . }}-tls
  {{- end }}
  rules:
    - host: {{ required "ingress.host required when ingress enabled" .Values.ingress.host | quote }}
      http:
        paths:
          - path: {{ .Values.ingress.path }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "app-bootstrap.name" . }}
                port:
                  number: {{ .Values.service.port }}
{{- end }}
