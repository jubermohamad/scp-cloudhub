{{- if .Values.configMap.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "app-bootstrap.name" . }}
  namespace: {{ include "app-bootstrap.namespace" . }}
  labels:
    {{- include "app-bootstrap.labels" . | nindent 4 }}
data:
  {{- toYaml .Values.configMap.data | nindent 2 }}
{{- end }}
