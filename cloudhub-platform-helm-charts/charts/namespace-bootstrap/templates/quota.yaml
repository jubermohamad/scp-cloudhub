{{- if .Values.resourceQuota.enabled }}
apiVersion: v1
kind: ResourceQuota
metadata:
  name: default
  namespace: {{ include "namespace-bootstrap.namespace" . }}
  labels:
    {{- include "namespace-bootstrap.labels" . | nindent 4 }}
spec:
  hard:
    {{- toYaml .Values.resourceQuota.hard | nindent 4 }}
{{- end }}
