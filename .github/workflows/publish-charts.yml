name: Publish Charts to Helm Registry

on:
  push:
    branches:
      - main
    paths:
      - 'Chart.yaml'
      - 'charts/**'
      - '.github/workflows/publish-charts.yml'
  workflow_dispatch:
    inputs:
      helm_repo_url:
        description: 'Helm repository URL'
        required: false
        default: 'https://helm.symphonyfs.net'
      charts_to_publish:
        description: 'Comma-separated chart names to publish (empty = all)'
        required: false

env:
  HELM_REPO_URL: ${{ github.event.inputs.helm_repo_url || 'https://helm.symphonyfs.net' }}
  HELM_REPO_USERNAME: ${{ secrets.HELM_REPO_USERNAME }}
  HELM_REPO_PASSWORD: ${{ secrets.HELM_REPO_PASSWORD }}

jobs:
  publish-charts:
    name: Package and Publish Charts
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: 'latest'

      - name: Add Helm ChartMuseum plugin
        run: |
          helm plugin install https://github.com/chartmuseum/helm-push.git || true

      - name: Create charts directory for packaging
        run: mkdir -p /tmp/helm-packages

      - name: Package umbrella charts
        run: |
          set -e

          # Charts to publish
          CHARTS=("common" "data" "detection" "investigation")

          for chart in "${CHARTS[@]}"; do
            echo "📦 Packaging $chart umbrella chart..."
            helm package charts/$chart \
              --destination /tmp/helm-packages \
              --version "$(grep '^version:' charts/$chart/Chart.yaml | awk '{print $2}')"

            if [ $? -eq 0 ]; then
              echo "✅ Successfully packaged $chart"
              ls -lh /tmp/helm-packages/${chart}-*.tgz
            else
              echo "❌ Failed to package $chart"
              exit 1
            fi
          done

          echo ""
          echo "📋 All packaged charts:"
          ls -lh /tmp/helm-packages/

      - name: Validate chart integrity
        run: |
          for tgz in /tmp/helm-packages/*.tgz; do
            echo "Validating $tgz..."
            tar -tzf "$tgz" > /dev/null || exit 1
          done
          echo "✅ All charts validated"

      - name: Publish charts to Helm repository
        run: |
          set -e

          if [ -z "$HELM_REPO_USERNAME" ] || [ -z "$HELM_REPO_PASSWORD" ]; then
            echo "❌ Helm repository credentials not configured"
            echo "   Please set HELM_REPO_USERNAME and HELM_REPO_PASSWORD secrets"
            exit 1
          fi

          echo "📤 Publishing charts to $HELM_REPO_URL..."

          for tgz in /tmp/helm-packages/*.tgz; do
            chart_name=$(basename "$tgz" .tgz)
            echo ""
            echo "Publishing $chart_name..."

            helm cm-push "$tgz" \
              --repo-name symphonyfs \
              --repo-url "$HELM_REPO_URL" \
              --username "$HELM_REPO_USERNAME" \
              --password "$HELM_REPO_PASSWORD" \
              --force

            if [ $? -eq 0 ]; then
              echo "✅ Published $chart_name"
            else
              echo "⚠️  Failed to publish $chart_name (may already exist)"
            fi
          done

      - name: Generate publish report
        if: always()
        run: |
          cat > /tmp/publish-report.txt <<EOF
          ═══════════════════════════════════════════════════════════════
          Chart Publishing Report
          ═══════════════════════════════════════════════════════════════

          Repository: $HELM_REPO_URL
          Timestamp: $(date -u +%Y-%m-%dT%H:%M:%SZ)
          Commit: ${{ github.sha }}
          Branch: ${{ github.ref_name }}

          Packaged Charts:
          EOF

          ls -lh /tmp/helm-packages/ | tail -n +2 | while read -r line; do
            echo "  $line" >> /tmp/publish-report.txt
          done

          cat /tmp/publish-report.txt
          echo ""
          echo "📝 Report saved to /tmp/publish-report.txt"

      - name: Upload publish report
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: chart-publish-report
          path: /tmp/publish-report.txt
          retention-days: 30

      - name: Create GitHub release annotation
        if: success()
        run: |
          echo "## 📦 Charts Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Repository:** $HELM_REPO_URL" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Packaged Charts" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          ls -1 /tmp/helm-packages/ | while read -r file; do
            echo "- \`$file\`" >> $GITHUB_STEP_SUMMARY
          done
