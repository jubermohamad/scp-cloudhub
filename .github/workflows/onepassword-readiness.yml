name: CloudHub 1Password Readiness

run-name: '[${{ inputs.application }}]/[${{ inputs.instanceName }}]'

on:
  workflow_dispatch:
    inputs:
      application:
        required: true
        type: string
      instanceName:
        required: true
        type: string
      customer:
        required: true
        type: string
      opServiceAccountTokenSecretName:
        required: false
        default: CLOUDHUB_1PASSWORD_READ
        type: string

permissions:
  contents: read

env:
  OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets[format('{0}', inputs.opServiceAccountTokenSecretName)] }}
  CLOUDHUB_1PASSWORD_REQUIRE_REFS: 'true'

jobs:
  readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: 1password/install-cli-action@8d006a0d0a4fd505af7f7ce589e7f768385ff5e4 # v3.0.0
      - name: Validate read-only authentication
        run: op whoami --format json >/dev/null
      - name: Run read-only readiness check
        env:
          APPLICATION: ${{ inputs.application }}
          INSTANCE_NAME: ${{ inputs.instanceName }}
          CUSTOMER: ${{ inputs.customer }}
        run: node .github/scripts/onepassword-readiness.mjs
