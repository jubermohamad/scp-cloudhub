%YAML 1.2
---
name: CloudHub 1Password Section Provision

run-name: '[${{ inputs.application }}]/[${{ inputs.instanceName }}]'

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Provisioning action'
        required: true
        type: string
        default: 'create-and-populate'
      customer:
        description: 'Customer item title in Customers vault'
        required: true
        type: string
      application:
        description: 'Application name'
        required: true
        type: string
      instanceName:
        description: 'Instance name'
        required: true
        type: string
      clusterName:
        description: 'Cluster name (optional metadata)'
        required: false
        type: string
      runtimeSection:
        description: 'Runtime section to create/populate'
        required: false
        type: string
      pipelineSection:
        description: 'Pipeline section to create/populate'
        required: false
        type: string
      sectionsCsv:
        description: 'Comma-separated sections to create/populate'
        required: false
        type: string
      fieldsCsv:
        description: 'Comma-separated fields to set'
        required: false
        type: string
      runtimeFieldsCsv:
        description: 'Comma-separated runtime fields to set in the runtime section'
        required: false
        type: string
      pipelineFieldsCsv:
        description: 'Comma-separated pipeline control fields to set in pipeline refs'
        required: false
        type: string
      generateRandomPasswords:
        description: 'Generate random values for secret-like fields'
        required: false
        type: boolean
        default: true
      opServiceAccountTokenSecretName:
        description: 'GitHub secret name containing the write-enabled 1Password service account token'
        required: false
        type: string
      source:
        description: 'Caller/source metadata'
        required: false
        type: string
        default: 'cloudhub-deployment-portal'
      secretTemplate:
        description: 'Template hint'
        required: false
        type: string
        default: 'official'

jobs:
  provision-1password-section:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Write-enabled service account token. Use only for section
      # create/populate and random password generation.
      OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets[format('{0}', inputs.opServiceAccountTokenSecretName)] }}
      OP_VAULT_NAME: Customers
    steps:
      - name: Install 1Password CLI
        uses: 1password/install-cli-action@8d006a0d0a4fd505af7f7ce589e7f768385ff5e4 # v3.0.0

      - name: Validate dispatch contract
        id: validate
        shell: bash
        env:
          ACTION: ${{ inputs.action }}
          CUSTOMER: ${{ inputs.customer }}
          APPLICATION: ${{ inputs.application }}
          INSTANCE_NAME: ${{ inputs.instanceName }}
          RUNTIME_SECTION_INPUT: ${{ inputs.runtimeSection }}
          PIPELINE_SECTION_INPUT: ${{ inputs.pipelineSection }}
          SECTIONS_CSV_INPUT: ${{ inputs.sectionsCsv }}
          FIELDS_CSV_INPUT: ${{ inputs.fieldsCsv }}
          RUNTIME_FIELDS_CSV_INPUT: ${{ inputs.runtimeFieldsCsv }}
          PIPELINE_FIELDS_CSV_INPUT: ${{ inputs.pipelineFieldsCsv }}
          OP_SECRET_NAME_INPUT: ${{ inputs.opServiceAccountTokenSecretName }}
        run: |
          set -euo pipefail

          if [[ -z "${OP_SERVICE_ACCOUNT_TOKEN:-}" ]]; then
            echo "::error::OP_SERVICE_ACCOUNT_TOKEN is not set for provisioning workflow"
            exit 1
          fi

          if [[ "${ACTION}" != "create-and-populate" ]]; then
            echo "::error::Unsupported action '${ACTION}'. Expected 'create-and-populate'."
            exit 1
          fi

          if [[ -z "${CUSTOMER}" || -z "${APPLICATION}" || -z "${INSTANCE_NAME}" ]]; then
            echo "::error::customer, application, and instanceName are required"
            exit 1
          fi

          if ! [[ "${OP_SECRET_NAME_INPUT}" =~ ^[A-Z][A-Z0-9_]*$ ]]; then
            echo "::error::opServiceAccountTokenSecretName must be a valid GitHub secret key (uppercase letters, numbers, underscores)"
            exit 1
          fi

          normalize_csv() {
            tr ',' '\n' | sed -E 's/^[[:space:]]+|[[:space:]]+$//g' | awk 'NF && !seen[$0]++' | paste -sd, -
          }

          runtime_section="${RUNTIME_SECTION_INPUT}"
          if [[ -z "${runtime_section}" ]]; then
            runtime_section="${APPLICATION}-${INSTANCE_NAME}"
          fi

          pipeline_section="${PIPELINE_SECTION_INPUT}"
          if [[ -z "${pipeline_section}" ]]; then
            pipeline_section="pipeline_refs"
          fi

          sections_csv="${SECTIONS_CSV_INPUT}"
          if [[ -z "${sections_csv}" ]]; then
            sections_csv="${runtime_section}"
          fi

          runtime_fields_csv="${RUNTIME_FIELDS_CSV_INPUT}"
          pipeline_fields_csv="${PIPELINE_FIELDS_CSV_INPUT}"

          if [[ -z "${runtime_fields_csv}" && -z "${pipeline_fields_csv}" ]]; then
            runtime_fields_csv="${FIELDS_CSV_INPUT}"
          fi

          if [[ -n "${pipeline_fields_csv}" ]]; then
            case ",${sections_csv}," in
              *,${pipeline_section},*) ;;
              *) sections_csv="${sections_csv},${pipeline_section}" ;;
            esac
          fi

          sections_csv="$(printf '%s' "${sections_csv}" | normalize_csv)"

          fields_csv="${FIELDS_CSV_INPUT}"
          if [[ -z "${fields_csv}" ]]; then
            fields_csv="${runtime_fields_csv},${pipeline_fields_csv}"
          fi

          runtime_fields_csv="$(printf '%s' "${runtime_fields_csv}" | normalize_csv)"
          pipeline_fields_csv="$(printf '%s' "${pipeline_fields_csv}" | normalize_csv)"
          fields_csv="$(printf '%s' "${fields_csv}" | normalize_csv)"

          if [[ -z "${sections_csv}" || -z "${fields_csv}" ]]; then
            echo "::error::Resolved sectionsCsv or fieldsCsv is empty"
            exit 1
          fi

          echo "runtimeSection=${runtime_section}" >> "${GITHUB_OUTPUT}"
          echo "pipelineSection=${pipeline_section}" >> "${GITHUB_OUTPUT}"
          echo "sectionsCsv=${sections_csv}" >> "${GITHUB_OUTPUT}"
          echo "fieldsCsv=${fields_csv}" >> "${GITHUB_OUTPUT}"
          echo "runtimeFieldsCsv=${runtime_fields_csv}" >> "${GITHUB_OUTPUT}"
          echo "pipelineFieldsCsv=${pipeline_fields_csv}" >> "${GITHUB_OUTPUT}"

      - name: Authenticate with 1Password
        shell: bash
        run: |
          set -euo pipefail
          op whoami --format json > /dev/null

      - name: Create and populate sections
        shell: bash
        env:
          CUSTOMER: ${{ inputs.customer }}
          GENERATE_RANDOM_PASSWORDS: ${{ inputs.generateRandomPasswords }}
          RUNTIME_SECTION: ${{ steps.validate.outputs.runtimeSection }}
          PIPELINE_SECTION: ${{ steps.validate.outputs.pipelineSection }}
          SECTIONS_CSV: ${{ steps.validate.outputs.sectionsCsv }}
          RUNTIME_FIELDS_CSV: ${{ steps.validate.outputs.runtimeFieldsCsv }}
          PIPELINE_FIELDS_CSV: ${{ steps.validate.outputs.pipelineFieldsCsv }}
        run: |
          set -euo pipefail

          if ! op item get "${CUSTOMER}" --vault "${OP_VAULT_NAME}" >/dev/null 2>&1; then
            op item create --category "Secure Note" --title "${CUSTOMER}" --vault "${OP_VAULT_NAME}" >/dev/null
          fi

          generate_value() {
            local field_name="$1"
            local randomize="$2"
            local field_lc
            field_lc="$(printf '%s' "${field_name}" | tr '[:upper:]' '[:lower:]')"

            if [[ "${randomize}" == "true" && "${field_lc}" =~ (password|passwd|secret|token|api[_-]?key|client[_-]?secret|private[_-]?key|jwt|salt|credential|passphrase|key) ]]; then
              openssl rand -base64 48 | tr -d '\n' | cut -c1-64
              return
            fi

            if [[ "${field_lc}" =~ (^|_)version$ || "${field_lc}" =~ __version$ ]]; then
              echo "main"
              return
            fi

            if [[ "${field_lc}" =~ (^|_)(branch|ref)$ || "${field_lc}" =~ __(branch|ref)$ ]]; then
              echo "main"
              return
            fi

            echo "set-by-cloudhub-provisioner"
          }

          write_fields_for_section() {
            local section="$1"
            local fields_csv="$2"

            [[ -z "${fields_csv}" ]] && return 0

            IFS=',' read -r -a fields <<< "${fields_csv}"
            for field in "${fields[@]}"; do
              field="$(printf '%s' "${field}" | sed -E 's/^[[:space:]]+|[[:space:]]+$//g')"
              [[ -z "${field}" ]] && continue

              value="$(generate_value "${field}" "${GENERATE_RANDOM_PASSWORDS}")"
              echo "::add-mask::${value}"

              op item edit "${CUSTOMER}" --vault "${OP_VAULT_NAME}" "${section}.${field}[concealed]=${value}" >/dev/null
              writes=$((writes + 1))
            done
          }

          writes=0
          IFS=',' read -r -a sections <<< "${SECTIONS_CSV}"
          for section in "${sections[@]}"; do
            section="$(printf '%s' "${section}" | sed -E 's/^[[:space:]]+|[[:space:]]+$//g')"
            [[ -z "${section}" ]] && continue

            if [[ "${section}" == "${RUNTIME_SECTION}" ]]; then
              write_fields_for_section "${section}" "${RUNTIME_FIELDS_CSV}"
              continue
            fi

            if [[ "${section}" == "${PIPELINE_SECTION}" ]]; then
              write_fields_for_section "${section}" "${PIPELINE_FIELDS_CSV}"
              continue
            fi

            echo "::warning::Skipping unsupported section '${section}'"
          done

          if [[ "${writes}" -eq 0 ]]; then
            echo "::error::No fields were written to 1Password"
            exit 1
          fi

          echo "Updated ${writes} field values in 1Password item '${CUSTOMER}'."
