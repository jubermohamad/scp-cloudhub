# ─────────────────────────────────────────────────────────────────────────────
# aks-plan.yaml
#
# PLACE THIS FILE IN:  cloudhub-infra-as-code/.github/workflows/aks-plan.yaml
#
# Purpose
# ───────
# Triggered by the CloudHub Platform Portal (Backstage) during the Review phase via
# the GitHub Actions workflow_dispatch API.  It accepts a base64-encoded
# cluster.yaml, runs a real Terraform plan, and writes a structured JSON
# summary to the plan-output branch so Backstage can display:
#   • resource counts (to create / modify / destroy)
#   • estimated monthly cost
#   • validation errors and warnings
#
# After the user is happy with the plan they click "Create PR" in Backstage,
# which opens a PR in cloudhub-infra-as-code.  On merge, provision-cluster.yaml
# (already in this repo) runs terraform apply.
#
# Prerequisites
# ─────────────
# 1. Add the following secrets to this repository (or the environment):
#      ARM_CLIENT_ID         – Azure service principal client ID
#      ARM_CLIENT_SECRET     – Azure service principal secret
#      ARM_TENANT_ID         – Azure tenant ID
#      ARM_SUBSCRIPTION_ID   – Azure subscription ID
#      TF_TOKEN_app_terraform_io – Terraform Cloud API token (if using TFC backend)
#
# 2. Adjust the `working-directory` in the Terraform steps to point at your
#    AKS Terraform root module.
#
# 3. If terraform-modules is a separate repository, uncomment one of the
#    "Checkout terraform modules" options below.
# ─────────────────────────────────────────────────────────────────────────────

name: AKS Plan (portal-triggered)

on:
  workflow_dispatch:
    inputs:
      cluster_yaml:
        description: 'Base64-encoded cluster.yaml content (generated by Backstage)'
        required: true
        type: string
      cluster_name:
        description: 'Cluster identifier, e.g. aks-dev-payments-cnc'
        required: true
        type: string

# GITHUB_TOKEN needs write access to commit plan results to plan-output branch.
permissions:
  contents: write

jobs:
  plan:
    name: terraform plan — ${{ inputs.cluster_name }}
    runs-on: ubuntu-latest

    env:
      TF_IN_AUTOMATION: 'true'
      ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
      ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
      # Uncomment if using Terraform Cloud:
      # TF_TOKEN_app_terraform_io: ${{ secrets.TF_CLOUD_TOKEN }}

    steps:
      # ── 1. Checkout cloudhub-infra-as-code ──────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── 2. Decode and place cluster.yaml ───────────────────────────────────
      - name: Decode cluster.yaml
        run: |
          CLUSTER_DIR="cloudhub-infra-config/clusters/aks/${{ inputs.cluster_name }}"
          mkdir -p "$CLUSTER_DIR"
          printf '%s' "${{ inputs.cluster_yaml }}" | base64 -d > "$CLUSTER_DIR/cluster.yaml"
          echo "=== cluster.yaml placed at $CLUSTER_DIR/cluster.yaml ==="
          cat "$CLUSTER_DIR/cluster.yaml"

      # ── 3. Checkout terraform-modules (pick one option) ────────────────────
      #
      # Option A – git submodule (if terraform-modules is a submodule):
      # - name: Init submodules
      #   run: git submodule update --init --recursive
      #
      # Option B – separate repository checkout:
      # - name: Checkout terraform-modules
      #   uses: actions/checkout@v4
      #   with:
      #     repository: SymphonySensa/terraform-modules
      #     path: terraform-modules
      #     token: ${{ secrets.GH_PAT }}

      # ── 4. Generate runtime tfvars ─────────────────────────────────────────
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install pyyaml

      - name: Generate terraform.tfvars.json
        run: |
          python cloudhub-infra-config/scripts/render_tfvars.py \
            --cluster "cloudhub-infra-config/clusters/aks/${{ inputs.cluster_name }}/cluster.yaml" \
            --output /tmp/generated.auto.tfvars.json
          echo "=== generated.auto.tfvars.json ==="
          cat /tmp/generated.auto.tfvars.json

      # ── 5. Terraform ────────────────────────────────────────────────────────
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '~1.7'
          # Disable the wrapper so JSON plan output can be parsed cleanly.
          terraform_wrapper: false

      - name: Terraform Init
        # TODO: adjust working-directory to your AKS Terraform root module path.
        working-directory: terraform-modules/aks
        run: terraform init -no-color

      - name: Terraform Validate
        working-directory: terraform-modules/aks
        run: terraform validate -no-color

      - name: Terraform Plan (JSON output)
        id: tf_plan
        working-directory: terraform-modules/aks
        # -json streams structured output; errors are captured separately.
        run: |
          terraform plan \
            -var-file=/tmp/generated.auto.tfvars.json \
            -no-color \
            -json \
            -out=/tmp/tfplan.out \
            > /tmp/plan_output.json 2>/tmp/plan_stderr.txt || true
          echo "plan_exit_code=$?" >> "$GITHUB_OUTPUT"

      # ── 6. Parse plan and build plan-summary.json ──────────────────────────
      - name: Parse plan output
        env:
          CLUSTER_NAME: ${{ inputs.cluster_name }}
        run: |
          python3 - << 'PYEOF'
          import json, os, sys

          resources_to_create = 0
          resources_to_modify = 0
          resources_to_destroy = 0
          errors   = []
          warnings = []

          # Parse streaming JSON from `terraform plan -json`
          try:
            with open('/tmp/plan_output.json') as f:
              for raw_line in f:
                line = raw_line.strip()
                if not line:
                  continue
                try:
                  msg = json.loads(line)
                except json.JSONDecodeError:
                  continue

                level = msg.get('@level', '')
                typ   = msg.get('type', '')

                if level == 'error':
                  errors.append(msg.get('@message', str(msg))[:400])

                elif typ == 'planned_change':
                  action = msg.get('change', {}).get('action', '')
                  if action == 'create':
                    resources_to_create += 1
                  elif action == 'update':
                    resources_to_modify += 1
                  elif action == 'delete':
                    resources_to_destroy += 1

                elif typ == 'change_summary':
                  chg = msg.get('changes', {})
                  resources_to_create = chg.get('add',    resources_to_create)
                  resources_to_modify = chg.get('change', resources_to_modify)
                  resources_to_destroy= chg.get('remove', resources_to_destroy)

          except FileNotFoundError:
            errors.append('terraform plan output file not found')

          # Include any stderr content
          try:
            stderr = open('/tmp/plan_stderr.txt').read().strip()
            if stderr:
              errors.append(stderr[:500])
          except:
            pass

          # ── Cost estimation (mirrors cloudhub-config.yaml) ───────────────────────
          VM_MONTHLY = {
            'Standard_B2s':     60,
            'Standard_D4s_v5': 280,
            'Standard_D8ds_v4': 360,
            'Standard_E8ds_v4': 560,
            'Standard_E16ds_v4': 1120,
          }
          REGION_OVERHEAD = 250
          SYS_VM = 'Standard_D8ds_v4'
          SYS_NODES = 2

          monthly_cost = 0
          try:
            import yaml as _yaml
            cluster_name = os.environ.get('CLUSTER_NAME', '')
            cluster_path = f'cloudhub-infra-config/clusters/aks/{cluster_name}/cluster.yaml'
            with open(cluster_path) as f:
              doc = _yaml.safe_load(f)
            spec = doc.get('spec', {})
            vm        = spec.get('nodePool', {}).get('vmSize', '')
            min_nodes = spec.get('nodePool', {}).get('minNodes', 1)
            regions   = len(spec.get('regions', ['placeholder']))
            node_cost = VM_MONTHLY.get(vm, 100) * min_nodes
            sys_cost  = VM_MONTHLY.get(SYS_VM, 360) * SYS_NODES
            monthly_cost = round(((node_cost + sys_cost + REGION_OVERHEAD) * regions) / 50) * 50
          except Exception as exc:
            warnings.append(f'Cost estimation unavailable: {exc}')

          summary = {
            'resourcesToCreate': resources_to_create,
            'resourcesToModify': resources_to_modify,
            'resourcesToDestroy': resources_to_destroy,
            'monthlyCost': monthly_cost,
            'errors':   errors,
            'warnings': warnings,
          }
          with open('/tmp/plan-summary.json', 'w') as f:
            json.dump(summary, f, indent=2)
          print('plan-summary.json:')
          print(json.dumps(summary, indent=2))
          PYEOF

      # ── 7. Publish plan results to plan-output branch ──────────────────────
      # Backstage calls GET /api/provisioning/plan/status/:runId, which reads
      # this file via the GitHub contents API and returns it to the UI.
      - name: Publish plan results to plan-output branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.run_id }}
        run: |
          REPO="${{ github.repository }}"
          FILE_PATH="plan-runs/${RUN_ID}.json"
          BRANCH="plan-output"

          # Ensure the plan-output branch exists (idempotent).
          if ! git ls-remote --exit-code origin "refs/heads/${BRANCH}" > /dev/null 2>&1; then
            echo "Creating ${BRANCH} branch..."
            git checkout -b "${BRANCH}"
            git commit --allow-empty -m "chore: init plan-output branch [skip ci]"
            git push origin "${BRANCH}"
          fi

          # Base64-encode the summary (no line-wrapping — required for GitHub API).
          CONTENT=$(base64 -w 0 < /tmp/plan-summary.json)

          # Check if the file already exists on the branch (need its SHA to update).
          EXISTING=$(curl -sf \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            "https://api.github.com/repos/${REPO}/contents/${FILE_PATH}?ref=${BRANCH}" \
            2>/dev/null || echo '{}')
          SHA=$(python3 -c "import sys,json; d=json.loads('${EXISTING}'); print(d.get('sha',''))" 2>/dev/null || echo '')

          # Build JSON request body.
          if [ -n "${SHA}" ]; then
            REQUEST_BODY=$(python3 -c "
          import json, sys
          print(json.dumps({
            'message': f'chore: plan result ${RUN_ID} [skip ci]',
            'content': '${CONTENT}',
            'branch':  '${BRANCH}',
            'sha':     '${SHA}',
          }))")
          else
            REQUEST_BODY=$(python3 -c "
          import json, sys
          print(json.dumps({
            'message': f'chore: plan result ${RUN_ID} [skip ci]',
            'content': '${CONTENT}',
            'branch':  '${BRANCH}',
          }))")
          fi

          HTTP_CODE=$(curl -sf -o /dev/null -w "%{http_code}" -X PUT \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/${REPO}/contents/${FILE_PATH}" \
            -d "${REQUEST_BODY}")

          echo "GitHub API response: ${HTTP_CODE}"
          echo "✅ plan-summary written to ${BRANCH}:${FILE_PATH}"

      # ── 8. Write GitHub Step Summary ───────────────────────────────────────
      - name: Write step summary
        if: always()
        run: |
          {
            echo "## AKS Terraform Plan — ${{ inputs.cluster_name }}"
            echo ""
            python3 - << 'PYEOF'
          import json

          try:
            with open('/tmp/plan-summary.json') as f:
              s = json.load(f)
            print("| Metric | Value |")
            print("|--------|-------|")
            print(f"| Resources to Create  | **{s['resourcesToCreate']}** |")
            print(f"| Resources to Modify  | **{s['resourcesToModify']}** |")
            print(f"| Resources to Destroy | **{s['resourcesToDestroy']}** |")
            print(f"| Estimated Monthly Cost | **${s['monthlyCost']:,}** |")
            if s.get('errors'):
              print("")
              print("### ❌ Errors")
              for e in s['errors']:
                print(f"- {e}")
            if s.get('warnings'):
              print("")
              print("### ⚠️ Warnings")
              for w in s['warnings']:
                print(f"- {w}")
          except Exception as e:
            print(f"Could not read plan-summary.json: {e}")
          PYEOF
          } >> "$GITHUB_STEP_SUMMARY"
